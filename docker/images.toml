# Distro inputs for scripts/generate_build_files.py; see docker/templates/Dockerfile.
# Image paths and platforms live in .github/docker-matrix.json.
# Optional fields default to empty; runtime defaults to builder, libc to gnu,
# python to python3, and entrypoint to ["cronstable"].
# Base images name a tag and its multi-arch index digest. Dependabot proposes
# new digests in the generated Dockerfiles; copy them here and regenerate.

[debian]
builder = "python:3.14-slim@sha256:a2b82f3c48559aa0a8446d9af49826b6e2b2016f4cd2afabfe6013ec53729170"
toolchain = '''
    retry apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update; \
    retry apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential libffi-dev zlib1g-dev git; \
    rm -rf /var/lib/apt/lists/*
'''
python = "python"
rust_setup = '''
    RUST_SETUP="apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update \
        && apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates \
        && curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path" \
'''
rust_cleanup = '''
; \
    rm -rf /var/lib/apt/lists/*
'''
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters."
extra_labels = '''
      org.opencontainers.image.url="https://github.com/ptweezy/cronstable" \
      org.opencontainers.image.documentation="https://github.com/ptweezy/cronstable/wiki" \
      org.opencontainers.image.authors="Parker Loflin <parker@cronstable.dev>" \
      org.opencontainers.image.vendor="Parker Loflin" \
'''

# musl wheels and the musl runtime must stay paired.
[alpine]
builder = "python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72"
toolchain = "    retry apk add --no-cache build-base libffi-dev git"
python = "python"
libc = "musl"
rust_setup = '''
    RUST_SETUP="apk add --no-cache curl \
        && curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path" \
'''
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters (Alpine)."

# Amazon Linux's default Python is too old; use 3.11 in both stages.
[amazonlinux]
builder = "amazonlinux:2023@sha256:c04a1012acc483977f61f7f91c28624a39a621e56a59781319a75dec528be9b6"
toolchain = '''
    retry dnf --setopt=retries=10 install -y python3.11 python3.11-pip python3.11-devel gcc git; \
    dnf clean all
'''
python = "python3.11"
runtime_install = '''
RUN set -eux; \
    retry() { n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retry $n: $*"; sleep $((n*30)); done; }; \
    retry dnf --setopt=retries=10 install -y python3.11; \
    dnf clean all
'''
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters (Amazon Linux 2023)."

# Debian 13 provides the same Python 3.13 layout as the distroless runtime.
# An absolute entrypoint and exec-form smoke check work without a shell.
[distroless]
builder = "debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad"
builder_env = "ENV DEBIAN_FRONTEND=noninteractive"
toolchain = '''
    retry apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update; \
    retry apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-venv python3-dev python3-pip build-essential libffi-dev zlib1g-dev git; \
    rm -rf /var/lib/apt/lists/*
'''
python = "python3.13"
runtime = "gcr.io/distroless/python3-debian13:latest@sha256:9a1ed29d41d7695245ff86bc2e08684d3dd253a3f9c8ca45677427f9f4fe3598"
entrypoint = "[\"/opt/venv/bin/cronstable\"]"
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters (distroless)."

# System libsodium avoids PyNaCl's bundled autotools tests under QEMU.
# The runtime must carry libsodium to match the builder link.
[fedora]
builder = "fedora:45@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c"
toolchain = '''
    retry dnf --setopt=retries=10 install -y python3 python3-pip python3-devel gcc make libffi-devel libsodium-devel git; \
    dnf clean all
'''
sodium = "    export SODIUM_INSTALL=system; \\"
runtime_install = '''
RUN set -eux; \
    retry() { n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retry $n: $*"; sleep $((n*30)); done; }; \
    retry dnf --setopt=retries=10 install -y python3 libsodium; \
    dnf clean all
'''
rust_setup = "    RUST_SETUP=\"dnf --setopt=retries=10 install -y rust cargo\" \\"
rust_cleanup = '''
; \
    dnf clean all
'''
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters (Fedora)."

# python313 includes ensurepip; no separate pip package is needed.
# System libsodium avoids emulated bundled-library builds; ship libsodium26.
[opensuse]
builder = "opensuse/leap:16.0@sha256:40b8e1fc290b203380b9adc7cd147ef2141f5a613c7cf7117f678f626855654e"
toolchain = '''
    retry zypper --non-interactive refresh; \
    retry zypper --non-interactive install python313 python313-devel gcc make libffi-devel libsodium-devel git; \
    zypper clean --all
'''
python = "python3.13"
sodium = "    export SODIUM_INSTALL=system; \\"
runtime_install = '''
RUN set -eux; \
    retry() { n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retry $n: $*"; sleep $((n*30)); done; }; \
    retry zypper --non-interactive refresh; \
    retry zypper --non-interactive install python313 libsodium26; \
    zypper clean --all
'''
rust_setup = '''
    RUST_SETUP="zypper --non-interactive refresh \
        && zypper --non-interactive install rust cargo" \
'''
rust_cleanup = '''
; \
    zypper clean --all
'''
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters (openSUSE Leap)."

# UBI builder and ubi-minimal runtime share their Python 3.12 layout.
[rhel]
builder = "registry.access.redhat.com/ubi10/ubi:latest@sha256:0e8ccad7d35f5fd756f4f2202f018b8d3c3e8bb9af8e627d874239381a00ab41"
toolchain = '''
    retry dnf --setopt=retries=10 install -y python3 python3-pip python3-devel gcc make libffi-devel git; \
    dnf clean all
'''
runtime = "registry.access.redhat.com/ubi10/ubi-minimal:latest@sha256:c3fe95ec9f53a3888c47314eb4d08bde09ebde646a428137b445091afe1daf89"
runtime_install = '''
RUN set -eux; \
    retry() { n=0; until "$@"; do n=$((n+1)); if [ "$n" -ge 5 ]; then return 1; fi; echo "retry $n: $*"; sleep $((n*30)); done; }; \
    retry microdnf install -y python3; \
    microdnf clean all
'''
rust_setup = "    RUST_SETUP=\"dnf --setopt=retries=10 install -y rust cargo\" \\"
rust_cleanup = '''
; \
    dnf clean all
'''
description = "A job scheduler with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters (RHEL/UBI 10)."

[ubuntu]
builder = "ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c"
builder_env = "ENV DEBIAN_FRONTEND=noninteractive"
toolchain = '''
    retry apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update; \
    retry apt-get -o Acquire::Retries=5 install -y --no-install-recommends python3 python3-venv python3-dev python3-pip build-essential libffi-dev zlib1g-dev git; \
