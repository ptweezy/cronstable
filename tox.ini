[tox]
# tox-uv runs env creation and installs through uv; listing it here makes a
# plain `tox` provision it. `tox --runner virtualenv` selects virtualenv+pip.
requires =
    tox-uv>=1
# Each interpreter row has a `windows` and a `posix` arm that differ only in
# the coverage profile. `platform` skips the arm that does not match the
# host, and a skip is a pass, so one command works on every runner.
envlist = py3{10,11,12,13,14,15}-{windows,posix}, lint, mypy, bandit, openapi

[testenv:lint]
description = lint source code
# ruff only reads the source tree, so don't build/install the package (which
# would impose the project's requires-python on the lint interpreter).
skip_install = true
deps =
    ruff
commands =
    ruff check cronstable
    ruff format --check cronstable


[testenv:mypy]
description = static type-check the source with mypy
# Installs the package so mypy resolves the runtime deps. Imports that
# cannot resolve (optional extras, untyped libraries) get per-module
# overrides in pyproject.toml instead of a global --ignore-missing-imports.
# The empty `extras` overrides the dev extra that [testenv] selects, so mypy
# checks against the runtime deps alone.
extras =
deps =
    mypy
commands =
    mypy -p cronstable


[testenv:bandit]
description = security-lint the source with bandit
# Like lint, reads only the source tree, so the package is not installed.
skip_install = true
deps =
    bandit[toml]
commands =
    bandit -c pyproject.toml -r cronstable --severity-level=medium


[testenv:openapi]
description = validate the OpenAPI spec (docs/openapi.yaml)
# validates only the spec file; no need to build/install the package.
skip_install = true
deps =
    openapi-spec-validator
commands =
    python .github/scripts/check_openapi.py


[testenv]
# pyproject.toml's dev extra is the test dependency list. The free-threaded
# envs below replace it.
extras =
    dev
# tox has no OS substitution, so the per-OS split is a factor. `platform` is
# fullmatched against sys.platform: the POSIX arm needs `(?!win32).*`, since
# the bare lookahead matches only the empty string and would skip the POSIX
# arm everywhere. A skipped env passes, but an invocation whose every env
# skips exits 1, so `tox -e py-posix` alone fails on Windows.
platform =
    windows: win32
    posix: (?!win32).*
setenv =
    PYTHONPATH = {toxinidir}
    # pytest-cov combines every `.coverage.*` in its data dir; envs sharing
    # one under `tox -p` would delete files another env holds open
    # (WinError 32 on Windows).
    COVERAGE_FILE = {envdir}/.coverage
    # Selects pyproject.toml's coverage profile by naming the platform whose
    # branches CANNOT run here (the inversion is easy to wire backwards;
    # tests/test_coverage_profiles.py pins it). The unconditional line gives
    # an unfactored env such as `tox -e py312` the POSIX profile.
    CRONSTABLE_COVERAGE_SKIP = windows
    windows: CRONSTABLE_COVERAGE_SKIP = posix
    posix: CRONSTABLE_COVERAGE_SKIP = windows
    # Per-arm coverage floor, about 1.5 points under CI (2026-09-29: POSIX
    # 96.51 to 96.60; Windows x64 95.75 to 95.79; win-arm64 95.35, with no
    # cryptography, orjson or playwright). Only one Linux cell has Chromium,
    # so no Windows cell runs the web E2E suites. The unconditional line is
    # for unfactored envs, which measure the POSIX profile and read lower on
    # Windows. Raise an arm as its cells rise; never lower one without a
    # recorded reason.
    CRONSTABLE_COV_FLOOR = 92
    windows: CRONSTABLE_COV_FLOOR = 94
    posix: CRONSTABLE_COV_FLOOR = 95

# Only the floor is factor-conditional. Keep `commands` unconditional: a
# factored `commands` is empty in an unfactored env, so `tox -e py312` would
# run zero tests and pass.
# coverage.xml feeds Codecov, which merges every cell and reads lower than
# either gated profile (a `(windows)` line counts as missed unless a Windows
# test hits it). .github/codecov.yml makes its statuses informational, so
# the floor above is the only gate.
commands = pytest --color=yes -vv --cov=cronstable --cov-report=term-missing --cov-report=xml --cov-fail-under={env:CRONSTABLE_COV_FLOOR}


[testenv:py3{14,15}t{,-windows,-posix}]
description = run the suite on free-threaded Python with the stdlib JSON fallback
# orjson rejects the free-threaded ABI, which no marker can express. These
# envs therefore install the generated copy of the dev extra without orjson
# and test the stdlib JSON fallback. The empty `extras` overrides the dev
# extra that [testenv] selects. The envs inherit every other setting, so
# each one keeps its OS profile and coverage floor.
# TODO: When orjson supports free-threaded Python, delete this section so
# these envs install the dev extra. Then remove the generated
# requirements/dev-freethreaded.txt, the free-threaded skip in
# tests/test_json_portability.py, and the separate free-threaded step in
# .github/workflows/release.yml.
extras =
deps =
    -rrequirements/dev-freethreaded.txt


[testenv:mindeps]
description = run the suite on the oldest dependency versions the metadata allows
# requirements/min.txt pins the minimum runtime and test dependency versions
# declared in pyproject.toml. This environment checks that those versions
# import and provide the required APIs. Run it with the oldest supported
# Python version. Coverage thresholds apply in the py environments.
# The pins install first. As constraints, they also bind the dev extra that
# [testenv] selects, so a dependency that needs a newer version fails the
# install instead of upgrading a pin.
deps =
    -rrequirements/min.txt
constraints =
    requirements/min.txt
commands = pytest --color=yes -q


[testenv:deep]
description = run thorough property tests, then randomize full-suite test order
# Scheduled: the thorough Hypothesis profile (about 30 times the ci
# examples, so no per-test timeout), then three random full-suite orders to
# find dependencies between tests. Reproduce an order with the seed from the
# pytest header: `pytest -p randomly --randomly-seed=N`.
setenv =
    {[testenv]setenv}
    CRONSTABLE_HYPOTHESIS_PROFILE = thorough
commands =
    pytest --color=yes -q -p no:randomly --timeout=0 -o faulthandler_timeout=3600 tests/test_properties_cronexpr.py tests/test_properties_parsers.py
    pytest --color=yes -q -p randomly
    pytest --color=yes -q -p randomly
    pytest --color=yes -q -p randomly
