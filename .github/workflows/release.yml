name: CI

# Every push (any branch) and pull request runs the static and package
# checks, then the tox matrix beside the build fan-out: PyInstaller binaries,
# Docker images (build-only), and the `perf` benchmark against the latest
# release tag. A release gates on ALL of it except the macOS 26 rows. Outside
# a release, only wiki/ is published (the ungated `wiki` job, on `main`).
#
# A release happens ONLY on:
#   - a push to `main` where a pushed commit SUBJECT starts with a marker:
#         [release]          -> minor (default)
#         [release:major]    -> major
#         [release:minor]    -> minor
#         [release:patch]    -> patch
#     The latest marked commit wins. Bodies are never scanned, so prose that
#     mentions a marker cannot trigger or escalate a release.
#   - workflow_dispatch: `bump` from the dropdown, or an exact X.Y.Z `tag`
#     (the `tag` input wins over `bump`).
# Example subject: [release:minor] Add retry backoff to the HTTP reporter
#
# Perf gate override, resolved by the same decide step:
#   - the workflow_dispatch input `perf`: gate (default), accept, or ignore
#   - a pushed commit SUBJECT starting with [perf:accept] or [perf:ignore]
#   `accept` reports a relative regression instead of failing on it. `ignore`
#   still attaches the comparison, but no finding and no perf job failure
#   holds the release. The strongest request wins
#   (ignore > accept > gate), and the release notes name it.
#
# Publication starts only after every build and test job succeeds: PyPI via
# Trusted Publishing (skip-existing, so a retry is a no-op), then the tag
# (RELEASE_TOKEN if set, else GITHUB_TOKEN) and a GitHub Release with every
# binary and one SHA256SUMS, then Docker images, Homebrew and winget. PyPI
# goes first so a failed upload leaves no orphan tag.

on:
  push:
    branches: ["**"]  # build + test on every commit, on every branch
  pull_request:       # and on every PR (covers fork PRs, which don't push here)
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level (ignored when 'tag' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      tag:
        description: "Exact version to release as X.Y.Z (overrides bump); leave blank to compute the next one"
        type: string
        default: ""
      perf:
        description: "Perf gate: gate (a regression fails the release), accept (regressions are reported, not gated), ignore (everything is reported, nothing gates)"
        type: choice
        options: [gate, accept, ignore]
        default: gate

# One in-flight run per (head repo, branch, kind); a same-repo push and its PR
# share a group. The HEAD repo keeps a fork PR from a branch named `main` out
# of the push-to-main group, where it would cancel a release mid-publish. The
# kind gives releases their own group: `cancel-in-progress: false` protects
# only a started run, and a queued one loses its slot to the next push.
#
# The release test is a loose superset of `decide` (a false negative could
# cancel a publish): any dispatch, any pushed message containing `[release`,
# or a push of 20+ commits, where the event payload truncates.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, '|'), '[release') || github.event.commits[19] != null) && 'release' || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, '|'), '[release') || github.event.commits[19] != null) }}

# Least-privilege default for all jobs; the publish jobs opt up to the narrower
# write scopes they actually need (see each one's own permissions:).
permissions:
  contents: read

# These settings harden installs against transient network failures.
# Runner-native jobs install with uv; UV_PYTHON_DOWNLOADS=never keeps it on
# the setup-python interpreter. The emulated foreign-arch jobs use pip inside
# `docker run` (the uv image is amd64/arm64 only, with no musl ppc64le/s390x
# wheels) and get PIP_RETRIES/PIP_TIMEOUT through `-e`.
env:
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"
  UV_HTTP_TIMEOUT: "60"
  UV_PYTHON_DOWNLOADS: "never"
  # The uv release every setup-uv step installs; pyinstaller/Dockerfile
  # copies the same version.
  SETUP_UV_VERSION: "0.12.5"

jobs:

  # ---------------------------------------------------------------------------
  # Decide + version (run on every event; feed both the gate and the publish).
  # ---------------------------------------------------------------------------

  # Decide whether this run releases (and at what level), then compute the one
  # version every builder pins through SETUPTOOLS_SCM_PRETEND_VERSION. One job,
  # so both steps share a full-history checkout. This file runs on every branch
  # and PR, so the decide step enforces the main-only release rule.
  version:
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.d.outputs.release }}
      perf: ${{ steps.d.outputs.perf }}
      perf-source: ${{ steps.d.outputs.perf_source }}
      new: ${{ steps.ver.outputs.new }}
      docker-matrix: ${{ steps.distros.outputs.matrix }}
      docker-none: ${{ steps.distros.outputs.docker-none }}
      docker-glibc: ${{ steps.distros.outputs.docker-glibc }}
      docker-musl: ${{ steps.distros.outputs.docker-musl }}
      pq-glibc: ${{ steps.distros.outputs.pq-glibc }}
      pq-musl: ${{ steps.distros.outputs.pq-musl }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history + tags: the marker scan walks BEFORE..AFTER and setuptools_scm / tag math resolve
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - name: Decide release
        id: d
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_PERF: ${{ github.event.inputs.perf }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          release=false
          bump=minor
          # Subjects of the commits this push adds (BEFORE..AFTER), scanned
          # for the [release] and [perf:*] markers. BEFORE is all-zeros on a
          # new branch and unset on a dispatch, so fall back to the tip.
          zero="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zero" ] \
               || ! git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null; then
            subjects="$(git log -1 --pretty=%s "$AFTER" 2>/dev/null || true)"
          else
            subjects="$(git log --pretty=%s "${BEFORE}..${AFTER}" 2>/dev/null || true)"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release=true
            bump="${INPUT_BUMP:-minor}"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # Markers count only at the start of a SUBJECT; git log lists
            # newest first, so the newest marked commit wins.
            marker="$(printf '%s\n' "$subjects" \
              | grep -oiE '^\[release(:(major|minor|patch))?\]' \
              | head -n1 \
              | tr '[:upper:]' '[:lower:]' || true)"
            if [ -n "$marker" ]; then
              release=true
              case "$marker" in
                "[release:major]") bump=major ;;
                "[release:patch]") bump=patch ;;
                *)                 bump=minor ;;
              esac
            fi
          fi
          # else: a PR or a non-main push -> build + test only, never release.
          #
          # Perf override: the dispatch input or a [perf:accept] or
          # [perf:ignore] subject marker. The strongest request wins
          # (ignore > accept > gate); only a release enforces the gate.
          perf=gate
          perf_source=default
          case "${INPUT_PERF:-}" in
            accept|ignore)
              perf="$INPUT_PERF"
              perf_source="workflow_dispatch input perf=$INPUT_PERF"
              ;;
          esac
          if [ "$perf" = "gate" ] \
               && printf '%s\n' "$subjects" | grep -qiE '^\[perf:accept\]'; then
            perf=accept
            perf_source="[perf:accept] commit marker"
          fi
          if printf '%s\n' "$subjects" | grep -qiE '^\[perf:ignore\]'; then
            perf=ignore
            perf_source="[perf:ignore] commit marker"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "perf=$perf" >> "$GITHUB_OUTPUT"
          echo "perf_source=$perf_source" >> "$GITHUB_OUTPUT"
          echo "::notice::release=$release bump=$bump perf=$perf ($perf_source; event=$EVENT ref=$REF)"
      - name: Compute version
        id: ver
        env:
          RELEASE: ${{ steps.d.outputs.release }}
          BUMP: ${{ steps.d.outputs.bump }}
          OVERRIDE: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "true" ]; then
            # Build-only run: resolve setuptools_scm's natural dev version off
            # git in a throwaway env (no venv/install left behind).
            new="$(uv run --no-project --with setuptools-scm python -m setuptools_scm)"
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "::notice::Build-only at version $new (no release)."
            exit 0
          fi

          git fetch --tags --force
          if [ -n "${OVERRIDE:-}" ]; then
            # Tags are bare X.Y.Z, and the rest of the pipeline (HISTORY.md
            # lookup, asset names, the PyPI version) assumes that shape.
            new="$OVERRIDE"
            if ! printf '%s' "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid tag '$new'; expected X.Y.Z (digits only, no leading 'v')." >&2
              exit 1
            fi
            echo "::notice::Releasing $new (explicit tag override)"
          else
            latest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            latest=${latest:-0.0.0}
            IFS='.' read -r major minor patch <<<"$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new="${major}.${minor}.${patch}"
            echo "::notice::Releasing $new (previous $latest, bump=$BUMP)"
          fi

          # Never clobber an existing tag (a failed publish leaves no orphan tag,
          # so a clean retry is still possible).
          if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "::error::Tag $new already exists; refusing to re-release." >&2
            exit 1
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
      # The ONE distro matrix (.github/docker-matrix.json). The gate builds
      # read its per-libc splits, and docker-assemble and docker-push read
      # the full list, so the lists cannot drift. Only push tags use `suffix`.
      - name: Emit the docker distro matrix
        id: distros
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/docker_matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Tests and builds overlap on EVERY event, after the quick static and
  # package checks.
  # ---------------------------------------------------------------------------

  # Static checks release the required tests first; the package smoke test
  # and source preflight then release builds without waiting for full suites.
  preflight:
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    needs:
      - version
      - tox-static
      - dist
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      zeroconf: ${{ steps.inputs.outputs.zeroconf }}
      cryptography: ${{ steps.inputs.outputs.cryptography }}
      crypto-sha: ${{ steps.inputs.outputs.crypto-sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Check release credentials and version
        if: needs.version.outputs.release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.new }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python .github/scripts/release_preflight.py
      - name: Check Azure signing login
        if: needs.version.outputs.release == 'true'
        uses: azure/login@v3.1.0
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check optional Docker Hub login
        if: needs.version.outputs.release == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve dependency sources
        id: inputs
        run: |
          python -m pip install packaging pytest strictyaml
          python .github/scripts/release_inputs.py
          python -m pytest .github/tests -q
      - name: Validate Linux package recipes
        run: bash .github/scripts/build_packages.sh 1.2.3 "$RUNNER_TEMP/package-check" --check
      - name: Validate package-manager templates
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/template-check"
          mkdir -p "$work"
          for asset in macos-arm64 macos-amd64 linux-arm64 linux-amd64 windows-amd64.exe windows-arm64.exe windows-i686.exe; do
            printf '%064d  cronstable-%s\n' 0 "$asset"
          done > "$work/SHA256SUMS"
          bash packaging/homebrew/render-formula.sh 1.2.3 "$work/SHA256SUMS" packaging/homebrew/cronstable.rb.tmpl > "$work/cronstable.rb"
          ruby -c "$work/cronstable.rb"
          python .github/scripts/render_scoop.py 1.2.3 "$work/SHA256SUMS" "$work/cronstable.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-inputs
          path: release-inputs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  tox-static:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck='' -pyflakes=''
      # The repository is LF-only (.gitattributes). Fail on any tracked blob
      # with CRLF or mixed endings that slipped past `text=auto`.
      - name: Guard against CRLF line endings
        run: |
          crlf="$(git ls-files --eol | grep -E 'i/(crlf|mixed)' || true)"
          if [ -n "$crlf" ]; then
            echo "::error::Tracked files with CRLF/mixed line endings (this repo is LF-only):"
            echo "$crlf"
            exit 1
          fi
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Check generated build files
        run: python scripts/generate_build_files.py --check
      # tox-uv pulls in uv and makes tox provision envs + install deps with it.
      - run: pip install tox tox-uv
      - run: tox -p auto -e lint,mypy,bandit,openapi

  # Dependency-license gate. The binaries and Docker images bundle the whole
  # dependency tree, so a copyleft (GPL/AGPL) or source-available (SSPL/BUSL)
  # license fails; weak copyleft (LGPL/MPL) is reported but allowed. The scan
  # reads installed metadata, so the job installs every distributable extra.
  # zeroconf (the `discovery` extra) is LGPL-2.1 and ships with its compliance
  # kit (in-binary notice, Release source archive, public build recipe); see
  # LICENSING.md.
  licenses:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - name: Install runtime + distributable extras
        run: |
          set -euo pipefail
          uv venv --python 3.14
          uv pip install ".[speedups,push,discovery]" "zeroconf==${{ needs.preflight.outputs.zeroconf }}"
      - name: Check dependency licenses
        run: |-
          uv run python .github/scripts/check_licenses.py


    needs:
      - version
      - preflight

  tox:
    strategy:
      # Complete the failure inventory on every OS/Python. Publication waits
      # for every required row, while artifact builds run alongside the tests.
      fail-fast: false
      matrix:
        # macOS runs the POSIX profile: its process, signal, fsync, and pipe
        # behavior differs from Linux, and releases ship macOS binaries.
        os: [ubuntu-26.04, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          # Linux ARM64 on the oldest and newest Python: releases ship ARM64
          # artifacts, and cryptography and orjson use different wheels there.
          - os: ubuntu-26.04-arm
            python: '3.10'
          - os: ubuntu-26.04-arm
            python: '3.14'
          # Gating win-arm64 row: the released .exe targets it.
          - os: windows-11-arm
            python: '3.14'
    runs-on: ${{ matrix.os }}
    # Cells take 2-9 minutes. 30 bounds a hung asyncio test and leaves
    # headroom for a degraded runner VM; 20 is too tight.
    timeout-minutes: 30
    steps: &tox-steps
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: |-
          pip install tox tox-uv

      # The tox env gets playwright but no browser, so without this step the
      # dashboard and daemon cron engine differential
      # (tests/test_web_engine_parity.py) self-skips. One cell suffices: the
      # differential is platform-independent and Chromium is ~150 MB. The
      # spec is the unpinned requirements_dev.txt line so the browser matches
      # the tox env playwright; on a skew the enforcement step below fails.
      - name: Install Chromium for the web engine differential
        if: matrix.os == 'ubuntu-26.04' && matrix.python == '3.14'
        run: |
          set -euo pipefail
          pip install "$(grep -E '^playwright' requirements_dev.txt)"
          python -m playwright install --with-deps chromium
      # Both envs on every runner: the one for the other OS skips (the tox.ini
      # `platform` key), so each cell measures its own OS coverage profile.
      - if: matrix.python != '3.14t'
        run: |-
          tox -e py-windows,py-posix
      - name: Test free-threaded Python with the stdlib JSON fallback
        if: matrix.python == '3.14t'
        run: tox -e py314t-posix

      # Opt-in by env var because it reads host tasks; one hosted Windows cell
      # runs it and fails if it skips.
      - name: Convert the runner's real Task Scheduler library
        if: matrix.os == 'windows-latest' && matrix.python == '3.14'
        shell: bash
        env:
          CRONSTABLE_TASKXML_LIVE: '1'
        run: |
          set -euo pipefail
          .tox/py-windows/Scripts/python -m pytest tests/test_taskxml.py \
            -k test_a_real_export_converts_and_loads -v -rs \
            --junitxml=taskxml-live.xml
          .tox/py-windows/Scripts/python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("taskxml-live.xml").getroot()
          suite = next(root.iter("testsuite"))
          assert int(suite.get("tests", 0)) == 1, "the live test was not collected"
          assert int(suite.get("skipped", 0)) == 0, "the live test skipped"
          EOF

      # Browser tests self-skip without Chromium. Rerun them with the tox env
      # interpreter so the cell fails if Playwright cannot find the browser.
      - name: Enforce the web engine differential ran (no silent skip)
        if: matrix.os == 'ubuntu-26.04' && matrix.python == '3.14'
        run: |
          set -euo pipefail
          .tox/py-posix/bin/python -m pytest \
            tests/test_web_engine_parity.py \
            tests/test_web_heat_e2e.py \
            tests/test_web_drawer_e2e.py \
            tests/test_web_recovery_e2e.py \
            tests/test_web_work_e2e.py \
            tests/test_web_title_e2e.py \
            tests/test_web_logsearch_e2e.py \
            tests/test_web_fleet_e2e.py \
            tests/test_web_xss_e2e.py \
            tests/test_web_auth_e2e.py \
            tests/test_web_connectivity_e2e.py \
            tests/test_web_table_e2e.py \
            tests/test_web_actions_e2e.py \
            tests/test_web_logs_e2e.py \
            tests/test_web_keyboard_e2e.py \
            tests/test_web_dag_e2e.py \
            tests/test_web_perf_e2e.py \
            tests/test_web_prefs_e2e.py \
            tests/test_web_surfaces_e2e.py \
            -v -rs --junitxml=parity-enforce.xml
          .tox/py-posix/bin/python - <<'EOF'
          import xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for suite in ET.parse("parity-enforce.xml").getroot().iter("testsuite"):
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          # JUnit counts xfail results as skipped, but those tests ran.
          root = ET.parse("parity-enforce.xml").getroot()
          totals["skipped"] -= sum(
              1
              for mark in root.iter("skipped")
              if mark.get("type") == "pytest.xfail"
          )
          print("parity differential:", totals)
          assert totals["tests"] >= 1, "no parity test was collected"
          assert totals["failures"] == 0 and totals["errors"] == 0
          assert totals["skipped"] == 0, (
              "a parity test skipped in the one cell that provisions "
              "Chromium: the browser install or resolution went stale"
          )
          EOF
      # Codecov merges the per-cell uploads by flag. fail_ci_if_error is false
      # so a Codecov outage or a fork PR without a token cannot fail the build.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python }}
          fail_ci_if_error: false

    needs:
      - version
      - tox-static

  tox-experimental:
    # Wait for supported rows to finish, but still report experimental
    # failures if one of those rows failed. Cancelled runs stay cancelled.
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
        # 3.14t is the free-threaded build: daemon threads run without the GIL.
        python: ['3.15', '3.14t']
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    steps: *tox-steps
    needs:
      - version
      - preflight
      - tox

  # Tests the pyproject.toml dependency floors (requirements_min.txt) on the
  # oldest Python; every other job resolves newer versions.
  tox-mindeps:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - run: pip install tox tox-uv
      - run: tox -e mindeps
    needs:
      - version
      - tox-static

  # Runs etcd and Kubernetes election scenarios against real servers and
  # checks that the test fakes match real HTTP behavior.
  # CRONSTABLE_LIVE_REQUIRED turns a skip for a missing server into a failure.
  backends-live:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      ETCD_IMAGE: gcr.io/etcd-development/etcd:v3.5.21
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install the package, development dependencies, and Kubernetes client
        run: pip install -e '.[kubernetes]' -r requirements_dev.txt
      - name: Start etcd without TLS or authentication
        run: |
          set -euo pipefail
          docker run -d --name etcd-plain -p 2379:2379 "$ETCD_IMAGE" \
            /usr/local/bin/etcd \
            --listen-client-urls http://0.0.0.0:2379 \
            --advertise-client-urls http://127.0.0.1:2379
      - name: Start etcd with TLS and authentication
        run: |
          set -euo pipefail
          tls="$RUNNER_TEMP/etcd-tls"
          mkdir -p "$tls"
          python - "$tls" <<'EOF'
          import pathlib
          import sys

          from tests._helpers import _write_tls

          paths = _write_tls(pathlib.Path(sys.argv[1]), cn="etcd")
          for path in paths.values():
              pathlib.Path(path).chmod(0o644)
          EOF
          docker run -d --name etcd-auth -p 2389:2379 -v "$tls:/tls:ro" \
            "$ETCD_IMAGE" /usr/local/bin/etcd \
            --listen-client-urls https://0.0.0.0:2379 \
            --advertise-client-urls https://localhost:2389 \
            --cert-file /tls/etcd-leaf.pem --key-file /tls/etcd-leaf.key
          ctl() {
            docker exec etcd-auth /usr/local/bin/etcdctl \
              --endpoints https://localhost:2379 --cacert /tls/etcd-ca.pem "$@"
          }
          for attempt in $(seq 1 30); do
            if ctl endpoint health; then break; fi
            sleep 1
          done
          ctl user add root:live-lane-password
          ctl user grant-role root root
          ctl auth enable
      - name: Wait for the plaintext etcd server
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:2379/health; then exit 0; fi
            sleep 1
          done
          docker logs etcd-plain
          exit 1
      - name: Start a kind cluster
        uses: helm/kind-action@v1.15.0
      - name: Run the live backend tests
        env:
          CRONSTABLE_LIVE_REQUIRED: '1'
          CRONSTABLE_LIVE_ETCD: http://127.0.0.1:2379
          CRONSTABLE_LIVE_ETCD_AUTH: https://localhost:2389
          CRONSTABLE_LIVE_ETCD_AUTH_PASSWORD: live-lane-password
          CRONSTABLE_LIVE_ETCD_AUTH_CA: ${{ runner.temp }}/etcd-tls/etcd-ca.pem
          CRONSTABLE_LIVE_K8S: '1'
        run: |
          set -euo pipefail
          python -m pytest tests/test_backend_live.py -v -rs -p no:randomly \
            --junitxml=backends-live.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for suite in ET.parse("backends-live.xml").getroot().iter("testsuite"):
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("live backends:", totals)
          assert totals["tests"] >= 1, "no live test was collected"
          assert totals["skipped"] == 0, "a live test skipped"
          EOF
      - name: Server logs
        if: failure()
        run: |
          docker logs etcd-plain || true
          docker logs etcd-auth || true
    needs:
      - version
      - tox-static

  # The `release` job publishes this artifact verbatim, so the bytes checked
  # here are the bytes that ship.
  dist:
    needs:
      - version
      - tox-static
    runs-on: ubuntu-26.04
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version,
      # and the setuptools_scm file finder needs only the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - name: Build distributions
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          uv build                                      # wheel + sdist into dist/
          uvx twine check dist/*.whl dist/*.tar.gz       # twine, run ephemerally
      # twine check and the publish action ignore file size; PyPI rejects an
      # oversized file only at upload, possibly after accepting the wheel.
      - name: Check artifacts against PyPI's per-file size limit
        run: |
          set -euo pipefail
          # warehouse: MAX_FILESIZE = 100 * ONE_MIB (constants.py). The error
          # text says "100 MB" but the value is 100 MiB.
          limit=104857600
          # Fail at 90 MiB: the sdist ships every git-tracked file (see
          # MANIFEST.in), so it grows with the repo.
          warn=94371840
          status=0
          for f in dist/*.whl dist/*.tar.gz; do
            size=$(wc -c < "$f")
            printf '%10d bytes  %s\n' "$size" "$f"
            if [ "$size" -ge "$warn" ]; then
              pct=$(( size * 100 / limit ))
              echo "::error file=MANIFEST.in::$(basename "$f") is ${size} bytes, ${pct}% of PyPI's ${limit}-byte per-file limit. Prune it (MANIFEST.in) before releasing."
              status=1
            fi
          done
          exit "$status"
      - name: Smoke-test the installed wheel
        run: python .github/scripts/smoke_dist.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Gates flake.nix, which `nix run github:ptweezy/cronstable` and a future
  # nixpkgs submission use. Advisory: releases ship no Nix artifact. It waits
  # for tox so the Intel row does not hold a scarce macOS runner while a
  # required test is queued.
  nix:
    needs: [preflight, tox]
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26-intel]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate all supported Nix systems
        run: nix flake check --all-systems --no-build
      # --print-build-logs so a dependency that fails to build says why in the
      # job log instead of only naming the derivation.
      - name: Build and check Nix dependencies
        run: nix flake check --print-build-logs --keep-going
      - name: Smoke-test the installed Nix application
        run: |
          nix run .#cronstable -- --version
          nix run .#cronstable -- --help > /dev/null

  # Self-contained glibc PyInstaller binaries, one per arch, built inside a
  # manylinux image against a python-build-standalone interpreter, for a
  # GLIBC_2.17 floor (armv7 and ppc64le: see their rows). The container is
  # required: pip picks manylinux wheels by the RUNNING glibc, so on a bare
  # runner it selects newer wheels and raises the floor.
  binaries:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-x86_64-unknown-linux-gnu-install_only.tar.gz'
            pysha: '490953e4a7e97a6ed64d0f0bd04f2d4d9a7bb45368890d3fa32ba05d0ff5c48f'
            floor: '2.17'
            # 64-bit, little-endian, EM_X86_64.
            archspec: elf:2:1:62
            # A pynacl wheel always exists here, so absence is a broken build.
            nacl: hard
            # So does a cryptography wheel (post-quantum sealing).
            pq: hard
            rust: '1'
            native: '1'
          - arch: amd64v3
            runner: ubuntu-26.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-x86_64_v3-unknown-linux-gnu-install_only.tar.gz'
            pysha: '8fc4a6bd7422364d815844616de31bfb5c38743815810fd9a8a4bc278684f6fc'
            floor: '2.17'
            archspec: elf:2:1:62
            nacl: hard
            pq: hard
            rust: '1'
            native: '1'
          - arch: arm64
            runner: ubuntu-26.04-arm
            platform: linux/arm64
            image: quay.io/pypa/manylinux2014_aarch64:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-aarch64-unknown-linux-gnu-install_only.tar.gz'
            pysha: '5bad659dc6d686b430f60104d53abfecb1cd93de37b8aaa112f10f0cea2cb655'
            floor: '2.17'
            archspec: elf:2:1:183   # 64-bit, little-endian, EM_AARCH64
            nacl: hard
            pq: hard   # manylinux2014_aarch64 wheel; see the amd64 row
            rust: '1'
            native: '1'
          - arch: ppc64le
            runner: ubuntu-26.04
            platform: linux/ppc64le
            qemu: true
            # manylinux_2_28: the only ppc64le cryptography wheel is tagged
            # manylinux_2_28, so the floor here is 2.28 (RHEL 8, Debian 10).
            image: quay.io/pypa/manylinux_2_28_ppc64le:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-ppc64le-unknown-linux-gnu-install_only.tar.gz'
            pysha: '5b9089861601ead3af0ab4c564cecd2c02b3e6cdf2eb4ef08e1caba98311a79f'
            floor: '2.28'
            archspec: elf:2:1:21    # 64-bit, little-endian, EM_PPC64
            nacl: soft
            pq: hard   # manylinux_2_28_ppc64le wheel; see the image note above
            rust: '1'
            native: '0'
          - arch: s390x
            runner: ubuntu-26.04
            platform: linux/s390x
            qemu: true
            image: quay.io/pypa/manylinux2014_s390x:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-s390x-unknown-linux-gnu-install_only.tar.gz'
            pysha: '8ceecd7af302de3f6e6c4564dd671e4d1fa3a2a69f7d40075c75a2747d6ceacf'
            floor: '2.17'
            archspec: elf:2:2:22    # 64-bit, BIG-endian, EM_S390
            nacl: soft
            # No s390x cryptography wheel exists, so this row builds it with
            # rustup Rust and a source-built OpenSSL 3.5 (CentOS 7 ships 1.0.2;
            # ML-KEM needs 3.5). soft, like the other QEMU source builds.
            pq: soft
            pq_src: '1'
            rust: '1'
            native: '0'
          - arch: armv7
            runner: ubuntu-26.04
            platform: linux/arm/v7
            qemu: true
            # No manylinux2014 armv7l image exists; this one sets a 2.31 floor.
            image: quay.io/pypa/manylinux_2_31_armv7l:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-armv7-unknown-linux-gnueabihf-install_only.tar.gz'
            pysha: 'fc000e5c8651aaa81113aa55868300ebb9debff71d6d96b2a841f589d5057668'
            floor: '2.31'
            archspec: elf:1:1:40    # 32-bit, little-endian, EM_ARM
            # Hard-float, and nothing in the bundle may need above ARMv7.
            armgate: '--arm-float hard --max-arm-arch v7 --max-arm-fp 4'
            nacl: soft
            # cryptography publishes a manylinux_2_31_armv7l wheel, which
            # matches this image, so pq is hard with no source build.
            pq: hard
            # No Rust by choice (rustup does support this triple): an orjson
            # build under QEMU costs more than orjson buys, and the stdlib
            # fallback (cronstable/_json) is byte-compatible.
            rust: '0'
            native: '0'
    runs-on: ${{ matrix.runner }}
    # The emulated rows source-build uvloop, pynacl and psutil under QEMU.
    # Generous on purpose; a row still going at this point is wedged, not slow.
    timeout-minutes: 300
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      # pip keeps the wheels it builds from sdists here, so QEMU compiles run
      # once per dependency bump. Keyed on the image too: a source-built wheel
      # carries a plain linux_<arch> tag whatever base built it.
      - name: Restore pip cache (QEMU-built wheels)
        id: pip-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: pip-manylinux-${{ matrix.arch }}-${{ matrix.image }}-${{ hashFiles('pyproject.toml', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
          restore-keys: |
            pip-manylinux-${{ matrix.arch }}-${{ matrix.image }}-
        continue-on-error: true
      # The static OpenSSL the pq_src row builds takes an hour under QEMU.
      # Keyed on build_openssl.sh (which pins the version) and the image.
      - name: Restore the OpenSSL build (pq_src rows)
        if: ${{ matrix.pq_src }}
        id: openssl-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .openssl-${{ matrix.arch }}
          key: openssl-manylinux-${{ matrix.arch }}-${{ hashFiles('pyinstaller/build_openssl.sh') }}-${{ matrix.image }}
        continue-on-error: true
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4.4.0
      # Its own step, so a registry blip never re-runs the build. Plain retry,
      # not pull_base: its mirror failover rewrites images into the Docker Hub
      # library/ namespace, which these quay.io images are not in.
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
      - name: Build binary (manylinux ${{ matrix.arch }})
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
          # Passed via the environment: the single-quoted script admits no
          # quotes. The command installs rustup Rust (the distro rustc
          # predates the orjson MSRV) in a fresh sh -c, so it sources
          # retry.sh itself. The installer goes to a file first, because sh
          # would already be running a truncated download piped into it. No
          # curl retry flags: CentOS 7 curl 7.29 rejects --retry-connrefused.
          RUST_SETUP_CMD: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e PIP_CACHE_DIR=/src/.pip-cache \
            -e RUST_SETUP_CMD \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              # NO APOSTROPHES: this whole script is single-quoted (sh -euc).
              . /src/.github/scripts/retry.sh
              # pip disables a cache directory that root does not own, and the
              # bind mount belongs to the runner user.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              # git refuses a repository another user owns, which fails the
              # setuptools_scm step of `pip install .`. The other container
              # lanes have no git.
              git config --global --add safe.directory /src
              # PyInstaller needs a shared libpython; the image CPythons in
              # /opt/python are built --disable-shared.
              sh /src/.github/scripts/install_pbs.sh \
                "${{ matrix.pyurl }}" "${{ matrix.pysha }}" /opt/pbs
              PATH=/opt/pbs/bin:$PATH
              LD_LIBRARY_PATH=/opt/pbs/lib
              export PATH LD_LIBRARY_PATH
              if [ "${{ matrix.arch }}" = amd64v3 ]; then
                python3 docker/python_runtime.py --check
                RUSTFLAGS="-C target-cpu=x86-64-v3"
                export RUSTFLAGS
              fi
              # python-build-standalone records its build compiler path
              # (/usr/bin/<triple>-gcc) in sysconfig, and this image lacks it,
              # so every source build fails. Use the image toolchain.
              CC=gcc
              CXX=g++
              AR=ar
              LDSHARED="gcc -shared"
              export CC CXX AR LDSHARED
              # install_extra.sh / install_orjson.sh read these; nothing on the
              # image PATH is the right interpreter, so both are absolute.
              PIP="/opt/pbs/bin/python3 -m pip"
              PY=/opt/pbs/bin/python3
              export PIP PY
              $PIP install --upgrade pip
              $PIP install -r pyinstaller/build-requirements.txt
              $PIP install .                    # bakes the pinned version into cronstable/version.py
              # Bundle uvloop (the `speedups` extra): a wheel on amd64/arm64,
              # else a source build. verify_extra.py uninstalls a build that
              # cannot run a loop (QEMU can miscompile), leaving asyncio.
              sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
              # Bundle orjson (the `speedups` extra): a wheel on amd64/arm64,
              # else a Rust build via RUST_SETUP. Without either, the binary
              # uses the byte-compatible stdlib encoder in cronstable/_json.
              RUST_SETUP=""
              if [ "${{ matrix.rust }}" = "1" ]; then
                RUST_SETUP="$RUST_SETUP_CMD"
              fi
              RUST_SETUP="$RUST_SETUP" sh pyinstaller/install_orjson.sh
              # Bundle pynacl (the `push` extra): hard where a wheel exists,
              # soft where it source-builds. A build that fails the sealed-box
              # round trip is uninstalled, so push fails closed.
              sh pyinstaller/install_extra.sh pynacl "@" ${{ matrix.nacl }} "push extra not bundled"
              # Bundle cryptography (the post-quantum half of the `push`
              # extra): hard where a wheel matches the image; pq_src rows
              # build it soft with rustup Rust and a static OpenSSL 3.5.
              # verify_extra.py then seals a real X-Wing probe, which catches
              # an OpenSSL without ML-KEM.
              if [ -n "${{ matrix.pq }}" ]; then
                pq_ready=1
                if [ -n "${{ matrix.pq_src }}" ]; then
                  # Best effort: a failed step skips post-quantum push.
                  {
                    if [ ! -x /opt/cargo/bin/cargo ]; then
                      sh -c "$RUST_SETUP_CMD"
                    fi
                    # OpenSSL needs perl IPC::Cmd and Time::Piece, which the
                    # image lacks. Do not add perl-bignum: bigint is in base
                    # perl here, and yum fails on that package name.
                    perl -MIPC::Cmd -MTime::Piece -e 1 2>/dev/null || retry 5 yum install -y perl-IPC-Cmd perl-Time-Piece
                    sh pyinstaller/build_openssl.sh /src/.openssl-${{ matrix.arch }}
                  } || pq_ready=0
                  PATH=/opt/cargo/bin:$PATH
                  CARGO_HOME=/opt/cargo
                  RUSTUP_HOME=/opt/rustup
                  OPENSSL_DIR=/src/.openssl-${{ matrix.arch }}
                  OPENSSL_STATIC=1
                  export PATH CARGO_HOME RUSTUP_HOME OPENSSL_DIR OPENSSL_STATIC
                fi
                if [ "$pq_ready" = 1 ]; then
                  sh pyinstaller/install_extra.sh cryptography "@" \
                    ${{ matrix.pq }} "post-quantum push not bundled"
                else
                  echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
                fi
              fi
              # Bundle zeroconf (the `discovery` extra): pure Python, so a hard
              # install on every row. LGPL-2.1: see the licenses job.
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version          # smoke test, on CentOS 7 itself
              # Gate the extras the build env kept (see smoke_frozen.sh).
              PY="$PY" sh pyinstaller/smoke_frozen.sh dist/cronstable
              # Black-box acceptance on native rows, inside the build libc.
              # Emulated rows get only the smoke and ABI checks.
              if [ "${{ matrix.native }}" = "1" ]; then
                $PIP install -r acceptance/requirements.txt
                $PY -m pytest -c acceptance/pytest.ini acceptance \
                  --cronstable-bin dist/cronstable \
                  --expected-version "$SETUPTOOLS_SCM_PRETEND_VERSION" \
                  --acceptance-output acceptance-results \
                  --junitxml acceptance-results/junit.xml
              fi
              # An image resolved to the wrong platform passes every smoke
              # above, so assert the architecture this row claims.
              $PY /src/.github/scripts/assert_arch.py dist/cronstable ${{ matrix.archspec }}
              # Assert the glibc FLOOR, which no functional test sees, and no
              # executable stack, which SELinux-hardened hosts refuse.
              $PY /src/.github/scripts/elf_floor.py dist/cronstable \
                --max-glibc ${{ matrix.floor }} --no-exec-stack ${{ matrix.armgate }}
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}
            '
      - name: Upload binary acceptance evidence
        if: ${{ always() && matrix.native == '1' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acceptance-linux-${{ matrix.arch }}
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 7
      # The container writes these as root with mode 0600, which the
      # runner-user tar in the cache save cannot read.
      - name: Make the pip cache readable by the cache save
        run: |
          set -euo pipefail
          for d in .pip-cache .openssl-${{ matrix.arch }}; do
            if [ -d "$d" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$d"
            fi
          done
      # Trunk only: the Actions cache is ONE 10 GB pool, and writes from every
      # branch would evict the docker layer cache. Branches restore from main.
      - name: Save pip cache (trunk only)
        if: ${{ steps.pip-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: pip-manylinux-${{ matrix.arch }}-${{ matrix.image }}-${{ hashFiles('pyproject.toml', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Save the OpenSSL build (pq_src rows, trunk only)
        if: ${{ matrix.pq_src && steps.openssl-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .openssl-${{ matrix.arch }}
          key: openssl-manylinux-${{ matrix.arch }}-${{ hashFiles('pyinstaller/build_openssl.sh') }}-${{ matrix.image }}
        continue-on-error: true
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}
          path: dist/cronstable-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained Linux binaries built inside `docker run --platform`, one
  # per arch x libc pair: every Alpine arch (`-musl` suffix) plus the two
  # glibc rows the manylinux `binaries` job cannot serve. Base images carry an
  # EXPLICIT distro tag, because a floating tag moves the libc floor silently;
  # Alpine 3.23 is the newest on musl 1.2.5. tests/test_ci_fences.py enforces
  # the distro tag.
  binaries-container:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        libc: [musl, glibc]
        arch: [amd64, amd64v3, arm64, i686, armv7, armv6, ppc64le, s390x, riscv64]
        exclude:
          # These glibc rows build in the manylinux `binaries` job instead;
          # armv6 is musl-only (Debian ships no arm32v6).
          - {libc: glibc, arch: amd64}
          - {libc: glibc, arch: amd64v3}
          - {libc: glibc, arch: arm64}
          - {libc: glibc, arch: armv7}
          - {libc: glibc, arch: ppc64le}
          - {libc: glibc, arch: s390x}
          - {libc: glibc, arch: armv6}
        include:
          # per-libc. These commands are spliced into the single-quoted
          # sh -euc script, so none may contain a quote character.
          - libc: musl
            image: python:3.14-alpine3.23
            suffix: -musl
            toolchain: 'retry 5 apk add --no-cache build-base libffi-dev zlib-dev'
            nacl_tools: 'retry 3 apk add --no-cache libffi-dev make >/dev/null 2>&1 || true'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 5 apk add --no-cache curl && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # For pq_src rows: Alpine 3.23 ships Rust 1.91 (cryptography
            # needs 1.83) and OpenSSL 3.5 (ML-KEM needs 3.5) on every arch,
            # so no rustup or OpenSSL build.
            pq_tools: 'retry 5 apk add --no-cache rust cargo openssl-dev pkgconf'
          - libc: glibc
            # Overridden per row: bookworm for i686, trixie for riscv64.
            image: python:3.14-slim-trixie
            suffix: ''
            toolchain: 'retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential libffi-dev zlib1g-dev'
            nacl_tools: 'retry 3 apt-get -o Acquire::Retries=5 install -y --no-install-recommends libffi-dev make >/dev/null 2>&1 || true'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # trixie ships rustc 1.85 and OpenSSL 3.5. Only riscv64 uses this;
            # the bookworm i686 row overrides it below.
            pq_tools: 'retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends rustc cargo libssl-dev pkg-config'
          # per-arch: docker platform, runner, and whether QEMU is needed.
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-26.04}
          - {arch: amd64v3, platform: linux/amd64, runner: ubuntu-26.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-26.04-arm}
          - {arch: i686, platform: linux/386, runner: ubuntu-26.04}
          # Post-quantum: hard where cryptography publishes a musllinux_1_2
          # wheel (x86_64, aarch64); elsewhere soft, built from the sdist with
          # pq_tools and verified like pynacl (see binaries).
          - {libc: musl, arch: amd64, pq: hard}
          - {libc: musl, arch: amd64v3, pq: hard}
          - {libc: musl, arch: arm64, pq: hard}
          - {libc: musl, arch: i686, pq: soft, pq_src: '1'}
          - {libc: musl, arch: armv7, pq: soft, pq_src: '1'}
          - {libc: musl, arch: armv6, pq: soft, pq_src: '1'}
          - {libc: musl, arch: ppc64le, pq: soft, pq_src: '1'}
          - {libc: musl, arch: s390x, pq: soft, pq_src: '1'}
          - {libc: musl, arch: riscv64, pq: soft, pq_src: '1'}
          # `armgate`: the float ABI and newest ARM instruction set that
          # elf_floor.py allows on 32-bit ARM.
          # `hostplat`: under QEMU an ARMv6 container reports armv7l, so pip
          # installs armv7l wheels that fail on ARMv6 hardware yet pass every
          # emulated smoke. _PYTHON_HOST_PLATFORM makes pip use armv6l tags,
          # so the C extensions compile in-container instead.
          - {arch: armv7, platform: linux/arm/v7, runner: ubuntu-26.04, qemu: true, armgate: '--arm-float hard --max-arm-arch v7 --max-arm-fp 4'}
          - {arch: armv6, platform: linux/arm/v6, runner: ubuntu-26.04, qemu: true, armgate: '--arm-float hard --max-arm-arch v6 --max-arm-fp 2', hostplat: linux-armv6l}
          - {arch: ppc64le, platform: linux/ppc64le, runner: ubuntu-26.04, qemu: true}
          - {arch: s390x, platform: linux/s390x, runner: ubuntu-26.04, qemu: true}
          - {arch: riscv64, platform: linux/riscv64, runner: ubuntu-26.04, qemu: true}
          # Matched on libc and arch, so only the two glibc rows take these.
          # `floor` is the newest glibc elf_floor.py allows. i686 uses bookworm
          # (glibc 2.36, Debian 12): python-build-standalone has no i686 Linux
          # build for the manylinux route. riscv64 needs trixie for the port.
          - libc: glibc
            arch: i686
            image: python:3.14-slim-bookworm
            floor: '2.36'
            # bookworm has OpenSSL 3.0 and rustc 1.63 (cryptography needs 3.5
            # and 1.83), so pq_openssl builds with rustup Rust and a static
            # OpenSSL 3.5, uncached because it runs natively. rustup gets the
            # host explicitly: uname in a linux/386 container can say x86_64.
            pq: soft
            pq_src: '1'
            pq_openssl: '1'
            pq_tools: 'retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates perl make pkg-config'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --default-host i686-unknown-linux-gnu --profile minimal --no-modify-path'
          - {libc: glibc, arch: riscv64, image: python:3.14-slim-trixie, floor: '2.41', pq: soft, pq_src: '1'}
    runs-on: ${{ matrix.runner }}
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      # The pip wheel cache (see binaries), keyed on libc and arch: glibc and
      # musl source builds share the plain linux_<arch> tag.
      - name: Restore pip cache (QEMU-built wheels)
        id: pip-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: pip-${{ matrix.libc }}-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
          restore-keys: |
            pip-${{ matrix.libc }}-${{ matrix.arch }}-
        continue-on-error: true
      - uses: ./.github/actions/setup-docker
        if: matrix.platform == 'linux/386'
      # binfmt/QEMU for the foreign-arch rows.
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4.4.0
      # Its own step, as in binaries; pull_base adds mirror failover.
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          pull_base ${{ matrix.image }} ${{ matrix.platform }}
      - name: Build binary (${{ matrix.libc }} container)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e PIP_CACHE_DIR=/src/.pip-cache \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              # NO APOSTROPHES: this whole script is single-quoted (sh -euc).
              # apk and apt retry too little, so the matrix commands use retry.
              . /src/.github/scripts/retry.sh
              # pip disables a cache directory root does not own; the host step
              # after the build hands ownership back for the cache save.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              # C toolchain and strip (the spec sets strip=True), plus libffi
              # and zlib headers for deps with no wheel for this libc and arch.
              ${{ matrix.toolchain }}
              if [ "${{ matrix.arch }}" = amd64v3 ]; then
                python docker/python_runtime.py --variant amd64v3 --libc musl --prefix /opt/pbs
                PATH=/opt/pbs/bin:$PATH
                RUSTFLAGS="-C target-cpu=x86-64-v3"
                export PATH RUSTFLAGS
              fi
              # See the hostplat comment in the matrix: this is what stops pip
              # selecting armv7l wheels inside an ARMv6 container.
              if [ -n "${{ matrix.hostplat }}" ]; then
                _PYTHON_HOST_PLATFORM="${{ matrix.hostplat }}"
                export _PYTHON_HOST_PLATFORM
                python -c "import sysconfig; print(\"host platform:\", sysconfig.get_platform())"
              fi
              pip install --upgrade pip
              pip install -r pyinstaller/build-requirements.txt
              pip install .                     # bakes the pinned version into cronstable/version.py
              # Bundle uvloop: see the binaries job.
              sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
              # Bundle orjson: see binaries. RUST_SETUP is the per-libc matrix
              # rust_setup, shaped like the binaries RUST_SETUP_CMD.
              RUST_SETUP="${{ matrix.rust_setup }}" sh pyinstaller/install_orjson.sh
              # Bundle pynacl: see binaries. soft on every row here, and the
              # nacl_tools install is best-effort.
              ${{ matrix.nacl_tools }}
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
              # Bundle cryptography: see binaries. pq_src rows build against
              # the distro libssl, which the bundle already carries for the
              # ssl module; the pq_openssl row links a static OpenSSL instead.
              if [ -n "${{ matrix.pq }}" ]; then
                if [ -n "${{ matrix.pq_src }}" ]; then
                  ${{ matrix.pq_tools }}
                fi
                pq_ready=1
                if [ -n "${{ matrix.pq_openssl }}" ]; then
                  # Best effort: a failed step skips post-quantum push.
                  {
                    if [ ! -x /opt/cargo/bin/cargo ]; then
                      sh -c "${{ matrix.rust_setup }}"
                    fi
                    sh pyinstaller/build_openssl.sh /opt/openssl
                  } || pq_ready=0
                  PATH=/opt/cargo/bin:$PATH
                  CARGO_HOME=/opt/cargo
                  RUSTUP_HOME=/opt/rustup
                  OPENSSL_DIR=/opt/openssl
                  OPENSSL_STATIC=1
                  export PATH CARGO_HOME RUSTUP_HOME OPENSSL_DIR OPENSSL_STATIC
                fi
                if [ "$pq_ready" = 1 ]; then
                  sh pyinstaller/install_extra.sh cryptography "@" \
                    ${{ matrix.pq }} "post-quantum push not bundled"
                else
                  echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
                fi
              fi
              # Bundle zeroconf (hard): see binaries and the licenses job.
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version            # smoke test, native or emulated on its own libc
              # Gate the extras the build env kept (see smoke_frozen.sh).
              PY="python" sh pyinstaller/smoke_frozen.sh dist/cronstable
              # Exercise native musl and i686 glibc on their own libc. This
              # needs no bash or curl in the container, only the driver deps.
              if [ "${{ matrix.qemu }}" != "true" ]; then
                python -m pip install -r acceptance/requirements.txt
                python -m pytest -c acceptance/pytest.ini acceptance \
                  --cronstable-bin dist/cronstable \
                  --expected-version "$SETUPTOOLS_SCM_PRETEND_VERSION" \
                  --acceptance-output acceptance-results \
                  --junitxml acceptance-results/junit.xml
              fi
              # Assert the glibc FLOOR where a row declares one (see binaries).
              # musl rows skip it: their floor is the pinned Alpine tag.
              gate=""
              if [ -n "${{ matrix.floor }}" ]; then
                gate="--max-glibc ${{ matrix.floor }} --no-exec-stack"
              fi
              if [ -n "$gate" ] || [ -n "${{ matrix.armgate }}" ]; then
                python /src/.github/scripts/elf_floor.py dist/cronstable $gate ${{ matrix.armgate }}
              fi
              if [ "${{ matrix.arch }}" = amd64v3 ]; then
                python /src/.github/scripts/assert_arch.py dist/cronstable elf:2:1:62
                python /src/.github/scripts/elf_floor.py dist/cronstable --max-glibc 0.0 --no-exec-stack
              fi
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}
            '
      # As in binaries. A failed save is only a warning, so without this the
      # QEMU wheels never persist.
      - name: Make the pip cache readable by the cache save
        run: |
          set -euo pipefail
          if [ -d .pip-cache ]; then
            sudo chown -R "$(id -u):$(id -g)" .pip-cache
          fi
      # Trunk only, for the cache pool reason given in binaries.
      - name: Save pip cache (trunk only)
        if: ${{ steps.pip-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: pip-${{ matrix.libc }}-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}"
      - name: Upload binary acceptance evidence
        if: ${{ always() && !matrix.qemu }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acceptance-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: dist/cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained MIPS binaries. Its own job because no `python:3.14-*` image
  # has a mips variant: the base is Debian, Python comes from apt (3.11, the
  # newest for this port), and the build uses a venv because bookworm marks
  # that interpreter externally managed (PEP 668).
  # Bookworm is the last suite with mips64el, and only the per-arch
  # `mips64le/debian` repository carries it. That repository is frozen (its
  # tag never moves or gets patched), like the archive slice pinned below.
  # PyPI has no mips wheels, so everything compiles, PyInstaller included.
  binaries-mips:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: mips64le
            platform: linux/mips64le
            image: mips64le/debian:bookworm-slim
            # 64-bit, little-endian, EM_MIPS: e_machine alone also matches
            # 32-bit and big-endian MIPS.
            archspec: elf:2:1:8
    runs-on: ubuntu-26.04
    # Generous for an emulated full-source build; a row past this is wedged.
    timeout-minutes: 300
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: a per-arch repository; see the binaries job.
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
          echo "digest=$(docker image inspect --format '{{.Id}}' '${{ matrix.image }}')" >> "$GITHUB_OUTPUT"
        id: image
      # Persist source wheels with an image/recipe key and a bounded cache.
      - name: Restore source wheels
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-mips-${{ matrix.arch }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Build binary (${{ matrix.arch }} container)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT -e PIP_CACHE_DIR=/src/.pip-cache \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              # NO APOSTROPHES in this script, comments included: it is one
              # single-quoted sh -euc argument, and one would end it early.
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              # Pin a snapshot slice: mips64el is outside bookworm LTS, so its
              # live index can disappear on any date and red a release. Plain
              # HTTP needs no ca-certificates in this slim image. The slice is
              # unpatched; the alternative is dropping the row. Recheck with:
              #   curl -s https://deb.debian.org/debian/dists/bookworm/Release | grep ^Architectures
              echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260715T000000Z/ bookworm main" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
              # Python plus a C toolchain: everything below builds from source.
              retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any -qq update
              retry 5 apt-get -o Acquire::Retries=5 -qq install -y --no-install-recommends \
                python3 python3-venv python3-dev build-essential zlib1g-dev libffi-dev pkg-config
              # pip runs as root; the mounted checkout belongs to the runner.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              python3 -VV
              python3 -m venv /v
              retry 5 /v/bin/pip install --upgrade pip setuptools wheel
              # install_extra.sh / install_orjson.sh read these.
              PIP=/v/bin/pip
              PY=/v/bin/python
              export PIP PY
              # Not retried: this compiles the bootloader, and retrying a
              # deterministic compile failure only multiplies it.
              /v/bin/pip install -r pyinstaller/build-requirements.txt
              /v/bin/pip install .                     # bakes the pinned version into cronstable/version.py
              # Extras as in binaries-container: compiled ones soft, zeroconf
              # hard. mips64el has no rustup toolchain and no distro rustc new
              # enough for orjson, so the binary uses stdlib json.
              sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
              sh pyinstaller/install_orjson.sh
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              /v/bin/pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version          # smoke test: fails the job if the bundle is broken
              # Gate the extras the build env kept (see smoke_frozen.sh).
              PY="/v/bin/python" sh pyinstaller/smoke_frozen.sh dist/cronstable
              /v/bin/python /src/.github/scripts/assert_arch.py \
                dist/cronstable ${{ matrix.archspec }}
              # The glibc floor, which the smoke test cannot see (it runs on
              # the build libc). No --no-exec-stack, unlike other glibc lanes:
              # Debian mips64el gives every object an executable stack for the
              # kernel FPU emulator (Debian #1022787); that check cannot pass.
              /v/bin/python /src/.github/scripts/elf_floor.py dist/cronstable --max-glibc 2.36
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}
            '
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}
          path: dist/cronstable-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Bound the source-wheel cache
        id: cache-size
        run: |
          sudo chown -R "$(id -u):$(id -g)" .pip-cache
          python3 .github/scripts/cache_size.py .pip-cache
      - name: Save source wheels (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-mips-${{ matrix.arch }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
        if: github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true'
        continue-on-error: true

  # Self-contained binaries for the legacy 32-bit ARM ABIs, both glibc:
  # hard-float ARMv6 (Raspberry Pi 1 and Zero) and soft-float armel (Kirkwood
  # NAS boxes). Debian armhf is ARMv7, so no `library/debian` or
  # `python:3.14-*` image can supply an ARMv6 base; Python comes from apt
  # (3.11), as on MIPS. PyPI has no ARMv6 or armel wheels, so everything
  # compiles, PyInstaller included. Two guards keep ARMv7 code out.
  # _PYTHON_HOST_PLATFORM: QEMU reports armv7l from uname, and this makes pip
  # use armv6l/armv5tel tags, compiling C extensions instead of installing
  # armv7l wheels. QEMU_CPU pins the emulated core to the target, so a stray
  # ARMv7 instruction faults during the build.
  binaries-arm-legacy:
    # pq-wheel-armv6 is continue-on-error, so a failed wheel never holds this
    # job; the armv6 row then seals x25519 only, as armel always does.
    needs:
      - version
      - pq-wheel-armv6
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: armv6
            platform: linux/arm/v6
            # Genuine linux/arm/v6 glibc, rebuilt weekly from Raspbian main.
            # Every other candidate is ARMv7-only, musl-only, or stale.
            # Pinned by tag, unlike armel: Raspbian OpenSSL and zlib ship in
            # the binary, so a patched base beats a byte-identical build. The
            # cost is a personal namespace with no support promise.
            image: tianon/raspbian:bookworm-slim
            # ARM1176JZF-S, the Pi 1/Zero core: ARMv6KZ with VFPv2.
            qemu_cpu: arm1176
            hostplat: linux-armv6l
            armgate: '--arm-float hard --max-arm-arch v6 --max-arm-fp 2'
            floor: '2.36'
            sources: ''
    runs-on: ubuntu-26.04
    # Generous for an emulated full-source build; a row past this is wedged.
    timeout-minutes: 360
    # Shared with binaries-armel.
    steps: &legacy-arm-steps
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      # The armv6 cryptography wheel, built in its own job because the compile
      # takes hours under emulation. Without it the row stays on x25519.
      - name: Fetch the ARMv6 post-quantum wheel
        if: ${{ matrix.arch == 'armv6' }}
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: pq-wheel-glibc-armv6
          path: pq-wheels
      - uses: docker/setup-qemu-action@v4.4.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: third-party and per-arch images; see binaries.
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
      - name: Build binary (${{ matrix.arch }})
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e QEMU_CPU=${{ matrix.qemu_cpu }} \
            -e _PYTHON_HOST_PLATFORM=${{ matrix.hostplat }} \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              if [ -n "${{ matrix.sources }}" ]; then
                echo "${{ matrix.sources }}" > /etc/apt/sources.list
                rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
              fi
              # Python plus a C toolchain: everything below builds from source.
              retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any -qq update
              retry 5 apt-get -o Acquire::Retries=5 -qq install -y --no-install-recommends \
                python3 python3-venv python3-dev build-essential zlib1g-dev libffi-dev pkg-config
              python3 -VV
              # Log the platform pip derives wheel tags from (the host guard).
              python3 -c "import sysconfig; print(\"wheel platform:\", sysconfig.get_platform())"
              python3 -m venv /v
              retry 5 /v/bin/pip install --upgrade pip setuptools wheel
              # install_extra.sh / install_orjson.sh read these.
              PIP=/v/bin/pip
              PY=/v/bin/python
              export PIP PY
              # Not retried: this compiles the bootloader, and retrying a
              # deterministic compile failure only multiplies it.
              /v/bin/pip install -r pyinstaller/build-requirements.txt
              /v/bin/pip install .                     # bakes the pinned version into cronstable/version.py
              # Extras as in binaries-container: compiled ones soft, zeroconf
              # hard. rustup has no toolchain for either ABI, so the binary
              # uses stdlib json in place of orjson.
              sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
              sh pyinstaller/install_orjson.sh
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
              # Bundle cryptography on armv6 from the fetched wheel, soft like
              # pynacl. PIP_ONLY_BINARY keeps pip off the sdist (no Rust in
              # here). armel has no Rust for its ABI and stays on x25519.
              if [ "${{ matrix.arch }}" = armv6 ] && ls /src/pq-wheels/cryptography-*.whl >/dev/null 2>&1; then
                PIP_FIND_LINKS=/src/pq-wheels PIP_ONLY_BINARY=cryptography \
                  sh pyinstaller/install_extra.sh cryptography "@" soft "post-quantum push not bundled"
              else
                echo "cryptography: no wheel for this row; post-quantum push not bundled"
              fi
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              /v/bin/pyinstaller pyinstaller/cronstable.spec
              # Smoke test on the emulated target core (QEMU_CPU).
              dist/cronstable --version
              # Gate the extras the build env kept (see smoke_frozen.sh).
              PY="/v/bin/python" sh pyinstaller/smoke_frozen.sh dist/cronstable
              # 32-bit, little-endian, EM_ARM. e_machine cannot tell the two ABIs
              # apart, which is what the float-ABI half of the gate below is for.
              /v/bin/python /src/.github/scripts/assert_arch.py dist/cronstable elf:1:1:40
              /v/bin/python /src/.github/scripts/elf_floor.py dist/cronstable \
                --max-glibc ${{ matrix.floor }} --no-exec-stack ${{ matrix.armgate }}
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}
            '
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}
          path: dist/cronstable-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # This ABI has no PQ wheel dependency and can start immediately.
  binaries-armel:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: armel
            platform: linux/arm/v5
            # Pinned by digest: this tag is frozen at its final build, and
            # bookworm-security has no armel: the OS layer stays unpatched.
            image: arm32v5/debian:bookworm-slim@sha256:cf9397e3198b2c002eb360586d341ba89154634198a26c578eb096b533b212cd
            # ARM926EJ-S, the Kirkwood core: ARMv5TE, no VFP, so soft-float.
            qemu_cpu: arm926
            hostplat: linux-armv5tel
            # bookworm main only: the default list includes bookworm-security,
            # which has no armel and makes apt warn. main still serves armel;
            # snapshot.debian.org has a frozen slice if that ends.
            sources: 'deb http://deb.debian.org/debian bookworm main'
            # libatomic (pulled in by libcrypto) is exempt from the v5 ceiling.
            # It declares Tag_CPU_arch v7 for its v7 ldrex/dmb variants, but
            # its IFUNC resolvers pick those only when HWCAP reports support;
            # a v5 core gets the __kuser_cmpxchg kernel helper. elf_floor.py
            # exempts a member only if it dispatches through IFUNC.
            armgate: '--arm-float soft --max-arm-arch v5 --max-arm-fp 0 --arm-arch-except libatomic.so.1'
            floor: '2.36'
    runs-on: ubuntu-26.04
    # Generous for an emulated full-source build; a row past this is wedged.
    timeout-minutes: 360
    steps: *legacy-arm-steps

  # Self-contained LoongArch binaries, glibc and musl. Its own job because
  # `library/debian`, `library/alpine` and `python:3.14-*` have no loong64:
  # both bases are third-party, and the musl row installs Python from apk.
  # They target the new-world ABI; old-world distros (Loongnix, Kylin, UOS)
  # are binary-incompatible and not served. PyPI has no loong64 wheels, so
  # everything compiles, PyInstaller included.
  binaries-loong64:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - libc: glibc
            suffix: ''
            # A python.org build on Debian trixie: the only tag line in this
            # namespace that gets rebuilt (sid-slim and forky-slim are stale).
            image: ghcr.io/loong64/python:3.14-slim-trixie
            toolchain: 'retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential libffi-dev zlib1g-dev curl ca-certificates'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # OpenSSL 3.5 headers for the cryptography source build; Rust
            # comes from rustup.
            pq_tools: 'retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends libssl-dev pkg-config'
            floor: '2.41'
          - libc: musl
            suffix: -musl
            # Tracks the signed Alpine minirootfs; the Docker Hub
            # loongarch64/alpine namespace is stale.
            image: ghcr.io/loong64/alpine:3.24.1
            toolchain: 'retry 5 apk add --no-cache build-base libffi-dev zlib-dev python3 python3-dev py3-pip curl'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # Alpine 3.24's OpenSSL 3.5 headers, for the same source build.
            pq_tools: 'retry 5 apk add --no-cache openssl-dev pkgconf'
            floor: ''
    runs-on: ubuntu-26.04
    # Generous for an emulated full-source build; a row past this is wedged.
    timeout-minutes: 300
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      # The default binfmt install includes loong64.
      - uses: docker/setup-qemu-action@v4.4.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: third-party images; see the binaries job.
          retry 5 docker pull --platform linux/loong64 ${{ matrix.image }}
          echo "digest=$(docker image inspect --format '{{.Id}}' '${{ matrix.image }}')" >> "$GITHUB_OUTPUT"
        id: image
      # Persist source wheels with an image/recipe key and a bounded cache.
      - name: Restore source wheels
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-loong64-${{ matrix.libc }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Build binary (loong64 ${{ matrix.libc }})
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/loong64 \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT -e PIP_CACHE_DIR=/src/.pip-cache \
            -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              # Per-libc toolchain; on musl, Python too, marked externally
              # managed (PEP 668), hence PIP_BREAK_SYSTEM_PACKAGES.
              ${{ matrix.toolchain }}
              # Own both newly created and restored caches before pip runs.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              python3 -VV
              pip install --upgrade pip
              # Not retried: this compiles the bootloader, and retrying a
              # deterministic compile failure only multiplies it.
              pip install -r pyinstaller/build-requirements.txt
              pip install .                     # bakes the pinned version into cronstable/version.py
              # Extras as in binaries-container: compiled ones soft, zeroconf
              # hard. rustup has loongarch64 toolchains for both libcs.
              sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
              RUST_SETUP="${{ matrix.rust_setup }}" sh pyinstaller/install_orjson.sh
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
              # Bundle cryptography, soft: no loong64 wheel, so it builds
              # against the distro OpenSSL (see binaries-container) with the
              # rustup Rust, fetched here if the orjson step did not.
              if { ${{ matrix.pq_tools }}; } && { [ -x /opt/cargo/bin/cargo ] || sh -c "${{ matrix.rust_setup }}"; }; then
                PATH=/opt/cargo/bin:$PATH CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup \
                  sh pyinstaller/install_extra.sh cryptography "@" soft "post-quantum push not bundled"
              else
                echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
              fi
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version          # smoke test, emulated on its own libc
              # Gate the extras the build env kept (see smoke_frozen.sh).
              PY="python3" sh pyinstaller/smoke_frozen.sh dist/cronstable
              # 64-bit, little-endian, EM_LOONGARCH.
              python3 /src/.github/scripts/assert_arch.py dist/cronstable elf:2:1:258
              if [ -n "${{ matrix.floor }}" ]; then
                python3 /src/.github/scripts/elf_floor.py dist/cronstable --max-glibc ${{ matrix.floor }} --no-exec-stack
              fi
              mv dist/cronstable dist/cronstable-linux-loong64${{ matrix.suffix }}
            '
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-loong64${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-loong64${{ matrix.suffix }}
          path: dist/cronstable-linux-loong64${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Bound the source-wheel cache
        id: cache-size
        run: |
          sudo chown -R "$(id -u):$(id -g)" .pip-cache
          python3 .github/scripts/cache_size.py .pip-cache
      - name: Save source wheels (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-loong64-${{ matrix.libc }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', 'pyinstaller/build-requirements.txt', '.github/workflows/release.yml') }}
        if: github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true'
        continue-on-error: true

  # Self-contained macOS 15 binaries, signed and notarized on a release. The
  # steps are shared with binaries-macos-experimental (macOS 26, ship: false,
  # never signed or attached). Shipped rows keep the bare `macos-<arch>` asset
  # names the Release and Homebrew formula expect. Intel rows gate and ship
  # like ARM; retirement map: wiki/Contributing-and-Releasing.md, "Intel Mac
  # support".
  binaries-macos:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: arm64
            runner: macos-15          # macOS 15, Apple Silicon -- shipped
            ship: true
            asset: macos-arm64
            # Every cryptography release ships macosx_11_0_arm64, so the
            # Apple Silicon rows take the newest.
            pq: hard
          - arch: amd64
            runner: macos-15-intel    # macOS 15, Intel -- shipped
            ship: true
            asset: macos-amd64
            # No patched cryptography wheel exists for Intel macOS: build
            # from source with Rust and OpenSSL; keep x25519 if that fails.
            pq: soft
            pq_src: '1'
          - arch: amd64v3
            runner: macos-15-intel    # macOS 15, Intel -- shipped
            ship: true
            asset: macos-amd64v3
            pq: soft
            pq_src: '1'
    runs-on: ${{ matrix.runner }}
    steps: &macos-steps
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'  # set explicitly; don't rely on the runner's preinstalled patch level
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - name: Prepare macOS signing credentials
        if: ${{ needs.version.outputs.release == 'true' && matrix.ship }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "::warning::macOS signing secrets not set; shipping an unsigned, unnotarized binary."
            exit 0
          fi

          # Import the Developer ID cert into a throwaway, randomly-keyed
          # keychain scoped to this runner (never the login keychain).
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # Let codesign use the key non-interactively.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Exercise the configured identity/private key before compilation.
          cp /usr/bin/true "$RUNNER_TEMP/signing-probe"
          . .github/scripts/retry.sh
          retry 3 codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$RUNNER_TEMP/signing-probe"

          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID"
      - name: Build amd64v3 Python
        if: matrix.arch == 'amd64v3'
        id: runtime
        run: |
          set -euo pipefail
          brew install openssl@3 libffi sqlite xz pkgconf
          CPPFLAGS="-I$(brew --prefix libffi)/include -I$(brew --prefix sqlite)/include" \
          LDFLAGS="-L$(brew --prefix libffi)/lib -L$(brew --prefix sqlite)/lib" \
            python3 docker/python_runtime.py --variant amd64v3 \
              --prefix "$RUNNER_TEMP/python-amd64v3" --openssl "$(brew --prefix openssl@3)"
      - name: Build binary
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          # Install into a throwaway uv venv on the runner's native arch and
          # freeze from it with `uv run` (uv discovers the setup-python 3.14).
          uv venv --python "${{ steps.runtime.outputs.python-path || '3.14' }}"
          uv pip install -r pyinstaller/build-requirements.txt
          uv pip install .                     # bakes the pinned version into cronstable/version.py
          # Bundle uvloop and orjson (see binaries): wheels on both arches.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_orjson.sh
          # Bundle pynacl, HARD: universal2 wheels exist, so a failure is a
          # broken build, and a soft-fail would ship push disabled.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh pynacl "@" hard
          # Bundle cryptography: a wheel on Apple Silicon, a source build
          # with Homebrew Rust and OpenSSL on the pq_src (Intel) rows.
          if [ -n "${{ matrix.pq }}" ]; then
            pq_ready=1
            if [ -n "${{ matrix.pq_src }}" ]; then
              if brew install openssl@3 rust && OPENSSL_DIR=$(brew --prefix openssl@3); then
                export OPENSSL_DIR OPENSSL_STATIC=1
              else
                pq_ready=0
              fi
            fi
            if [ "$pq_ready" = 1 ]; then
              PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
                sh pyinstaller/install_extra.sh cryptography "@" \
                  ${{ matrix.pq }} "post-quantum push not bundled"
            else
              echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
            fi
          fi
          # Bundle zeroconf (the `discovery` extra): hard install; LGPL-2.1,
          # see the licenses job.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
          uv run pyinstaller pyinstaller/cronstable.spec
          dist/cronstable --version            # smoke test: fails the job if the bundle is broken
          # Gate the extras the build env kept (see smoke_frozen.sh).
          PY="uv run python" sh pyinstaller/smoke_frozen.sh dist/cronstable hard
          # Assert the native arch: under Rosetta an x86_64 build passes the
          # smoke test on the arm64 runner.
          case "${{ matrix.arch }}" in
            amd64|amd64v3) want=x86_64 ;;
            arm64) want=arm64 ;;
          esac
          file dist/cronstable | grep -q "$want"
      # Without the signing secrets this exits 0 and ships unsigned (the
      # prepare step warns). It runs before the rename, which is safe: the
      # notarization ticket binds to the cdhash, not the filename.
      - name: Sign and notarize
        if: ${{ needs.version.outputs.release == 'true' && matrix.ship }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Notarization requires the hardened runtime and a secure timestamp.
          # Retried: the Apple timestamp service fails transiently.
          . .github/scripts/retry.sh
          retry 3 codesign --force --options runtime --timestamp \
            --entitlements pyinstaller/entitlements.plist \
            --keychain "$KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" dist/cronstable
          codesign --verify --strict --verbose=2 dist/cronstable

          # Notarize: the zip is just the upload transport; the ticket binds to
          # the binary's signature, so we keep shipping the bare signed binary.
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k dist/cronstable "$RUNNER_TEMP/cronstable.zip"
          xcrun notarytool submit "$RUNNER_TEMP/cronstable.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
        timeout-minutes: 20
      # On a release this runs AFTER signing, against the executable we ship.
      - name: Test binary acceptance
        timeout-minutes: 10
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          uv pip install -r acceptance/requirements.txt
          uv run python -m pytest -c acceptance/pytest.ini acceptance \
            --cronstable-bin dist/cronstable \
            --expected-version "$EXPECTED_VERSION" \
            --acceptance-output acceptance-results \
            --junitxml acceptance-results/junit.xml
      - name: Upload binary acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acceptance-${{ matrix.asset }}
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Rename binary
        run: |-
          mv dist/cronstable "dist/cronstable-${{ matrix.asset }}"
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-${{ matrix.asset }}
          path: dist/cronstable-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  binaries-macos-experimental:
    needs:
      - version
      - preflight
      - tox
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26          # macOS 26 (Tahoe), Apple Silicon -- CI only
            ship: false
            asset: macos26-arm64
            pq: hard   # see the macOS 15 arm64 row
          - arch: amd64
            runner: macos-26-intel    # macOS 26 (Tahoe), Intel -- CI only
            ship: false
            asset: macos26-amd64
            pq: soft
            pq_src: '1'
          - arch: amd64v3
            runner: macos-26-intel    # macOS 26 (Tahoe), Intel -- CI only
            ship: false
            asset: macos26-amd64v3
            pq: soft
            pq_src: '1'
    runs-on: ${{ matrix.runner }}
    # The macOS 26 rows are coverage-only: never let them gate a release.
    continue-on-error: true
    steps: *macos-steps

  # FreeBSD binaries, built in a FreeBSD VM on an x86_64 Ubuntu runner:
  # PyInstaller cannot cross-compile and GitHub has no FreeBSD runner. arm64
  # runs under full-system QEMU, which the VM action rates faster than an
  # arm64 host. PyPI has no FreeBSD wheels, so every compiled dependency,
  # the PyInstaller bootloader included, is a source build. Compiled extras
  # are soft (verify_extra.py drops a bad build); pure-Python zeroconf is
  # hard. The 6h timeout covers the cryptography Rust compile under QEMU.
  binaries-freebsd:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: amd64
            vmarch: x86_64
            # Host-native, so the orjson Rust build is cheap enough to try.
            # openssl35: the base OpenSSL 3.0 cannot seal ML-KEM.
            pkgs: python314 rust gmake pkgconf libsodium openssl35
            orjson: '1'
            pq: '1'
            cflags: -I/usr/local/include
          - arch: amd64v3
            vmarch: x86_64
            pkgs: python314 rust gmake pkgconf libsodium openssl35 libffi sqlite3
            orjson: '1'
            pq: '1'
            cflags: -I/usr/local/include
          - arch: arm64
            vmarch: aarch64
            # Full-system QEMU. orjson is skipped: it and its maturin backend
            # compile from Rust source, and stdlib json is the fallback.
            # cryptography is built anyway because post-quantum push needs
            # it; a build that fails the X-Wing probe leaves x25519 sealing.
            pkgs: python314 rust gmake pkgconf libsodium openssl35
            orjson: '0'
            pq: '1'
            cflags: -I/usr/local/include -include sys/cdefs.h
    # The arm64 row stays on ubuntu-24.04: its ARM guest does not boot with
    # the Ubuntu 26 QEMU/firmware stack. Both hosts boot the same FreeBSD.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04' || 'ubuntu-26.04' }}
    timeout-minutes: 360
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (FreeBSD ${{ matrix.vmarch }})
        uses: vmactions/freebsd-vm@v1.5.8
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          release: '14.3'
          arch: ${{ matrix.vmarch }}
          # All 4 runner vCPUs; memory above the 6144 default is for the
          # C/Rust source builds.
          cpu: 4
          mem: 8192
          # Copy the guest workspace back so dist/ reaches the upload step.
          copyback: true
          # Only NAMED host variables cross into the guest.
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          prepare: |
            pkg install -y ${{ matrix.pkgs }}
          run: |
            set -eu
            . .github/scripts/retry.sh

            # lang/python314 is built --without-ensurepip, so the venv has no
            # pip; bootstrap it with base fetch, retrying only the download.
            runtime=python3.14
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              CFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
                python3.14 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3
              runtime=/tmp/cronstable-python-amd64v3/bin/python3
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export RUSTFLAGS
            fi
            "$runtime" -m venv --without-pip venv
            retry 5 fetch -o get-pip.py https://bootstrap.pypa.io/get-pip.py
            venv/bin/python get-pip.py

            # install_extra.sh and install_orjson.sh read these.
            PIP="venv/bin/pip"
            PY="venv/bin/python"
            export PIP PY

            # Base clang does not search /usr/local, the pkg prefix (pynacl
            # misses sodium.h without it). The aarch64 row also force-includes
            # sys/cdefs.h: its machine/ieeefp.h uses __BEGIN_DECLS without
            # including it, which breaks the PyInstaller bootloader build.
            CFLAGS="${{ matrix.cflags }}"
            LDFLAGS="-L/usr/local/lib"
            export CFLAGS LDFLAGS

            # NOT wrapped in retry: with no FreeBSD wheel this compiles the
            # bootloader, and retry.sh is for network operations only.
            venv/bin/pip install -r pyinstaller/build-requirements.txt
            venv/bin/pip install .                # bakes the pinned version into cronstable/version.py

            # Bundle uvloop: always a source build here (see binaries).
            sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
            # Bundle orjson on rows that set matrix.orjson. pkg rust (1.96+)
            # meets the orjson MSRV, so RUST_SETUP stays unset.
            if [ "${{ matrix.orjson }}" = "1" ]; then
              sh pyinstaller/install_orjson.sh
            else
              echo "orjson: skipped on this lane; using stdlib json"
            fi
            # Bundle pynacl against the pkg libsodium: the PyNaCl autotools
            # build spawns thousands of configure probes, slow under QEMU.
            SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
            # Bundle cryptography from its sdist, linked statically against
            # the port OpenSSL 3.5 so the bundle carries no libssl.
            if [ "${{ matrix.pq }}" = "1" ]; then
              OPENSSL_DIR=/usr/local OPENSSL_STATIC=1 \
                sh pyinstaller/install_extra.sh cryptography "@" soft "post-quantum push not bundled"
            else
              echo "cryptography: skipped on this lane; post-quantum push not bundled"
            fi
            # Bundle zeroconf (the `discovery` extra): hard install; LGPL-2.1,
            # see the licenses job.
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            venv/bin/pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            # Gate the extras the build env kept (see smoke_frozen.sh).
            PY="venv/bin/python" sh pyinstaller/smoke_frozen.sh dist/cronstable
            # Assert the ELF machine matches the row, so a VM booted on the
            # wrong image cannot ship a mislabeled asset.
            case "${{ matrix.arch }}" in
              amd64|amd64v3) spec=elf:2:1:62 ;;    # 64-bit LE, EM_X86_64
              arm64) spec=elf:2:1:183 ;;   # 64-bit LE, EM_AARCH64
            esac
            venv/bin/python .github/scripts/assert_arch.py dist/cronstable "$spec"
            mv dist/cronstable "dist/cronstable-freebsd-${{ matrix.arch }}"
            # Package with pkg(8) inside the VM; freebsd_pkg.py says why fpm
            # on Linux is not equivalent. The script is stdlib-only.
            python3.14 .github/scripts/freebsd_pkg.py               "$SETUPTOOLS_SCM_PRETEND_VERSION"               "dist/cronstable-freebsd-${{ matrix.arch }}" dist/pkgout
            # Install the package to run its post-install (pw service account)
            # and prove the payload runs from its installed path.
            pkg add dist/pkgout/cronstable-*.pkg
            /usr/local/bin/cronstable --version
            test -x /usr/local/etc/rc.d/cronstable
            pw usershow cronstable >/dev/null
            mv dist/pkgout/cronstable-*.pkg "dist/cronstable-freebsd-${{ matrix.arch }}.pkg"
            # Keep hundreds of megabytes of build tree out of the copyback.
            rm -rf venv build get-pip.py freebsd-pkg-work dist/pkgout
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-freebsd-${{ matrix.arch }}" "dist/cronstable-freebsd-${{ matrix.arch }}.pkg"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-freebsd-${{ matrix.arch }}
          path: |
            dist/cronstable-freebsd-${{ matrix.arch }}
            dist/cronstable-freebsd-${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # OpenBSD binaries, built in a KVM-accelerated OpenBSD VM (see
  # binaries-freebsd). Needs PyInstaller 6.22.1 or later, the first release
  # with native OpenBSD detection fixed. OpenBSD limits: no setuid one-file
  # build, no parent-process anti-spoofing, and the bootloader finds itself
  # through argv[0] and $PATH, so a supervisor that rewrites argv[0] breaks it.
  binaries-openbsd:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        arch: [amd64, amd64v3]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (OpenBSD 7.9 amd64)
        uses: vmactions/openbsd-vm@v1.4.8
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          # OpenBSD offers no cross-release ABI guarantee, so this pin is the
          # release the binary runs on and needs bumping every six months.
          release: '7.9'
          cpu: 4
          mem: 8192
          # rsync the guest workspace back so dist/ reaches the host upload.
          copyback: true
          # Only NAMED host variables cross into the guest.
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          prepare: |
            pkg_add -I python%3.13 py3-pip libsodium py3-psutil py3-multidict py3-yarl py3-propcache py3-aiohappyeyeballs py3-jinja2 py3-uvloop rust openssl%3.5 gmake pkgconf libffi sqlite3 xz bzip2
          run: |
            set -eu

            # The python port is EXTERNALLY-MANAGED (PEP 668). Pip installs
            # into the system interpreter so the pkg_add C extensions above
            # stay visible; a venv would hide them.
            PIP_BREAK_SYSTEM_PACKAGES=1
            export PIP_BREAK_SYSTEM_PACKAGES

            # install_extra.sh reads these; the port has no python3 symlink.
            PIP="python3.13 -m pip"
            PY="python3.13"
            export PIP PY
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              CFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
                python3.13 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3
              PY=/tmp/cronstable-python-amd64v3/bin/python3
              PIP="$PY -m pip"
              PATH=/tmp/cronstable-python-amd64v3/bin:$PATH
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export PY PIP PATH RUSTFLAGS
            fi

            # NOT wrapped in retry: this compiles the bootloader.
            $PIP install -r pyinstaller/build-requirements.txt
            $PIP install .                    # bakes the pinned version into cronstable/version.py

            # Bundle uvloop: the pkg_add py3-uvloop already meets the floor.
            sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
            # No orjson: port rust 1.94.1 is below its MSRV and py3-orjson is
            # below the pyproject floor. stdlib json is byte-compatible.
            echo "orjson: skipped on this lane; using stdlib json"
            # Bundle pynacl against the port libsodium.
            CFLAGS="-I/usr/local/include"
            LDFLAGS="-L/usr/local/lib"
            export CFLAGS LDFLAGS
            SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
            # Bundle cryptography from its sdist, statically against the
            # openssl%3.5 port (eopenssl35 side-by-side paths): ML-KEM needs
            # OpenSSL 3.5 or later, and base LibreSSL does not provide it.
            OPENSSL_INCLUDE_DIR=/usr/local/include/eopenssl35 \
              OPENSSL_LIB_DIR=/usr/local/lib/eopenssl35 OPENSSL_STATIC=1 \
              sh pyinstaller/install_extra.sh cryptography "@" soft "post-quantum push not bundled"
            # Bundle zeroconf (the `discovery` extra): hard install; LGPL-2.1,
            # see the licenses job.
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            # Gate the extras the build env kept (see smoke_frozen.sh).
            PY="$PY" sh pyinstaller/smoke_frozen.sh dist/cronstable
            # 64-bit, little-endian, EM_X86_64.
            $PY .github/scripts/assert_arch.py dist/cronstable elf:2:1:62
            mv dist/cronstable dist/cronstable-openbsd-${{ matrix.arch }}
            # Keep the PyInstaller work tree out of the copyback.
            rm -rf build
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-openbsd-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-openbsd-${{ matrix.arch }}
          path: dist/cronstable-openbsd-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # NetBSD binaries, built in a KVM-accelerated NetBSD VM (see
  # binaries-freebsd). PyInstaller supports NetBSD without documenting it:
  # compat.py defines is_netbsd, and bindepend.py sets a parseable ldd format.
  binaries-netbsd:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        arch: [amd64, amd64v3]
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (NetBSD 11.0 amd64)
        uses: vmactions/netbsd-vm@v1.5.2
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          release: '11.0'
          cpu: 4
          mem: 8192
          copyback: true
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          # This image has no pkgin; base pkg_add uses the preset PKG_PATH.
          prepare: |
            set -eu
            . .github/scripts/retry.sh
            # Keep libraries already installed as dependencies. The repository
            # can offer a newer version that conflicts with the installed one.
            for package in python313 libsodium py313-psutil py313-multidict py313-yarl py313-propcache py313-aiohappyeyeballs py313-jinja2 py313-uvloop py313-orjson rust openssl gmake pkgconf libffi sqlite3 xz bzip2; do
              if ! /usr/sbin/pkg_info -qe "$package"; then
                retry 5 /usr/sbin/pkg_add "$package"
              fi
            done
          run: |
            set -eu
            . .github/scripts/retry.sh

            # pkgsrc python313 has no ensurepip; bootstrap pip with base ftp,
            # retrying only the download. --system-site-packages keeps the
            # pkg_add C extensions visible.
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              CFLAGS="-I/usr/pkg/include" LDFLAGS="-L/usr/pkg/lib -Wl,-R/usr/pkg/lib" \
                python3.13 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3
              /tmp/cronstable-python-amd64v3/bin/python3 -m venv --without-pip venv
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export RUSTFLAGS
            else
              python3.13 -m venv --system-site-packages --without-pip venv
            fi
            retry 5 ftp -o get-pip.py https://bootstrap.pypa.io/get-pip.py
            venv/bin/python get-pip.py

            # install_extra.sh and install_orjson.sh read these.
            PIP="venv/bin/pip"
            PY="venv/bin/python"
            export PIP PY

            # pkgsrc installs under /usr/pkg, which the base compiler does not
            # search on its own; every source build below needs it.
            CFLAGS="-I/usr/pkg/include"
            LDFLAGS="-L/usr/pkg/lib -Wl,-R/usr/pkg/lib"
            export CFLAGS LDFLAGS

            # NOT wrapped in retry: this compiles the bootloader.
            $PIP install -r pyinstaller/build-requirements.txt
            $PIP install .                    # bakes the pinned version into cronstable/version.py

            # pkgsrc provides uvloop and orjson above the floors, so neither
            # is a source build.
            sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
            sh pyinstaller/install_orjson.sh
            # Bundle pynacl against the pkgsrc libsodium.
            SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
            # Bundle cryptography from its sdist, statically against pkgsrc
            # openssl 3.6 (ML-KEM needs 3.5+) with pkgsrc rust.
            OPENSSL_DIR=/usr/pkg OPENSSL_STATIC=1 \
              sh pyinstaller/install_extra.sh cryptography "@" soft "post-quantum push not bundled"
            # Bundle zeroconf (the `discovery` extra): hard install; LGPL-2.1,
            # see the licenses job.
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            venv/bin/pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            # Gate the extras the build env kept (see smoke_frozen.sh).
            PY="$PY" sh pyinstaller/smoke_frozen.sh dist/cronstable
            # 64-bit, little-endian, EM_X86_64.
            $PY .github/scripts/assert_arch.py dist/cronstable elf:2:1:62
            mv dist/cronstable dist/cronstable-netbsd-${{ matrix.arch }}
            rm -rf venv build get-pip.py
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-netbsd-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-netbsd-${{ matrix.arch }}
          path: dist/cronstable-netbsd-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # illumos binaries, built in an OmniOS r151054 LTS VM (supported to
  # 2028-05-01; see binaries-freebsd). They also serve OpenIndiana and
  # SmartOS zones, which share the illumos ABI. OmniOS ships a shared
  # libpython3.13.so and ensurepip. PyInstaller handles illumos in its
  # bootloader wscript, compat.py (is_solar) and bindepend.py.
  binaries-illumos:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        arch: [amd64, amd64v3]
    runs-on: ubuntu-26.04
    # The cryptography Rust compile dominates; under KVM it takes minutes.
    timeout-minutes: 180
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (OmniOS r151054 amd64)
        uses: vmactions/omnios-vm@v1.3.7
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          release: 'r151054-build'
          cpu: 4
          mem: 8192
          copyback: true
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          prepare: |
            # The CPython source build needs pkg-config for ncurses: its
            # fallback finds the library but misses term.h (setupterm).
            pkg install runtime/python-313 developer/build-essential developer/pkg-config library/security/openssl-3
            # libsodium (push) and rust (post-quantum push) come from the
            # OmniOS extra publisher. If it is unreachable, the binary ships
            # without push and the job still passes.
            pkg publisher extra.omnios >/dev/null 2>&1 || pkg set-publisher -g https://pkg.omnios.org/r151054/extra/ extra.omnios || echo "extra publisher unavailable; push not bundled"
            pkg install ooce/library/libsodium ooce/developer/rust || echo "libsodium or rust unavailable; push or post-quantum push not bundled"
          run: |
            set -eu

            # OmniOS ships ensurepip, so the venv needs no get-pip.py. Do not
            # copy the FreeBSD bootstrap: illumos has no `fetch`.
            runtime=python3.13
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              LDFLAGS="-L/usr/lib/amd64 -Wl,-R/usr/lib/amd64" \
                python3.13 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3 --openssl /usr
              runtime=/tmp/cronstable-python-amd64v3/bin/python3
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export RUSTFLAGS
            fi
            "$runtime" -m venv venv

            # install_extra.sh / install_orjson.sh read these.
            PIP="venv/bin/pip"
            PY="venv/bin/python"
            export PIP PY

            # NOT wrapped in retry: this compiles the bootloader.
            $PIP install -r pyinstaller/build-requirements.txt
            $PIP install .                    # bakes the pinned version into cronstable/version.py

            # Every extra is a soft source build. orjson ends on stdlib json:
            # its build backend needs more than the extra rust. pynacl links
            # the /opt/ooce libsodium (-R for run-time lookup). cryptography
            # uses core OpenSSL 3.5, which the interpreter already links, so
            # the bundle carries one OpenSSL.
            sh pyinstaller/install_extra.sh uvloop "@" soft "using asyncio"
            sh pyinstaller/install_orjson.sh
            PKG_CONFIG_PATH=/opt/ooce/lib/amd64/pkgconfig \
              CFLAGS="-I/opt/ooce/include" \
              LDFLAGS="-L/opt/ooce/lib/amd64 -R/opt/ooce/lib/amd64" \
              SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "@" soft "push extra not bundled"
            if [ -x /opt/ooce/bin/cargo ]; then
              PATH="/opt/ooce/bin:$PATH" \
                OPENSSL_LIB_DIR=/usr/lib/amd64 OPENSSL_INCLUDE_DIR=/usr/include \
                sh pyinstaller/install_extra.sh cryptography "@" soft "post-quantum push not bundled"
            else
              echo "cryptography: no rust on this host; post-quantum push not bundled"
            fi
            # Bundle zeroconf (the `discovery` extra): hard install; LGPL-2.1,
            # see the licenses job.
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            venv/bin/pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            # Gate the extras the build env kept (see smoke_frozen.sh).
            PY="$PY" sh pyinstaller/smoke_frozen.sh dist/cronstable
            # 64-bit, little-endian, EM_X86_64.
            $PY .github/scripts/assert_arch.py dist/cronstable elf:2:1:62
            mv dist/cronstable dist/cronstable-illumos-${{ matrix.arch }}
            rm -rf venv build
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-illumos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-illumos-${{ matrix.arch }}
          path: dist/cronstable-illumos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Per arch: a one-file .exe, a one-directory .zip (the only layout that can
  # host the service; the one-file bootloader runs the app in a child process
  # the SCM never sees), a WiX MSI of the .zip payload, and (except i686) a
  # WinGet setup .exe. Deps without a win_arm64 wheel compile from sdist with
  # the MSVC toolchain. These are the unsigned gate set; sign-windows signs
  # and repackages them for a release.
  binaries-windows:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          # pyarch (the setup-python `architecture` input) is empty on native
          # rows so the action uses the runner arch; i686 asks for the 32-bit
          # interpreter on the x64 runner.
          # pfsuffix and regflag: on a 64-bit host a 32-bit MSI installs under
          # "Program Files (x86)" and writes the WOW6432Node registry view, so
          # the smoke assertions follow the host arch.
          - arch: amd64
            runner: windows-latest
            pyarch: ''
            pfsuffix: ''
            regflag: /reg:64
            # Every cryptography release ships win_amd64, so this row takes
            # the newest.
            pq: hard
          - arch: amd64v3
            runner: windows-latest
            pyarch: ''
            pfsuffix: ''
            regflag: /reg:64
            pq: hard
          - arch: arm64
            runner: windows-11-arm
            pyarch: ''
            pfsuffix: ''
            regflag: /reg:64
            # No win_arm64 cryptography wheel has ML-KEM, so this row builds
            # from source (pq_src). soft: verify_extra.py drops a build that
            # cannot seal X-Wing, and that binary keeps x25519 push only.
            pq: soft
            pq_src: '1'
            pq_rust_host: aarch64-pc-windows-msvc
            pq_rust_target: aarch64-pc-windows-msvc
            pq_vcpkg_triplet: arm64-windows-static
          - arch: i686
            runner: windows-latest
            pyarch: x86
            pfsuffix: ' (x86)'
            regflag: /reg:32
            # Upstream dropped win32 wheels before the security fixes.
            # Try patched source, targeting 32 bits even on this x64 host.
            pq: soft
            pq_src: '1'
            pq_rust_host: x86_64-pc-windows-msvc
            pq_rust_target: i686-pc-windows-msvc
            pq_vcpkg_triplet: x86-windows-static
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # Shallow checkout; see the dist job.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        id: py
        with:
          python-version: '3.14'
          architecture: ${{ matrix.pyarch }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - name: Build amd64v3 Python
        if: matrix.arch == 'amd64v3'
        id: runtime
        shell: pwsh
        run: |
          python docker/python_runtime.py --variant amd64v3 --prefix "$env:RUNNER_TEMP/python-amd64v3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build binary
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
          # "both" emits dist/cronstable.exe and the service-hosting
          # dist/cronstable/ from one Analysis (one dependency scan).
          CRONSTABLE_BUNDLE: both
        run: |
          set -euo pipefail
          # Pass the interpreter path, not `--python 3.14`: on the i686 row a
          # bare version can resolve to the x64 3.14 and ship a 64-bit build
          # under a 32-bit name.
          uv venv --python "${{ steps.runtime.outputs.python-path || steps.py.outputs.python-path }}"
          uv pip install -r pyinstaller/build-requirements.txt
          uv pip install .                     # bakes the pinned version into cronstable/version.py
          # Bundle orjson (the `speedups` extra); see binaries.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_orjson.sh
          # Bundle pynacl (the `push` extra), hard: every Windows arch has a
          # wheel, so a failure means a broken build.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh pynacl "@" hard
          # Bundle cryptography (post-quantum push); see binaries. pq_src
          # rows build it from source (see the matrix).
          if [ -n "${{ matrix.pq }}" ]; then
            pq_ready=1
            if [ -n "${{ matrix.pq_src }}" ]; then
              # Best effort: a failure here drops post-quantum push from this
              # soft row (logged below) and never fails the job.
              prepare_crypto_toolchain() {
                # The arm64 image may lack cargo; if so, fetch rustup-init.
                if ! command -v cargo >/dev/null 2>&1; then
                  curl --proto '=https' --tlsv1.2 -sSfo rustup-init.exe \
                    "https://static.rust-lang.org/rustup/dist/${{ matrix.pq_rust_host }}/rustup-init.exe" || return 1
                  ./rustup-init.exe -y --profile minimal --default-toolchain stable || return 1
                  export PATH="$USERPROFILE/.cargo/bin:$PATH"
                fi
                rustup toolchain install stable --profile minimal || return 1
                rustup target add --toolchain stable "${{ matrix.pq_rust_target }}" || return 1
                export RUSTUP_TOOLCHAIN=stable
                export CARGO_BUILD_TARGET="${{ matrix.pq_rust_target }}"
                # Static OpenSSL 3.5+ from vcpkg. Pull the ports first: the
                # image checkout can predate the OpenSSL that ML-KEM needs.
                test -n "${VCPKG_INSTALLATION_ROOT:-}" || return 1
                git -C "$VCPKG_INSTALLATION_ROOT" pull --ff-only || return 1
                "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics || return 1
                "$VCPKG_INSTALLATION_ROOT/vcpkg" install "openssl:${{ matrix.pq_vcpkg_triplet }}" || return 1
                export OPENSSL_DIR="$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.pq_vcpkg_triplet }}"
                export OPENSSL_STATIC=1
              }
              prepare_crypto_toolchain || pq_ready=0
            fi
            if [ "$pq_ready" = 1 ]; then
              PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
                sh pyinstaller/install_extra.sh cryptography "@" \
                  ${{ matrix.pq }} "post-quantum push not bundled"
            else
              echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
            fi
          fi
          # Bundle zeroconf (the `discovery` extra): hard install; LGPL-2.1,
          # see the licenses job.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
          uv run pyinstaller pyinstaller/cronstable.spec
          ./dist/cronstable.exe --version      # smoke test: fails the job if the bundle is broken
          # Prove the FROZEN bundle reaches PyNaCl and zeroconf too (both
          # fail closed at config validation when they cannot import).
          ./dist/cronstable.exe --validate-config -c pyinstaller/smoke-push.yaml
          # Both bootloader layouts get the same black-box scenarios. Install
          # driver dependencies after freezing so pytest never enters a bundle.
          uv pip install -r acceptance/requirements.txt
          uv run python -m pytest -c acceptance/pytest.ini acceptance \
            --cronstable-bin dist/cronstable.exe \
            --expected-version "$SETUPTOOLS_SCM_PRETEND_VERSION" \
            --acceptance-output acceptance-results/onefile \
            --junitxml acceptance-results/onefile/junit.xml
          # Assert the PE arch: on the x64 runner a 64-bit i686 build passes
          # every smoke above. Read the COFF Machine field; `file` output
          # varies by version and arch.
          case "${{ matrix.arch }}" in
            amd64|amd64v3) spec=pe:8664 ;;   # IMAGE_FILE_MACHINE_AMD64
            arm64) spec=pe:aa64 ;;   # IMAGE_FILE_MACHINE_ARM64
            i686)  spec=pe:014c ;;   # IMAGE_FILE_MACHINE_I386
          esac
          uv run python .github/scripts/assert_arch.py dist/cronstable.exe "$spec"
          mv dist/cronstable.exe "dist/cronstable-windows-${{ matrix.arch }}.exe"
      # pwsh, the shell Windows users run the binary from. The one-directory
      # bundle shares this Analysis, so it needs no second pass.
      - name: Prove the frozen binary seals xwing
        if: ${{ matrix.pq != '' }}
        shell: pwsh
        run: |
          # A soft row may have dropped cryptography (logged at install).
          uv run python -c "import cryptography" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cryptography is not in the build env; nothing to gate"
            exit 0
          }
          $exe = "dist/cronstable-windows-${{ matrix.arch }}.exe"
          $suites = & $exe --sealable-suites
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAIL: --sealable-suites exited $LASTEXITCODE"
            exit 1
          }
          Write-Host "sealable suites: $($suites -join ', ')"
          if ($suites -notcontains 'xwing') {
            Write-Host "FAIL: the frozen binary cannot seal xwing"
            exit 1
          }
      - name: Check every declared binary artifact
        shell: bash
        run: python .github/scripts/check_artifacts.py "dist/cronstable-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-windows-${{ matrix.arch }}
          path: dist/cronstable-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Smoke-test and zip the one-directory bundle
        run: |
          set -euo pipefail
          ./dist/cronstable/cronstable.exe --version
          ./dist/cronstable/cronstable.exe --validate-config -c pyinstaller/smoke-push.yaml
          uv run python -m pytest -c acceptance/pytest.ini acceptance \
            --cronstable-bin dist/cronstable/cronstable.exe \
            --expected-version "${{ needs.version.outputs.new }}" \
            --acceptance-output acceptance-results/onedir \
            --junitxml acceptance-results/onedir/junit.xml
          # A real SCM round trip; the hosted runners are elevated. `service
          # install` requires a -c path only SYSTEM and Administrators can
          # write, which `init` creates. Registration only: never `service
          # start` here.
          trap './dist/cronstable/cronstable.exe service remove --name cronstable-ci-smoke >/dev/null 2>&1 || true' EXIT
          smokecfg="$(cygpath -w "$RUNNER_TEMP")\\cronstable-ci-smoke"
          ./dist/cronstable/cronstable.exe init "$smokecfg"
          ./dist/cronstable/cronstable.exe service install --name cronstable-ci-smoke -c "$smokecfg"
          ./dist/cronstable/cronstable.exe service status --name cronstable-ci-smoke | grep -i stopped
          ./dist/cronstable/cronstable.exe service remove --name cronstable-ci-smoke
          # One top-level cronstable/ directory, so extracting into
          # C:\Program Files gives the path the Windows docs use.
          uv run python -c "import shutil; shutil.make_archive('dist/cronstable-windows-${{ matrix.arch }}', 'zip', root_dir='dist', base_dir='cronstable')"
      - name: Check every declared binary artifact
        shell: bash
        run: python .github/scripts/check_artifacts.py "dist/cronstable-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-windows-${{ matrix.arch }}-zip
          path: dist/cronstable-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # sign-windows rebuilds the MSIs with this same script, so the gate
      # proves what ships; test_ci_fences pins both call sites.
      - name: Build MSI
        env:
          VERSION: ${{ needs.version.outputs.new }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sh .github/scripts/build_msi.sh "$ARCH" "$VERSION" \
            dist/cronstable "dist/cronstable-windows-${ARCH}.msi"
      # The service must be installed but never started: the .wxs starts it
      # only on an upgrade that finds one, or with STARTSERVICE=1.
      - name: Smoke-test MSI (install, verify, uninstall)
        env:
          ARCH: ${{ matrix.arch }}
          PFSUFFIX: ${{ matrix.pfsuffix }}
        run: |
          set -euo pipefail
          . .github/scripts/msi_smoke.sh
          # Require the default configuration directory to be absent so
          # this test exercises its creation.
          test ! -e /c/ProgramData/cronstable
          msi_install "dist/cronstable-windows-${ARCH}.msi" msi-install.log
          # Check for the same ownership and permissions as `cronstable init`:
          # a trusted owner and a protected DACL accepted by the service host.
          uv run python - <<'EOF'
          from cronstable import platform
          path = r"C:\ProgramData\cronstable"
          sddl = platform._read_security_sddl(path)
          print(sddl)
          assert sddl and platform._sddl_owner(sddl) in platform._TRUSTED_OWNERS, "untrusted owner"
          assert "D:P" in sddl, "the DACL still inherits from ProgramData"
          assert platform.service_write_grantee(path) is None, platform.service_write_grantee(path)
          EOF
          # Stopped, and ImagePath matches winservice.host_argv/image_path
          # exactly. PFSUFFIX: see the matrix.
          sc query cronstable | grep -q 'STOPPED'
          sc qc cronstable | grep -F "\"C:\\Program Files${PFSUFFIX}\\cronstable\\cronstable.exe\" -l INFO service run --name cronstable -c \"C:\\ProgramData\\cronstable\""
          # The recovery actions the Util custom action configured.
          sc qfailure cronstable | grep -qi 'RESTART'
          # The installed exe runs from Program Files.
          "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe" --version
          python .github/scripts/smoke_windows_first_run.py \
            "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe"
          msi_uninstall "dist/cronstable-windows-${ARCH}.msi" msi-uninstall.log
          # Service and files are gone; the configuration directory stays.
          if sc query cronstable >/dev/null 2>&1; then
            echo "service still registered after uninstall" >&2
            exit 1
          fi
          test ! -e "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe"
          test -d /c/ProgramData/cronstable
      # Install with a CUSTOM config directory, upgrade to a patch-bumped twin
      # without re-passing properties, then require that the service still
      # uses that directory and that the upgrade started it. The running
      # service is also the one place to prove a real PARAMCHANGE reload.
      - name: Smoke-test MSI upgrade (remembered properties, restart, reload)
        env:
          VERSION: ${{ needs.version.outputs.new }}
          ARCH: ${{ matrix.arch }}
          PFSUFFIX: ${{ matrix.pfsuffix }}
          REGFLAG: ${{ matrix.regflag }}
        run: |
          set -euo pipefail
          . .github/scripts/msi_smoke.sh
          sh .github/scripts/build_msi.sh "$ARCH" "$VERSION" \
            dist/cronstable upgrade-twin.msi bump-patch
          cfg="/c/cronstable-ci-upgrade-cfg"
          cfgwin='C:\cronstable-ci-upgrade-cfg'
          mkdir -p "$cfg"
          cp pyinstaller/smoke-push.yaml "$cfg/"
          # The repair commands the service prints for a writable config
          # directory; /reset clears explicit grants first.
          MSYS2_ARG_CONV_EXCL='*' icacls "$cfgwin" /reset
          MSYS2_ARG_CONV_EXCL='*' icacls "$cfgwin" /inheritance:r \
            /grant '*S-1-5-18:(OI)(CI)F' /grant '*S-1-5-32-544:(OI)(CI)F' \
            /grant '*S-1-5-11:(OI)(CI)RX' /grant '*S-1-3-4:(OI)(CI)RX'
          MSYS2_ARG_CONV_EXCL='*' icacls "$cfgwin" /setowner '*S-1-5-32-544'
          uv run python - <<'EOF'
          from cronstable import platform
          path = r"C:\cronstable-ci-upgrade-cfg"
          sddl = platform._read_security_sddl(path)
          print(sddl)
          assert sddl and "D:P" in sddl, "the configuration DACL must be protected"
          assert platform.service_write_grantee(path) is None, platform.service_write_grantee(path)
          EOF
          cleanup_upgrade() {
            upgrade_result=$?
            if [ "$upgrade_result" -ne 0 ]; then
              msi_service_diagnostics cronstable "$cfg/logs/cronstable-service.log" || true
            fi
            msi_uninstall upgrade-twin.msi cleanup-twin.log >/dev/null 2>&1 || true
            msi_uninstall "dist/cronstable-windows-${ARCH}.msi" cleanup-v1.log >/dev/null 2>&1 || true
            rm -rf "$cfg"
            exit "$upgrade_result"
          }
          trap cleanup_upgrade EXIT
          msi_install "dist/cronstable-windows-${ARCH}.msi" upgrade-v1.log \
            CONFIGDIR="$cfgwin"
          sc qc cronstable | grep -F "$cfgwin"
          # The upgrade: no properties on the command line, the managed
          # rollout's normal shape.
          msi_install upgrade-twin.msi upgrade-v2.log
          # The custom directory survived the re-registration.
          sc qc cronstable | grep -F "$cfgwin"
          # The probe found the remembered directory: the start marker exists
          # and the service reaches RUNNING. REGFLAG selects the registry view
          # the package wrote (WOW6432Node for i686; see the matrix).
          MSYS2_ARG_CONV_EXCL='*' reg query 'HKLM\SOFTWARE\cronstable' /v ServiceStartedByMsi "$REGFLAG"
          msi_wait_for_service cronstable
          # `service reload` sends PARAMCHANGE, which succeeds only when the
          # service advertises it. The log line lands in the bootstrap log
          # because smoke-push.yaml has no logging: section.
          "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe" service reload
          for _ in $(seq 1 15); do
            grep -q 'service control PARAMCHANGE' "$cfg/logs/cronstable-service.log" 2>/dev/null && break
            sleep 1
          done
          grep -q 'service control PARAMCHANGE' "$cfg/logs/cronstable-service.log"
          # A reload is not a stop: the service is still RUNNING.
          sc query cronstable | grep -q 'RUNNING'
          msi_uninstall upgrade-twin.msi upgrade-uninstall.log
          if sc query cronstable >/dev/null 2>&1; then
            echo "service still registered after upgrade uninstall" >&2
            exit 1
          fi
      - name: Build and smoke-test WinGet setup
        if: matrix.arch != 'i686'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sh .github/scripts/build_setup.sh "$ARCH" \
            "dist/cronstable-windows-${ARCH}.msi" "dist/cronstable-windows-${ARCH}-setup.exe"
          sh .github/scripts/build_setup.sh "$ARCH" upgrade-twin.msi upgrade-setup.exe
          pwsh -NoProfile -File .github/scripts/smoke_windows_setup.ps1 \
            -Setup "dist/cronstable-windows-${ARCH}-setup.exe" \
            -PreviousMsi "dist/cronstable-windows-${ARCH}.msi" -UpgradeSetup upgrade-setup.exe
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.arch != 'i686'
        with:
          name: cronstable-windows-${{ matrix.arch }}-setup
          path: dist/cronstable-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Check every declared binary artifact
        shell: bash
        run: python .github/scripts/check_artifacts.py "dist/cronstable-windows-${{ matrix.arch }}.msi"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-windows-${{ matrix.arch }}-msi
          path: dist/cronstable-windows-${{ matrix.arch }}.msi
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload binary acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: acceptance-windows-${{ matrix.arch }}
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 7

  # cryptography wheels, built once per (libc, arch) for image platforms
  # without PyPI wheels (one QEMU compile takes an hour or more). Docker jobs
  # get them in docker/wheelhouse/<libc>/ for pip --find-links; the per-libc
  # directories keep musl and glibc wheels apart. Each row builds in the
  # container the wheel loads in, on CPython 3.11: the build interpreter sets
  # the abi3 floor, and cp311-abi3 loads on every image interpreter. A failed
  # build leaves that platform with x25519 push only (extract_deps.py reports
  # it) and does not block publication.
  pq-wheels:
    needs: [version, preflight]
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: ${{ needs.version.outputs.pq-glibc }}
      version: ${{ needs.version.outputs.new }}
      cryptography: ${{ needs.preflight.outputs.cryptography }}
      crypto-sha: ${{ needs.preflight.outputs.crypto-sha }}

  pq-wheels-musl:
    needs: [version, preflight]
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: ${{ needs.version.outputs.pq-musl }}
      version: ${{ needs.version.outputs.new }}
      cryptography: ${{ needs.preflight.outputs.cryptography }}
      crypto-sha: ${{ needs.preflight.outputs.crypto-sha }}

  pq-wheel-armv6:
    needs:
      - version
      - preflight
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download resolved cryptography source
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: release-inputs
      - uses: docker/setup-qemu-action@v4.4.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: a third-party image (see binaries-arm-legacy).
          retry 5 docker pull --platform linux/arm/v6 tianon/raspbian:bookworm-slim
          echo "digest=$(docker image inspect --format '{{.Id}}' tianon/raspbian:bookworm-slim)" >> "$GITHUB_OUTPUT"
        id: image
      - name: Restore ARMv6 compiler work
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pq-cache
          key: armv6-work-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyinstaller/build_openssl.sh', '.github/scripts/compiler_fingerprint.py', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Build the cryptography wheel (glibc armv6)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v6 \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e QEMU_CPU=arm1176 \
            -e _PYTHON_HOST_PLATFORM=linux-armv6l \
            -v "$PWD:/src" -w /src \
            tianon/raspbian:bookworm-slim sh -euc '
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any -qq update
              # A C toolchain for OpenSSL and the crate build, perl for the
              # OpenSSL Configure script, binutils for the readelf checks.
              retry 5 apt-get -o Acquire::Retries=5 -qq install -y --no-install-recommends \
                python3 python3-venv python3-dev build-essential libffi-dev pkg-config \
                perl make curl ca-certificates binutils
              python3 -VV
              python3 -c "import sysconfig; print(\"wheel platform:\", sysconfig.get_platform())"
              python3 -m venv /v
              retry 5 /v/bin/pip install --upgrade pip setuptools wheel
              retry 3 curl --proto =https --tlsv1.2 -sSfo /tmp/rustup-init https://static.rust-lang.org/rustup/dist/arm-unknown-linux-gnueabihf/rustup-init
              chmod +x /tmp/rustup-init
              env CARGO_HOME=/src/.pq-cache/cargo RUSTUP_HOME=/opt/rustup /tmp/rustup-init -y \
                --default-host arm-unknown-linux-gnueabihf --default-toolchain stable \
                --profile minimal --no-modify-path
              PATH=/src/.pq-cache/cargo/bin:$PATH
              CARGO_HOME=/src/.pq-cache/cargo
              RUSTUP_HOME=/opt/rustup
              export PATH CARGO_HOME RUSTUP_HOME
              rustc -vV
              BUILD_OPENSSL_CONFIG_EXTRA=no-asm sh pyinstaller/build_openssl.sh /src/.pq-cache/openssl
              OPENSSL_DIR=/src/.pq-cache/openssl
              OPENSSL_STATIC=1
              export OPENSSL_DIR OPENSSL_STATIC
              toolchain=$(/v/bin/python .github/scripts/compiler_fingerprint.py)
              export CARGO_TARGET_DIR="/src/.pq-cache/target/$toolchain"
              rm -rf /src/wheelhouse
              # The preflight resolves this source from pyproject and checks its hash.
              /v/bin/pip wheel --no-deps --wheel-dir /src/wheelhouse /src/release-inputs/cryptography-${{ needs.preflight.outputs.cryptography }}.tar.gz
              # Prove the wheel seals X-Wing through the daemon itself, on
              # the emulated target core, before it is handed to the binary.
              /v/bin/pip install /src/wheelhouse/cryptography-*.whl
              /v/bin/pip install .
              /v/bin/python pyinstaller/verify_extra.py cryptography
              ext=$(/v/bin/python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
              # Self-contained: no libssl or libcrypto as a shared dependency.
              readelf -d "$ext" > /tmp/cryptography.dyn
              grep NEEDED /tmp/cryptography.dyn || true
              if grep -E "NEEDED.*lib(ssl|crypto)" /tmp/cryptography.dyn; then
                echo "FAIL: the wheel links OpenSSL dynamically" >&2
                exit 1
              fi
              # Within the ARMv6 ceiling elf_floor.py holds the binary to
              # (v6, v6KZ or v6K; VFPv2 at most).
              readelf -A "$ext" | grep -E "Tag_CPU_arch:|Tag_FP_arch:" > /tmp/cryptography.arm
              cat /tmp/cryptography.arm
              if grep -E "Tag_CPU_arch: v(7|8|6T2)" /tmp/cryptography.arm; then
                echo "FAIL: the wheel needs an instruction set above ARMv6" >&2
                exit 1
              fi
              if grep -E "Tag_FP_arch: (VFPv3|VFPv4|FP-ARMv8)" /tmp/cryptography.arm; then
                echo "FAIL: the wheel needs a floating-point unit above VFPv2" >&2
                exit 1
              fi
              chmod -R a+rX /src/wheelhouse
              ls -l /src/wheelhouse
            '
      - name: Make the wheelhouse readable by the cache save
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" .pq-cache wheelhouse
          python3 .github/scripts/cache_size.py .pq-cache
        id: cache-size
      - name: Save ARMv6 compiler work (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pq-cache
          key: armv6-work-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyinstaller/build_openssl.sh', '.github/scripts/compiler_fingerprint.py', '.github/workflows/release.yml') }}
        if: github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true'
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pq-wheel-glibc-armv6
          path: wheelhouse/cryptography-*.whl
          if-no-files-found: error
          retention-days: 7

  # Cache maintenance is best-effort and never gates publication.
  compiler-cache-budget:
    needs: [pq-wheels, pq-wheels-musl, pq-wheel-armv6, binaries-mips, binaries-loong64]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'ptweezy/cronstable' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Bound compiler cache storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune_ci_caches.py

  # Each platform builds once. Platforms without source wheels start after
  # preflight; others wait for their libc wheel group. Assembly checks every
  # image before publication copies those same bytes.
  docker:
    needs: [version, preflight]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.version.outputs.docker-none }}
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      zeroconf: ${{ needs.preflight.outputs.zeroconf }}

  docker-glibc:
    needs: [version, preflight, pq-wheels]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.version.outputs.docker-glibc }}
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      zeroconf: ${{ needs.preflight.outputs.zeroconf }}

  docker-musl:
    needs: [version, preflight, pq-wheels-musl]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.version.outputs.docker-musl }}
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      zeroconf: ${{ needs.preflight.outputs.zeroconf }}

  docker-assemble:
    needs: [version, docker, docker-glibc, docker-musl]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.version.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-${{ matrix.distro }}-linux-*
          path: images
      - name: Validate and assemble OCI manifests
        env:
          VERSION: ${{ needs.version.outputs.new }}
          DISTRO: ${{ matrix.distro }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          python .github/scripts/oci_images.py --inputs images --distro "$DISTRO" \
            --platforms "$PLATFORMS" --version "$VERSION" --revision "$GITHUB_SHA" --output layout
          tar -cf image.tar -C layout .
          sha256sum image.tar > image.sha256
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          skopeo copy --all --preserve-digests oci-archive:image.tar:release oci:verified:release
      - uses: actions/upload-artifact@v7.0.1
        if: needs.version.outputs.release == 'true'
        with:
          name: docker-release-${{ matrix.distro }}
          path: |
            image.tar
            image.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  perf:
    needs:
      - version
      - preflight
    runs-on: ubuntu-26.04
    # perf=ignore: a perf job that fails for any reason (crashed bench,
    # timeout, pairing refusal) does not hold the release.
    continue-on-error: ${{ needs.version.outputs.perf == 'ignore' }}
    # A runtime budget; bench.py logs its ten slowest benchmarks for triage.
    # A timeout here is NOT a perf regression.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history + tags: the baseline is the latest release tag
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.SETUP_UV_VERSION }}
      - name: Install current and baseline environments
        id: envs
        env:
          NEW_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          uv venv --python 3.14 .venv-new
          SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION" \
            uv pip install --python .venv-new/bin/python .
          # orjson on BOTH sides, as production ships it; not the full
          # speedups extra, since uvloop would dominate every async delta.
          # Hard: compare.py refuses a pairing whose sides differ in orjson.
          uv pip install --python .venv-new/bin/python orjson
          # pynacl on BOTH sides, hard: push.seal_500 skips without it.
          uv pip install --python .venv-new/bin/python pynacl
          # Playwright for webui.* on BOTH sides: a metric that skips on one
          # side is ungated. Best-effort, but then the webui ids in
          # benchmarks/expected_gated.txt fail a release; for a transient
          # outage, rerun instead of editing that list.
          uv pip install --python .venv-new/bin/python playwright || true
          .venv-new/bin/python -m playwright install --with-deps chromium \
            || echo "::warning::playwright/chromium unavailable; webui.* skip"
          git fetch --tags --force
          prev=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$prev" ]; then
            # Baseline: the last release in a worktree and its own venv. The
            # current bench.py drives both sides; an old release skips any
            # API it lacks.
            git worktree add /tmp/perf-baseline "$prev"
            uv venv --python 3.14 .venv-old
            SETUPTOOLS_SCM_PRETEND_VERSION="$prev" \
              uv pip install --python .venv-old/bin/python /tmp/perf-baseline
            # Hard, like the current-side installs above.
            uv pip install --python .venv-old/bin/python orjson pynacl
            # The Chromium download above is shared, so this adds only the
            # Python package.
            uv pip install --python .venv-old/bin/python playwright || true
          else
            echo "::notice::No release tag yet; recording a baseline without a comparison."
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - name: Run benchmarks (interleaved rounds, per tier)
        env:
          PYTHONHASHSEED: "0"
          PREV: ${{ steps.envs.outputs.prev }}
        run: |
          set -euo pipefail
          mkdir -p perf
          # Cheap in-process metrics get more rounds, which feed the scatter
          # statistic but do NOT narrow the noise band. Subprocess metrics
          # spawn processes and get fewer. Each round runs old then new, so
          # both sides see the same runner noise.
          run_tier() {
            tier="$1"; rounds="$2"
            for round in $(seq 1 "$rounds"); do
              if [ -n "$PREV" ]; then
                .venv-old/bin/python benchmarks/bench.py --tier "$tier" \
                  --json "perf/old.$tier$round.json"
              fi
              .venv-new/bin/python benchmarks/bench.py --tier "$tier" \
                --json "perf/new.$tier$round.json"
            done
          }
          run_tier inprocess 5
          run_tier subprocess 2
      - name: Compare and gate
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          NEW_VERSION: ${{ needs.version.outputs.new }}
          PREV: ${{ steps.envs.outputs.prev }}
          PERF_MODE: ${{ needs.version.outputs.perf }}
          PERF_SOURCE: ${{ needs.version.outputs.perf-source }}
        run: |
          set -euo pipefail
          # PERF_MODE comes from the dispatch input or a [perf:accept] /
          # [perf:ignore] subject marker. accept reports relative regressions
          # without failing; ignore warns only, like an ordinary commit.
          flags=""
          if [ "$RELEASE" != "true" ]; then
            flags="--warn-only"   # ordinary commit: same comparison, warnings only
          elif [ "$PERF_MODE" = "ignore" ]; then
            flags="--warn-only"
            echo "::warning::perf gate overridden ($PERF_SOURCE): regressions, budget breaches and dead gates are reported but do not gate this release."
          elif [ "$PERF_MODE" = "accept" ]; then
            flags="--accept"
            echo "::notice::$PERF_SOURCE: regressions are reported but do not gate."
          fi
          # --budgets: absolute ceilings that catch drift a green relative gate
          # lets through. --expected-gated: ids that must compare on both
          # sides, so a dead gate fails. Both honor --warn-only; [perf:accept]
          # excuses neither (each file changes only by reviewed edit).
          if [ -z "$PREV" ]; then
            # $flags applies here too: --budgets gates without a baseline.
            .venv-new/bin/python benchmarks/compare.py $flags \
              --current perf/new.*.json --current-label "$NEW_VERSION" \
              --budgets benchmarks/budgets.json \
              --md perf/perf-summary.md --merged-out perf/perf-results.json
          else
            .venv-new/bin/python benchmarks/compare.py $flags \
              --baseline perf/old.*.json --current perf/new.*.json \
              --baseline-label "$PREV" --current-label "$NEW_VERSION" \
              --budgets benchmarks/budgets.json \
              --expected-gated benchmarks/expected_gated.txt \
              --md perf/perf-summary.md --svg perf/perf-chart.svg \
              --merged-out perf/perf-results.json
          fi
          if [ "$RELEASE" = "true" ] && [ "$PERF_MODE" = "ignore" ]; then
            # Head the report the release notes carry, so a FAILED verdict
            # below reads as information.
            {
              echo "### Performance checks overridden"
              echo ""
              echo "Performance checks were overridden for this release ($PERF_SOURCE). The results below are informational. Regressions, exceeded performance limits, missing comparisons, and benchmark job failures did not block publication."
              echo ""
              cat perf/perf-summary.md
            } > perf/perf-summary.stamped.md
            mv perf/perf-summary.stamped.md perf/perf-summary.md
          fi
      # Upload even when the gate failed; the report explains the red X.
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: perf/
          if-no-files-found: error
          retention-days: 30

  # Developer Certificate of Origin: every PR commit needs a `Signed-off-by:`
  # trailer (`git commit -s`; see DCO and CONTRIBUTING.md). PR-only, so it is
  # NOT in the release gate.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the full PR commit range must be walkable
      - name: Verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # The PR's own commits only (base..head), merges excluded: a
          # maintainer's merge is not a contribution needing a sign-off.
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git show -s --format='%B' "$sha" \
                 | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $(git show -s --format='%h %s' "$sha") is missing a Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::DCO check failed. Sign off your commits (git commit -s). To fix an existing branch: git rebase --signoff ${BASE_SHA} then git push --force-with-lease. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All PR commits carry a DCO sign-off."

  # ---------------------------------------------------------------------------
  # Publish: release only, after every gate job above succeeds (`packages`
  # also builds on every commit, to prove the packaging). A skipped `release`
  # skips docker-push and homebrew too; do NOT add always().
  # ---------------------------------------------------------------------------

  # Authenticode-sign the Windows assets on a release. One x64 job signs every
  # arch (Authenticode is arch-agnostic): the signing client does not run on
  # Windows ARM, and id-token: write stays out of the build lanes. Payload
  # exes are signed before packaging, so this job re-zips them and rebuilds
  # and signs every MSI and setup bundle. A missing secret or a signing or
  # scan failure blocks the release; WinGet requires signed installers.
  sign-windows:
    needs: [version, binaries-windows]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC federation for azure/login; no stored client secret
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1    # for packaging/msi/cronstable.wxs
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Require the signing secrets
        id: signing_secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          # The name list IS the env block above (an unset secret arrives
          # empty); test_ci_fences pins it to every secret the job uses.
          names="$(compgen -A export AZURE_ | sort || true)"  # no-match exits 1; the guard below owns that case
          if [ -z "$names" ]; then
            echo "no AZURE_* env vars found; the decide step lost its env block" >&2
            exit 1
          fi
          missing=""
          for name in $names; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing secrets missing:$missing; WinGet requires signed installers."
            exit 1
          fi
      # Rebuild the MSI and setup artifacts from the signed payloads.
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: cronstable-windows-*
          merge-multiple: true
          path: signdir
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3.1.0
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Unpack the payloads and stage the exes
        run: |
          set -euo pipefail
          mkdir -p out exes
          for arch in amd64 amd64v3 arm64 i686; do
            python -c "import zipfile; zipfile.ZipFile('signdir/cronstable-windows-${arch}.zip').extractall('work/${arch}')"
            test -f "work/${arch}/cronstable/cronstable.exe"
            cp "signdir/cronstable-windows-${arch}.exe" exes/
          done
      # Five signing calls: the one-file exes, then each payload root exe
      # (recursion off leaves the third-party DLLs under _internal unsigned).
      # All go through the local retrying action, which owns the digest and
      # timestamp inputs; test_ci_fences pins the ladder and those inputs.
      - name: Sign the one-file exes
        uses: ./.github/actions/sign-artifacts
        with:
          label: the one-file exes
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\exes
          files-folder-filter: exe
      - name: Sign the amd64 payload exe
        uses: ./.github/actions/sign-artifacts
        with:
          label: the amd64 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\amd64\cronstable
          files-folder-filter: exe
      - name: Sign the amd64v3 payload exe
        uses: ./.github/actions/sign-artifacts
        with:
          label: the amd64v3 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\amd64v3\cronstable
          files-folder-filter: exe
      - name: Sign the arm64 payload exe
        uses: ./.github/actions/sign-artifacts
        with:
          label: the arm64 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\arm64\cronstable
          files-folder-filter: exe
      - name: Sign the i686 payload exe
        uses: ./.github/actions/sign-artifacts
        with:
          label: the i686 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\i686\cronstable
          files-folder-filter: exe
      - name: Re-zip the signed payloads
        run: |
          set -euo pipefail
          # Same shape as the build lane: one top-level cronstable/ folder,
          # so extracting into C:\Program Files gives the documented path.
          for arch in amd64 amd64v3 arm64 i686; do
            python -c "import shutil; shutil.make_archive('out/cronstable-windows-${arch}', 'zip', root_dir='work/${arch}', base_dir='cronstable')"
            cp "exes/cronstable-windows-${arch}.exe" out/
          done
      - name: Rebuild the MSIs from the signed payload
        env:
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          # Same script as the binaries-windows Build MSI step, so the signed
          # rebuild matches the MSI the gate smoke-tested (test_ci_fences pins
          # both). -arch is metadata, so this x64 runner builds arm64 too.
          for arch in amd64 amd64v3 arm64 i686; do
            sh .github/scripts/build_msi.sh "$arch" "$VERSION" \
              "work/${arch}/cronstable" "out/cronstable-windows-${arch}.msi"
          done
      - name: Sign the MSIs
        uses: ./.github/actions/sign-artifacts
        with:
          label: the MSIs
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: msi
      - name: Build setup bundles and detach their engines
        run: |
          set -euo pipefail
          export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.dotnet/tools"
          mkdir -p bundles engines
          for arch in amd64 amd64v3 arm64; do
            sh .github/scripts/build_setup.sh "$arch" \
              "out/cronstable-windows-${arch}.msi" "bundles/cronstable-windows-${arch}-setup.exe"
            wix burn detach "bundles/cronstable-windows-${arch}-setup.exe" \
              -engine "engines/cronstable-windows-${arch}-setup.exe"
          done
      - name: Sign the setup engines
        uses: ./.github/actions/sign-artifacts
        with:
          label: the setup engines
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\engines
          files-folder-filter: exe
      - name: Reattach the signed setup engines
        run: |
          set -euo pipefail
          export PATH="$PATH:$(cygpath -u "$USERPROFILE")/.dotnet/tools"
          mkdir -p setups
          for arch in amd64 amd64v3 arm64; do
            wix burn reattach "bundles/cronstable-windows-${arch}-setup.exe" \
              -engine "engines/cronstable-windows-${arch}-setup.exe" \
              -o "setups/cronstable-windows-${arch}-setup.exe"
          done
      - name: Sign the setup bundles
        uses: ./.github/actions/sign-artifacts
        with:
          label: the setup bundles
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\setups
          files-folder-filter: exe
      - name: Stage the signed setup bundles
        run: cp setups/*-setup.exe out/
      # The action can exit 0 having signed nothing (a filter typo), so check
      # what ships: out/ minus the zips, the payload exes in work/ (the zip
      # contents), and the engines. The count floor catches a shrinking set.
      - name: Verify every signature
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File | Where-Object Extension -ne '.zip') +
                   @(Get-ChildItem work\*\cronstable\*.exe -File) +
                   @(Get-ChildItem engines\*.exe -File)
          if ($files.Count -lt 18) {
            throw "expected at least 18 signed files, found $($files.Count)"
          }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') {
              throw "unsigned or invalid signature on $($f.FullName): $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "OK $($f.FullName) -> $($sig.SignerCertificate.Subject)"
          }
      # msiexec round trip on the x64 MSIs only: arm64 cannot run here and
      # i686 installs to a redirected directory. binaries-windows covers the
      # .wxs details on the unsigned twins. The trap uninstalls on failure.
      - name: Smoke-test the signed amd64 MSI (install, uninstall)
        run: |
          set -euo pipefail
          . .github/scripts/msi_smoke.sh
          for arch in amd64 amd64v3; do
            msi="out/cronstable-windows-${arch}.msi"
            trap 'msi_uninstall "$msi" signed-cleanup.log >/dev/null 2>&1 || true' EXIT
            msi_install "$msi" signed-install.log
            sc query cronstable | grep -q 'STOPPED'
            "/c/Program Files/cronstable/cronstable.exe" --version
            python .github/scripts/smoke_windows_first_run.py \
              "/c/Program Files/cronstable/cronstable.exe"
            msi_uninstall "$msi" signed-uninstall.log
          done
      # Validate WinGet artifacts while the other platform builds run.
      # A failure blocks publication through release's sign-windows dependency.
      - name: Smoke-test the signed amd64 setups
        shell: pwsh
        run: |
          foreach ($arch in @('amd64', 'amd64v3')) {
            ./.github/scripts/smoke_windows_setup.ps1 -Setup "out/cronstable-windows-$arch-setup.exe"
          }
      - name: Prepare winget checksums
        run: |
          set -euo pipefail
          cd out
          sha256sum cronstable-windows-amd64.msi cronstable-windows-arm64.msi \
            cronstable-windows-amd64-setup.exe cronstable-windows-arm64-setup.exe > SHA256SUMS
      - name: Verify and Defender-scan winget installers
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/prepare_winget.ps1 -AssetDirectory out -EngineDirectory engines -OutputDirectory winget-validation -WixCommand "$env:USERPROFILE/.dotnet/tools/wix.exe"
      - name: Generate winget manifests
        env:
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          python -m pip install strictyaml==1.7.3
          python .github/scripts/render_winget.py "$VERSION" winget-validation/metadata.json winget-manifests
      - name: Validate with the winget client
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $wingetVersion = '1.29.290'
          # The pinned client supports the generated manifest schema.
          Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
          Repair-WinGetPackageManager -Version $wingetVersion -Force
          $client = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($client) {
            $clientPath = $client.Source
          } else {
            $package = Get-AppxPackage Microsoft.DesktopAppInstaller
            if (-not $package) { throw 'WinGet executable unavailable after repair' }
            $clientPath = Join-Path $package.InstallLocation 'winget.exe'
          }
          $actualVersion = (& $clientPath --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "winget --version failed ($LASTEXITCODE)" }
          Write-Host "WinGet client: $actualVersion ($clientPath)"
          if ($actualVersion -ne "v$wingetVersion") {
            throw "Expected WinGet v$wingetVersion, found $actualVersion"
          }
          & $clientPath validate --manifest winget-manifests --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
      - name: Preserve winget validation evidence
        if: always() && steps.signing_secrets.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: winget-validation
          path: |
            winget-validation/*.log
            winget-validation/*.wxs
            winget-validation/metadata.json
            winget-manifests/*.yaml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the signed set
        uses: actions/upload-artifact@v7.0.1
        with:
          # Keep outside the cronstable-* glob that release-prepare merges
          # into one directory, or signed and unsigned copies race on
          # download order (test_ci_fences pins this).
          name: signed-windows
          path: |
            out/cronstable-windows-amd64.exe
            out/cronstable-windows-amd64v3.exe
            out/cronstable-windows-arm64.exe
            out/cronstable-windows-i686.exe
            out/cronstable-windows-amd64.zip
            out/cronstable-windows-amd64v3.zip
            out/cronstable-windows-arm64.zip
            out/cronstable-windows-i686.zip
            out/cronstable-windows-amd64.msi
            out/cronstable-windows-amd64v3.msi
            out/cronstable-windows-arm64.msi
            out/cronstable-windows-i686.msi
            out/cronstable-windows-amd64-setup.exe
            out/cronstable-windows-amd64v3-setup.exe
            out/cronstable-windows-arm64-setup.exe
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: [version, binaries, binaries-container, binaries-loong64]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cronstable-linux-*
          merge-multiple: true
          path: binaries
      - name: Build .deb, .rpm and .apk packages
        run: |
          set -euo pipefail
          # Development artifacts use the same numeric package version as the MSIs.
          package_version="$(printf '%s' "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          bash .github/scripts/build_packages.sh "$package_version" binaries
        env:
          VERSION: ${{ needs.version.outputs.new }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-packages
          path: |
            binaries/*.deb
            binaries/*.rpm
            binaries/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release-prepare:
    needs:
      - version
      - dist
      - binaries
      - binaries-container
      - binaries-mips
      - binaries-arm-legacy
      - binaries-loong64
      - binaries-macos
      - binaries-freebsd
      - binaries-openbsd
      - binaries-netbsd
      - binaries-illumos
      - binaries-windows
      - sign-windows
      - perf
      - preflight
      - packages
      - binaries-armel
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Publish the exact wheel and sdist that `dist` built and checked.
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Download release binaries
        uses: actions/download-artifact@v8.0.1
        with:
          path: binaries
          pattern: cronstable-*
          merge-multiple: true

      # Overlay the signed Windows files before anything hashes or attaches
      # them, so SHA256SUMS, the Release and the winget manifests describe the
      # signed bytes. test_ci_fences pins the position.
      - name: Overlay the signed Windows artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: signed-windows
          path: binaries

      # Prebuilt by `packages`; hash and attach these exact files.
      - name: Download Linux packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: linux-packages
          path: binaries
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp dist/*.whl dist/*.tar.gz \
             binaries/cronstable-linux-amd64 binaries/cronstable-linux-arm64 \
             binaries/cronstable-linux-amd64v3 \
             binaries/cronstable-linux-i686 binaries/cronstable-linux-armv7 \
             binaries/cronstable-linux-armv6 binaries/cronstable-linux-armel \
             binaries/cronstable-linux-ppc64le binaries/cronstable-linux-s390x \
             binaries/cronstable-linux-riscv64 binaries/cronstable-linux-loong64 \
             binaries/cronstable-linux-mips64le \
             binaries/cronstable-linux-amd64-musl binaries/cronstable-linux-arm64-musl \
             binaries/cronstable-linux-amd64v3-musl \
             binaries/cronstable-linux-i686-musl binaries/cronstable-linux-armv7-musl \
             binaries/cronstable-linux-armv6-musl binaries/cronstable-linux-loong64-musl \
             binaries/cronstable-linux-ppc64le-musl binaries/cronstable-linux-s390x-musl \
             binaries/cronstable-linux-riscv64-musl \
             binaries/cronstable-linux-amd64.deb binaries/cronstable-linux-arm64.deb \
             binaries/cronstable-linux-amd64v3.deb \
             binaries/cronstable-linux-i686.deb binaries/cronstable-linux-armv7.deb \
             binaries/cronstable-linux-ppc64le.deb binaries/cronstable-linux-s390x.deb \
             binaries/cronstable-linux-riscv64.deb \
             binaries/cronstable-linux-amd64.rpm binaries/cronstable-linux-arm64.rpm \
             binaries/cronstable-linux-amd64v3.rpm \
             binaries/cronstable-linux-i686.rpm binaries/cronstable-linux-armv7.rpm \
             binaries/cronstable-linux-ppc64le.rpm binaries/cronstable-linux-s390x.rpm \
             binaries/cronstable-linux-riscv64.rpm \
             binaries/cronstable-linux-amd64.apk binaries/cronstable-linux-arm64.apk \
             binaries/cronstable-linux-amd64v3.apk \
             binaries/cronstable-linux-i686.apk binaries/cronstable-linux-armv7.apk \
             binaries/cronstable-linux-armv6.apk binaries/cronstable-linux-ppc64le.apk \
             binaries/cronstable-linux-s390x.apk binaries/cronstable-linux-riscv64.apk binaries/cronstable-linux-loong64.apk \
             binaries/cronstable-macos-amd64 binaries/cronstable-macos-arm64 \
             binaries/cronstable-macos-amd64v3 \
             binaries/cronstable-freebsd-amd64 binaries/cronstable-freebsd-arm64 \
             binaries/cronstable-freebsd-amd64v3 \
             binaries/cronstable-freebsd-amd64.pkg binaries/cronstable-freebsd-arm64.pkg \
             binaries/cronstable-freebsd-amd64v3.pkg \
             binaries/cronstable-openbsd-amd64 binaries/cronstable-netbsd-amd64 \
             binaries/cronstable-netbsd-amd64v3 \
             binaries/cronstable-openbsd-amd64v3 \
             binaries/cronstable-illumos-amd64 \
             binaries/cronstable-illumos-amd64v3 \
             binaries/cronstable-windows-amd64.exe binaries/cronstable-windows-arm64.exe \
             binaries/cronstable-windows-amd64v3.exe \
             binaries/cronstable-windows-i686.exe \
             binaries/cronstable-windows-amd64.zip binaries/cronstable-windows-arm64.zip \
             binaries/cronstable-windows-amd64v3.zip \
             binaries/cronstable-windows-i686.zip \
             binaries/cronstable-windows-amd64.msi binaries/cronstable-windows-arm64.msi \
             binaries/cronstable-windows-amd64v3.msi \
             binaries/cronstable-windows-i686.msi \
             binaries/cronstable-windows-amd64-setup.exe binaries/cronstable-windows-arm64-setup.exe \
             binaries/cronstable-windows-amd64v3-setup.exe \
             "$work"/
          ( cd "$work" && sha256sum -- * ) > SHA256SUMS
          cat SHA256SUMS

      # Scoop is a pull channel: once this file is in ScoopInstaller/Extras,
      # its Excavator bot updates it from each release SHA256SUMS asset.
      - name: Render the Scoop manifest
        run: |
          set -euo pipefail
          mkdir -p scoop
          python3 .github/scripts/render_scoop.py "${{ needs.version.outputs.new }}" SHA256SUMS scoop/cronstable.json
          cat scoop/cronstable.json

      # Perf gate output for this run: summary, raw results and chart.
      - name: Download performance report
        uses: actions/download-artifact@v8.0.1
        # Under perf=ignore the perf job may have died before uploading; the
        # notes step below then says so instead of failing the release.
        continue-on-error: ${{ needs.version.outputs.perf == 'ignore' }}
        with:
          name: perf-report
          path: perf

      - name: Build release notes from HISTORY.md
        env:
          NEW: ${{ needs.version.outputs.new }}
          PERF_MODE: ${{ needs.version.outputs.perf }}
          PERF_SOURCE: ${{ needs.version.outputs.perf-source }}
        run: |
          set -euo pipefail
          # The $NEW section of HISTORY.md, up to the next "## " header.
          # Matching on fields ($2 == the version) accepts a dated heading and
          # keeps 1.2.1 from matching 1.2.10.
          awk -v ver="$NEW" '
            $1 == "##" && $2 == ver { cap = 1; next }
            cap && /^## / { exit }
            cap { print }
          ' HISTORY.md | sed '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "::notice::Using HISTORY.md notes for $NEW."
          else
            echo "::warning::No HISTORY.md section for $NEW; release notes will be auto-generated only."
          fi
          # Append the perf comparison as text only (the perf job passes no
          # --img-url): a body image counts as a download on every render and
          # cannot display, since GitHub serves release assets as attachments.
          if [ -f perf/perf-summary.md ]; then
            {
              echo ""
              cat perf/perf-summary.md
            } >> release-notes.md
          else
            # only reachable under perf=ignore, where a perf job that died
            # before writing its report does not hold the release
            echo "::warning::perf/perf-summary.md is missing (perf gate $PERF_MODE, $PERF_SOURCE); the notes carry no comparison."
            {
              echo ""
              echo "### Performance"
              echo ""
              echo "Performance checks were overridden for this release ($PERF_SOURCE). The benchmark job did not produce a report, so no performance comparison is available."
            } >> release-notes.md
          fi

      # zeroconf LGPL-2.1 source offer: attach its sdist, resolved in this run,
      # and the notices file to the Release. See the licenses job.
      - name: Download resolved source archives
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: release-inputs
      - name: Prepare source offer and Homebrew formula
        run: |
          set -euo pipefail
          cp -R release-inputs/third-party .
          mkdir -p homebrew
          bash packaging/homebrew/render-formula.sh "${{ needs.version.outputs.new }}" SHA256SUMS \
            packaging/homebrew/cronstable.rb.tmpl > homebrew/cronstable.rb
          ruby -c homebrew/cronstable.rb
      - name: Preserve prepared release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prepared-release
          path: |
            dist/
            binaries/
            SHA256SUMS
            scoop/
            homebrew/
            perf/
            third-party/
            release-notes.md
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve validated Homebrew formula
        uses: actions/upload-artifact@v7.0.1
        with:
          name: homebrew-formula
          path: homebrew/cronstable.rb
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 20

  release:
    needs:
      - version
      - tox
      - tox-mindeps
      - backends-live
      - tox-static
      - licenses
      - release-prepare
      - docker-assemble
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # push the tag and create the GitHub Release
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # release-prepare assembled and hashed the wheel, sdist and binaries:
      # publish those exact bytes rather than rebuilding.
      - name: Download prepared release
        uses: actions/download-artifact@v8.0.1
        with:
          name: prepared-release
          path: .
      - name: Verify prepared artifact checksums
        run: python3 .github/scripts/verify_release_checksums.py
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Runs before the tag and Release, so a retry after a later failure
          # finds the files on PyPI; skip-existing lets it finish the release.
          skip-existing: true

      # Everything below runs only after PyPI has accepted the upload.
      - name: Tag the release
        env:
          NEW: ${{ needs.version.outputs.new }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On a re-run the tag is already on the remote: skip it when it names
          # HEAD, fail when it names another commit. ls-remote peels the annotated
          # tag to its commit, which a shallow checkout cannot do locally.
          existing="$(git ls-remote --tags origin "refs/tags/$NEW^{}" "refs/tags/$NEW" | tail -n1 | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$(git rev-parse HEAD)" ]; then
              echo "tag $NEW already points at HEAD; skipping"
              exit 0
            fi
            echo "::error::tag $NEW already exists at $existing, not HEAD $(git rev-parse HEAD)"
            exit 1
          fi
          git tag -a "$NEW" -m "Release $NEW"
          # RELEASE_TOKEN is optional. GITHUB_TOKEN can tag commits already on
          # main; a tagged commit whose workflow files differ from the default
          # branch can require a token with the workflow scope.
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$NEW"
          else
            echo "::notice::RELEASE_TOKEN not set; pushing the tag with the job GITHUB_TOKEN (contents: write)."
            git push origin "refs/tags/$NEW"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.new }}
          name: ${{ needs.version.outputs.new }}
          # The HISTORY.md notes, followed by the notes GitHub generates.
          body_path: release-notes.md
          generate_release_notes: true
          # Attach everything in this one step: immutable releases block later
          # attaches. The explicit list keeps the CI-only cronstable-macos26-*
          # files and perf-chart.svg (perf-report artifact only) off the
          # Release. An unmatched entry, as under perf=ignore, is skipped.
          files: |
            SHA256SUMS
            scoop/cronstable.json
            perf/perf-summary.md
            perf/perf-results.json
            third-party/THIRD-PARTY-NOTICES.txt
            third-party/zeroconf-*.tar.gz
            dist/*.whl
            dist/*.tar.gz
            binaries/cronstable-linux-amd64
            binaries/cronstable-linux-amd64v3
            binaries/cronstable-linux-arm64
            binaries/cronstable-linux-i686
            binaries/cronstable-linux-armv7
            binaries/cronstable-linux-armv6
            binaries/cronstable-linux-armel
            binaries/cronstable-linux-ppc64le
            binaries/cronstable-linux-s390x
            binaries/cronstable-linux-riscv64
            binaries/cronstable-linux-loong64
            binaries/cronstable-linux-mips64le
            binaries/cronstable-linux-amd64-musl
            binaries/cronstable-linux-amd64v3-musl
            binaries/cronstable-linux-arm64-musl
            binaries/cronstable-linux-i686-musl
            binaries/cronstable-linux-armv7-musl
            binaries/cronstable-linux-armv6-musl
            binaries/cronstable-linux-loong64-musl
            binaries/cronstable-linux-ppc64le-musl
            binaries/cronstable-linux-s390x-musl
            binaries/cronstable-linux-riscv64-musl
            binaries/cronstable-linux-amd64.deb
            binaries/cronstable-linux-amd64v3.deb
            binaries/cronstable-linux-arm64.deb
            binaries/cronstable-linux-i686.deb
            binaries/cronstable-linux-armv7.deb
            binaries/cronstable-linux-ppc64le.deb
            binaries/cronstable-linux-s390x.deb
            binaries/cronstable-linux-riscv64.deb
            binaries/cronstable-linux-amd64.rpm
            binaries/cronstable-linux-amd64v3.rpm
            binaries/cronstable-linux-arm64.rpm
            binaries/cronstable-linux-i686.rpm
            binaries/cronstable-linux-armv7.rpm
            binaries/cronstable-linux-ppc64le.rpm
            binaries/cronstable-linux-s390x.rpm
            binaries/cronstable-linux-riscv64.rpm
            binaries/cronstable-linux-amd64.apk
            binaries/cronstable-linux-amd64v3.apk
            binaries/cronstable-linux-arm64.apk
            binaries/cronstable-linux-i686.apk
            binaries/cronstable-linux-armv7.apk
            binaries/cronstable-linux-armv6.apk
            binaries/cronstable-linux-ppc64le.apk
            binaries/cronstable-linux-s390x.apk
            binaries/cronstable-linux-riscv64.apk
            binaries/cronstable-linux-loong64.apk
            binaries/cronstable-macos-amd64
            binaries/cronstable-macos-amd64v3
            binaries/cronstable-macos-arm64
            binaries/cronstable-freebsd-amd64
            binaries/cronstable-freebsd-amd64v3
            binaries/cronstable-freebsd-arm64
            binaries/cronstable-freebsd-amd64.pkg
            binaries/cronstable-freebsd-amd64v3.pkg
            binaries/cronstable-freebsd-arm64.pkg
            binaries/cronstable-openbsd-amd64
            binaries/cronstable-openbsd-amd64v3
            binaries/cronstable-netbsd-amd64
            binaries/cronstable-netbsd-amd64v3
            binaries/cronstable-illumos-amd64
            binaries/cronstable-illumos-amd64v3
            binaries/cronstable-windows-amd64.exe
            binaries/cronstable-windows-amd64v3.exe
            binaries/cronstable-windows-arm64.exe
            binaries/cronstable-windows-i686.exe
            binaries/cronstable-windows-amd64.zip
            binaries/cronstable-windows-amd64v3.zip
            binaries/cronstable-windows-arm64.zip
            binaries/cronstable-windows-i686.zip
            binaries/cronstable-windows-amd64.msi
            binaries/cronstable-windows-amd64v3.msi
            binaries/cronstable-windows-arm64.msi
            binaries/cronstable-windows-i686.msi
            binaries/cronstable-windows-amd64-setup.exe
            binaries/cronstable-windows-amd64v3-setup.exe
            binaries/cronstable-windows-arm64-setup.exe

    timeout-minutes: 20

  # Push the validated multi-arch images to GHCR, and to Docker Hub when the
  # DOCKERHUB_* secrets are set. `needs: release` gates it on every build.
  docker-push:
    concurrency:
      group: docker-publish-${{ github.repository }}-${{ matrix.distro }}
      cancel-in-progress: false
    needs:
      - version
      - release
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write   # push to GHCR
    strategy:
      fail-fast: false
      # The rows the `docker` gate built (.github/docker-matrix.json, via
      # `version`), so what is pushed is exactly what was gated.
      matrix:
        include: ${{ fromJSON(needs.version.outputs.docker-matrix) }}
    steps:
      - name: Resolve registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          images="ghcr.io/${REPO,,}"   # GHCR image names must be lowercase
          dockerhub=false
          # Preflight requires a complete pair when Docker Hub is configured.
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/cronstable"
            dockerhub=true
          fi
          {
            echo "dockerhub=$dockerhub"
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          # The distro suffix (e.g. `-alpine`) is appended to every tag; it is
          # empty for Debian, which therefore owns the bare `latest`/`<version>`.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.version.outputs.new }}
            type=raw,value=latest
            # Explicit -debian alias so the default base is pinnable by name too
            # (latest-debian / <version>-debian), mirroring the other variants.
            type=raw,value=${{ needs.version.outputs.new }}-debian,enable=${{ startsWith(matrix.distro, 'debian') }}
            type=raw,value=latest-debian,enable=${{ startsWith(matrix.distro, 'debian') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download validated OCI image
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-release-${{ matrix.distro }}
          path: .
      - name: Publish the validated image without rebuilding
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sha256sum -c image.sha256
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" oci-archive:image.tar:release "docker://$tag"
          done <<< "$TAGS"
    timeout-minutes: 30

  homebrew:
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1    # for the formula template + render script

      - name: Download validated Homebrew formula
        uses: actions/download-artifact@v8.0.1
        with:
          name: homebrew-formula
          path: prepared
      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            # Every release must update the tap; a silent skip would leave it
            # stale behind a green run.
            echo "::error::HOMEBREW_TAP_TOKEN is not set; cannot update the Homebrew tap. Add it as a repo secret (fine-grained PAT with Contents: read/write on ptweezy/homebrew-tap) and re-run this release." >&2
            exit 1
          fi

          # Retry a function: retry.sh logs the failed command, and the clone
          # URL carries the tap token. The rm lets a retry replace a partial
          # clone, since git refuses a non-empty target.
          . .github/scripts/retry.sh
          clone_tap() {
            rm -rf tap
            git clone --depth 1 \
              "https://x-access-token:${TAP_TOKEN}@github.com/ptweezy/homebrew-tap.git" tap
          }
          retry 5 clone_tap
          mkdir -p tap/Formula
          cp prepared/cronstable.rb tap/Formula/cronstable.rb

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first, then compare the index: a plain `git diff` ignores
          # untracked files, so a first publication would look unchanged.
          git add Formula/cronstable.rb
          if git diff --cached --quiet; then
            echo "Formula already current for ${VERSION}."
            exit 0
          fi
          git commit -m "cronstable ${VERSION}"
          git push

  # Submit ptweezy.cronstable to microsoft/winget-pkgs from the manifests
  # sign-windows validated. WINGET_TOKEN (classic PAT, public_repo scope) is
  # required; its account owns the fork and the PRs.
  winget:
    needs: [version, release, sign-windows]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Download signed winget installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir winget-assets --pattern SHA256SUMS \
            --pattern cronstable-windows-amd64.msi \
            --pattern cronstable-windows-arm64.msi \
            --pattern cronstable-windows-amd64-setup.exe \
            --pattern cronstable-windows-arm64-setup.exe
      - name: Download validated winget manifests
        uses: actions/download-artifact@v8.0.1
        with:
          name: winget-validation
          path: .
      - name: Verify published winget installers match the scanned files
        env:
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          python .github/scripts/verify_winget_release.py "$VERSION" winget-validation/metadata.json winget-assets
      - name: Set winget release date
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          python -m pip install strictyaml==1.7.3
          published_at="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt')"
          python .github/scripts/set_winget_release_date.py "$VERSION" "$published_at" winget-manifests/ptweezy.cronstable.installer.yaml
      - name: Submit winget manifest
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "::error::WINGET_TOKEN is not set; the winget manifest would go stale. Add it as a repo secret (a GitHub PAT with public_repo scope)." >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o wingetcreate.exe \
            https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe
          ./wingetcreate.exe submit winget-manifests \
            --no-open --token "$WINGET_TOKEN" \
            --prtitle "New version: ptweezy.cronstable version ${VERSION}"

  # ---------------------------------------------------------------------------
  # Docs. Gated on neither a release nor the build and test matrix, so a
  # flaky emulated arch never holds up a wiki fix.
  # ---------------------------------------------------------------------------

  # Publish wiki/ (the source of truth) to the GitHub wiki, a separate
  # <repo>.wiki.git repository where its bare [Page](Page) links resolve.
  # Only a push to main publishes, because the pages link to /blob/main/.
  # GITHUB_TOKEN can push the wiki of its own repository, so no PAT is needed.
  wiki:
    # A fork has no wiki repository until someone creates a page, so the
    # wiki checkout would fail on every fork main push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ptweezy/cronstable'
    runs-on: ubuntu-26.04
    permissions:
      # Allows the wiki push (undocumented under `contents`). Nothing in this
      # repository is written.
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1    # for the wiki/ page sources
      - uses: actions/checkout@v7.0.1    # the wiki is its own repo; its default branch is always master
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Publish wiki/ to the GitHub wiki
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Mirror, so pages deleted from wiki/ leave the wiki too. This also
          # removes pages created in the wiki web UI; edit wiki/ instead.
          mirror() {
            find .wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R wiki/. .wiki/
          }

          git -C .wiki config user.name  "github-actions[bot]"
          git -C .wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Web UI edits or a concurrent run can win the push race; the commit
          # is a snapshot of wiki/, so re-mirror onto the new tip and retry.
          for attempt in 1 2 3; do
            git -C .wiki fetch -q origin master
            git -C .wiki reset -q --hard origin/master
            mirror

            # Stage first, then compare the index; see the homebrew job.
            git -C .wiki add -A
            if git -C .wiki diff --cached --quiet; then
              echo "Wiki already current for ${SHA:0:7}."
              exit 0
            fi

            # Print the change set: a mirror deletes, and a deletion must never
            # be silent in the log.
            git -C .wiki diff --cached --name-status

            git -C .wiki commit -q -m "Sync wiki from ${SHA:0:7}"
            if git -C .wiki push -q origin HEAD:master; then
              echo "::notice::Wiki published from ${SHA:0:7}."
              exit 0
            fi
            echo "::warning::Wiki push rejected (attempt ${attempt}/3); re-mirroring onto the new tip."
          done

          echo "::error::Could not push the wiki after 3 attempts; the wiki repo is being written concurrently. Re-run this job." >&2
          exit 1
