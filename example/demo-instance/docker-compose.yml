# The public read-only demo instance (see cronstable.yaml and README.md).
#
#   cp .env.example .env      # then paste the tunnel token into it
#   docker compose -f example/demo-instance/docker-compose.yml up -d --build
#
# Two containers: the daemon, and a Cloudflare Tunnel that publishes it at
# demo.cronstable.com.  The tunnel dials out to Cloudflare, so the host
# needs no port forwarding, no static IP and no inbound firewall hole,
# which is what makes running this on a machine at home reasonable.  TLS
# terminates at Cloudflare, so there is no certificate to manage here.

services:
  cronstable-demo:
    build:
      context: ../..
    container_name: cronstable-demo
    # Point at the config file, not the image's default `-c /etc/cronstable.d`
    # directory. `include: legacy.crontab` resolves next to the config, so
    # under a directory scan the crontab would load twice (once by the scan,
    # which treats a `.crontab` entry as a config in its own right, and once
    # by the include) and the daemon would refuse to start on duplicate job
    # names. This also matches how launchd/install.sh runs it.
    command: ["-c", "/etc/cronstable.d/cronstable.yaml"]
    environment:
      # The view-scoped demo credential. Public by design (it ships in the
      # companion app); override to rotate, then update the app config.
      # Anonymous visitors already hold the same view scope, so this token
      # is a convenience for clients that authenticate, not a gate.
      CRONSTABLE_DEMO_VIEW_TOKEN: ${CRONSTABLE_DEMO_VIEW_TOKEN:-cronstable-public-demo-view}
      # The demo-operator job's control+approve credential. Deliberately has
      # no default: a literal here would be a published control token for
      # every host that ran this file unmodified. Generate one into .env:
      #   printf 'CRONSTABLE_DEMO_OPERATOR_TOKEN=%s\n' \
      #     "$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
      CRONSTABLE_DEMO_OPERATOR_TOKEN: ${CRONSTABLE_DEMO_OPERATOR_TOKEN:?generate one into example/demo-instance/.env (see the comment above)}
    # Loopback only, and only so the operator can curl it on the box: the
    # tunnel reaches the daemon over the compose network as
    # http://cronstable-demo:8080, never through a published port.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./cronstable.yaml:/etc/cronstable.d/cronstable.yaml:ro
      # `include:` resolves next to the config, so the migrated crontab has
      # to be mounted beside it.
      - ./legacy.crontab:/etc/cronstable.d/legacy.crontab:ro
      - demo-state:/var/lib/cronstable/state
    restart: unless-stopped
    # Demo jobs are pure shell noise; keep the blast radius tiny anyway.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    # Probes the way a visitor arrives: no credential at all. On this board
    # that is the supported path (web.anonymousScopes grants view), so a
    # healthy container means the public experience works.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8080/summary", timeout=5)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cronstable-demo-tunnel
    # A named tunnel run from a token; the public hostname -> service
    # mapping lives in the Cloudflare dashboard (see README.md), pointing
    # at http://cronstable-demo:8080 on this compose network.
    command: tunnel --no-autoupdate run
    environment:
      # Required: the `:?` makes a missing token a startup error rather
      # than a container that quietly retries forever.  Keep it in .env,
      # which is gitignored. Anyone holding it can publish traffic
      # through your tunnel.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in example/demo-instance/.env}
    depends_on:
      cronstable-demo:
        condition: service_started
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

volumes:
  demo-state:
