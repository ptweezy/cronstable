# Extended checks on main that never block a commit (release.yml holds the
# required ones): deep (tox -e deep), devmode (PYTHONDEVMODE asyncio and
# ResourceWarning diagnostics) and mutation (mutmut, one module per job).
# Jobs install the latest compatible dependencies, so a breaking upstream
# release shows up here before the next push.

name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  deep:
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pip install tox tox-uv
      # Same Chromium install as release.yml, so the browser suites run.
      - name: Install Chromium
        run: |
          set -euo pipefail
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: tox -e deep

  devmode:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      PYTHONDEVMODE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]'
      # Allow twice the usual timeout for Python development mode.
      - run: python -m pytest -q --timeout=540 -o faulthandler_timeout=600

  mutation:
    strategy:
      fail-fast: false
      matrix:
        module:
          - cronexpr
          - crontabs
          - redact
          - ical
          - _json
          - fingerprint
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pip install -e '.[dev]' mutmut
      # [tool.mutmut] in pyproject.toml selects the sources and tests.
      # Limit this job to mutations in one module.
      - name: Mutate cronstable.${{ matrix.module }}
        run: |
          set -euo pipefail
          python -m mutmut run --max-children 4 \
            "cronstable.${{ matrix.module }}*" > mutmut-run.log 2>&1 || true
          tail -c 2000 mutmut-run.log | tr '\r' '\n' | tail -n 5
          python -m mutmut results > "mutation-${{ matrix.module }}.txt"
          python -m mutmut export-cicd-stats
      - name: Summarize
        run: |
          python - "${{ matrix.module }}" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          import sys

          stats = json.load(open("mutants/mutmut-cicd-stats.json"))
          print("### cronstable.{}".format(sys.argv[1]))
          print("| killed | survived | timeout | no tests | total |")
          print("|---|---|---|---|---|")
          print("| {killed} | {survived} | {timeout} | {no_tests} | {total} |".format(**stats))
          EOF
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mutation-${{ matrix.module }}
          path: mutation-${{ matrix.module }}.txt
          if-no-files-found: error
          retention-days: 30
