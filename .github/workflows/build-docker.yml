name: Build Docker platforms

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      version:
        type: string
        required: true
      release:
        type: boolean
        required: true
      zeroconf:
        type: string
        required: true
      ref:
        type: string
        default: ''
      refresh:
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: ${{ inputs.release }}
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      # Runner setup comes from the workflow revision, even when refreshing
      # a release whose source tree predates the shared compatibility action.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        if: matrix.platforms == 'linux/386'
      - name: Validate the released source against trusted history
        if: inputs.ref != ''
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TO_VALIDATE: ${{ inputs.ref }}
          REFRESH: ${{ inputs.refresh }}
        run: python3 .github/scripts/docker_refresh.py validate-ref
      - name: Check out the application revision
        if: inputs.ref != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Fetch this platform's optional wheel
        if: matrix.wheel != ''
        continue-on-error: ${{ !inputs.refresh }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.wheel }}
          path: docker/wheelhouse/${{ matrix.wheel_group }}
      - name: Download dependency sources for the refreshed image
        if: inputs.refresh
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: ${{ runner.temp }}/release-inputs
      - name: Prepare the runtime refresh and dependency source offer
        if: inputs.refresh
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/release-inputs/refresh-tools/refresh_runtime.py" recipe \
            --dockerfile "$DOCKERFILE" --distro "$DISTRO" --output "$RUNNER_TEMP/Dockerfile.refresh"
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.qemu
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Select the registry cache
        id: cache
        env:
          CACHE_SCOPE: ${{ matrix.distro }}-${{ matrix.platform_id }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-buildcache:$CACHE_SCOPE" >> "$GITHUB_OUTPUT"
      - name: Log in for registry caching
        id: cache-login
        if: ${{ !inputs.refresh }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
        continue-on-error: true
      - name: Build the platform once
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ inputs.refresh && format('{0}/Dockerfile.refresh', runner.temp) || matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          pull: ${{ inputs.refresh }}
          no-cache: ${{ inputs.refresh }}
          build-contexts: |
            ${{ inputs.refresh && format('dependency-sources={0}/release-inputs/third-party', runner.temp) || '' }}
            ${{ inputs.refresh && format('refresh-tools={0}/release-inputs/refresh-tools', runner.temp) || '' }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=${{ inputs.version }}
            PYTHON_VARIANT=${{ matrix.python_variant }}
            ZEROCONF_VERSION=${{ inputs.zeroconf }}
            DEPS_REFRESH=${{ (inputs.release || inputs.refresh) && github.run_id || '' }}
          provenance: false
          # Cache loss affects build speed only. Publishing consumes the OCI
          # artifact. Registry caches have one tag per distro and platform.
          cache-from: ${{ !inputs.refresh && format('type=registry,ref={0}', steps.cache.outputs.ref) || '' }}
          cache-to: ${{ !inputs.refresh && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.cache-login.outcome == 'success' && format('type=registry,ref={0},mode=max,ignore-error=true', steps.cache.outputs.ref) || '' }}
      - name: Test the refreshed runtime
        if: inputs.refresh
        env:
          PLATFORM: ${{ matrix.platforms }}
          DISTRO: ${{ matrix.distro }}
          VERSION: ${{ inputs.version }}
          ZEROCONF_VERSION: ${{ inputs.zeroconf }}
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          IFS=/ read -r image_os image_arch image_variant <<< "$PLATFORM"
          platform_args=(--override-os "$image_os" --override-arch "$image_arch")
          if [ -n "$image_variant" ]; then
            platform_args+=(--override-variant "$image_variant")
          fi
          skopeo "${platform_args[@]}" copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:cronstable-refresh:test
          docker run --rm --platform "$PLATFORM" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            cronstable-refresh:test --version
          docker run --rm -i --platform "$PLATFORM" --network none --read-only \
            --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /opt/venv/bin/python cronstable-refresh:test - "$VERSION" "$ZEROCONF_VERSION" <<'PY'
          import importlib.metadata
          import pathlib
          import ssl
          import subprocess
          import sys
          import tempfile
          import aiohttp
          import zeroconf.asyncio
          from nacl.public import PrivateKey, SealedBox
          assert importlib.metadata.version('cronstable') == sys.argv[1]
          assert importlib.metadata.version('zeroconf') == sys.argv[2]
          assert list(pathlib.Path('/usr/share/doc/cronstable/third-party').glob('zeroconf-*.tar.gz'))
          ssl.create_default_context()
          key = PrivateKey.generate()
          assert SealedBox(key).decrypt(SealedBox(key.public_key).encrypt(b'refresh')) == b'refresh'
          with tempfile.TemporaryDirectory() as directory:
              config = pathlib.Path(directory) / 'cronstable.yaml'
              config.write_text('jobs:\n  - name: smoke\n    command: /opt/venv/bin/python --version\n    schedule: "* * * * *"\n')
              subprocess.run([sys.executable, '-m', 'cronstable', '--validate-config', '-c', str(config)], check=True)
          PY
          docker run --rm -i --platform "$PLATFORM" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /opt/venv/bin/python cronstable-refresh:test - < .github/scripts/check_licenses.py
          docker run --rm -i --platform "$PLATFORM" --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /opt/venv/bin/python cronstable-refresh:test - check --distro "$DISTRO" \
            < "$RUNNER_TEMP/release-inputs/refresh-tools/refresh_runtime.py"
      - name: Prepare the OCI image for scanning
        if: inputs.refresh
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan-image"
          tar -xf "$RUNNER_TEMP/image.tar" -C "$RUNNER_TEMP/scan-image"
      - name: Scan the refreshed image
        if: inputs.refresh
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platforms }}
        with:
          input: ${{ runner.temp }}/scan-image
          scanners: vuln
          format: json
          output: ${{ runner.temp }}/vulnerabilities.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          list-all-pkgs: true
          exit-code: '1'
          timeout: 15m
      - name: Show vulnerability findings
        if: ${{ always() && inputs.refresh }}
        run: |
          if [ -f "$RUNNER_TEMP/vulnerabilities.json" ]; then
            jq -r '.Results[]? | .Target as $target | .Vulnerabilities[]? |
              [$target, .PkgName, .InstalledVersion, .FixedVersion, .Severity, .VulnerabilityID] | @tsv' \
              "$RUNNER_TEMP/vulnerabilities.json"
          fi
      - name: Upload vulnerability report
        if: ${{ always() && inputs.refresh }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: vulnerabilities-${{ matrix.distro }}-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/vulnerabilities.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: image-${{ matrix.distro }}-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.release && 7 || 2 }}
