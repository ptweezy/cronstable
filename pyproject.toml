[build-system]
requires = ["setuptools>=83", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cronstable"
description = "A modern, distributed, fault-tolerant, highly available, leader-electing, container-friendly, highly configurable, precompiled, multi-architecture, portable, security-hardened, production-ready cron replacement."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "TRADEMARKS.md", "LICENSING.md"]
authors = [{ name = "Parker Loflin", email = "parker@cronstable.dev" }]
maintainers = [{ name = "Parker Loflin", email = "parker@cronstable.dev" }]
keywords = [
    "cron",
    "crontab",
    "scheduler",
    "job-scheduler",
    "task-scheduler",
    "scheduling",
    "cron-replacement",
    "cronjob",
    "container",
    "docker",
    "kubernetes",
    "k8s",
    "daemon",
    "yaml",
    "devops",
    "sre",
    "sysadmin",
    "sentry",
    "statsd",
    "prometheus",
    "metrics",
    "monitoring",
    "retry",
    "timezone",
    "asyncio",
]
dynamic = ["version"]
dependencies = [
    "strictyaml>=1.7,<2",
    "aiohttp>=3.14.3,<4",
    "sentry-sdk>=2.8,<3",
    "aiosmtplib>=5.1.1,<6",
    "jinja2>=3.1.6,<4",
    # zoneinfo's tz database, so timezones resolve on minimal/slim images
    # that don't ship the system tzdata.
    "tzdata>=2024.1",
    # per-run CPU/memory accounting (opt-in `monitorResources`; see
    # cronstable.resources). psutil gives a portable, process-tree-aware read of
    # a job's CPU time and resident memory on Linux, macOS and Windows alike --
    # asyncio's own subprocess reaping only surfaces the exit code. The feature
    # is off by default, but the import is unconditional so `cronstable --help`
    # and the type checker resolve it everywhere; it ships wheels for the
    # mainstream targets and builds from source elsewhere.
    "psutil>=5.9",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ptweezy/cronstable"
Documentation = "https://github.com/ptweezy/cronstable#readme"
Source = "https://github.com/ptweezy/cronstable"
Changelog = "https://github.com/ptweezy/cronstable/releases"
Issues = "https://github.com/ptweezy/cronstable/issues"
Container = "https://github.com/ptweezy/cronstable/pkgs/container/cronstable"

[project.scripts]
cronstable = "cronstable.__main__:main"

[project.optional-dependencies]
# Optional: use the official Kubernetes client for the `kubernetes` leadership
# backend. Entirely optional -- without it (or on an architecture where its
# grpc/protobuf wheels are unavailable) the backend auto-falls back to its
# hand-rolled apiserver REST transport over the core aiohttp dependency, so the
# core install stays zero-new-dep and architecture-portable. The etcd backend
# needs no extra: it always uses etcd's v3 gRPC-gateway JSON/HTTP API directly.
kubernetes = ["kubernetes>=27"]
# Optional: swap asyncio's event loop for uvloop's faster libuv-based one
# (cluster HTTP, web dashboard, Prometheus scrape). Best-effort at runtime --
# cronstable falls back to stock asyncio when it is absent -- so it stays off the
# core install to keep the zero-new-dep, architecture-portable baseline intact.
# Gated off Windows, which has no uvloop build (and needs the Proactor loop for
# subprocesses anyway); pip skips it there rather than failing to resolve.
speedups = [
    "uvloop>=0.19; sys_platform != 'win32'",
    # orjson accelerates the durable-state persistence and cluster-gossip JSON
    # paths (see cronstable._json, which falls back to the stdlib json when it is
    # absent). Like uvloop it is best-effort: it ships no wheels for some of
    # the leaner architectures we target (riscv64, armv6, musl ppc64le/s390x),
    # so it stays optional and the zero-new-dep, architecture-portable core
    # install runs on stock json without it. It does have Windows wheels, so
    # (unlike uvloop) it needs no platform marker.
    "orjson>=3.11.6",
]
# End-to-end encrypted push alerts (the `push` reporter; see cronstable.push).
# PyNaCl bundles libsodium (pure C, no Rust), ships abi3 wheels for every
# mainstream target incl. win-arm64, and source-builds with a plain C
# toolchain on the leaner arches. Optional so the zero-new-dep,
# architecture-portable core install holds; UNLIKE the speedups extras there
# is no silent runtime fallback: a config with a `push:` section refuses to
# start when this is absent (an alerting channel must fail closed, not
# self-disable). See config._validate_push_config.
push = ["pynacl>=1.6.2"]
# Post-quantum push sealing (the `xwing` suite; see cronstable.push): the
# `push` extra plus cryptography, whose HPKE module seals X-Wing (ML-KEM-768
# + X25519).  Two extras because the libraries reach different distances:
# PyNaCl covers every target above, so `push` can be the hard, start-refusing
# gate, while cryptography is Rust plus OpenSSL and publishes wheels for a
# subset.  The marker lists the targets that have one, so this extra always
# resolves; off the list it installs PyNaCl alone and the daemon refuses
# xwing pairings (fail-closed; x25519 push still seals).  Unmarked, pip would
# take the newest cryptography and fail building its sdist for want of Rust
# and OpenSSL headers.  Linux stops at x86_64 and aarch64, the arches with a
# wheel under BOTH libcs: cryptography publishes ppc64le and armv7l for
# manylinux but not musllinux, and a marker cannot see the libc.  Those two
# get xwing from the release binaries instead, whose lanes do know their libc
# (the `pq` matrix keys in .github/workflows/release.yml).
push-pq = [
    "pynacl>=1.6.2",
    "cryptography>=48; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# Zero-config LAN discovery (the opt-in `web.bonjour` mDNS advert; see
# cronstable.discovery). Same fail-closed contract: web.bonjour without this
# installed is a ConfigError, never a silent no-advert.
discovery = ["zeroconf>=0.149.16"]
dev = [
    # the cluster mTLS tests mint throwaway certs with it, and the X-Wing
    # sealing tests need its HPKE module (>=48). Same wheel allowlist as the
    # push-pq extra above; see requirements_dev.txt for what the tests do
    # where it resolves to nothing.
    "cryptography>=48; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    # The optional-extra deps the tests must really exercise (orjson, pynacl,
    # zeroconf); requirements_dev.txt documents why each is here.  Without
    # them a `pip install -e .[dev]` + `pytest` checkout runs the suite in
    # the importorskip blind spot that file warns about: the accelerated
    # JSON, push-sealing, and mDNS test arms all self-skip.  This list and
    # requirements_dev.txt are pinned equal by tests/test_dev_deps_parity.py.
    "orjson>=3.11.6; python_version < '3.15' and (platform_machine != 'ARM64' or sys_platform != 'win32')",
    "pynacl>=1.6.2",
    "zeroconf>=0.149.16",
    # drives a real Chromium for the client/daemon cron-engine differential;
    # requirements_dev.txt explains the marker and the separate browser step.
    "playwright; platform_machine != 'ARM64' or sys_platform != 'win32'",
    # security linter; bandit[toml] reads [tool.bandit] from pyproject.toml.
    "bandit[toml]",
    "mypy",
    "mypy-extensions",
    # validates docs/openapi.yaml (.github/scripts/check_openapi.py, tox -e openapi).
    "openapi-spec-validator",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "tox",
    # tox-uv routes tox's env creation + installs through uv (see tox.ini).
    "tox-uv",
]

[tool.setuptools]
# The kubernetes/etcd leadership backends talk to their store over plain HTTP
# via the core aiohttp dependency (no kubernetes/etcd3 client, no grpc), so
# they add no runtime dependency and need no optional extra -- which also keeps
# cronstable's wide architecture coverage intact.
packages = ["cronstable", "cronstable.web", "cronstable.backends"]

[tool.setuptools.package-data]
"cronstable.web" = ["*.html"]
# Third-party license notices ride inside every artifact (wheel, Docker,
# and the frozen binaries via the spec's collect_data_files), so the
# LGPL notice for the bundled python-zeroconf is never separated from
# the code it covers. Printed by `cronstable --third-party-licenses`.
"cronstable" = ["licenses/*.txt"]

[tool.setuptools_scm]
version_file = "cronstable/version.py"

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = [
    # Bugbear warnings
    "B",
    "B9",
    # mccabe complexity warnings
    "C",
    # Pycodestyle errors https://pycodestyle.pycqa.org/en/latest/intro.html#error-codes
    "E",
    # Pyflakes violations https://flake8.pycqa.org/en/latest/user/error-codes.html
    "F",
    # Pycodestyle warnings
    "W",
    # pyupgrade: only the typing-modernization codes (builtin generics, PEP
    # 604 unions, deprecated typing imports); the full UP set stays off
    "UP006",
    "UP007",
    "UP035",
    "I",  # <= import sorting
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.10"
# Type-check against the POSIX API surface (grp/pwd/os.setuid/...), which is
# where those calls actually run; the Windows-specific branches are guarded at
# runtime (sys.platform checks / getattr). CI runs mypy on Linux, so pinning
# this keeps local runs on any OS consistent.
#
# The gate that reads the Windows branches is the test suite, and until the
# per-OS coverage profiles below existed that claim was hollow: every Windows
# branch was pragma'd out of the measurement on the Windows rows too. It is
# now true, because `# pragma: no cover (windows)` code is measured there. A
# second `mypy --platform win32` pass would be the stronger check and is not
# wired yet; `cronstable.platform.apply_priority` reaches os.setpriority
# behind a plain bool (the `windows=` override its tests drive both arms
# with), which no sys.platform spelling can prune, so that pass currently
# needs a `type: ignore` the Linux pass considers unused.
platform = "linux"
no_implicit_optional = true
warn_no_return = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
# The optional-extra deps are imported behind try/except guards (orjson in
# cronstable._json, uvloop in cronstable.__main__, pynacl and cryptography
# in cronstable.push, zeroconf in cronstable.discovery, kubernetes in the
# leadership backend's official-client fast path), so a checkout without the
# extras installed must still type-check cleanly. cryptography ships py.typed,
# so where it IS installed (the dev env) mypy still checks it fully; this
# entry only covers the bare tox mypy env, exactly like nacl's.
module = [
    "orjson",
    "uvloop",
    "nacl",
    "nacl.*",
    "cryptography",
    "cryptography.*",
    "zeroconf",
    "zeroconf.*",
    "kubernetes",
    "kubernetes.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Core runtime deps that ship no py.typed marker (and whose stub packages we
# deliberately don't add): their surface types as Any, exactly as it always
# has. This table is the ONLY missing-import allowance; tox -e mypy runs
# WITHOUT a global --ignore-missing-imports, so a new unresolvable import
# fails the gate instead of silently typing as Any.
module = [
    "strictyaml",
    "strictyaml.*",
    "psutil",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A wedged await (the intermittent 3.12 test_dag_tools_full_flow hang) must
# dump every thread's stack and fail the run, not burn the 30 min CI job
# timeout and report "cancelled". Armed per test; no test comes near 300s.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true

[tool.coverage.run]
source = ["cronstable"]
branch = true
omit = ["cronstable/version.py"]

[tool.coverage.report]
show_missing = true
# Three pragma tokens, two profiles. A bare `# pragma: no cover` is hidden on
# every OS (defensive branches, unreachable raises, the etcd/kubernetes
# network glue). `# pragma: no cover (windows)` is hidden on POSIX and
# MEASURED on Windows; `# pragma: no cover (posix)` is the mirror. Without
# them the Windows cells scored the wrong file: the Windows code that runs
# there was excluded, and the POSIX code that cannot run there was counted
# and missed.
#
# Rule 2 is the only difference between the two profiles. coverage
# substitutes the environment variable when it reads this file, and tox.ini
# sets it from the `windows`/`posix` factor to name the platform whose
# branches CANNOT run in that env. The default (`windows`) is the historical
# POSIX-shaped measurement, so a bare `pytest --cov` or an IDE run reports
# what it always did.
#
# exclude_lines REPLACES coverage's defaults rather than appending to them
# (which is what `exclude_also` does, and the default catch-all pragma rule
# would then swallow the tagged pragmas before rule 2 ever saw them). So rule
# 1 is coverage's own DEFAULT_EXCLUDE[0] with a lookahead appended, and the
# last two entries are the copies of DEFAULT_EXCLUDE[1] and [2] this project
# still wants. Both OS rules accept the token anywhere after `cover`, so a
# site can keep the trailing prose that explains it.
# tests/test_coverage_profiles.py pins rule 1 against DEFAULT_EXCLUDE[0]
# verbatim, because that relationship is the point of rule 1; it pins the
# last two by what they exclude instead, since coverage rewords those two
# between patch releases and a verbatim pin would red every cell whose
# resolved coverage is a patch out of step with this one.
exclude_lines = [
    '#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(cover|COVER)(?!.*\((windows|posix)\))',
    '#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(cover|COVER).*\(${CRONSTABLE_COVERAGE_SKIP-windows}\)',
    '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
    'if (typing\.)?TYPE_CHECKING:',
]

[tool.bandit]
exclude_dirs = ["tests"]
# B104's only hits are the literal "0.0.0.0"/"::" strings in config.py's
# wildcard-listen match-sets (_WILDCARD_LISTEN_HOSTS and friends): data used to
# recognize a wildcard listen address, not a socket bind. The real listen host
# is user-configured and never a literal here, so B104 yields only false
# positives. Bandit still runs at medium+; every other check stays active.
skips = ["B104"]
