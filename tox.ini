[tox]
# tox-uv swaps tox's env creation and package/dependency installs from
# virtualenv+pip to uv: dramatically faster (parallel downloads, a shared global
# wheel cache) and behavior-identical for our envs. Declaring it in `requires`
# means a plain `tox` auto-provisions it, so a local `tox` run uses uv with no
# extra step; CI installs it explicitly alongside tox. Force the old path with
# `tox --runner virtualenv` if ever needed.
requires =
    tox-uv>=1
# Every interpreter row exists in a `windows` and a `posix` arm. The two
# differ only in which OS's branches the coverage gate measures (see
# [testenv] below); the `platform` key makes the arm that does not match the
# running OS skip, and a skip is a pass, so a bare `tox` measures the profile
# that matches the box it is on and CI runs one command on every runner.
envlist = py3{10,11,12,13,14,15}-{windows,posix}, lint, mypy, bandit, openapi

[testenv:lint]
description = lint source code
# ruff only reads the source tree, so don't build/install the package (which
# would impose the project's requires-python on the lint interpreter).
skip_install = true
deps =
    ruff
commands =
    ruff check cronstable
    ruff format --check cronstable


[testenv:mypy]
description = static type-check the source with mypy
# Unlike lint/bandit this env DOES install the package: mypy resolves the
# runtime deps (aiohttp, jinja2, sentry-sdk, ...) for real instead of running
# under a global --ignore-missing-imports, which silently typed every
# third-party surface as Any and defeated the curated per-module override
# table in pyproject.toml. The deps that legitimately cannot resolve
# (optional extras, untyped libraries) are enumerated there.
deps =
    mypy
    mypy-extensions
commands =
    mypy -p cronstable


[testenv:bandit]
description = security-lint the source with bandit
# bandit reads the source tree; like lint, skip installing the package so
# its interpreter isn't constrained by the project's requires-python. The
# severity floor and config (tests excluded) match the removed pre-commit hook.
skip_install = true
deps =
    bandit[toml]
commands =
    bandit -c pyproject.toml -r cronstable --severity-level=medium


[testenv:openapi]
description = validate the OpenAPI spec (docs/openapi.yaml)
# validates only the spec file; no need to build/install the package.
skip_install = true
deps =
    openapi-spec-validator
commands =
    python .github/scripts/check_openapi.py


[testenv]
deps = -rrequirements_dev.txt
# tox forwards only a small default allowlist into the env it builds, so a var
# exported by the caller reaches pytest just by being named here. Neither of
# these is set for a normal run; both are opt-in levers, and naming them costs
# nothing when they are unset.
#
#   PYTHONWARNINGS: CI sets this on the prerelease-Python cells only (see the
#     `tox` job in .github/workflows/release.yml) so a new interpreter's
#     deprecations are visible, including the ones raised while modules import,
#     which happens before pytest installs its own per-test filters. The gating
#     cells leave it unset and so gain no new way to go red.
#
#   PYTHONWARNDEFAULTENCODING: the manual encoding audit, for the 3.15 UTF-8
#     default (PEP 686). Setting it to 1 makes the interpreter emit an
#     EncodingWarning at every open()/read_text()/write_text() that relies on
#     the default encoding, which is the locale's through 3.14 and UTF-8 from
#     3.15, i.e. exactly the calls whose behavior moves:
#
#         PYTHONWARNDEFAULTENCODING=1 tox -e py
#
#     Run it after touching file I/O and check that no hit points into
#     cronstable/ (as of the 3.15 audit there are none; the ~130 remaining hits
#     are all test fixtures writing ASCII, which is why CI does NOT set this:
#     they would bury the DeprecationWarning signal above).
passenv =
    PYTHONWARNDEFAULTENCODING
    PYTHONWARNINGS
# tox has no OS token in its substitutions, so the per-OS split has to be a
# factor. `platform` is matched against sys.platform with re.FULLMATCH, not
# re.match: the POSIX arm therefore has to be `(?!win32).*` and NOT the bare
# lookahead `(?!win32)`, which is zero-width and so can only fullmatch the
# empty string. The bare form matches no platform at all, which means the
# POSIX arm skips everywhere and the suite stops running on Linux.
# A skipped env is a pass and creates no venv, which is what makes one
# invocation correct on every runner, but only as long as some selected env
# does match: measured on tox 4.58.0, an invocation whose every env skips
# prints `evaluation failed :(` and exits 1. So `tox -e py-windows,py-posix`
# passes on both OSes, `tox -e py-posix` alone fails on Windows, and the bare
# regex above would have failed the Linux cells rather than passed them
# hollowly.
platform =
    windows: win32
    posix: (?!win32).*
setenv =
    PYTHONPATH = {toxinidir}
    # pytest-cov collects in coverage's parallel mode (so cronstable's spawned
    # subprocesses are measured), writing `.coverage.<host>.<pid>.*` files and
    # then combine()-ing every `.coverage.*` it finds in the data dir. That dir
    # defaults to {toxinidir}, shared by all envs -- so under `tox -p` one env's
    # combine races another's: it tries to os.remove() a data file the other
    # env's live process still holds open. On Windows that's a hard WinError 32,
    # and pytest dies with an INTERNALERROR (exit 3) in whichever env loses the
    # race. Pin each env's coverage data under its own {envdir} so parallel runs
    # never share (or delete) each other's files. Serial runs and CI (one env
    # per runner) are unaffected.
    COVERAGE_FILE = {envdir}/.coverage
    # Which coverage profile pyproject.toml's exclude_lines selects. Name the
    # platform whose branches CANNOT run here, so they leave the denominator:
    # the `windows` arm skips the POSIX code, and vice versa. Easy to wire
    # backwards and nearly silent when you do (the number moves a few tenths
    # and the gate still passes), so tests/test_coverage_profiles.py asserts
    # the inversion. The unconditional line is the historical POSIX-shaped
    # profile, which is what an unfactored `tox -e py312` gets.
    CRONSTABLE_COVERAGE_SKIP = windows
    windows: CRONSTABLE_COVERAGE_SKIP = posix
    posix: CRONSTABLE_COVERAGE_SKIP = windows
    # The coverage floor, per arm. Deliberately the same number on both in
    # this change: the profiles move what each cell measures, so the honest
    # per-OS floors are the ones read off a real CI run (win-arm64 has no
    # cryptography, orjson or playwright, and Chromium is installed on one
    # Linux cell only, so no Windows cell runs the web E2E suites and no
    # local number is that cell's). Ratchet each arm on its own once those
    # numbers exist; never down without a recorded reason.
    CRONSTABLE_COV_FLOOR = 92
    windows: CRONSTABLE_COV_FLOOR = 92
    posix: CRONSTABLE_COV_FLOOR = 92

# --cov-fail-under gates the build on coverage: a change that drops a tested
# path to zero coverage fails CI instead of merging green. Only the floor is
# factor-conditional, through {env:}; the command itself stays unconditional
# on purpose. A fully factored `commands` resolves to nothing at all in an
# unfactored env, so `tox -e py`, `tox -e py312` and `tox -e py314` (the
# documented local invocations) would build a venv, run zero tests and print
# `congratulations`.
# --cov-report=xml writes coverage.xml for the CI Codecov upload; Codecov merges
# every matrix cell's report, so the published number reflects POSIX + Windows
# combined rather than any single row. Expect it to read LOWER than either
# gated profile from here on, and not because anything regressed: the two
# profiles no longer measure the same line set, so a `(windows)` line is
# excluded from every POSIX report and included in every Windows one, and the
# merged view is a union across two different exclusion sets in which such a
# line counts as missed unless a Windows test actually hits it. Several do not
# (`_taskkill_tree`'s failure arms, the ctypes console callback,
# `WindowsKeyReader._pump`). The badge moving down once, on the commit that
# introduces the profiles, is that union and nothing else. It cannot red a
# build: .github/codecov.yml sets `informational: true` on both the project
# and the patch status, so the tox gate above stays the only pass/fail.
commands = pytest --color=yes -vv --cov=cronstable --cov-report=term-missing --cov-report=xml --cov-fail-under={env:CRONSTABLE_COV_FLOOR}
