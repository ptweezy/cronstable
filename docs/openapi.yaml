openapi: 3.0.3

# ---------------------------------------------------------------------------
# cronstable HTTP control API.
#
# This is the machine-readable contract for the aiohttp control API cronstable
# serves when a `web:` section is configured (see the Web Dashboard and the
# HTTP-API wiki page). It is the source a generated client (e.g. the iOS app,
# via swift-openapi-generator) is built from. Three checks keep it honest:
# .github/scripts/check_openapi.py (structure: schema validity, refs,
# path/parameter agreement, duplicate path keys), tests/test_openapi.py
# (drift: every path+method here must match cronstable.cron.WEB_ROUTES, the
# table the aiohttp app is built from, in both directions), and
# tests/test_openapi_payload_keys.py (fields: every key the payload builders
# emit, nested objects included, is a declared property of its schema).
#
# It documents the *shape* of every endpoint: its path, method, parameters,
# auth, and the fields of each response. A newer daemon's extra key or value
# never breaks a generated client: no response object sets
# `additionalProperties: false`, and a response vocabulary that can grow is
# either an `anyOf` of its known values and a bare string, or a plain string
# whose description lists the known values. A generated client discards a
# whole response when one value fails to decode, so a type here is never
# stricter than every value the builder can emit: `number` for anything that
# can carry a fraction, and `format: date-time` only where the value is
# always an ISO 8601 string. Payloads whose shape the writer chooses (state
# records, fan-out items, cursor values) stay untyped. The wiki HTTP-API page
# holds the prose reference for the routes it covers.
# ---------------------------------------------------------------------------

info:
  title: cronstable HTTP control API
  description: >-
    The optional REST + SSE control API a cronstable daemon serves when a
    `web:` section is configured. Every route is documented in prose on the
    HTTP-API wiki page; this spec is the generated-client contract.
  version: "1.2.x"
  contact:
    name: cronstable
    url: https://github.com/ptweezy/cronstable
  license:
    name: MIT
    url: https://github.com/ptweezy/cronstable/blob/main/LICENSE

servers:
  - url: "{scheme}://{host}:{port}"
    description: >-
      A self-hosted cronstable daemon. There is no vendor endpoint: the
      operator supplies the address of their own `web.listen` listener (LAN,
      Tailscale, or a reverse proxy). `unix://` listeners are not addressable
      here.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: 127.0.0.1
      port:
        default: "8080"

# Bearer-token auth applies to every route when `web.authToken` is configured;
# an unauthenticated daemon ignores it. The `.ics` calendar routes also
# accept the same token as a `?token=` query parameter (declared per-operation),
# because calendar clients cannot send a bearer header.
#
# `web.anonymousScopes` is a third shape: a daemon that configures tokens and
# lists scopes there grants those scopes to requests presenting no credential,
# so a public read-only board answers a tokenless GET. Only `view` may be
# granted that way (the config schema refuses the rest), so every mutating
# route stays token-gated, and `GET /push/devices` is excluded besides.
# A request that presents a credential is evaluated exactly as it is without
# the setting, so a wrong token still gets 401 rather than the anonymous grant.
security:
  - bearerAuth: []
  - {} # an unauthenticated daemon (no web.authToken) accepts calls with no token

tags:
  - name: meta
    description: Version, identity, and the batched fleet summary.
  - name: jobs
    description: Job status, history, resources, and run/cancel/pause control.
  - name: dags
    description: DAG introspection and control (orchestration).
  - name: schedule
    description: Schedule intelligence (preview, pressure, duplicates, why).
  - name: cluster
    description: Cluster, fleet, and node views.
  - name: calendar
    description: iCalendar feeds.
  - name: badges
    description: SVG status badges to embed in a README, a wiki, or a dashboard.
  - name: state
    description: >-
      Durable-state inspector: store inventory, documents with KV values
      redacted, and full record bodies (archived output excluded).
  - name: push
    description: End-to-end encrypted push alerts and device pairing.
  - name: daemon
    description: Daemon lifecycle (the authenticated graceful stop).
  - name: metrics
    description: Prometheus exposition.

paths:
  /version:
    get:
      tags: [meta]
      summary: Daemon version
      operationId: getVersion
      responses:
        "200":
          description: The cronstable version as plain text.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /job-set-id:
    get:
      tags: [meta]
      summary: Job-set identity
      operationId: getJobSetId
      description: >-
        The fingerprint of the configured job set. Returns plain text, or a
        JSON object when the `Accept` header lists `application/json` among
        its media ranges (compound headers and `;q=` parameters included;
        the `*/*` and `application/*` wildcards keep the text default).
      responses:
        "200":
          description: The job-set id.
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  job_set_id: { type: string }
                  jobs: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /status:
    get:
      tags: [jobs]
      summary: Per-job status
      operationId: getStatus
      description: >-
        Every job's status (running / disabled / scheduled). Returns one line
        per job as plain text, or a JSON array when the `Accept` header lists
        `application/json` among its media ranges (compound headers and `;q=`
        parameters included; wildcards keep the text default).
      responses:
        "200":
          description: Job status rows.
          content:
            text/plain:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /summary:
    get:
      tags: [meta]
      summary: Batched fleet overview
      operationId: getSummary
      description: >-
        Everything a widget or status tile needs in one call: fleet job counts,
        the soonest upcoming fire, this node's identity, and its cluster role.
      responses:
        "200":
          description: The fleet summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs:
    get:
      tags: [jobs]
      summary: List all jobs
      operationId: listJobs
      description: >-
        Every job with its schedule, running state, next fire, last run, and a
        compact recent-outcome tail. Supports `ETag` / `If-None-Match` (304).
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The job list.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Job" }
        "304": { description: Not modified (matching `If-None-Match`). }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs/{name}:
    get:
      tags: [jobs]
      summary: One job's detail
      operationId: getJob
      description: One job, in the same shape as an entry of `GET /jobs`.
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: The job detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{name}/runs:
    get:
      tags: [jobs]
      summary: Job run history + stats
      operationId: getJobRuns
      parameters:
        - $ref: "#/components/parameters/JobName"
        - name: limit
          in: query
          description: >-
            Max runs to return, newest kept (clamped to the retained
            history; default serves the whole retained window). `stats`
            always covers the whole retained window.
          schema: { type: integer }
      responses:
        "200":
          description: Retained run history and aggregate statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRuns" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /activity:
    get:
      tags: [jobs]
      summary: Batched recent run outcomes for every job
      operationId: getActivity
      description: >-
        The activity heatmap's feed: the same records as
        `GET /jobs/{name}/runs`, for every job at once, without the per-job
        fan-out. `jobs` maps each job name to its retained runs, oldest
        first, each reduced to the three plotted fields; a job that has
        never run maps to an empty array. The response carries every job
        unless `jobs` caps it. Supports `ETag` / `If-None-Match` (304).
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: limit
          in: query
          description: >-
            Max runs per job, newest kept (clamped to the retained
            history; default serves the whole retained window).
          schema: { type: integer }
        - name: jobs
          in: query
          description: >-
            Max jobs to return (at least 1; a lower value counts as 1).
            The default returns every job. A capped response keeps the
            first `jobs` jobs in configuration order, the order `GET /jobs`
            lists them, unless `sort` selects another order.
          schema: { type: integer }
        - name: sort
          in: query
          description: >-
            Sort order applied before the `jobs` cap. `name` selects the
            first `jobs` job names in ascending code point order. Ignored
            when `jobs` is not set.
          schema: { type: string, enum: [name] }
      responses:
        "200":
          description: Recent run outcomes, per job.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: object
                    additionalProperties:
                      type: array
                      items: { $ref: "#/components/schemas/ActivityRun" }
        "304": { description: Not modified (matching `If-None-Match`). }
        "400":
          description: An unknown `sort` value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs/{name}/trends:
    get:
      tags: [jobs]
      summary: Job stats per time window
      operationId: getJobTrends
      description: The `GET /jobs/{name}/runs` stats object, per time window, over the durable ledger.
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: Windowed trend statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  source:
                    # Open enum (enum + bare string under anyOf, like
                    # JobRun.outcome): a newer daemon may compute trends
                    # from a source this list has not heard of yet, and
                    # clients must keep decoding.
                    description: >-
                      Where the trend windows were computed from. Known
                      values: durable, memory. The list is open: a newer
                      daemon may send a value that is not on it, and
                      clients must keep decoding and render the unknown
                      value neutrally.
                    anyOf:
                      - type: string
                        enum: [durable, memory]
                      - type: string
                  generated_at: { type: string, format: date-time }
                  windows:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/RunStats" }
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{name}/resources:
    get:
      tags: [jobs]
      summary: Job CPU/RSS time series
      operationId: getJobResources
      parameters:
        - $ref: "#/components/parameters/JobName"
        - name: limit
          in: query
          description: Number of recent monitored or capped runs to include (clamped).
          schema: { type: integer }
        - name: runs
          in: query
          description: Legacy alias of `limit` (read when `limit` is absent).
          schema: { type: integer }
      responses:
        "200":
          description: Chart-grade CPU/RSS series for the job.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  monitored: { type: boolean }
                  interval: { type: number, nullable: true }
                  limits:
                    allOf: [{ $ref: "#/components/schemas/ResourceLimits" }]
                    nullable: true
                    description: The job's `resourceLimits`, or null.
                  live:
                    type: array
                    description: >-
                      One entry per running instance that is monitored and
                      has a sample or a series point.
                    items: { $ref: "#/components/schemas/LiveRunResources" }
                  runs:
                    type: array
                    description: >-
                      Recent finished runs, oldest first, that were monitored
                      or capped (the `JobRun` shape with its chart series).
                      `resources` is null for a capped run without
                      monitoring.
                    items: { $ref: "#/components/schemas/JobRun" }
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{name}/logs:
    get:
      tags: [jobs]
      summary: Live job output (SSE)
      operationId: streamJobLogs
      description: >-
        A Server-Sent Events stream of the job's captured output: buffered
        lines first, then live lines, then an `end` event. See the HTTP-API
        wiki for the event grammar.
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: An SSE stream (`text/event-stream`).
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{name}/start:
    post:
      tags: [jobs]
      summary: Run a job now
      operationId: startJob
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: Launched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: string }
                required: [started]
        "202":
          description: Accepted into a resource pool queue.
          content:
            application/json:
              schema:
                type: object
                required: [queued, queueId, pool]
                properties:
                  queued: { type: string }
                  queueId: { type: string }
                  pool: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            The job is disabled; concurrencyPolicy Forbid starts nothing
            because an instance is still running, or, under
            concurrencyScope cluster, because another node holds the job's
            slot; or its resource pool refuses the run: the pool queue is
            full, the pool is draining before a capacity change, or pool
            state requires reliable exclusive locks (JSON error envelope
            with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Pool state is unavailable for a job in a resource pool: the
            configured store has not started, a store operation fails with
            an I/O error or takes longer than 5 seconds, or a pool document
            cannot be read. Also answered when the store that holds a
            concurrencyScope cluster job's slot does not answer within 10
            seconds and onStoreUnavailable is fail-closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /jobs/{name}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a running job
      operationId: cancelJob
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/JobName"
      responses:
        "200":
          description: All running instances cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: string }
                  instances: { type: integer }
                required: [cancelled, instances]
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The job is not running (JSON error envelope).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /jobs/{name}/pause:
    post:
      tags: [jobs]
      summary: Pause a job's scheduled fires
      operationId: pauseJob
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/JobName"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PauseRequest" }
      responses:
        "200":
          description: The active pause window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused: { $ref: "#/components/schemas/Pause" }
        "400":
          description: A malformed or out-of-range pause request.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /jobs/{name}/resume:
    post:
      tags: [jobs]
      summary: End a job's pause
      operationId: resumeJob
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/JobName"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                by: { type: string }
      responses:
        "200":
          description: Pause cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused:
                    type: object
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dags:
    get:
      tags: [dags]
      summary: List DAGs
      operationId: listDags
      description: >-
        Supports `ETag` / `If-None-Match` (304) and gzip, like `GET /jobs`.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Configured DAGs and their tasks.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dag" }
        "304": { description: Not modified (matching `If-None-Match`). }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /dags/{name}/runs:
    get:
      tags: [dags]
      summary: List a DAG's runs
      operationId: listDagRuns
      parameters:
        - $ref: "#/components/parameters/DagName"
        - name: limit
          in: query
          description: Max runs to return (default 50, max 500).
          schema: { type: integer }
      responses:
        "200":
          description: Recent dag_runs (newest first).
          content:
            application/json:
              schema:
                type: object
                properties:
                  dag: { type: string }
                  name:
                    type: string
                    description: Same as `dag` (the generic subject key).
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/DagRunSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            No such DAG, or no `state:` store is configured (run documents
            only exist in a durable store). The `error` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dags/{name}/runs/{run_key}:
    get:
      tags: [dags]
      summary: One DAG run's document
      operationId: getDagRun
      parameters:
        - $ref: "#/components/parameters/DagName"
        - $ref: "#/components/parameters/RunKey"
      responses:
        "200":
          description: The full durable run document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DagRunDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dags/{name}/runs/{run_key}/xcom:
    get:
      tags: [dags]
      summary: A DAG run's XCom outputs
      operationId: getDagRunXcom
      parameters:
        - $ref: "#/components/parameters/DagName"
        - $ref: "#/components/parameters/RunKey"
      responses:
        "200":
          description: The XCom entries the run's tasks published.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DagXcomPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >-
            No such DAG or run, or no `state:` store is configured (XCom only
            exists in a durable store). The `error` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dags/{name}/runs/{run_key}/tasks/{taskkey}/logs:
    get:
      tags: [dags]
      summary: Live DAG task output (SSE)
      operationId: streamDagTaskLogs
      parameters:
        - $ref: "#/components/parameters/DagName"
        - $ref: "#/components/parameters/RunKey"
        - $ref: "#/components/parameters/TaskKey"
      responses:
        "200":
          description: An SSE stream (`text/event-stream`) of a running task instance.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /dags/{name}/trigger:
    post:
      tags: [dags]
      summary: Trigger a manual DAG run
      operationId: triggerDag
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/DagName"
      responses:
        "200":
          description: The created run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dag: { type: string }
                  name:
                    type: string
                    description: Same as `dag` (the generic subject key).
                  runKey: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: The run could not be durably recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dags/{name}/backfill:
    post:
      tags: [dags]
      summary: Backfill a DAG across a range
      operationId: backfillDag
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/DagName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
              required: [from, to]
      responses:
        "200":
          description: The backfill result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  created:
                    type: integer
                    description: >-
                      The number of scheduled instants in the range (at most
                      100) that have a run in the store when the request
                      returns, including runs that already existed before the
                      request.
        "400":
          description: >-
            A bad range or an unknown/unscheduled DAG (every refused backfill
            is 400 with a `reason`; this route never returns 404). While the
            configured state store has not started, these requests answer
            503 instead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: >-
            Backfill state is unavailable
            (`backfill state is unavailable`): the configured store has not
            started, a store operation fails or times out, or a run document
            cannot be read. Runs written before the fault stay, and the same
            request creates the rest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dags/{name}/runs/{run_key}/tasks/{taskkey}/decision:
    post:
      tags: [dags]
      summary: Approve or reject an approval gate
      operationId: decideDagTask
      x-required-scope: approve
      parameters:
        - $ref: "#/components/parameters/DagName"
        - $ref: "#/components/parameters/RunKey"
        - $ref: "#/components/parameters/TaskKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [approve, reject] }
                by: { type: string }
              required: [decision]
      responses:
        "200":
          description: The decision was recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DagDecision" }
        "400":
          description: A bad decision value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: The task is not awaiting a decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cluster:
    get:
      tags: [cluster]
      summary: This node's cluster view
      operationId: getCluster
      responses:
        "200":
          description: "The cluster/leadership view (`enabled: false` when unclustered)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /fleet:
    get:
      tags: [cluster]
      summary: Fleet-wide per-node job view
      operationId: getFleet
      description: >-
        Supports `ETag` / `If-None-Match` (304) and gzip, like `GET /jobs`.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Each node's per-job run summaries.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FleetView" }
        "304": { description: Not modified (matching `If-None-Match`). }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /node:
    get:
      tags: [cluster]
      summary: This node's live CPU/memory
      operationId: getNode
      responses:
        "200":
          description: The node's identity and live resources.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeView" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /node/history:
    get:
      tags: [cluster]
      summary: This node's CPU/memory history
      operationId: getNodeHistory
      responses:
        "200":
          description: Oldest-first `[t, cpu%, mem%]` points.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_name: { type: string }
                  enabled: { type: boolean }
                  interval: { type: number, nullable: true }
                  points:
                    type: array
                    items:
                      type: array
                      items: { type: number }
                additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schedule/preview:
    get:
      tags: [schedule]
      summary: Decode and lint one cron expression
      operationId: schedulePreview
      parameters:
        - name: expr
          in: query
          required: true
          schema: { type: string }
        - name: tz
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: Number of fire instants to preview (clamped).
          schema: { type: integer }
        - name: count
          in: query
          description: Legacy alias of `limit` (read when `limit` is absent).
          schema: { type: integer }
        - name: seed
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The decoded, described, previewed, and linted expression.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: A missing `expr` or unknown `tz`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schedule/pressure:
    get:
      tags: [schedule]
      summary: Forward-looking collision heatmap
      operationId: schedulePressure
      parameters:
        - name: hours
          in: query
          schema: { type: integer }
        - name: tz
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The fleet's fire density over the window.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: An unknown `tz`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schedule/duplicates:
    get:
      tags: [schedule]
      summary: Jobs whose schedules coincide
      operationId: scheduleDuplicates
      responses:
        "200":
          description: Groups of jobs firing on identical instants.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schedule/suggest:
    get:
      tags: [schedule]
      summary: Suggest the least-loaded slot
      operationId: scheduleSuggest
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [hourly, daily] }
        - name: tz
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The winning slot and alternatives.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: A bad `period` or unknown `tz`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /schedule/why:
    get:
      tags: [schedule]
      summary: Explain why a job did/didn't fire at an instant
      operationId: scheduleWhy
      parameters:
        - name: job
          in: query
          required: true
          schema: { type: string }
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A field-by-field match explanation.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: A missing `job`/`at` or unparseable `at`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /calendar.ics:
    get:
      tags: [calendar]
      summary: Fleet-wide iCalendar feed
      operationId: getCalendar
      security:
        - bearerAuth: []
        - icsToken: []
        - {}
      parameters:
        - name: days
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          description: Max fire entries per job (clamped).
          schema: { type: integer }
        - name: per_job
          in: query
          description: Legacy alias of `limit` (read when `limit` is absent).
          schema: { type: integer }
        - $ref: "#/components/parameters/IcsToken"
      responses:
        "200":
          description: An RFC 5545 calendar feed.
          content:
            text/calendar:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs/{name}/calendar.ics:
    get:
      tags: [calendar]
      summary: One job's iCalendar feed
      operationId: getJobCalendar
      security:
        - bearerAuth: []
        - icsToken: []
        - {}
      parameters:
        - $ref: "#/components/parameters/JobName"
        - name: days
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          description: Max fire entries per job (clamped).
          schema: { type: integer }
        - name: per_job
          in: query
          description: Legacy alias of `limit` (read when `limit` is absent).
          schema: { type: integer }
        - $ref: "#/components/parameters/IcsToken"
      responses:
        "200":
          description: An RFC 5545 calendar feed for one job.
          content:
            text/calendar:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /badge.svg:
    get:
      tags: [badges]
      summary: The fleet's status badge
      operationId: getFleetBadge
      description: >-
        An SVG badge for the whole job set, such as `cronstable | 2 failing`.
        The message counts the jobs in the most urgent state among
        `failing`, `overdue`, and `passing`, in that order. It shows
        `no status` when no job is in those three states, and `no jobs` when
        no jobs are configured. The count reads the jobs as the serving node
        sees them, not the cluster-wide `/fleet` view. Registered unless
        `web.badges: false`. With `web.badges.public: true`, exempt from
        the bearer token and loadable by pages on any origin. Supports
        `ETag` / `If-None-Match` (304).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/BadgeLabel"
        - $ref: "#/components/parameters/BadgeStyle"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The badge image.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Security-Policy:
              $ref: "#/components/headers/BadgeContentSecurityPolicy"
            X-Frame-Options:
              $ref: "#/components/headers/BadgeFrameOptions"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BadgeResourcePolicy"
          content:
            image/svg+xml:
              schema: { type: string }
        "304":
          description: Not modified (matching `If-None-Match`).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Security-Policy:
              $ref: "#/components/headers/BadgeContentSecurityPolicy"
            X-Frame-Options:
              $ref: "#/components/headers/BadgeFrameOptions"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BadgeResourcePolicy"
        "400":
          description: A blank or overlong `label`, one with a control character or line break, or an unknown `style`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs/{name}/badge.svg:
    get:
      tags: [badges]
      summary: One job's status badge
      operationId: getJobBadge
      description: >-
        An SVG badge that shows the job's name beside its verdict: `passing`,
        `failing`, `overdue` (an SLA check is in breach), `paused`,
        `disabled`, `cancelled`, `unknown`, `running` (a run is in progress
        and the daemon has no earlier run of the job on record), or
        `pending` (the daemon has no record of a run of the job). Once the
        job has a recorded run, an in-progress run or a run skipped by a
        pause keeps the previous run's verdict. The verdict reads the runs
        that the serving node has on record. Registered unless
        `web.badges: false`. With `web.badges.public: true`, exempt from
        the bearer token and loadable by pages on any origin. Supports
        `ETag` / `If-None-Match` (304).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/JobName"
        - $ref: "#/components/parameters/BadgeLabel"
        - $ref: "#/components/parameters/BadgeStyle"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The badge image.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Security-Policy:
              $ref: "#/components/headers/BadgeContentSecurityPolicy"
            X-Frame-Options:
              $ref: "#/components/headers/BadgeFrameOptions"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BadgeResourcePolicy"
          content:
            image/svg+xml:
              schema: { type: string }
        "304":
          description: Not modified (matching `If-None-Match`).
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Content-Security-Policy:
              $ref: "#/components/headers/BadgeContentSecurityPolicy"
            X-Frame-Options:
              $ref: "#/components/headers/BadgeFrameOptions"
            Cross-Origin-Resource-Policy:
              $ref: "#/components/headers/BadgeResourcePolicy"
        "400":
          description: A blank or overlong `label`, one with a control character or line break, or an unknown `style`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /state:
    get:
      tags: [state]
      summary: Durable-state health + inventory (metadata only)
      operationId: getState
      responses:
        "200":
          description: "Store health and topology (`enabled: false` when stateless)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateInventory" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /state/documents:
    get:
      tags: [state]
      summary: State documents (KV values redacted)
      operationId: getStateDocuments
      parameters:
        - name: ns
          in: query
          required: true
          description: >-
            The namespace to inspect. Must start with `kv/`, `cursor/`, or
            `idem/`; anything else (or an absent `ns`) is 400.
          schema: { type: string }
      responses:
        "200":
          description: >-
            `{namespace, documents}`; KV values are redacted to a
            `valueSize`/`valueType` summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateDocumentsPage" }
        "400":
          description: "`ns` missing or not a `kv/`/`cursor/`/`idem/` namespace."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No `state:` store is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /state/records:
    get:
      tags: [state]
      summary: State records (full bodies)
      operationId: getStateRecords
      parameters:
        - name: stream
          in: query
          required: true
          description: The stream to inspect; an absent or empty value is 400.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Newest records returned, clamped to 1-500.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: >-
            `{stream, records}`, each record its full stored body. A `runs/`
            record carries what `GET /jobs/{name}/runs` and
            `GET /jobs/{name}/resources` already serve under `view`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateRecordsPage" }
        "400":
          description: "`stream` missing or empty."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            A `logs/` stream, or `logs` itself. Archived output is raw job
            output, which this route never returns.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No `state:` store is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /whoami:
    get:
      tags: [meta]
      summary: Describe the presented bearer token
      operationId: getWhoami
      description: >-
        What the caller may do, so a client can draw the right controls
        (and the dashboard can warn when its pairing QR would hand a phone
        the all-scopes token). Branch on `allScopes` rather than on
        `authenticated`: an unauthenticated caller is unrestricted on a
        daemon with no token configured (no auth middleware, `allScopes`
        true) and restricted under a `web.anonymousScopes` grant
        (`label: "anonymous"`, `allScopes` false). See the `WhoAmI` schema
        for all three shapes. Every shape carries `pairLinkBase`, the base
        URL of the pairing QR's deep link, and `sealableSuites`, the
        suites this daemon can seal push alerts under. Every shape also
        carries `instance`, which identifies the daemon. `listeners`, the
        daemon's bound TCP listeners, is in every shape except the
        `web.anonymousScopes` one. `badges` says whether the daemon serves
        the status badges, and whether they're public.
      responses:
        "200":
          description: The matched token's identity.
          headers:
            Cronstable-Instance:
              $ref: "#/components/headers/CronstableInstance"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /push/devices:
    get:
      tags: [push]
      summary: List paired push devices
      operationId: getPushDevices
      description: >-
        Every device paired for end-to-end encrypted push alerts. Push
        tokens are redacted to their trailing characters; public keys are
        returned whole. 404 until a `push:` section is configured.
        Requires a bearer token even where `web.anonymousScopes` grants
        `view`: the registry names paired devices, so it is the one
        view-scoped route excluded from anonymous access, and answers 403
        to a credential-less caller.
      responses:
        "200":
          description: "`{devices}`, sorted by pairing time."
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/PushDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No `push:` section is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The device registry's store is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [push]
      summary: Pair a device
      operationId: pairPushDevice
      x-required-scope: control
      description: >-
        Register a device (public key, its sealing suite, and platform push
        token) for encrypted alerts. Pairing is keyed on the public key: the same key
        pairing again updates its record in place (push tokens rotate,
        phones get renamed) and keeps its id and createdAt, so revocation
        references stay stable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                platform: { type: string, maxLength: 32 }
                publicKey:
                  type: string
                  description: >-
                    The device public key, base64. Its length must match
                    the suite: 32 bytes for `x25519`, 1216 for `xwing`.
                suite:
                  type: string
                  description: >-
                    Sealing suite the key belongs to. Optional; omitted
                    means `x25519`. Known values: `x25519`
                    (libsodium sealed box), `xwing` (X-Wing, ML-KEM-768 +
                    X25519, sealed with HPKE). The daemon refuses a suite
                    its install cannot seal to at pairing rather than
                    storing a record; `GET /whoami` lists the sealable set
                    as `sealableSuites`.
                  default: x25519
                pushToken: { type: string, maxLength: 512 }
              required: [name, platform, publicKey, pushToken]
      responses:
        "201":
          description: "`{device, created: true}`: a new pairing."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "200":
          description: >-
            `{device, created: false}`: an existing public key re-paired.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: >-
            Malformed JSON body, or a field missing, over-long, or not a
            valid base64 key of the length its suite requires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No `push:` section is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The device registry's store is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /push/devices/{id}:
    delete:
      tags: [push]
      summary: Revoke a paired device
      operationId: revokePushDevice
      x-required-scope: control
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: "`{revoked: id}`."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No `push:` section, or no device with this id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The device registry's store is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /push/devices/{id}/test:
    post:
      tags: [push]
      summary: Send a test alert to one device
      operationId: testPushDevice
      x-required-scope: control
      description: >-
        Seals a test payload to the device, posts it to the configured
        relay, and returns the outcome, so delivery is debuggable end
        to end from the dashboard.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: "`{device, status, error: null}`: the relay accepted it."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "502":
          description: >-
            `{device, status, error}`: sealing failed or the relay refused
            or was unreachable. Includes `device` and `status` alongside the
            standard `error` field so a `test` caller can see which device
            and relay status caused the failure.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    additionalProperties: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No `push:` section, or no device with this id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The device registry's store is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /shutdown:
    post:
      tags: [daemon]
      summary: Gracefully stop this daemon
      operationId: shutdownDaemon
      x-required-scope: control
      description: >-
        Starts the same graceful drain as Ctrl-C or SIGTERM: stops
        scheduling new runs, waits for running jobs to finish, stops the web
        server, and exits. Useful for deployments without an interactive
        console or SIGTERM support, such as service wrappers, supervisors,
        and headless Windows hosts. Always refused unless the request is
        bearer-token authenticated, even on a deployment that leaves every
        other route open: an unauthenticated listener must not hand every
        process that can reach it a stop switch. In a cluster this stops
        only the node addressed.
      responses:
        "200":
          description: "`{shuttingDown: true}`: the drain has begun."
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            No bearer token authenticated this request (including the case
            where the listener has no tokens configured at all).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /metrics:
    get:
      tags: [metrics]
      summary: Prometheus exposition
      operationId: getMetrics
      description: >-
        The Prometheus text exposition. Omitted when `web.metrics: false`;
        exempt from the bearer token when `web.metrics.public: true`.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: >-
            The metrics exposition: the classic text format by default, or
            OpenMetrics when the `Accept` header names
            `application/openmetrics-text`.
          content:
            text/plain:
              schema: { type: string }
            application/openmetrics-text:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /mcp:
    description: >-
      The MCP (Model Context Protocol) endpoint, registered only when
      `mcp.enabled` is set. The JSON-RPC 2.0 protocol it speaks (Streamable
      HTTP transport, message set, toolsets) is documented on the MCP wiki
      page, not re-typed here; this entry pins the surface and its auth. Every
      method requires the `view` scope from a scoped token, and each tool
      then requires the scope of the REST route it mirrors (`control` for
      the mutating tools, `approve` for the gate decision). Anonymous access
      (`web.anonymousScopes`) never reaches it. It also enforces its own
      `Origin` allow-list.
    post:
      tags: [mcp]
      summary: MCP JSON-RPC message
      operationId: postMcp
      x-required-scope: view
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "202":
          description: A notification; no reply body.
        "400":
          description: >-
            An empty body, malformed JSON, a JSON-RPC batch, a JSON-RPC
            response (this server sends no requests), or an unsupported
            `MCP-Protocol-Version`, each as the `Error` envelope. A
            2026-07-28 request whose `_meta` or mirrored headers fail
            validation, or whose version is unsupported, gets a JSON-RPC
            error instead (`McpError`: -32602, -32020 or -32022).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/McpError"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: >-
            A 2026-07-28 request naming a method this server does not
            implement (-32601).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpError" }
    get:
      tags: [mcp]
      summary: Not supported (stateless transport)
      operationId: getMcp
      x-required-scope: view
      responses:
        "405":
          description: >-
            Always; the stateless transport opens no server-to-client SSE
            stream. `Allow: POST, OPTIONS`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    options:
      tags: [mcp]
      summary: CORS preflight
      operationId: optionsMcp
      x-required-scope: view
      responses:
        "204":
          description: Preflight approved for an allow-listed `Origin`.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The `Origin` is not on `mcp.allowedOrigins`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: No `Origin` header (not a browser preflight).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /:
    get:
      tags: [ui]
      summary: The dashboard page
      operationId: getIndex
      description: >-
        The single-page Web Dashboard, registered unless `web.ui: false`.
        Served without authentication (the page holds no data; the browser
        sends the stored bearer token on the data requests it makes, and
        none on an anonymous-view board). Supports `ETag` / `If-None-Match`
        (304) and gzip, like `GET /jobs`.
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      security: []
      responses:
        "200":
          description: The dashboard HTML.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            text/html:
              schema: { type: string }
        "304": { description: Not modified (matching `If-None-Match`). }

  /pools:
    get:
      tags: [jobs]
      summary: Inspect shared resource pools and waiting work
      operationId: listPools
      responses:
        "200":
          description: Pool capacity, queue entries, and recent outcomes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourcePool"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: >-
            Pool state is unavailable: the configured store has not
            started, a store operation fails with an I/O error or takes
            longer than 5 seconds, or a pool document cannot be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /pools/{name}/queue/{key}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a waiting pool entry
      operationId: cancelQueuedWork
      x-required-scope: control
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Queued work cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  state: { type: string, enum: [cancelled] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            The pool holds no entry under the key (`queue entry not found`),
            or the entry is running, finished, or expired
            (`only waiting entries can be cancelled`). A daemon whose
            configuration has no `state` section answers
            `unknown pool '<name>'`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Pool state is unavailable: the configured store has not
            started, a store operation fails with an I/O error or takes
            longer than 5 seconds, or a pool document cannot be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dags/{name}/runs/{run_key}/recover:
    post:
      tags: [dags]
      summary: Preview or execute selective recovery
      operationId: recoverDagRun
      x-required-scope: control
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: run_key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "200":
          description: A replay preview or the new recovery run and its plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRunResult" }
        "400":
          description: Invalid request fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            The workflow or the run is not found
            (`workflow run not found`), the source, configuration, or
            preview cannot be used, or the source run is busy
            (`source run is busy; retry shortly`): another holder has its
            lease, or the store cannot read or write the lease file. A
            daemon whose configuration has no `state` section answers
            `workflow run not found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Recovery state is unavailable: the configured store has not
            started, a store operation fails or times out, or a record or
            document cannot be read. A lease file that the store cannot
            read or write answers `409` with a busy source instead. When
            the write that creates the recovery run times out, the source
            run's lease stays until it lapses, so a retry answers `409`
            with a busy source for up to 60 seconds, unless the write
            landed. An acquire of that lease that times out can also land,
            with the same `409` until the lease lapses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dags/{name}/recover:
    post:
      tags: [dags]
      summary: Preview or recover failed logical dates
      operationId: recoverDagDates
      x-required-scope: control
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RecoveryRequest"
                - type: object
                  required: [from, to]
                  properties:
                    from: { type: string, format: date-time }
                    to: { type: string, format: date-time }
      responses:
        "200":
          description: Plans for failed dates, or the resulting recovery run keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryRangeResult" }
        "400":
          description: Invalid request fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: >-
            The workflow is absent from the configuration
            (`workflow not found`), the range or its preview cannot be used,
            or a source run is busy. The first execution of a preview takes
            the lease of every source run before it records the batch. It
            records no batch when the store denies one of those leases
            (another holder has it, or the store cannot read or write the
            lease file), when a source differs from the preview, or when
            taking the leases and confirming the sources takes 30 seconds
            or longer. After a busy answer from that step, the same token
            succeeds once the lease is free, or answers
            `recovery preview is stale; preview again` when
            retention has deleted the source or another recovery has created
            a run for its date. Once the batch is recorded, the request
            leases each source again while it creates that run's recovery. A
            source that is busy then leaves the batch recorded, and the same
            token continues it. A daemon whose configuration has no `state`
            section answers `workflow not found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            Recovery state is unavailable: the configured store has not
            started, a store operation fails or times out, or a record or
            document cannot be read. A lease file that the store cannot
            read or write answers `409` with a busy source instead. When the
            write of the batch times out, the source leases stay until they
            lapse, so a retry answers `409` with a busy source for up to 60
            seconds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <token>` when `web.authToken` or one or more
        `web.authTokens` is set. Compared in constant time; a missing or wrong
        token is 401. Tokens may be *scoped*: the scalar `web.authToken` grants
        all scopes, while each `web.authTokens` entry lists some of `view`
        (every read-only GET, and every /mcp method), `control` (the
        mutating POSTs) and `approve` (the DAG decision route); `control` and
        `approve` each imply `view`. A recognized token
        that lacks the scope an operation requires is 403, not 401. The
        required scope defaults to `view` for GET/HEAD and `control` for other
        methods; operations that need another carry an `x-required-scope`
        extension. A daemon may also grant scopes to callers presenting no
        credential at all (`web.anonymousScopes`, `view` only), in which case
        the same scope table decides the request and an uncovered operation
        answers 403; presenting a wrong token is still 401.
    icsToken:
      type: apiKey
      in: query
      name: token
      description: >-
        Any configured token (`web.authToken` or a `web.authTokens` entry
        holding `view`) as a `?token=` query parameter. Accepted only on the
        `.ics` calendar routes (calendar clients cannot send a bearer header);
        every other route refuses query tokens.

  parameters:
    JobName:
      name: name
      in: path
      required: true
      description: The job's `name`.
      schema: { type: string }
    DagName:
      name: name
      in: path
      required: true
      description: The DAG's `name`.
      schema: { type: string }
    RunKey:
      name: run_key
      in: path
      required: true
      description: The DAG run key.
      schema: { type: string }
    TaskKey:
      name: taskkey
      in: path
      required: true
      description: The task key within the run.
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: A prior `ETag`; a match yields 304.
      schema: { type: string }
    IcsToken:
      name: token
      in: query
      required: false
      description: The auth token, for calendar clients that cannot send a bearer header.
      schema: { type: string }
    BadgeLabel:
      name: label
      in: query
      required: false
      description: >-
        Text that replaces the badge's left half, which otherwise shows the
        job's name, or `cronstable` on the fleet badge. 1 to 64 characters,
        with no control characters or line breaks.
      schema: { type: string, minLength: 1, maxLength: 64 }
    BadgeStyle:
      name: style
      in: query
      required: false
      description: >-
        `flat`, with rounded corners and a soft gradient, or `flat-square`,
        with square corners and no gradient. An empty value takes the
        default.
      schema: { type: string, enum: [flat, flat-square], default: flat }
    DeviceId:
      name: id
      in: path
      required: true
      description: The paired device's id (assigned at pairing).
      schema: { type: string }

  headers:
    ETag:
      description: A content hash for conditional `If-None-Match` requests.
      schema: { type: string }
    BadgeContentSecurityPolicy:
      description: >-
        `default-src 'none'; frame-ancestors 'self'`, so a browser refuses
        to frame the badge in a page from another origin, or
        `default-src 'none'` with `web.badges.public: true`. A `web.headers`
        entry of the same name replaces it.
      schema: { type: string }
    BadgeFrameOptions:
      description: >-
        `SAMEORIGIN`, which refuses a frame in a page from another origin
        when a `web.headers` `Content-Security-Policy` leaves out
        `frame-ancestors`. Not sent with `web.badges.public: true`. A
        `web.headers` entry of the same name replaces it, or adds it to a
        public badge.
      schema: { type: string }
    BadgeResourcePolicy:
      description: >-
        `same-origin`, so a browser refuses to load the badge as an image
        into a page from another origin, or `cross-origin` with
        `web.badges.public: true`. A `web.headers` entry of the same name
        replaces it.
      schema: { type: string }
    CronstableInstance:
      description: >-
        The daemon's instance ID, which it draws at random when it starts.
        Every response that this API's application serves carries it,
        including a 401 and a 404, and `GET /whoami` reports the same value
        as `instance`, so a client can tell one daemon from another without
        presenting a token. A request that the HTTP server cannot parse,
        such as one with a malformed request line, fails before it reaches
        the application, and its 400 has no such header.
      schema: { type: string }

  responses:
    Unauthorized:
      description: >-
        Missing or unrecognized bearer token (when `web.authToken` or any
        `web.authTokens` entry is configured). The body is the same JSON
        error envelope every other error response carries, but its `error`
        is the generic `401: Unauthorized`, byte-identical for a missing
        header, a wrong scheme, and an unknown token so that the response
        does not leak which part of the header failed. On a daemon
        configuring `web.anonymousScopes` this narrows to "credentials were
        presented and are invalid": a request carrying nothing at all is
        served, or refused with a reasoned 403 naming the scope it lacked.
      headers:
        Cronstable-Instance:
          $ref: "#/components/headers/CronstableInstance"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        The bearer token is valid but lacks the scope this operation requires
        (see `x-required-scope`), or a cross-site `Origin` was refused, or no
        credential was presented to a daemon whose `web.anonymousScopes`
        grant does not cover this operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: >-
        No such job, DAG, or run. The `error` names the subject that was not
        found, and on the routes that resolve a job or a DAG's schedule
        (`/schedule/why`, `/jobs/{name}/calendar.ics`) it says so. On the DAG
        run routes it also distinguishes an unknown DAG from a daemon with no
        `state:` store, since run documents only exist in a durable store.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: >-
        The uniform error envelope. Every 4xx/5xx body this API's application
        serves is this object, the auth middleware's 401 included, so clients
        parse failures one way across every endpoint. The one exception is
        /mcp's 2026-07-28 path, whose protocol errors are `McpError`. A request that fails
        before it reaches the application (a malformed request line, an
        unparseable method token, oversized request headers, an unrecognized
        `Expect:`) is answered by the HTTP server itself as text/plain and is
        not described by this specification. Neither is the cluster peer
        transport, a separate mTLS listener this specification does not
        cover, which answers its own bodyless 4xx.
      properties:
        error:
          type: string
          description: Human-readable reason.
      required: [error]
    McpError:
      type: object
      description: >-
        A JSON-RPC 2.0 error response, the one exception to the `Error`
        envelope. /mcp answers a 2026-07-28 request that fails validation
        with one, as the MCP specification requires, so a client can tell a
        modern server's rejection from a legacy one's.
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          description: The request's id, or null when it could not be read.
          nullable: true
        error:
          type: object
          properties:
            code: { type: integer }
            message: { type: string }
            data:
              description: >-
                For -32022, the `supported` versions and the `requested` one.
          required: [code, message]
      required: [jsonrpc, id, error]

    WhoAmI:
      type: object
      description: >-
        What the caller is allowed to do, in three shapes. A matched token
        reports `authenticated: true` with its own label and scopes. A
        daemon with no auth configured reports
        `authenticated: false, label: null, allScopes: true`, and grants
        every scope. A credential-less request served through
        `web.anonymousScopes` reports
        `authenticated: false, label: "anonymous", allScopes: false` with
        the granted scopes, which is a restricted caller even though it is
        unauthenticated. Because those last two disagree while sharing
        `authenticated: false`, `allScopes` is the field a client should
        branch on. `anonymous` is reserved: config load refuses a real
        token labeled with it.
      properties:
        authenticated: { type: boolean }
        label: { type: string, nullable: true }
        scopes:
          type: array
          items:
            # Open enum (enum + bare string under anyOf, like
            # JobRun.outcome): a newer daemon may grow the scope set, and
            # clients must keep decoding. An unknown scope grants nothing
            # the client recognizes; capability checks look for the known
            # values only.
            description: >-
              Token scope. Known values: view, control, approve. The list
              is open: a newer daemon may send a scope that is not on it,
              and clients must keep decoding and simply not recognize the
              unknown scope.
            anyOf:
              - type: string
                enum: [view, control, approve]
              - type: string
        allScopes: { type: boolean }
        pairLinkBase:
          type: string
          description: >-
            Base URL of the pairing deep link the dashboard's QR encodes:
            the origin of `push.relay.url` plus `/pair` (embedded
            credentials dropped), or the hosted relay's landing while no
            `push:` section is applied.
        sealableSuites:
          type: array
          items: { type: string }
          description: >-
            The suites this daemon can seal push alerts under: `x25519`
            always, `xwing` when the install can seal post-quantum
            (cryptography 48 or newer, which the `push` extra carries
            wherever a wheel exists). The app pairs under `xwing` when it
            is listed. The field stays outside `required` on purpose:
            a daemon that omits it seals `x25519` only, so generated
            clients decode it as optional and read absence as
            `["x25519"]`.
        instance:
          type: string
          description: >-
            An ID that the daemon draws at random when it starts and keeps
            until it exits. Every response that this API's application
            serves carries the same value in the `Cronstable-Instance`
            header.
        listeners:
          type: array
          items: { type: string }
          description: >-
            The address of each TCP socket that the `web.listen` entries
            bound, in the form of a `web.listen` entry, such as
            `http://0.0.0.0:8080`. The list has no entry for a unix socket.
            The reply to a credential-less request served through
            `web.anonymousScopes` omits the field.
        badges:
          type: object
          nullable: true
          description: >-
            `null` while the daemon serves no status badges
            (`web.badges: false`). `public` is the `web.badges.public`
            setting, which lets an image proxy fetch the badges without a
            token and lets pages from other origins load them. `dashboard`
            is false under `web.ui: false`, where copied badge Markdown has
            no dashboard page to link to. The dashboards list their
            copy-badge commands only when the object is present.
          properties:
            public: { type: boolean }
            dashboard: { type: boolean }
          required: [public, dashboard]
      required: [authenticated, scopes, allScopes, pairLinkBase]

    PushDevice:
      type: object
      description: One paired push device, as listed (push token redacted).
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        publicKey:
          type: string
          description: The device public key, base64.
        suite:
          type: string
          description: >-
            Sealing suite the key belongs to: `x25519` (libsodium sealed
            box) or `xwing` (X-Wing, ML-KEM-768 + X25519, sealed with
            HPKE). The field stays outside `required`: a record naming no
            suite is `x25519`, the only suite such a record can hold.
        sealableHere:
          type: boolean
          description: >-
            Whether this node can seal alerts for `suite`. Nodes sharing a
            state store share the device registry, but each node has its own
            installed libraries; a device paired with `xwing` on a node with
            `cryptography` installed reports `false` on a node without it,
            and alerts from that node cannot reach the device. Optional; when
            omitted, the daemon can seal every stored suite.
        fingerprint:
          type: string
          nullable: true
          description: >-
            Short SHA-256 fingerprint of the raw key bytes (12 hex
            characters, dash-grouped), for out-of-band comparison against
            the fingerprint the companion app displays.
        pushToken:
          type: string
          description: Redacted to its trailing characters.
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, nullable: true }
      required: [id, name, platform, publicKey]
      additionalProperties: true

    StatusRow:
      type: object
      description: One job's compact status.
      properties:
        job: { type: string }
        status:
          # Open enum (enum + bare string under anyOf, like JobRun.outcome):
          # a newer daemon may add a status, and clients must keep decoding
          # and render the unknown value neutrally.
          description: >-
            Job status. Known values: running, disabled, scheduled. The
            list is open: a newer daemon may send a value that is not on
            it, and clients must keep decoding and render the unknown
            value neutrally.
          anyOf:
            - type: string
              enum: [running, disabled, scheduled]
            - type: string
        pid:
          type: array
          items: { type: integer }
        scheduled_in:
          description: Seconds until the next fire (number), or the string "@reboot", or null.
          nullable: true
        never_fires: { type: boolean }
      required: [job, status]
      additionalProperties: true

    Summary:
      type: object
      description: The batched fleet overview behind `GET /summary`.
      properties:
        version: { type: string }
        node_name: { type: string }
        generated_at: { type: string, format: date-time }
        jobs:
          type: object
          properties:
            total: { type: integer }
            enabled: { type: integer }
            disabled: { type: integer }
            running: { type: integer }
            paused: { type: integer }
            failing: { type: integer }
            never_fires: { type: integer }
        next_fire:
          nullable: true
          type: object
          properties:
            job: { type: string }
            in: { type: number }
            at: { type: string, format: date-time }
        dags:
          type: object
          properties:
            total: { type: integer }
        cluster:
          type: object
          properties:
            enabled: { type: boolean }
            distribution: { type: string }
            quorate: { type: boolean }
            is_leader: { type: boolean }
            leader: { type: string, nullable: true }
          additionalProperties: true
      additionalProperties: true

    Job:
      type: object
      description: One job's full state (an entry of `GET /jobs`, or `GET /jobs/{name}`).
      properties:
        pool: { $ref: "#/components/schemas/JobPool" }
        verification: { $ref: "#/components/schemas/VerificationStatus" }
        name: { type: string }
        enabled: { type: boolean }
        schedule: { type: string }
        command: { type: string }
        captureStdout: { type: boolean }
        captureStderr: { type: boolean }
        utc: { type: boolean }
        timezone: { type: string, nullable: true }
        running: { type: boolean }
        pids:
          type: array
          items: { type: integer }
        scheduled_in: { type: number, nullable: true }
        never_fires: { type: boolean }
        schedule_findings:
          type: array
          items: { $ref: "#/components/schemas/ScheduleFinding" }
        last_run:
          allOf: [{ $ref: "#/components/schemas/JobRun" }]
          nullable: true
        history:
          type: array
          items:
            type: object
            properties:
              outcome: { type: string }
              duration: { type: number, nullable: true }
        paused:
          allOf: [{ $ref: "#/components/schemas/Pause" }]
          nullable: true
        limits:
          allOf: [{ $ref: "#/components/schemas/ResourceLimits" }]
          description: The job's `resourceLimits`; present only when set.
        schedule_resolved:
          type: string
          description: >-
            The plain crontab spelling that an `H` schedule resolves to.
            Present only when it differs from `schedule`.
        running_resources: { $ref: "#/components/schemas/RunningResources" }
        retry: { $ref: "#/components/schemas/JobRetry" }
        sla: { $ref: "#/components/schemas/JobSla" }
        rebootPending:
          type: boolean
          description: >-
            Present and true while an `@reboot` job waits for its boot run,
            because no cluster owner existed at boot or a pause holds the
            run.
        concurrencyScope:
          type: string
          description: >-
            An open string. The known value is `cluster`. Present only on a
            job with `concurrencyScope: cluster`, together with `slot`.
        slot: { $ref: "#/components/schemas/JobSlot" }
        clusterPolicy:
          type: string
          description: >-
            An open string. Known values are `Leader`, `PreferLeader`, and
            `EveryNode`. Present only while `cluster.electLeader` is
            configured.
        clusterOwner:
          type: string
          nullable: true
          description: >-
            The node that owns the job under `spread` distribution. A
            `Leader` job's owner is null while the cluster has no quorum. A
            `PreferLeader` job's owner ignores quorum and is never null.
            Present only under `spread`, on a job whose `clusterPolicy` is
            not `EveryNode`.
        priority:
          type: string
          description: >-
            The job's process scheduling priority. An open string. Known
            values are `idle`, `below-normal`, `above-normal`, and `high`.
            Present only when the job sets a priority other than `normal`.
            This string is a different setting from the integer queue
            priority in `pool.priority`.
      required: [name, enabled, schedule, running]
      additionalProperties: true

    RunningResources:
      type: object
      description: >-
        The live CPU and memory of a job's running instances, summed over
        the instances that have a sample. Present only while the job runs
        with `monitorResources` and at least one sample exists.
      properties:
        cpu_percent:
          type: number
          description: >-
            CPU use since the previous sample, in percent of one core,
            summed over the instances. It can exceed 100 when the instances
            use more than one core.
        cpu_seconds:
          type: number
          description: CPU time the instances have used so far, in seconds.
        rss_bytes:
          type: integer
          format: int64
          description: Current resident memory, in bytes.
        instances:
          type: integer
          description: >-
            The number of instances the sums cover. It can be lower than the
            length of `pids`, because an instance without a sample is left
            out.
      required: [cpu_percent, cpu_seconds, rss_bytes, instances]
      additionalProperties: true

    JobRetry:
      type: object
      description: >-
        The job's armed retry sequence. Present only after a failure armed a
        retry, until the sequence ends.
      properties:
        attempt:
          type: integer
          description: >-
            The number of the retry that is armed or running, starting at 1.
        maxAttempts:
          type: integer
          nullable: true
          description: >-
            The job's `onFailure.retry.maximumRetries`: the retry budget, not
            counting the first run. Null when the budget is unlimited.
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the armed retry fires, as an ISO 8601 string. The value
            stays after the retry fires, so it is in the past while that
            retry runs.
        delaySeconds:
          type: number
          nullable: true
          description: The backoff delay before the armed retry, in seconds.
      required: [attempt, maxAttempts, nextRetryAt, delaySeconds]
      additionalProperties: true

    JobSla:
      type: object
      description: >-
        The job's SLA checks. Present only on a job that sets at least one
        `sla` threshold.
      properties:
        thresholds:
          type: object
          description: >-
            The configured thresholds, in seconds, keyed by their `sla`
            setting name: `maxTimeSinceSuccessSeconds`, `lateAfterSeconds`,
            or `maxRuntimeSeconds`. Only the thresholds that are set appear.
          additionalProperties: { type: integer }
        state:
          type: string
          description: >-
            An open string. Known values are `ok` and `late`. The value is
            `late` while `breaches` is not empty.
        breaches:
          type: array
          description: The checks that are in breach.
          items: { $ref: "#/components/schemas/JobSlaBreach" }
      required: [thresholds, state, breaches]
      additionalProperties: true

    JobSlaBreach:
      type: object
      description: One SLA check that is in breach.
      properties:
        check:
          type: string
          description: >-
            An open string. Known values are `maxTimeSinceSuccess`,
            `lateAfter`, and `maxRuntime`: the threshold's setting name
            without its `Seconds` suffix.
        since:
          type: string
          format: date-time
          description: When the breach began, as an ISO 8601 string.
        observed_seconds:
          type: number
          description: >-
            The measured value, in seconds, taken when the response is
            built.
        threshold_seconds:
          type: integer
          description: The configured threshold, in seconds.
      required: [check, since, observed_seconds, threshold_seconds]
      additionalProperties: true

    JobSlot:
      type: object
      description: >-
        This node's hold on the job's cluster concurrency slot. Present only
        on a job with `concurrencyScope: cluster`.
      properties:
        held:
          type: boolean
          description: Whether this node holds the slot's lease.
        holder:
          type: string
          nullable: true
          description: >-
            The lease holder, as `<host>#<process token>`, while this node
            holds the slot. Null otherwise, so the value never names another
            node.
        refs:
          type: integer
          description: The number of this node's live instances that use the slot.
      required: [held, holder, refs]
      additionalProperties: true

    ResourceLimits:
      type: object
      description: A job's configured caps. A null cap is uncapped.
      required: [cpu, memory_bytes, processes, required]
      properties:
        cpu: { type: number, nullable: true, description: CPUs. }
        memory_bytes: { type: integer, format: int64, nullable: true }
        processes: { type: integer, nullable: true }
        required: { type: boolean }

    LimitsRecord:
      type: object
      description: >-
        A run's caps and what the kernel recorded. `peak_memory_bytes` is
        the figure the memory cap is measured on (cgroup `memory.peak`, or
        a Job Object's commit charge), not the sampled RSS.
      required: [enforced]
      properties:
        cpu: { type: number, nullable: true }
        memory_bytes: { type: integer, format: int64, nullable: true }
        processes: { type: integer, nullable: true }
        required: { type: boolean }
        enforced:
          type: boolean
          description: Every configured cap applied for the whole run.
        mechanism:
          type: string
          nullable: true
          description: "`cgroup-v2` or `job-object`; null when no cap applied."
        unenforced:
          type: array
          description: The configured caps that did not apply (`cpu`, `memory`, `processes`).
          items: { type: string }
        reason: { type: string, nullable: true, description: Why caps did not apply. }
        refused:
          type: boolean
          description: >-
            `true` when `resourceLimits.required` refused the run: the command
            never started, or cronstable ended its process because it could
            not be moved into its cgroup or Job Object. A Linux process that
            cannot join its cgroup never starts the command, so its run
            reports the start failure's 127. A run whose process cronstable
            ended reports the kill's exit code instead (1 on Windows, -9 on
            Linux).
        memory_exceeded:
          type: boolean
          description: The run hit its memory cap and was killed.
        process_limit_hits: { type: integer, nullable: true }
        peak_memory_bytes: { type: integer, format: int64, nullable: true }
        cpu_throttled_seconds: { type: number, nullable: true, description: Linux only. }
      additionalProperties: true

    LimitsCapability:
      type: object
      description: Whether this host can enforce `resourceLimits`.
      required: [available, mechanism, resources, reason, hint]
      properties:
        available: { type: boolean }
        mechanism: { type: string, nullable: true }
        resources:
          type: array
          description: The caps this host can apply (`cpu`, `memory`, `processes`).
          items: { type: string }
        reason: { type: string, nullable: true, description: Why caps are unavailable or partial. }
        hint: { type: string, nullable: true, description: What the operator can do. }
      additionalProperties: true

    ResourcePool:
      type: object
      required: [name, slots, used, queued, entries]
      properties:
        name: { type: string }
        slots: { type: integer }
        configuredSlots: { type: integer }
        used: { type: integer }
        queued: { type: integer }
        maxQueued: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/PoolEntry" }

    PoolEntry:
      type: object
      required: [id, state, slots, priority, queuedAt, expiresAt]
      properties:
        id: { type: string }
        state: { type: string }
        slots: { type: integer }
        priority: { type: integer }
        queuedAt: { type: number }
        expiresAt: { type: number }
        position: { type: integer }
        waitingReason: { type: string }
        reason:
          type: string
          nullable: true
          description: >-
            Why the entry ended or waits, or null when its completion
            recorded none.
        job: { type: string }
        dag: { type: string }
        runKey: { type: string }
        task: { type: string }
        digest:
          type: string
          description: >-
            The digest of the job definition that queued the entry. The
            daemon cancels a queued job entry when the definition changes.
        leaseUntil:
          type: number
          description: >-
            When the running entry's admission lease lapses, in epoch
            seconds. Present once the entry has been admitted.
        finishedAt:
          type: number
          description: When the entry ended, in epoch seconds.
        observed:
          type: boolean
          description: >-
            Present and true once the scheduler has acknowledged the end of
            a DAG task's entry.
      additionalProperties: true

    JobPool:
      type: object
      required: [name, slots, priority]
      properties:
        name: { type: string }
        slots: { type: integer }
        priority: { type: integer }
        queueUnavailable:
          type: boolean
          description: >-
            Present as `true`, in place of `queued`, when pool state cannot
            be read or written. The job routes still answer `200`.
        queued:
          type: array
          items: { $ref: "#/components/schemas/PoolEntry" }

    VerificationStatus:
      type: object
      properties:
        configured: { type: boolean }
        running: { type: boolean }

    RecoveryRequest:
      type: object
      properties:
        mode: { type: string, enum: [failed, from], default: failed }
        tasks:
          type: array
          maxItems: 2000
          items: { type: string }
          description: Task instance names for mode from, including mapped names such as process#2.
        dryRun: { type: boolean, default: true }
        planToken:
          type: string
          minLength: 64
          maxLength: 64
          description: Token returned by the preview; required when dryRun is false.
        allowConfigChange:
          type: boolean
          default: false
          description: Acknowledge using the current configuration when it differs from the source run.

    RecoveryPlan:
      type: object
      description: >-
        What a recovery of one finished run replays and what it keeps.
      properties:
        sourceRunKey: { type: string }
        sourceRunId: { type: string }
        mode:
          type: string
          description: An open string. Known values are `failed` and `from`.
        requestedTasks:
          type: array
          description: The task instance keys that the request named, sorted.
          items: { type: string }
        tasks:
          type: array
          description: >-
            The task instance keys that the recovery runs again, sorted:
            the selection plus everything downstream of it.
          items: { type: string }
        preserved:
          type: array
          description: >-
            The task instance keys that the recovery keeps from the source
            run, sorted.
          items: { type: string }
        resetMappings:
          type: array
          description: >-
            The mapped tasks whose fan-out the recovery expands again,
            sorted.
          items: { type: string }
        artifacts:
          type: array
          description: The XCom artifacts of the preserved tasks that the recovery copies.
          items:
            type: object
            properties:
              name: { type: string }
              sha256: { type: string }
              size: { type: integer }
              meta:
                type: object
                nullable: true
                additionalProperties: true
            additionalProperties: true
        configurationRevision:
          type: string
          description: The digest of the DAG's current launch configuration.
        sourceConfigurationRevision:
          type: string
          nullable: true
          description: >-
            The source run's `configurationRevision`, or null for a run
            that records none.
        configurationChanged:
          type: boolean
          description: >-
            Whether the two revisions differ. Executing such a plan needs
            `allowConfigChange`.
        planToken:
          type: string
          description: >-
            The 64-hex digest of the plan and its source, which an executing
            request sends back.
      additionalProperties: true

    RecoveryRunResult:
      description: >-
        A recovery preview (`dryRun: true`), or the recovery run that an
        executed plan created or found (`dryRun: false`).
      allOf:
        - $ref: "#/components/schemas/RecoveryPlan"
        - type: object
          properties:
            dryRun: { type: boolean }
            runKey:
              type: string
              description: >-
                The recovery run's key, `recovery-<planToken>`. Present when
                `dryRun` is false.
            created:
              type: boolean
              description: >-
                False when an earlier request already created the run.
                Present when `dryRun` is false.
          required: [dryRun]
          additionalProperties: true

    RecoveryRangeResult:
      type: object
      description: >-
        A preview of the failed dates in a range (`dryRun: true`), or the
        recovery runs that an executed batch created (`dryRun: false`).
      properties:
        dryRun: { type: boolean }
        planToken:
          type: string
          description: The batch's token, which an executing request sends back.
        dates:
          type: integer
          description: The number of failed dates that the batch covers, at most 100.
        plans:
          type: array
          description: One plan per failed date, oldest first. Present when `dryRun` is true.
          items: { $ref: "#/components/schemas/RecoveryPlan" }
        from:
          type: string
          format: date-time
          description: >-
            The range's start as the daemon parsed it, read as UTC when the
            request gave no offset. Present when `dryRun` is true.
        to:
          type: string
          format: date-time
          description: >-
            The range's end, parsed the same way. Present when `dryRun` is
            true.
        runs:
          type: array
          description: The recovery runs' keys. Present when `dryRun` is false.
          items: { type: string }
        complete:
          type: boolean
          description: True once the batch has a run for every date. Present when `dryRun` is false.
      required: [dryRun, planToken, dates]
      additionalProperties: true

    VerificationResult:
      type: object
      properties:
        outcome: { type: string }
        exit_code: { type: integer, nullable: true }
        fail_reason: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time }
        duration: { type: number, nullable: true }
        stdout: { type: string, nullable: true }
        stderr: { type: string, nullable: true }
        stdout_discarded: { type: integer }
        stderr_discarded: { type: integer }
        output_truncated: { type: boolean }
        limits:
          allOf: [{ $ref: "#/components/schemas/LimitsRecord" }]
          nullable: true
          description: >-
            The check's own caps record, or null when its job has no
            `resourceLimits`. A check killed at its memory cap is recorded
            here; the run's `limits` covers the run's own processes.

    JobRun:
      type: object
      description: One finished run.
      properties:
        verification: { $ref: "#/components/schemas/VerificationResult" }
        outcome:
          # Open enum (enum + bare string under anyOf): generated clients keep
          # decoding when a newer daemon ships an outcome this list has not
          # heard of yet, instead of failing the whole /jobs payload.
          description: >-
            Run outcome. Known values: success, failure, cancelled, unknown,
            skipped. The list is open: a newer daemon may send a value that
            is not on it, and clients must keep decoding and render the
            unknown value neutrally.
          anyOf:
            - type: string
              enum: [success, failure, cancelled, unknown, skipped]
            - type: string
        exit_code: { type: integer, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        duration: { type: number, nullable: true }
        fail_reason: { type: string, nullable: true }
        resources: { $ref: "#/components/schemas/RunResources" }
        limits:
          allOf: [{ $ref: "#/components/schemas/LimitsRecord" }]
          description: Present only for a run of a job with `resourceLimits`.
        skip_reason:
          type: string
          nullable: true
          description: >-
            Why a `skipped` row exists. An open string. The known value is
            `paused`. Null on every other row.
        ranAt:
          type: string
          format: date-time
          description: >-
            The same instant as `finished_at`. Present on every row except a
            `skipped` one, so a pause never moves the last-ran watermark.
      additionalProperties: true

    RunResources:
      type: object
      nullable: true
      description: >-
        The CPU time and peak memory that a monitored run used, sampled
        while it ran. Null for a run without `monitorResources`, and for a
        monitored run that ended before its first sample.
      properties:
        cpu_user_seconds:
          type: number
          description: User-mode CPU time, in seconds.
        cpu_system_seconds:
          type: number
          description: System-mode CPU time, in seconds.
        cpu_total_seconds:
          type: number
          description: The sum of the user and system CPU time, in seconds.
        max_rss_bytes:
          type: integer
          format: int64
          description: The highest resident memory that a sample saw, in bytes.
        samples:
          type: integer
          description: The number of samples taken.
        series:
          type: array
          description: >-
            The downsampled chart series, oldest first. Each point is
            `[epoch seconds, CPU percent, resident bytes]`. Present only on
            `GET /jobs/{name}/resources` and in the run ledger, and only when
            the run recorded points.
          items:
            type: array
            items: { type: number }
      additionalProperties: true

    LiveRunResources:
      type: object
      description: One running instance's CPU and memory so far.
      properties:
        started_at: { type: string, format: date-time, nullable: true }
        pid: { type: integer, nullable: true }
        current: { $ref: "#/components/schemas/ResourceSnapshot" }
        series:
          type: array
          description: >-
            The run-so-far chart series, oldest first, in the
            `RunResources.series` point shape. Empty when the job's
            `monitorResources.history` is 0.
          items:
            type: array
            items: { type: number }
      required: [started_at, pid, current, series]
      additionalProperties: true

    ResourceSnapshot:
      type: object
      nullable: true
      description: >-
        One running instance's latest sample, or null before its first
        sample.
      properties:
        cpu_seconds:
          type: number
          description: CPU time used so far, in seconds.
        cpu_percent:
          type: number
          description: CPU use since the previous sample, in percent of one core.
        rss_bytes:
          type: integer
          format: int64
          description: Current resident memory, in bytes.
      additionalProperties: true

    JobRuns:
      type: object
      properties:
        name: { type: string }
        runs:
          type: array
          items: { $ref: "#/components/schemas/JobRun" }
        stats: { $ref: "#/components/schemas/RunStats" }
      additionalProperties: true

    ActivityRun:
      type: object
      description: One retained run, reduced to the fields the heatmap plots.
      properties:
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time }
        outcome:
          # Open enum (enum + bare string under anyOf, like JobRun.outcome),
          # so generated clients keep decoding a newer daemon's outcomes.
          description: >-
            Run outcome. Known values: success, failure, cancelled, unknown,
            skipped. The list is open: a newer daemon may send a value that
            is not on it, and clients must keep decoding and render the
            unknown value neutrally.
          anyOf:
            - type: string
              enum: [success, failure, cancelled, unknown, skipped]
            - type: string
      additionalProperties: true

    RunStats:
      type: object
      description: Aggregate run statistics.
      properties:
        total: { type: integer }
        success: { type: integer }
        failure: { type: integer }
        cancelled: { type: integer }
        unknown: { type: integer }
        success_rate: { type: number, nullable: true }
        avg_duration: { type: number, nullable: true }
        min_duration: { type: number, nullable: true }
        max_duration: { type: number, nullable: true }
        last_duration: { type: number, nullable: true }
        avg_cpu_seconds:
          type: number
          nullable: true
          description: >-
            Mean CPU time of the monitored runs, in seconds. Each CPU and
            memory figure is null when no run in the window was monitored.
        max_cpu_seconds:
          type: number
          nullable: true
          description: Highest CPU time of a monitored run, in seconds.
        last_cpu_seconds:
          type: number
          nullable: true
          description: >-
            CPU time of the newest run by finish time, in seconds. Null when
            that run was not monitored, even when older runs were.
        avg_rss_bytes:
          type: number
          nullable: true
          description: >-
            Mean peak resident memory of the monitored runs, in bytes. A
            mean, so the value can be fractional.
        max_rss_bytes:
          type: integer
          format: int64
          nullable: true
          description: Highest peak resident memory of a monitored run, in bytes.
        last_rss_bytes:
          type: integer
          format: int64
          nullable: true
          description: >-
            Peak resident memory of the newest run by finish time, in bytes.
            Null when that run was not monitored.
      additionalProperties: true

    ScheduleFinding:
      type: object
      properties:
        code: { type: string }
        level: { type: string }
        message: { type: string }

    Pause:
      type: object
      description: An active runtime pause window.
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        note: { type: string }
        by: { type: string }
        channel: { type: string }
      additionalProperties: true

    PauseRequest:
      type: object
      properties:
        durationSeconds: { type: integer }
        until: { type: string, format: date-time }
        note: { type: string }
        by: { type: string }

    Dag:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
        scheduled: { type: boolean }
        schedule: { type: string }
        retainRuns:
          type: integer
          description: >-
            How many finished runs retention keeps, newest first. Retention
            also keeps a finished run that a recovery references, and a run
            that has not finished.
        latestRun: { $ref: "#/components/schemas/DagLatestRun" }
        runCounts:
          type: object
          description: >-
            The retained runs counted by run state, such as `success` and
            `failed`. Present together with `latestRun`.
          additionalProperties: { type: integer }
        totalRuns:
          type: integer
          description: >-
            The number of retained runs, which can exceed `retainRuns`.
            Present together with `latestRun`.
        tasks:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              dependsOn:
                type: array
                items: { type: string }
              triggerRule:
                type: string
                description: >-
                  An open string. Known values are `all_success`, `all_done`,
                  `none_failed`, `none_failed_min_one_success`, and
                  `all_done_min_one_failed`.
              retries: { type: integer }
              mapped: { type: boolean }
            additionalProperties: true
      additionalProperties: true

    DagRunSummary:
      type: object
      properties:
        runKey: { type: string }
        runId: { type: string }
        state: { type: string }
        kind: { type: string }
        logicalDate: { type: string, format: date-time, nullable: true }
        taskStates:
          type: object
          additionalProperties: { type: integer }
        createdAt:
          type: number
          nullable: true
          description: When the run was created, in epoch seconds.
        updatedAt:
          type: number
          nullable: true
          description: >-
            When the run document was last written, in epoch seconds. Close
            to the finish time once the run has finished.
      additionalProperties: true

    DagLatestRun:
      type: object
      description: >-
        The newest retained run, by creation time. Present only while a
        `state:` store holds at least one run of the DAG and the read
        succeeds.
      properties:
        runKey: { type: string, nullable: true }
        state:
          type: string
          description: An open string. Known values are `running`, `success`, and `failed`.
        kind:
          type: string
          nullable: true
          description: >-
            An open string. Known values are `scheduled`, `catchup`,
            `manual`, `backfill`, and `recovery`.
        createdAt:
          type: number
          nullable: true
          description: When the run was created, in epoch seconds.
        updatedAt:
          type: number
          nullable: true
          description: When the run document was last written, in epoch seconds.
      additionalProperties: true

    DagXcomPage:
      type: object
      description: The XCom values that a run's tasks published.
      properties:
        dag: { type: string }
        runKey: { type: string }
        runId: { type: string, nullable: true }
        entries:
          type: array
          description: >-
            One entry per published name `<taskkey>/<key>`, sorted by that
            name. At most 500.
          items: { $ref: "#/components/schemas/DagXcomEntry" }
        truncated:
          type: boolean
          description: True when the run published more than 500 names.
      required: [dag, runKey, entries, truncated]
      additionalProperties: true

    DagXcomEntry:
      type: object
      description: >-
        One published XCom value. A value of 65,536 bytes or less carries
        `value` when it decodes as UTF-8 text and `binary` otherwise; a
        larger one carries `oversize`. An entry whose stored value cannot
        be read carries none of the three.
      properties:
        taskkey: { type: string }
        key: { type: string }
        sha256: { type: string, nullable: true }
        size:
          type: integer
          nullable: true
          description: The value's size, in bytes.
        at:
          type: number
          nullable: true
          description: When the task published the value, in epoch seconds.
        value: { type: string }
        binary: { type: boolean }
        oversize: { type: boolean }
      additionalProperties: true

    DagDecision:
      type: object
      description: The result of a recorded approval decision.
      properties:
        ok: { type: boolean }
        state:
          type: string
          description: >-
            The gate's state after the decision. An open string. Known
            values are `success`, `skipped`, and `failed`.
      required: [ok, state]
      additionalProperties: true

    DagRunDocument:
      type: object
      description: The full durable run document (task states, timings, decisions, XCom).
      properties:
        dag: { type: string }
        runKey: { type: string }
        runId:
          type: string
          description: >-
            The run's ID, 32 hex characters. A recovery run uses its
            64-character plan token.
        logicalDate:
          type: string
          nullable: true
          description: >-
            The scheduled instant the run covers, as an ISO 8601 string.
            Null on a manual run.
        kind:
          type: string
          description: >-
            An open string. Known values are `scheduled`, `catchup`,
            `manual`, `backfill`, and `recovery`.
        state:
          type: string
          description: >-
            An open string. Known values are `running`, `success`, and
            `failed`. Once every task has ended, the run is `failed` when a
            task ended `failed` or `upstream_failed`, and `success`
            otherwise.
        createdAt:
          type: number
          description: When the run was created, in epoch seconds.
        updatedAt:
          type: number
          description: When the document was last written, in epoch seconds.
        configurationRevision:
          type: string
          description: >-
            The digest of the DAG's launch configuration when the run was
            created. A recovery plan reads a document without one as a
            changed configuration.
        mapped:
          type: object
          description: >-
            Each mapped task's fan-out, keyed by task ID. Empty until an
            upstream task publishes the items.
          additionalProperties:
            type: object
            properties:
              items:
                type: array
                description: The fan-out items, as JSON values.
                items: {}
              expandedAt:
                type: number
                description: When the fan-out expanded, in epoch seconds.
            additionalProperties: true
        recovery: { $ref: "#/components/schemas/DagRunRecovery" }
        tasks:
          type: object
          description: Task entries keyed by task instance key.
          additionalProperties:
            type: object
            properties:
              state:
                type: string
                description: >-
                  An open string. Known values are `pending`, `running`,
                  `up_for_retry`, `success`, `failed`, `skipped`,
                  `upstream_failed`, and `expanded`.
              id:
                type: string
                description: The task ID. A mapped instance carries its base ID.
              mapIndex:
                type: integer
                nullable: true
                description: The instance's index in the fan-out, or null.
              attempt:
                type: integer
                description: >-
                  The number of failed attempts. A task that failed after
                  its retries shows `retries + 1`.
              proc:
                type: string
                nullable: true
                description: The claiming process's token while the task runs.
              pid:
                type: integer
                nullable: true
                description: The process ID while the task runs, once known.
              host:
                type: string
                nullable: true
                description: >-
                  The host of the node that claimed the task, which stays
                  after the task ends. Null on an approval gate and on an
                  entry that no node has claimed.
              startedAt:
                type: number
                nullable: true
                description: The first claim, in epoch seconds. Retries keep it.
              finishedAt:
                type: number
                nullable: true
                description: When the task ended, in epoch seconds.
              exitCode: { type: integer, nullable: true }
              failReason: { type: string, nullable: true }
              resources: { $ref: "#/components/schemas/RunResources" }
              updatedAt:
                type: number
                nullable: true
                description: When the entry last changed, in epoch seconds.
              mapped:
                type: boolean
                description: Present and true on the placeholder entry of a mapped task.
              mapItem:
                description: >-
                  The instance's fan-out item, as a JSON value. Present only
                  on a mapped instance.
              pokeCount:
                type: integer
                description: The number of finished pokes. Present only on a sensor.
              firstPokeAt:
                type: number
                description: >-
                  The sensor's first claim, in epoch seconds, which its poke
                  timeout counts from.
              nextPokeAt:
                type: number
                nullable: true
                description: >-
                  When the sensor pokes next, in epoch seconds. Null while a
                  poke runs and after the sensor succeeds.
              approval:
                type: object
                nullable: true
                description: >-
                  The decision on an approval gate, or null until one is
                  recorded. Present only on an approval gate.
                properties:
                  decision:
                    type: string
                    description: An open string. Known values are `approved` and `rejected`.
                  by: { type: string }
                  at:
                    type: number
                    description: When the decision was recorded, in epoch seconds.
                additionalProperties: true
              awaitingApproval:
                type: boolean
                description: >-
                  Present and true while an approval gate waits for a
                  decision. A waiting gate's `state` is `running`.
              nextRetryAt:
                type: number
                nullable: true
                description: >-
                  When the next attempt can start, in epoch seconds (the job
                  routes give their retry time as an ISO 8601 string
                  instead). Present once the task has failed. Null after its
                  last attempt fails.
              queued:
                type: object
                description: >-
                  The pool entry that a `pending` task waits in. Present
                  only while the task waits for pool capacity.
                properties:
                  pool: { type: string }
                  id: { type: string }
                  since:
                    type: number
                    description: When the task joined the queue, in epoch seconds.
                  reason: { type: string }
                additionalProperties: true
              verification: { $ref: "#/components/schemas/VerificationResult" }
              limits: { $ref: "#/components/schemas/LimitsRecord" }
              reusedFrom:
                type: string
                description: >-
                  The source run's key, on an entry that a recovery run kept
                  from its source.
            additionalProperties: true
      additionalProperties: true

    DagRunRecovery:
      description: >-
        The plan that created a recovery run, and how far its preparation
        got. Present only on a `recovery` run.
      allOf:
        - $ref: "#/components/schemas/RecoveryPlan"
        - type: object
          properties:
            status:
              type: string
              description: >-
                An open string. Known values are `preparing`, `ready`, and
                `failed`.
            error:
              type: string
              description: Why the preparation failed. Present only when `status` is `failed`.
          additionalProperties: true

    ClusterView:
      type: object
      description: >-
        This node's cluster view. An unclustered daemon, and a cluster whose
        backend failed to start, answer `{"enabled": false, "peers": []}`.
        The gossip backend and the lease backends (`kubernetes`, `etcd`,
        and `filesystem`) send different subsets of the other keys.
      properties:
        enabled: { type: boolean }
        backend: { type: string }
        node_name: { type: string }
        job_set_id: { type: string }
        cluster_size: { type: integer }
        quorum: { type: integer }
        elect_leader: { type: boolean }
        distribution: { type: string }
        quorate: { type: boolean }
        leader:
          type: string
          nullable: true
          description: >-
            The leader's node name, or null without quorum and under
            `spread`, where each job has its own owner. A lease backend can
            report `<unknown holder>` while the store does not say who
            holds the lease.
        is_leader: { type: boolean }
        peers:
          type: array
          description: The configured gossip peers. Always empty on a lease backend.
          items: { $ref: "#/components/schemas/ClusterPeer" }
        conflict:
          type: boolean
          description: >-
            True while a duplicate node name, a size conflict, or a policy
            conflict holds. Until it clears, `Leader` jobs don't run on this
            node, and `PreferLeader` jobs keep running. Always false on a
            lease backend.
        conflict_names:
          type: array
          description: The node names that more than one node uses, sorted.
          items: { type: string }
        size_conflict:
          type: boolean
          description: True while a reachable peer declares a different cluster size.
        conflicting_sizes:
          type: array
          description: The cluster sizes that peers declare and that differ from this node's, sorted.
          items: { type: integer }
        policy_conflict:
          type: boolean
          description: >-
            True while a reachable peer runs a different `distribution` or
            `electLeader`.
        conflicting_policies:
          type: array
          description: >-
            One readable sentence per differing setting, sorted, such as
            `distribution 'spread' != 'single-leader'` (the peer's value
            first).
          items: { type: string }
        candidates_truncated:
          type: integer
          description: >-
            Zero while the leader candidate set fits its gossip cap of 512
            names, otherwise the full candidate count. Present only on the
            gossip backend.
        lease: { $ref: "#/components/schemas/ClusterLease" }
        fleet:
          type: boolean
          description: >-
            Whether the observability overlay serves `GET /fleet` for this
            lease cluster. Present only on a lease backend.
        node_stats: { $ref: "#/components/schemas/NodeStats" }
      additionalProperties: true

    ClusterPeer:
      type: object
      description: One configured gossip peer, as this node last saw it.
      properties:
        host:
          type: string
          description: The configured peer address, `host:port`.
        status:
          type: string
          description: >-
            An open string. Known values are `unknown`, `self`, `agreed`,
            `syncing`, `drifted`, `unreachable`, `untrusted`, and `conflict`.
        job_set_id:
          type: string
          nullable: true
          description: >-
            The peer's job-set ID from its last successful poll, kept after
            a failed one. Null until the first success.
        node_name:
          type: string
          nullable: true
          description: The peer's node name, with the same lifetime as `job_set_id`.
        last_seen:
          type: string
          format: date-time
          nullable: true
          description: The last successful contact, as an ISO 8601 string.
        last_error:
          type: string
          nullable: true
          description: >-
            Why the last poll failed, why a reachable peer is `conflict`, or
            the fingerprint-scheme mismatch that makes it `drifted`. Null
            after any other successful poll.
        mismatch_streak:
          type: integer
          description: >-
            Consecutive polls that saw a different job-set ID. Only
            `agreed` and `self` reset it.
        node_stats: { $ref: "#/components/schemas/NodeStats" }
      required: [host, status, job_set_id, node_name, last_seen, last_error, mismatch_streak, node_stats]
      additionalProperties: true

    ClusterLease:
      type: object
      description: >-
        The leadership lease as this node last observed it. Present only on
        a lease backend. Each backend sends its own subset of these keys.
        Before the first observation, `holder` and `expiry` are null.
      properties:
        holder:
          type: string
          nullable: true
          description: >-
            The lease holder's identity, or `<unknown holder>` while the
            store does not say who holds the lease. Null before the first
            observation.
        expiry:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the lease lapses, as an ISO 8601 string. `kubernetes`
            reports it only while this node leads. `etcd` keeps the value
            after this node loses the lease, so compare `holder` with
            `identity` before reading it as live.
        identity: { type: string, description: This node's identity in the election. }
        electionName: { type: string, description: The election's name (`etcd` and `filesystem`). }
        fence:
          type: integer
          nullable: true
          description: The holder's takeover counter (`filesystem`).
        path: { type: string, description: The lease store's path (`filesystem`). }
        name: { type: string, description: The Lease object's name (`kubernetes`). }
        namespace: { type: string, nullable: true, description: The Lease object's namespace (`kubernetes`). }
        leaseId:
          type: string
          nullable: true
          description: The etcd lease ID, as a decimal string (`etcd`).
      additionalProperties: true

    NodeStats:
      type: object
      nullable: true
      description: >-
        A node's live CPU and memory. Null when the node cannot sample them
        (no psutil, or a failed read). A peer's figures arrive through
        gossip, so each key is present only when it passed validation, every
        figure except `cpu_count` is a JSON number that can carry a fraction
        (byte counts included), and the object expires to null after three
        poll intervals without a fresh reading.
      properties:
        cpu_percent:
          type: number
          description: CPU use, 0 to 100.
        cpu_count:
          type: integer
          description: >-
            The number of logical CPUs. A peer's count outside the signed
            64-bit range is dropped.
        mem_percent: { type: number }
        mem_used_bytes: { type: number, description: In bytes. }
        mem_total_bytes: { type: number, description: In bytes. }
        proc_rss_bytes:
          type: number
          description: The daemon's own resident memory, in bytes. Absent when the read is denied.
        proc_cpu_percent:
          type: number
          description: The daemon's own CPU use. Absent when the read is denied.
      additionalProperties: true

    FleetView:
      type: object
      description: >-
        Every node's per-job run summaries. A daemon with no cluster, or a
        lease cluster without the observability overlay, answers
        `{"enabled": false, "nodes": []}`. On a lease cluster the other keys
        describe the overlay, whose backend is always `gossip`.
      properties:
        enabled: { type: boolean }
        nodes:
          type: array
          description: This node first, then each distinct peer.
          items: { $ref: "#/components/schemas/FleetNode" }
        backend:
          type: string
          description: An open string. The known value is `gossip`.
        node_name: { type: string }
        distribution:
          type: string
          description: An open string. Known values are `single-leader` and `spread`.
        elect_leader: { type: boolean }
        interval:
          type: number
          description: >-
            The gossip poll interval, in seconds: how stale a healthy
            peer's `as_of` can be.
      required: [enabled, nodes]
      additionalProperties: true

    FleetNode:
      type: object
      description: One node of the fleet view.
      properties:
        node_name:
          type: string
          nullable: true
          description: Null on a peer until its first successful poll.
        host:
          type: string
          nullable: true
          description: The configured peer address. Null on this node's own entry.
        self: { type: boolean }
        status:
          type: string
          description: >-
            `self` on this node's own entry. A peer carries the
            `ClusterPeer.status` vocabulary. An open string.
        as_of:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the summaries were current: now for this node, the last
            successful contact for a peer, or null when a peer was never
            reached.
        jobs:
          type: object
          nullable: true
          description: >-
            The node's job summaries keyed by job name. Null when no
            snapshot ever arrived from the peer, which differs from `{}`, a
            node with no jobs.
          additionalProperties: { $ref: "#/components/schemas/FleetJobSummary" }
        truncated:
          type: boolean
          description: True when the node advertises only the first 512 jobs by name.
        node_stats: { $ref: "#/components/schemas/NodeStats" }
      required: [node_name, host, self, status, as_of, jobs, truncated, node_stats]
      additionalProperties: true

    FleetJobSummary:
      type: object
      description: One job as a node of the fleet reports it.
      properties:
        running: { type: boolean }
        enabled: { type: boolean }
        scheduled_in:
          type: number
          nullable: true
          description: >-
            Seconds until the next fire, aged to the time of the response
            for a peer. Null while the job runs, when it is disabled or
            `@reboot`, and when it never fires.
        last:
          type: object
          nullable: true
          description: >-
            The node's last finished run, or null when the node has no
            record of one. A node without a `state:` store records only the
            runs since it started. A peer reports only `success`, `failure`,
            and `cancelled` runs, so its other outcomes read as null.
          properties:
            outcome:
              type: string
              description: >-
                An open string. Known values are `success`, `failure`,
                `cancelled`, `unknown`, and `skipped`.
            finished_at:
              type: string
              description: >-
                When the run finished. This node writes an ISO 8601 string,
                and relays a peer's value unchecked, up to 64 printable
                characters.
            duration: { type: number, nullable: true, description: In seconds. }
            exit_code:
              type: integer
              nullable: true
              description: >-
                The run's exit code. A peer's exit code outside the signed
                64-bit range reads as null.
          additionalProperties: true
      required: [running, enabled, scheduled_in, last]
      additionalProperties: true

    NodeView:
      type: object
      properties:
        node_name: { type: string }
        resources:
          type: object
          nullable: true
          properties:
            cpu_percent: { type: number }
            cpu_count: { type: integer }
            mem_percent: { type: number }
            mem_used_bytes: { type: integer }
            mem_total_bytes: { type: integer }
            proc_rss_bytes: { type: integer }
            proc_cpu_percent: { type: number }
          additionalProperties: true
        limits: { $ref: "#/components/schemas/LimitsCapability" }
      additionalProperties: true

    StateInventory:
      type: object
      description: >-
        The state store's health, topology, and inventory. A daemon without
        a store, and one whose store failed to start, answer
        `{"enabled": false}`. When the inventory walk fails or times out,
        the answer keeps `view`, `stats`, and `node`, and reports
        `enumerable: false` with empty groups.
      properties:
        enabled: { type: boolean }
        enumerable:
          type: boolean
          description: False when the store cannot list its contents or the walk failed.
        view: { $ref: "#/components/schemas/StateView" }
        stats: { $ref: "#/components/schemas/StateStats" }
        records:
          type: object
          description: >-
            Record streams grouped by prefix, the part of the stream name
            before its first `/`, such as `runs` or `artifacts`.
          additionalProperties: { $ref: "#/components/schemas/StateGroup" }
        documents:
          type: object
          description: Document namespaces grouped by prefix, such as `kv` or `dagrun`.
          additionalProperties: { $ref: "#/components/schemas/StateGroup" }
        leases:
          type: array
          description: >-
            The leases that are held or have lapsed without a release, at
            most 200 in all.
          items: { $ref: "#/components/schemas/StateLease" }
        quarantine:
          type: integer
          description: The number of entries in the store's quarantine.
        node: { $ref: "#/components/schemas/StateNode" }
      required: [enabled]
      additionalProperties: true

    StateView:
      type: object
      description: >-
        The store's backend and topology. `path`, `namespace`,
        `shared_locking`, and `job_set_id` are present on the `filesystem`
        backend.
      properties:
        backend:
          type: string
          description: An open string. The known value is `filesystem`.
        topology:
          type: string
          description: >-
            An open string. Known values are `shared`, `single-node`, and
            `unknown` (before the store starts).
        path: { type: string, description: The store's absolute path for this namespace. }
        namespace:
          type: string
          description: The `deploymentId`, or `default`.
        shared_locking:
          type: boolean
          description: True when a lease excludes across hosts (the `shared` topology).
        job_set_id: { type: string }
      required: [backend, topology]
      additionalProperties: true

    StateStats:
      type: object
      description: >-
        The store's counters since the backend started. A reload that
        changes the `state:` section starts a new backend with fresh
        counters. Empty for a backend that keeps none.
      properties:
        ops:
          type: object
          description: >-
            Per-operation counters keyed by operation name, such as `list`
            or `doc-read`. An operation appears after its first run.
          additionalProperties: { $ref: "#/components/schemas/StateOpStat" }
        lock:
          type: object
          properties:
            acquisitions:
              type: integer
              description: >-
                Advisory file-lock acquisitions by the store, for documents,
                leases, and garbage collection.
            wait_seconds:
              type: number
              description: Total time spent waiting for the store's advisory locks, in seconds.
          additionalProperties: true
        throttle:
          type: object
          description: Operations that `maxOpsPerSecond` delayed. Lease operations bypass it.
          properties:
            count: { type: integer }
            wait_seconds:
              type: number
              description: Total delay, in seconds.
          additionalProperties: true
        workers:
          type: object
          description: >-
            Worker lane occupancy. An `*_inflight` value that stays at its
            capacity across polls means the store is not answering.
          properties:
            bulk_inflight: { type: integer }
            bulk_peak: { type: integer }
            bulk_capacity: { type: integer }
            lease_inflight: { type: integer }
            lease_peak: { type: integer }
            lease_capacity: { type: integer }
          additionalProperties: true
      additionalProperties: true

    StateOpStat:
      type: object
      description: One store operation's counters.
      properties:
        count: { type: integer }
        errors: { type: integer }
        seconds:
          type: number
          description: >-
            Total time in the store, in seconds, excluding queueing and
            throttling. The mean is `seconds / count`.
      required: [count, errors, seconds]
      additionalProperties: true

    StateGroup:
      type: object
      description: The streams or namespaces that share one prefix.
      properties:
        count:
          type: integer
          description: >-
            The number of records or documents across every stream of the
            prefix, listed or not.
        streams:
          type: integer
          description: >-
            The number of streams or namespaces, empty ones included. A
            value above the length of `scopes` means the list is truncated.
        scopes:
          type: array
          description: At most 200 scopes, sorted by their percent-encoded on-disk name.
          items: { $ref: "#/components/schemas/StateScope" }
      required: [count, streams, scopes]
      additionalProperties: true

    StateScope:
      type: object
      description: One stream or namespace of a prefix.
      properties:
        scope:
          type: string
          description: >-
            The name after the prefix's first `/`, which can itself contain
            `/`. Empty for a stream named by its prefix alone, such as
            `meta`. A stream is `<prefix>/<scope>`, or the prefix alone when
            the scope is empty.
        count:
          type: integer
          description: The number of records or documents, which can be 0.
      required: [scope, count]
      additionalProperties: true

    StateLease:
      type: object
      description: One lease in the store.
      properties:
        name:
          type: string
          description: The lease name, such as `slots/<job>` or `dagadvance/<dag>/<run key>`.
        holder: { type: string }
        fence: { type: integer }
        expiresAt:
          type: number
          description: When the lease lapses, in epoch seconds.
        expired:
          type: boolean
          description: True when `expiresAt` has passed without a release.
      required: [name, holder, fence, expiresAt, expired]
      additionalProperties: true

    StateNode:
      type: object
      description: This node's own retry and slot state, read from memory.
      properties:
        host:
          type: string
          description: The host name that this node writes into its records.
        retries:
          type: array
          description: This node's armed retry sequences.
          items: { $ref: "#/components/schemas/StateRetry" }
        slots:
          type: array
          description: The cluster concurrency slots that this node holds.
          items: { $ref: "#/components/schemas/StateSlot" }
      required: [host, retries, slots]
      additionalProperties: true

    StateRetry:
      type: object
      description: >-
        One armed retry sequence, as in `Job.retry` without
        `maxAttempts`.
      properties:
        job: { type: string }
        attempt:
          type: integer
          description: The number of the retry that is armed or running, starting at 1.
        nextRetryAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the armed retry fires, as an ISO 8601 string. It stays in
            the past while that retry runs.
        delaySeconds:
          type: number
          nullable: true
          description: The backoff delay before the armed retry, in seconds.
      required: [job, attempt, nextRetryAt, delaySeconds]
      additionalProperties: true

    StateSlot:
      type: object
      description: One cluster concurrency slot that this node holds.
      properties:
        slot:
          type: string
          description: The job name. The slot's lease is `slots/<job>`.
        holder:
          type: string
          description: The lease holder, as `<host>#<process token>`.
        fence: { type: integer }
        expiresAt:
          type: number
          description: When the lease lapses, in epoch seconds.
        refs:
          type: integer
          description: The number of this node's live instances that use the slot.
      required: [slot, holder, fence, expiresAt, refs]
      additionalProperties: true

    StateDocumentsPage:
      type: object
      description: >-
        Every document of one namespace, in the store's listing order and
        unpaginated. A store that fails or times out answers an empty list.
      properties:
        namespace:
          type: string
          description: The requested `ns`.
        documents:
          type: array
          items: { $ref: "#/components/schemas/StateDocument" }
      required: [namespace, documents]
      additionalProperties: true

    StateDocument:
      type: object
      description: >-
        One document. A `kv/` document carries `key`, `updatedAt`,
        `valueSize`, and `valueType` in place of its value. A `cursor/`
        document carries `name`, `value`, and `updatedAt`. An `idem/`
        document carries `key`, `claimedAt`, and, for a claim with a TTL,
        `expiresAt`.
      properties:
        key: { type: string }
        name: { type: string }
        value:
          description: A cursor's stored watermark, as a JSON value.
        updatedAt:
          type: number
          description: When the document was last written, in epoch seconds.
        valueSize:
          type: integer
          nullable: true
          description: >-
            The size of the KV value's JSON encoding, in bytes, measured
            with ASCII escapes. An approximation of the stored size.
        valueType:
          type: string
          description: >-
            The KV value's type. An open string. Known values are `str`,
            `int`, `float`, `bool`, `list`, `dict`, and `NoneType`.
        claimedAt:
          type: number
          description: When the idempotency key was claimed, in epoch seconds.
        expiresAt:
          type: number
          description: When the claim lapses, in epoch seconds.
      additionalProperties: true

    StateRecordsPage:
      type: object
      description: >-
        The newest records of one stream, newest first. A store that fails
        or times out answers an empty list.
      properties:
        stream:
          type: string
          description: The requested `stream`.
        records:
          type: array
          description: >-
            Full record bodies, without a record ID or write time. Each
            prefix writes its own shape: a `runs/` record is a `JobRun`
            with its chart series, for example.
          items: { type: object, additionalProperties: true }
      required: [stream, records]
      additionalProperties: true
