# The public interactive demo instance (demo.cronstable.com).
#
# This board backs the dashboard anyone can open at demo.cronstable.com, the
# companion app's "Try the demo" button, and App Store review. It is one
# plausible homelab (media library, photo pipeline, backups, home sensors,
# family reminders) curated as a feature tour: every job exists to light up
# one capability, and its name, comment and log lines say which, so a
# first-time visitor can answer "what can this thing do?" by scrolling.
#
# Public access is explicitly bounded by the demo gateway. Visitors can run,
# cancel, pause/resume the allowlisted samples and trigger/decide workflows.
# Starts share a ten-second cooldown; pauses last one minute, public notes and
# attribution are fixed, and only one active run per workflow may be started
# by visitors. Administration, backfill and device pairing remain private.
# The public view token stays compatible with existing companion-app builds.
# The gateway and demo-operator use a PRIVATE control+approve token.
# No push block: real APNs pairing/delivery still needs a separate test server.
# All work is simulated locally; no backup, firmware or media service is touched.
#
# Every command here runs on both supported hosts: bash plus python3 only, no
# curl and no coreutils-only binaries, because the container image is
# python:3.14-slim and the native host is a Mac.
#
# Bring-up: launchd/install.sh (native launchd agent + Cloudflare Tunnel, the
# live deployment) or docker-compose.yml next to this file. Both retarget the
# state path and the listener; see README.md.

# Two classic crontab lines, migrated as-is: cronstable lowers Vixie-style
# entries into normal jobs whose names embed their line numbers, and the
# schedule doctor lints them like everything else (the */45 below earns an
# uneven-step warning it deserved all along).
include:
  - legacy.crontab

defaults:
  shell: /bin/bash
  captureStdout: true
  captureStderr: true
  concurrencyPolicy: Forbid
  executionTimeout: 30
  killTimeout: 2

# Durable run history: job detail and run screens stay populated across daemon
# restarts, jobs get the loopback state API (cursor/idempotent/lock/artifact/
# secret/xcom below), and the DAGs require the store for run documents.
# maxRunsPerJob bounds ledger growth on a board that runs 24/7.
state:
  path: /var/lib/cronstable/state
  maxRunsPerJob: 200
  jobApi:
    enabled: true

web:
  # Plaintext on the local port; TLS is the tunnel's job.
  listen:
    - http://0.0.0.0:8080
  # The standard daemon grants anonymous read access. The gateway adds
  # bounded visitor actions using a private credential on the internal API.
  anonymousScopes:
    - view
  # Prometheus exposition, tokenless by design: `curl demo.cronstable.com/metrics`
  # works with no credential at all, a small proof the instance is real.
  metrics:
    enabled: true
    public: true
  # Node CPU/memory ring behind the dashboard header meter and the app's node
  # tab: 5s resolution, two hours of window.
  nodeHistory:
    interval: 5
    points: 1440
  authTokens:
    - label: public-demo-viewer
      scopes:
        - view
      fromEnvVar: CRONSTABLE_DEMO_VIEW_TOKEN
    # The gateway and scripted operator's credential (see the header and
    # demo-operator job). control+approve imply view. Generated per host by
    # launchd/install.sh; never checked in and never defaulted.
    #
    # Both bring-up paths guarantee it is set, and they have to: an
    # authTokens entry whose source resolves empty fails closed, and that
    # takes the whole web API down (jobs keep running, nothing serves,
    # including the anonymous view). Running this config by hand without
    # the variable is the one way to see that, and the daemon logs it.
    - label: demo-operator
      scopes:
        - control
        - approve
      fromEnvVar: CRONSTABLE_DEMO_OPERATOR_TOKEN

jobs:
  # =====================================================================
  #  Pulse: the board is alive the moment you open it
  # =====================================================================

  # [shows: @reboot] A first run the moment the daemon starts, so a fresh
  # deploy is never an empty board. With the durable store above, @reboot
  # fires once per OS boot where the platform exposes a boot identity
  # (Linux); macOS has none, so on the launchd host every daemon start
  # counts as a fresh boot and re-fires it. Its log doubles as the board's
  # welcome mat and names the scripted operator honestly.
  - name: welcome
    command: |
      echo "cronstable public demo up on $HOSTNAME at $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
      echo "every job on this board exists to show one capability; scroll and read"
      echo "you are reading this without a token: this instance grants anonymous view scope"
      echo "try Run now on the sample jobs or trigger firmware-rollout and decide its approval gate"
      echo "work is simulated; starts have a shared 10s cooldown and visitor pauses last 60s"
    schedule: "@reboot"

  # [shows: durable KV counter] The steady green pulse, with a proof of
  # durability: the beat number lives in the state store, so it keeps counting
  # across daemon restarts and redeploys instead of resetting.
  - name: heartbeat
    command: |
      n=$(cronstable state get beats 2>/dev/null || echo 0)
      n=$((n + 1))
      cronstable state set beats "$n" 2>/dev/null || true
      echo "beat $n at $(date -u +%H:%M:%S) UTC (the count survives restarts: it lives in the durable state store)"
    schedule: "* * * * *"

  # [shows: seconds-field scheduling + argv-list command] The object schedule
  # form takes a `second` field, which makes the whole scheduler tick
  # per-second; watch the countdown on this row run in seconds. The command is
  # a list, so it executes directly with no shell in between.
  - name: load-pulse
    schedule:
      second: "*/20"
    concurrencyPolicy: Forbid
    executionTimeout: 10
    command:
      - python3
      - -c
      - "import os; l = os.getloadavg(); print(f'load {l[0]:.2f} {l[1]:.2f} {l[2]:.2f} (1/5/15 min)')"

  # =====================================================================
  #  Live logs and long runners: something is almost always Running
  # =====================================================================

  # [shows: live log streaming (SSE)] Streams a line per second for ~20 s: open
  # the job and watch the tail move. The lines rotate through the house's
  # telemetry vocabulary so the stream reads like a homelab, not a counter.
  - name: sensor-sweep
    command: |
      echo "sweeping 20 telemetry points..."
      for i in $(seq 1 20); do
        case $((i % 4)) in
          1) echo "point $i/20: attic $((RANDOM % 8 + 24)).$((RANDOM % 9))C, humidity $((RANDOM % 20 + 40))%" ;;
          2) echo "point $i/20: NAS fans $((RANDOM % 400 + 800)) rpm, drives cool" ;;
          3) echo "point $i/20: UPS on line power, battery $((RANDOM % 5 + 95))%" ;;
          0) echo "point $i/20: garage door closed, beam clear ($(date -u +%T))" ;;
        esac
        sleep 1
      done
      echo "sweep complete: 20/20 nominal"
    schedule: "*/3 * * * *"

  # [shows: Forbid concurrency + progress logs + duration variance]
  # Four to six one-second batches simulate index work without CPU stress.
  - name: media-reindex
    command: |
      batches=$((RANDOM % 3 + 4))
      echo "reindexing library in $batches batches..."
      for i in $(seq 1 $batches); do
        echo "[demo] metadata read and index write simulated; no media files opened"
        echo "batch $i/$batches indexed ($((i * 512)) items)"
        sleep 1
      done
      echo "reindex complete: $((batches * 512)) items"
    schedule: "*/15 * * * *"
    concurrencyPolicy: Forbid
    monitorResources:
      interval: 0.5
      history: 240

  # [shows: Replace concurrency + cancellation + shared mutex]
  # A 12–16 second simulated render can be replaced or cancelled by a visitor.
  - name: cam-timelapse
    schedule: "2-57/5 * * * *"
    concurrencyPolicy: Replace
    monitorResources: true
    command: |
      segs=$((RANDOM % 3 + 6))
      echo "stitching driveway-cam stills ($segs segments planned)"
      i=1
      while [ $i -le $segs ]; do
        echo "segment $i/$segs rendered at $(date -u +%T)"
        sleep 2
        i=$((i + 1))
      done
      cronstable lock run --global --wait --timeout 5 photo-library -- sh -c 'echo "publishing segments into the shared photo library (holds the photo-library mutex)"; sleep 1'
      echo "timelapse updated: $segs segments"

  # =====================================================================
  #  Failure school: every way a run can go wrong, each on its own job
  # =====================================================================

  # [shows: the incident showcase + SLA breach + archived output] always fails,
  # with a log tail worth reading; the stderr lines are what a push payload's
  # log_tail would carry for a real failure. It never succeeds, so its
  # maxTimeSinceSuccess SLA is permanently breached: this one row carries the
  # OVERDUE badge, and archiveOutput keeps every failure's output readable in
  # the durable ledger.
  - name: backup-verify
    command: |
      echo "verify: opening snapshot catalog..."
      echo "verify: snapshot $(date -u +%Y-%m-%d)T01:00Z has 41,283 entries"
      echo "ERROR: checksum mismatch in chunk 0x9f31 (media/photos/2019/IMG_2214.jpg)" 1>&2
      echo "ERROR: 3 of 41,283 objects failed verification" 1>&2
      echo "hint: run 'restic check --read-data' on the backup host" 1>&2
      exit 1
    schedule: "*/10 * * * *"
    sla:
      maxTimeSinceSuccessSeconds: 3600
    archiveOutput: true

  # [shows: SLA panel, healthy + the duplicates panel] backup-verify's
  # counterpart: same */10 spelling on purpose (the schedule tab's duplicate
  # detector pairs them), but this one always succeeds, so its job detail shows
  # a live green SLA panel next to its neighbor's permanent breach. The small
  # random sleep keeps its Trends duration chart honest.
  - name: offsite-snapshot
    command: |
      sleep $((RANDOM % 3 + 2))
      echo "snapshot shipped at $(date -u +%T) ($((RANDOM % 400 + 200)) MiB)"
    schedule: "*/10 * * * *"
    sla:
      maxTimeSinceSuccessSeconds: 1800
      maxRuntimeSeconds: 300

  # [shows: retry with exponential backoff] Fails about a third of the time,
  # and retries usually rescue it: catch the Retrying state and the attempt
  # timeline. (The demo-operator also pauses this job for 15 minutes a few
  # times a day, so the Paused badge and pause note get stage time too.)
  - name: feed-sync
    command: |
      echo "pulling 14 feeds at $(date -u +%T)..."
      if (( RANDOM % 3 == 0 )); then
        echo "upstream 502 from feeds.example.net, will retry" 1>&2
        exit 6
      fi
      echo "14/14 feeds fresh"
    schedule: "*/5 * * * *"
    onFailure:
      retry:
        maximumRetries: 3
        initialDelay: 5
        maximumDelay: 60
        backoffMultiplier: 2

  # [shows: failsWhen.producesStderr, failure by output, not exit code] Always
  # exits 0; a few times a day it prints one stderr warning and that alone
  # marks the run failed. Cron's oldest gotcha, made explicit. The inline
  # environment value it echoes shows per-job env injection.
  - name: config-drift-check
    command: |
      echo "auditing homelab configs against baseline $DRIFT_BASELINE"
      if [ "$(date -u +%-M)" = "39" ] && [ $(( $(date -u +%-H) % 3 )) -eq 0 ]; then
        echo "drift: docker-compose.media.yml differs from baseline (2 keys)" 1>&2
      fi
      echo "audit pass complete (exit code 0 either way; stderr is the verdict)"
    schedule: "9-54/15 * * * *"
    environment:
      - key: DRIFT_BASELINE
        value: main@4f2c9e1
    failsWhen:
      producesStdout: false
      producesStderr: true
      nonzeroReturn: true

  # [shows: executionTimeout + killTimeout] Probes the dashboard's own loopback
  # endpoint and reports the round-trip. Four times a day it "hangs" past its
  # 30 s budget and cronstable terminates it: the run records a timeout
  # fail_reason (the classic exit 137/143 story).
  - name: gateway-probe
    command: |
      echo "probing the local dashboard endpoint (loopback)..."
      python3 -c "
      import os, time, urllib.request
      start = time.monotonic()
      with urllib.request.urlopen(os.environ['DEMO_WEB_URL'] + '/metrics', timeout=10) as r:
          r.read()
          print(f'answered HTTP {r.status} in {time.monotonic() - start:.3f}s')
      "
      if [ "$(date -u +%-M)" = "40" ] && [ $(( $(date -u +%-H) % 6 )) -eq 1 ]; then
        echo "response stalled mid-read; waiting on the socket..."
        sleep 120
      fi
      echo "probe complete"
    schedule: "*/20 * * * *"
    executionTimeout: 30
    killTimeout: 5
    # The daemon's own listener, injected rather than hardcoded so a
    # re-hosted board (a different port, a different bind) edits one line.
    environment:
      - key: DEMO_WEB_URL
        value: http://127.0.0.1:8080

  # =====================================================================
  #  Durable state primitives: cursor, idempotency, depends-on-past
  # =====================================================================

  # [shows: cursor watermark + onlyIfLastSucceeded (depends-on-past)] An
  # incremental export: each run reads the durable watermark, exports "rows",
  # and advances it (advance is monotonic; a replay can never move it
  # backwards). Six times a day it aborts before the watermark moves, and
  # onlyIfLastSucceeded then skips the next scheduled fire rather than export on
  # top of a failure; the demo-operator clears the gate with a manual start,
  # which is exactly the operator override the gate is designed for.
  - name: meter-export
    schedule: "4-54/10 * * * *"
    onlyIfLastSucceeded: true
    command: |
      set -u
      last=$(cronstable cursor get meter-rows 2>/dev/null || echo 0)
      if [ "$(date -u +%-M)" = "44" ] && [ $(( $(date -u +%-H) % 4 )) -eq 1 ]; then
        echo "smart-meter bridge returned a torn page at row $last; aborting before the watermark moves" 1>&2
        exit 1
      fi
      rows=$((RANDOM % 40 + 10))
      next=$((last + rows))
      echo "exporting meter rows $last..$next"
      sleep $((rows / 10 + 2))
      # advance echoes the new value; the narrated line below is the one
      # worth reading in the log
      cronstable cursor advance meter-rows "$next" > /dev/null
      echo "watermark now $next"

  # [shows: exactly-once via `cronstable idempotent`] Scheduled hourly on
  # purpose, rotates exactly once per day: the first run of the day wins the
  # claim (exit 0), later runs find it taken (exit 5) and skip, and a store
  # error (exit 1) fails the run rather than guessing "already done".
  - name: rotate-journal
    schedule: "0 * * * *"
    command: |
      set -u
      key="journal-$(date -u +%F)"
      cronstable idempotent "$key" && rc=0 || rc=$?
      if [ "$rc" -eq 0 ]; then
        echo "rotating the homelab journal for $(date -u +%F) (won claim $key)"
        sleep 2
        echo "journal rotated and compressed"
      elif [ "$rc" -eq 5 ]; then
        echo "journal already rotated today (claim $key taken); nothing to do"
      else
        echo "state store unreachable; failing rather than guessing" 1>&2
        exit "$rc"
      fi

  # [shows: resource samples + below-normal priority + shared mutex]
  # Four 256 KiB buffers model a pipeline in eight seconds; no AI inference.
  - name: photo-tagger
    schedule: "7-59/15 * * * *"
    priority: below-normal
    monitorResources:
      interval: 0.5
      history: 240
    command: |
      echo "[demo] simulating photo tags with a 1 MiB sample buffer; no photos or model loaded"
      python3 - <<'PY'
      import time
      blobs = []
      for step in range(4):
          blobs.append(bytearray(256 * 1024))
          print(f"[demo] tagging pass {step + 1}/4: sample buffer {256 * (step + 1)} KiB; no AI model", flush=True)
          time.sleep(2)
      print("tagged 214 photos; releasing model memory")
      PY
      cronstable lock run --global --wait --timeout 5 photo-library -- sh -c 'echo "writing tags into the shared photo library (holds the photo-library mutex)"; sleep 1'

  # =====================================================================
  #  Schedule showpieces: the schedule tab, calendar, and lint findings
  # =====================================================================

  # [shows: H hashed schedules + missed-run catch-up (run-all)] `H/10` picks
  # this job's own stable phase from a hash of its name, the cure for
  # every-job-at-:00 stampedes; the schedule tab names the exact minutes it
  # resolved to. After daemon downtime, run-all replays each missed slot (up to
  # 2 h back, launches spread by catch-up jitter), so a redeploy leaves a
  # visible catch-up burst in the ledger.
  - name: metrics-rollup
    schedule: "H/10 * * * *"
    onMissed: run-all
    startingDeadlineSeconds: 7200
    catchupJitterSeconds: 20
    environment:
      - key: DEMO_WEB_URL
        value: http://127.0.0.1:8080
    command: |
      python3 -c "
      import os, urllib.request
      with urllib.request.urlopen(os.environ['DEMO_WEB_URL'] + '/metrics', timeout=10) as r:
          body = r.read().decode('utf-8', 'replace')
      series = sum(1 for line in body.splitlines() if line.startswith('cronstable_'))
      print(f'rolled up {series} cronstable series from /metrics')
      "
      echo "that endpoint is public on this demo: curl https://demo.cronstable.com/metrics yourself, no token needed"

  # [shows: the uneven-step lint warning] */7 does not divide 60, so the last
  # interval of each hour is short; the schedule doctor flags it. The warning
  # badge on this row is the point.
  - name: dns-flush
    schedule: "*/7 * * * *"
    command: echo "flushed $((RANDOM % 300 + 100)) cached lookups from the lab resolver"

  # [shows: LW, last weekday of the month] Business-day cron: fires on the final
  # Mon-Fri of every month, skipping the weekend, and the daemon works out
  # where the month ends. The week calendar renders the odd cadence.
  - name: bill-reminder
    schedule: "0 9 LW * *"
    command: 'echo "utilities autopay clears today (last weekday): balances checked, nothing overdrawn"'

  # [shows: nth-weekday (sun#1) + idle priority + archived output] The monthly
  # storage-pool scrub, first Sunday at 02:00, at idle priority so it never
  # outranks real work (lowering priority needs no privilege; raising does).
  # archiveOutput keeps each month's scrub report forever.
  - name: pool-scrub
    schedule: "0 2 * * sun#1"
    priority: idle
    archiveOutput: true
    monitorResources: true
    command: |
      echo "monthly scrub of the storage pool (idle priority)"
      for disk in ssd0 hdd1 hdd2; do
        echo "[demo] checking a synthetic block list; no disk scan performed"
        sleep 1
        echo "$disk: surface pass clean"
      done
      echo "scrub complete: 0 repaired, 0 unrecoverable"

  # [shows: L-3 (offset from month end) + run-scoped secrets + redaction]
  # Renewal check three days before month end, whatever length the month has.
  # Its dummy account key is a run-scoped secret served over the loopback
  # endpoint (never via the environment); the job proves it has it by printing
  # only its length, and redactArchivedSecrets scrubs the value from the
  # archived output should it ever leak into a log line.
  - name: cert-check
    schedule: "0 4 L-3 * *"
    archiveOutput: true
    redactArchivedSecrets: true
    secrets:
      - name: ACME_ACCOUNT_KEY
        value: demo-acme-key-000000000000
    command: |
      set -u
      key=$(cronstable secret get ACME_ACCOUNT_KEY)
      echo "renewal window opens 3 days before month end; account key staged (${#key} chars, value never printed)"
      echo "cert lab.internal: 41 days left; no renewal needed"

  # [shows: per-job timezone + DST advisory + weekday names] Runs on New York
  # market mornings; 09:30 America/New_York is DST-sensitive, and the schedule
  # tab names the next transition.
  - name: market-open-note
    schedule: "30 9 * * mon-fri"
    timezone: America/New_York
    command: 'echo "market open: refreshed the ticker tile on the kitchen wallboard"'

  # [shows: a second timezone] Sends at 21:00 Tokyo time, whatever that is here:
  # per-job timezones make "9 pm at grandma's" a one-liner.
  - name: photo-frame-sync
    schedule: "0 21 * * *"
    timezone: Asia/Tokyo
    command: echo "queued 12 new photos for the family frame in Osaka (arrives 9 pm their time)"

  # [shows: @daily nickname + utc:false + onMissed run-once + workingDirectory]
  # The nightly report in local time. If the host was down over midnight,
  # run-once coalesces however many days were missed into one catch-up run at
  # startup (bounded to 12 h). workingDirectory is the "Start in" knob; pwd in
  # the output proves it.
  - name: disk-report
    schedule: "@daily"
    utc: false
    onMissed: run-once
    startingDeadlineSeconds: 43200
    workingDirectory: /tmp
    command: |
      echo "nightly disk report, running from $(pwd)"
      df -h / | tail -1
      echo "report filed"

  # [shows: weekday hour-ranges + the heatmap's diurnal shape] Weekday mornings
  # only: the kitchen wallboard gets weather, the family calendar, and the bus
  # ETA at the top of hours 6-9 local. Together with the :00 herd this makes
  # mornings visibly hotter than nights on the pressure heatmap, which is
  # exactly the shape the suggest tool exists to read.
  - name: morning-briefing
    schedule: "0 6-9 * * mon-fri"
    utc: false
    command: |
      echo "refreshing the kitchen wallboard for the $(date +%H):00 block"
      sleep $((RANDOM % 3 + 2))
      echo "weather, family calendar, and bus-ETA tiles updated"

  # [shows: the duplicates panel's second group + the :00 herd] Shares
  # rotate-journal's exact `0 * * * *` spelling on purpose: the duplicate
  # detector shows a second group (backup-verify/offsite-snapshot at */10 is the
  # first), and the top-of-hour stampede gets one more member for the pressure
  # heatmap to point at.
  - name: thermostat-sync
    schedule: "0 * * * *"
    command: |
      echo "reading 6 thermostat setpoints..."
      sleep $((RANDOM % 6 + 2))
      echo "6/6 zones synced to the schedule ($((RANDOM % 3 + 19))C target)"

  # [shows: the never-fires lint finding] The 6th field is a year; pinning a
  # past year is the documented idiom for parking a job without deleting its
  # config. The scheduler drops it from the fire index and every surface reports
  # never_fires with a warning badge.
  - name: ipv6-cutover
    schedule: "0 3 1 1 * 2020"
    command: echo "dual-stack migration runbook (completed 2020; parked by pinning the year, kept for the audit trail)"

  # =====================================================================
  #  Manual, disabled, and the scripted operator
  # =====================================================================

  # [shows: a visitor-started restore drill] Two seconds, fixed output,
  # and no data access; Run now works for anyone through the gateway.
  - name: restore-drill
    command: |
      echo "[demo] restore drill: selected a synthetic backup snapshot"
      sleep 1
      echo "restored 12 sample records to a disposable scratch database (simulated)"
      sleep 1
      echo "12/12 checks passed; no real files or databases were changed"
    schedule: "0 3 1 1 *"

  # [shows: enabled:false] The disabled state.
  - name: legacy-mirror
    enabled: false
    command: echo "decommissioned 2025; kept for reference"
    schedule: "0 4 * * *"

  # Private housekeeping, excluded from the gateway. Once a minute it
  # resolves gates older than five minutes, rescues a depends-on-past job,
  # and occasionally demonstrates a scheduled maintenance window.
  - name: demo-operator
    schedule: "* * * * *"
    executionTimeout: 60
    secrets:
      - name: OPERATOR_TOKEN
        fromEnvVar: CRONSTABLE_DEMO_OPERATOR_TOKEN
    environment:
      - key: DEMO_WEB_URL
        value: http://127.0.0.1:8080
    command: |
      set -u
      OPERATOR_TOKEN=$(cronstable secret get OPERATOR_TOKEN 2>/dev/null) || { echo "operator token not staged on this host; standing down"; exit 0; }
      export OPERATOR_TOKEN
      python3 - <<'PY'
      import json, os, urllib.error, urllib.request
      from datetime import datetime, timezone

      BASE = os.environ["DEMO_WEB_URL"]
      BY = "demo-operator"
      TOKEN = os.environ["OPERATOR_TOKEN"]

      def call(method, path, body=None):
          req = urllib.request.Request(BASE + path, method=method)
          req.add_header("Authorization", "Bearer " + TOKEN)
          data = None
          if body is not None:
              data = json.dumps(body).encode()
              req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, data=data, timeout=10) as resp:
                  return resp.status, json.loads(resp.read() or b"{}")
          except urllib.error.HTTPError as exc:
              return exc.code, {}

      now = datetime.now(timezone.utc)
      minute, hour = now.minute, now.hour

      # 1) decide abandoned firmware-rollout gates after five minutes.
      #
      # An approval task parks forever until someone decides it, and
      # retainRuns only prunes runs that reached success or failed, so a
      # gate nobody answers is a run document that never ages out and gets
      # re-read on every /dags poll. This sweep is therefore the only thing
      # bounding them: it looks back far enough to drain a backlog left by
      # an operator that was down for a while, not just the current hour.
      decision = "reject" if hour % 6 == 3 else "approve"
      _, doc = call("GET", "/dags/firmware-rollout/runs?limit=100")
      for run in doc.get("runs") or []:
          if run.get("state") in ("success", "failed"):
              continue        # terminal: no gate left to decide
          if now.timestamp() - float(run.get("createdAt") or now.timestamp()) < 300:
              continue  # give visitors at least five minutes to decide
          status, _ = call(
              "POST",
              "/dags/firmware-rollout/runs/{}/tasks/approve/decision".format(run["runKey"]),
              {"decision": decision, "by": BY},
          )
          if status == 200:
              print("{}d firmware-rollout run {} as {}".format(decision, run["runKey"], BY))
          # 409 means that run is not sitting at its gate yet (the
          # sensor is still poking); the next sweep catches it

      # 2) meter-export rescue: a manual start bypasses its depends-on-past gate
      _, doc = call("GET", "/jobs/meter-export/runs")
      runs = [r for r in doc.get("runs") or [] if r.get("finished_at")]
      runs.sort(key=lambda r: r["finished_at"], reverse=True)
      for run in runs:
          if run.get("outcome") == "failure":
              finished = datetime.fromisoformat(run["finished_at"].replace("Z", "+00:00"))
              age = (now - finished).total_seconds()
              if age > 720:
                  status, _ = call("POST", "/jobs/meter-export/start")
                  print("meter-export sat failed {}s; manual start to clear its depends-on-past gate (HTTP {})".format(int(age), status))
          break

      # 3) a scripted maintenance window on feed-sync
      if hour % 6 == 2 and 32 <= minute <= 36:
          status, _ = call(
              "POST",
              "/jobs/feed-sync/pause",
              {"durationSeconds": 900, "note": "upstream feed maintenance window (scripted demo)", "by": BY},
          )
          print("paused feed-sync for 15 min (HTTP {})".format(status))

      print("operator sweep complete")
      PY

# =====================================================================
#  Orchestration: three DAGs, one per pattern
# =====================================================================
dags:
  # [shows: dynamic fan-out via XCom expand + fan-in + artifacts] The flagship
  # pipeline: plan the share list, archive each share in parallel (one mapped
  # task instance per share), then write a manifest and publish it to the
  # content-addressed artifact store. Every 30 minutes, history capped.
  - name: nightly-archive
    schedule: "*/30 * * * *"
    onMissed: skip
    retainRuns: 48
    tasks:
      - id: plan
        command: |
          set -eu
          echo '["documents", "media", "homelab-configs", "photos", "paperless"]' | cronstable xcom push --key shares
      - id: archive-share
        dependsOn:
          - plan
        expand:
          fromTask: plan
          key: shares
        command: |
          set -eu
          echo "archiving share $CRONSTABLE_DAG_MAP_ITEM (#$CRONSTABLE_DAG_MAP_INDEX)"
          sleep 1
          echo "share $CRONSTABLE_DAG_MAP_ITEM archived"
      - id: manifest
        dependsOn:
          - archive-share
        command: |
          set -eu
          shares=$(cronstable xcom pull --task plan --key shares)
          manifest=$(mktemp "${TMPDIR:-/tmp}/cronstable-demo-manifest.XXXXXX")
          trap 'rm -f "$manifest"' EXIT
          printf 'archived at %s\nshares: %s\n' "$(date -u +%FT%TZ)" "$shares" > "$manifest"
          cronstable artifact put archive-manifest "$manifest"
          echo "manifest for $shares published to the artifact store"

  # [shows: a frequent pipeline you can catch mid-flight + per-task retries +
  # triggerRule all_done + a deterministic failure] Every 5 minutes: scan,
  # render thumbnails per album in parallel, update the search index, tidy. At
  # the top of odd hours the index task hits a "stale writer" and fails through
  # its retry, so the workflows tab shows real mixed health, and `tidy` runs
  # anyway because all_done counts failures as done.
  - name: photo-pipeline
    schedule: "1-56/5 * * * *"
    onMissed: skip
    retainRuns: 60
    tasks:
      - id: scan
        command: |
          set -eu
          echo '["family", "trips", "garden", "screenshots"]' | cronstable xcom push --key albums
          echo "scanned the inbox: 4 albums have new photos"
      - id: thumbs
        dependsOn:
          - scan
        expand:
          fromTask: scan
          key: albums
        retries: 2
        retryDelaySeconds: 15
        command: |
          set -eu
          n=$((RANDOM % 14 + 4))
          echo "album $CRONSTABLE_DAG_MAP_ITEM: rendering $n thumbnails (worker #$CRONSTABLE_DAG_MAP_INDEX)"
          sleep 2
          echo "album $CRONSTABLE_DAG_MAP_ITEM done"
      - id: index
        dependsOn:
          - thumbs
        retries: 1
        retryDelaySeconds: 45
        command: |
          set -eu
          if [ $(( $(date -u +%-H) % 2 )) -eq 1 ] && [ "$(date -u +%-M)" -lt 5 ]; then
            echo "search index segment locked by a stale writer (clears within the hour)" 1>&2
            exit 1
          fi
          echo "search index updated for 4 albums"
      - id: tidy
        dependsOn:
          - index
        triggerRule: all_done
        command: 'echo "scratch space cleared (all_done: runs after success and after the odd-hour index failure)"'

  # [shows: sensor + human approval + onReject skip + all_done report]
  # A manual trigger reaches the gate in seconds. Visitors have at least five
  # minutes to approve/reject before the private operator cleans up the run.
  - name: firmware-rollout
    schedule: "10 * * * *"
    onMissed: skip
    retainRuns: 48
    tasks:
      - id: stage
        command: |
          set -eu
          v="fw-$(date -u +%Y%m%d-%H)00"
          echo "$v" | cronstable xcom push --key version
          echo "staged $v for the smart-plug fleet"
      - id: canary-window
        type: sensor
        dependsOn:
          - stage
        pokeIntervalSeconds: 2
        pokeTimeoutSeconds: 30
        pokeJitterSeconds: 0
        command: |
          echo "[demo] canary health check passed; ready for your approval"
      - id: approve
        type: approval
        dependsOn:
          - canary-window
        onReject: skip
      - id: apply
        dependsOn:
          - approve
        command: |
          set -eu
          v=$(cronstable xcom pull --task stage --key version)
          echo "rolling $v out to 6 plugs"
          for i in $(seq 1 6); do
            echo "plug $i/6 flashed"
            sleep 1
          done
          echo "$v applied everywhere"
      - id: report
        dependsOn:
          - apply
        triggerRule: all_done
        command: 'echo "rollout report filed (all_done: written whether the gate approved, rejected, or apply failed)"'
