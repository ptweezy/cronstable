[build-system]
requires = ["setuptools>=83", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cronstable"
description = "A cron replacement with retries, alerts, saved run history, workflows, and dashboards for single machines and clusters."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "TRADEMARKS.md", "LICENSING.md"]
authors = [{ name = "Parker Loflin", email = "parker@cronstable.dev" }]
maintainers = [{ name = "Parker Loflin", email = "parker@cronstable.dev" }]
keywords = [
    "cron",
    "crontab",
    "scheduler",
    "job-scheduler",
    "task-scheduler",
    "scheduling",
    "cron-replacement",
    "cronjob",
    "container",
    "docker",
    "kubernetes",
    "k8s",
    "daemon",
    "yaml",
    "devops",
    "sre",
    "sysadmin",
    "sentry",
    "statsd",
    "prometheus",
    "metrics",
    "monitoring",
    "retry",
    "timezone",
    "asyncio",
]
dynamic = ["version"]
dependencies = [
    # Require an importable release when testing minimum dependencies.
    # PyPI withdrew 1.7.0 because it causes an import error.
    "strictyaml>=1.7.3,<2",
    "aiohttp>=3.14.3,<4",
    "sentry-sdk>=2.70.0,<3",
    "aiosmtplib>=5.1.3,<6",
    "jinja2>=3.1.6,<4",
    # zoneinfo's tz database, so timezones resolve on minimal/slim images
    # that don't ship the system tzdata.
    "tzdata>=2026.4",
    # Per-run CPU/memory accounting (opt-in `monitorResources`; see
    # cronstable.resources). The feature is off by default, but the import is
    # unconditional so `cronstable --help` and mypy resolve it everywhere.
    "psutil>=7.2.2",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ptweezy/cronstable"
Documentation = "https://github.com/ptweezy/cronstable#readme"
Source = "https://github.com/ptweezy/cronstable"
Changelog = "https://github.com/ptweezy/cronstable/releases"
Issues = "https://github.com/ptweezy/cronstable/issues"
Container = "https://github.com/ptweezy/cronstable/pkgs/container/cronstable"

[project.scripts]
cronstable = "cronstable.__main__:main"

[project.optional-dependencies]
# Official Kubernetes client for the `kubernetes` leadership backend. Without
# it (or where its grpc/protobuf wheels are missing) the backend falls back to
# its own apiserver REST transport over aiohttp. The etcd backend needs none.
kubernetes = ["kubernetes>=27"]
# uvloop's faster event loop; cronstable falls back to stock asyncio without
# it. Windows has no uvloop build (and needs the Proactor loop for
# subprocesses), so the marker skips it there.
speedups = [
    "uvloop>=0.19; sys_platform != 'win32'",
    # orjson speeds the state-persistence and cluster-gossip JSON paths
    # (cronstable._json falls back to stdlib json). Optional because some
    # targets (riscv64, armv6, musl ppc64le/s390x) have no wheel; Windows
    # does, so no marker.
    "orjson>=3.11.6",
]
# End-to-end encrypted push alerts (the `push` reporter; see cronstable.push).
# PyNaCl seals `x25519` and fails closed: a config with a `push:` section
# refuses to start without it (config._validate_push_config).
# cryptography seals the post-quantum `xwing` suite. Its marker lists only
# targets with a wheel, so pip never tries the sdist (which needs Rust and
# OpenSSL headers); elsewhere the daemon seals `x25519`, refuses `xwing`
# pairings and says so at startup. Linux stops at x86_64 and aarch64, the
# only arches with wheels under both libcs (a marker cannot see the libc).
# The release binaries (`pq`/`pq_src` in release.yml) and container images
# (docker/extract_deps.py) build xwing for more targets.
# The floor is the patched release (GHSA-537c-gmf6-5ccf, GHSA-g6cj-pr64-35w5,
# GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww). 49.0.0 dropped Intel macOS and
# 32-bit Windows; they keep x25519 only. Do not cap at a vulnerable 48.x.
# `platform_machine` reports the kernel: on a 32-bit userland with a 64-bit
# kernel, install with `linux32 pip install "cronstable[push]"`. A 32-bit
# Python on 64-bit Windows reports `AMD64`; install `pynacl` by hand there or
# use a 64-bit Python.
push = [
    "pynacl>=1.6.2",
    "cryptography>=50.0.1,<51; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# Zero-config LAN discovery (the opt-in `web.bonjour` mDNS advert; see
# cronstable.discovery). Same fail-closed contract: web.bonjour without this
# installed is a ConfigError, never a silent no-advert.
discovery = ["zeroconf>=0.151.3"]
dev = [
    # Canonical dev list: scripts/generate_build_files.py emits
    # requirements_dev.txt for tox and pip. Edit dependencies here.
    # cryptography (mTLS and X-Wing tests) reuses the push marker and its
    # linux32 caveat; those tests skip where it is absent.
    "cryptography>=50.0.1,<51; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    # orjson is wheel-only here: the marker skips targets that would need a
    # Rust source build. py314t uses a generated list without it, because no
    # marker can detect the free-threaded ABI that orjson rejects.
    "orjson>=3.11.6; python_version < '3.15' and (platform_machine != 'ARM64' or sys_platform != 'win32')",
    "pynacl>=1.6.2",
    "zeroconf>=0.151.3",
    # Browser-backed tests require a separate `playwright install chromium`
    # step after pip installs the library. No wheel/sdist exists on win-arm64.
    "playwright; platform_machine != 'ARM64' or sys_platform != 'win32'",
    # security linter; bandit[toml] reads [tool.bandit] from pyproject.toml.
    "bandit[toml]",
    "mypy",
    # validates docs/openapi.yaml (.github/scripts/check_openapi.py, tox -e openapi).
    "openapi-spec-validator",
    # validates MCP tool results against their declared outputSchema
    # (tests/test_mcp_tools.py).
    "jsonschema",
    # Compare the saved cron test cases with the original library in
    # tests/test_cronexpr.py on each CI runner.
    "crontab>=1.0.5,<2",
    # Property tests generate schedules, configuration, Task XML, and
    # protocol payloads to check invariants (tests/test_properties_*.py).
    "hypothesis>=6.168.1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    # Randomize test order to find dependencies between tests; reproduce an
    # order with the header seed: `-p randomly --randomly-seed=N`.
    "pytest-randomly",
    # Report timed-out tests and their thread stacks before the
    # faulthandler_timeout limit terminates the session.
    "pytest-timeout",
    "ruff",
    "tox",
    # tox-uv routes tox's env creation + installs through uv (see tox.ini).
    "tox-uv",
]

[tool.setuptools]
packages = ["cronstable", "cronstable.web", "cronstable.backends"]

[tool.setuptools.package-data]
"cronstable.web" = ["*.html"]
# License notices ship in every artifact (wheel, Docker, frozen binaries)
# so the LGPL notice for bundled python-zeroconf stays with its code.
# `cronstable --third-party-licenses` prints them.
"cronstable" = ["licenses/*.txt"]

[tool.setuptools_scm]
version_file = "cronstable/version.py"

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = [
    # Bugbear warnings
    "B",
    "B9",
    # Blind except: each broad `except Exception` carries a
    # `# noqa: BLE001 - <reason>` marker
    "BLE001",
    # mccabe complexity warnings
    "C",
    # Pycodestyle errors https://pycodestyle.pycqa.org/en/latest/intro.html#error-codes
    "E",
    # Pyflakes violations https://flake8.pycqa.org/en/latest/user/error-codes.html
    "F",
    # Pycodestyle warnings
    "W",
    # pyupgrade, typing-modernization codes only (builtin generics, PEP 604
    # unions and optionals, deprecated typing imports)
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "I",  # <= import sorting
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.mypy]
python_version = "3.10"
# Check the POSIX API surface (grp, pwd, os.setuid) on every OS, as Linux CI
# does; Windows branches are runtime-guarded and the Windows test rows cover
# them. No `--platform win32` pass: cronstable.platform.apply_priority
# reaches os.setpriority behind a plain bool, so that pass would need a
# `type: ignore` that the Linux pass reports as unused.
platform = "linux"
no_implicit_optional = true
warn_no_return = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
# Optional-extra deps, imported behind try/except guards, so a checkout
# without the extras still type-checks. Where an extra is installed and ships
# py.typed (cryptography in the dev env), mypy still checks it fully.
module = [
    "orjson",
    "uvloop",
    "nacl",
    "nacl.*",
    "cryptography",
    "cryptography.*",
    "zeroconf",
    "zeroconf.*",
    "kubernetes",
    "kubernetes.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Core runtime deps with no py.typed (stub packages deliberately omitted).
# This table is the ONLY missing-import allowance, so a new unresolvable
# import fails tox -e mypy.
module = [
    "strictyaml",
    "strictyaml.*",
    "psutil",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", ".github/tests"]
# A wedged await dumps every thread's stack and fails the run before the
# 30-minute CI job timeout cancels it. Armed per test; none comes near 300s.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
# Report a test timeout and thread stacks after the asyncio task dump
# (tests/conftest.py, at 80% of faulthandler_timeout), but before
# faulthandler terminates the session. Recovery depends on the timeout method.
timeout = 270
# Treat warnings as errors, including unawaited coroutines, unclosed
# resources, and deprecated API use. Document a reason for each exception.
filterwarnings = [
    "error",
    # cron.py and the demo gateway store request values under string keys.
    # Using web.RequestKey would import aiohttp when the daemon module loads,
    # violating the startup constraint in tests/test_perf_invariants.py.
    "ignore::aiohttp.web_exceptions.NotAppKeyWarning",
]

[tool.coverage.run]
source = ["cronstable"]
branch = true
omit = ["cronstable/version.py"]

[tool.coverage.report]
show_missing = true
# Three pragma tokens, two profiles. A bare `# pragma: no cover` is hidden on
# every OS; `# pragma: no cover (windows)` is hidden on POSIX and MEASURED on
# Windows; `(posix)` is the mirror. The token may follow other text.
# Rule 2 is the only per-profile rule: tox.ini sets CRONSTABLE_COVERAGE_SKIP
# to the platform whose branches CANNOT run in that env, and the `windows`
# default gives a bare `pytest --cov` or an IDE run the POSIX profile.
#
# exclude_lines REPLACES coverage's defaults (with `exclude_also`, the default
# pragma rule would swallow the tagged pragmas), so rule 1 is
# DEFAULT_EXCLUDE[0] plus a lookahead and the last two copy DEFAULT_EXCLUDE[1]
# and [2]. tests/test_coverage_profiles.py pins rule 1 verbatim and the last
# two by behavior, because coverage rewords those in patch releases.
exclude_lines = [
    '#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(cover|COVER)(?!.*\((windows|posix)\))',
    '#\s*(pragma|PRAGMA)[:\s]?\s*(no|NO)\s*(cover|COVER).*\(${CRONSTABLE_COVERAGE_SKIP-windows}\)',
    '^\s*(((async )?def .*?)?[\])]+(\s*->.*?)?:\s*)?\.\.\.\s*(#|$)',
    'if (typing\.)?TYPE_CHECKING:',
]

[tool.mutmut]
# Nightly mutation tests, one module per job; a surviving mutant points to a
# missing or weak assertion. List only input-driven modules, which avoids
# timing-related failures. To run locally:
#     pip install mutmut && mutmut run "cronstable.redact*" && mutmut results
source_paths = [
    "cronstable/cronexpr.py",
    "cronstable/crontabs.py",
    "cronstable/redact.py",
    "cronstable/ical.py",
    "cronstable/_json.py",
    "cronstable/fingerprint.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_cronexpr.py",
    "tests/test_properties_cronexpr.py",
    "tests/test_crontabs.py",
    "tests/test_redact.py",
    "tests/test_ical.py",
    "tests/test_json_portability.py",
    "tests/test_fingerprint.py",
    "tests/test_properties_parsers.py",
]
also_copy = ["tests", "cronstable"]
pytest_add_cli_args = ["-p", "no:randomly", "-p", "no:cacheprovider"]

[tool.bandit]
exclude_dirs = ["tests"]
# B104 hits only the "0.0.0.0"/"::" literals in config.py's wildcard-listen
# match-sets (such as _WILDCARD_LISTEN_HOSTS), which recognize a wildcard
# address and never bind one.
skips = ["B104"]
