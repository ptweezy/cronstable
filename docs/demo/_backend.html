  // deterministic hash -> [0,1) for stable jitter keyed on any string

  var DOWMAP = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  function field(tok, min, max, names) {
    var out = {};
    tok.split(",").forEach(function (part) {
      var step = 1, rng = part;
      var sl = part.split("/"); if (sl.length === 2) { rng = sl[0]; step = parseInt(sl[1], 10) || 1; }
      var lo, hi;
      if (rng === "*") { lo = min; hi = max; }
      else {

        lo = dd[0]; hi = dd.length === 2 ? dd[1] : dd[0];

  }
  // the extension day forms (L / L-n / nW / LW; L<n> / d#n), so the roster's
  // business-day jobs schedule exactly like the real engine
  function daySpec(tok, isDow) {
    var plain = [], s = { offsets: {}, nearest: [], lastW: false, lastDow: {}, nth: {}, special: false };
    tok.split(",").forEach(function (part) {
      var low = part.toLowerCase(), m;
      if (!isDow && low === "l") { s.offsets[0] = 1; s.special = true; }
      else if (!isDow && low === "lw") { s.lastW = true; s.special = true; }
      else if (!isDow && (m = low.match(/^l-(\d+)$/))) { s.offsets[+m[1]] = 1; s.special = true; }
      else if (!isDow && (m = low.match(/^(\d+)w$/))) { s.nearest.push(+m[1]); s.special = true; }
      else if (isDow && (m = low.match(/^l(\d+)$/))) { s.lastDow[+m[1] % 7] = 1; s.special = true; }
      else if (isDow && (m = low.match(/^([a-z]+|\d+)#(\d)$/))) {
        var d = DOWMAP[m[1]] != null ? DOWMAP[m[1]] : (+m[1] % 7);
        s.nth[d + "#" + m[2]] = 1; s.special = true;
      }
      else plain.push(part);
    });

    return s;
  }
  function parseCron(expr) {
    if (!expr) return null;
    if (expr[0] === "@") { if (expr === "@reboot") return { reboot: true }; expr = MAC[expr] || expr; }
    var p = expr.trim().split(/\s+/);
    if (p.length === 6) p = p.slice(1);              // drop seconds field for minute stepping
    if (p.length !== 5) return { sub: true };        // 7-field / exotic -> sub-minute bucket
    var domS = daySpec(p[2], false), dowS = daySpec(p[4], true);
    return {
      mi: field(p[0], 0, 59), ho: field(p[1], 0, 23),
      dom: domS.plain ? field(domS.plain, 1, 31) : {},
      mo: field(p[3], 1, 12),
      dow: dowS.plain ? field(dowS.plain, 0, 6, DOWMAP) : {},
      domSpec: domS, dowSpec: dowS,
      domStar: p[2] === "*", dowStar: p[4] === "*",

  }
  function monthEndUTC(d) { return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); }
  function shiftW(y, mo, t, end) {
    var wd = new Date(Date.UTC(y, mo, t)).getUTCDay();
    if (wd === 6) return t > 1 ? t - 1 : t + 2;      // Saturday -> Friday (or inward)
    if (wd === 0) return t < end ? t + 1 : t - 2;    // Sunday -> Monday (or inward)
    return t;
  }
  function domSideOk(c, d) {
    if (c.dom[d.getUTCDate()]) return true;
    var s = c.domSpec; if (!s || !s.special) return false;
    var end = monthEndUTC(d), day = d.getUTCDate();
    if (s.offsets[end - day]) return true;
    if (s.lastW && day === shiftW(d.getUTCFullYear(), d.getUTCMonth(), end, end)) return true;
    for (var i = 0; i < s.nearest.length; i++) {
      var t = s.nearest[i];
      if (t <= end && day === shiftW(d.getUTCFullYear(), d.getUTCMonth(), t, end)) return true;

  }
  function dowSideOk(c, d) {
    if (c.dow[d.getUTCDay()]) return true;
    var s = c.dowSpec; if (!s || !s.special) return false;
    var end = monthEndUTC(d), day = d.getUTCDate();
    if (s.lastDow[d.getUTCDay()] && day > end - 7) return true;
    return !!s.nth[d.getUTCDay() + "#" + (Math.floor((day - 1) / 7) + 1)];
  }
  function matches(c, d) {
    if (!c.mi[d.getUTCMinutes()] || !c.ho[d.getUTCHours()] || !c.mo[d.getUTCMonth() + 1]) return false;
    if (c.domStar && c.dowStar) return true;         // engine AND rule (cronexpr._day_matches)
    if (c.domStar) return dowSideOk(c, d);
    if (c.dowStar) return domSideOk(c, d);

  // previous fire times (newest-first), not before `floor` ms, capped

    if (c.sub) { var out = [], base = Math.floor(from / 5000) * 5000; for (var k = 0; k < count; k++) { var t = base - k * 5000; if (t < floor) break; out.push(t); } return out; }
    var d = new Date(Math.floor(from / 60000) * 60000), res = [], guard = 0;
    while (res.length < count && guard++ < 60000) { if (d.getTime() < floor) break; if (matches(c, d)) res.push(d.getTime()); d = new Date(d.getTime() - 60000); }
    return res;
  }
  // memoized per expression: the cached fire is the first one after its
  // recorded `from`, so for any later probe below it no new fire can have
  // appeared in between; the monthly business-day schedules then stop
  // re-walking ~40k minutes on every poll
  var _nextFireMemo = {};   // expr -> {from, t}
  function nextFire(expr, from) {
    var hit = _nextFireMemo[expr];
    if (hit && from >= hit.from && hit.t > from) return hit.t;
    var c = parseCron(expr); if (!c || c.reboot) return null;
    if (c.sub) return Math.ceil((from + 1) / 5000) * 5000;
    var d = new Date(Math.ceil((from + 1) / 60000) * 60000), guard = 0;
    while (guard++ < 60000) {
      if (matches(c, d)) { _nextFireMemo[expr] = { from: from, t: d.getTime() }; return d.getTime(); }
      d = new Date(d.getTime() + 60000);
    }
    return null;
  }

  // ---- job roster --------------------------------------------------
  // J(name, schedule, {p:policy, o:owner, run:seconds, mem:MiB, cpu:%, mon,
  //                     fail:profile, cap0, tz, disabled, sub, manual, cmd})
  function J(name, schedule, o) { o = o || {}; o.name = name; o.schedule = schedule; return o; }

  var EN = "EveryNode", LD = "Leader", PL = "PreferLeader";
  var host = "$HOSTNAME";
  var ROSTER = [

    J("risk-model-recompute", "* * * * *", { p: EN, run: 30, mon: 1, cpu: 101, cmd: 'echo "risk-model-recompute burning one core ~30s on ' + host + '" timeout 30 sh -c \'while :; do :; done\'' }),
    J("fraud-graph-scan", "* * * * *", { p: LD, o: "meridian-h", run: 40, mon: 1, cpu: 98, cmd: 'yes | timeout 40 sha256sum' }),

    J("report-render-buffer", "*/2 * * * *", { p: LD, o: "meridian-i", run: 20, mon: 1, cpu: 18, mem: 400, cmd: 'echo "report-render-buffer holding ~400MB resident ~20s"' }),

    J("webhook-dispatch", "* * * * *", { p: EN, fail: "every5", cmd: 'if [ $(( $(date -u +%M) % 5 )) -eq 0 ]; then echo "upstream 503 from hooks.meridian.io" >&2; exit 7; fi; echo delivered' }),
    J("outbox-flush", "*/5 * * * *", { p: LD, o: "meridian-a", fail: "selfheal", cmd: 'cronstable kv incr outbox-attempt; echo "flushing transactional outbox"' }),

    J("build-daily-report", "0 6 * * *", { p: LD, o: "meridian-h", cmd: 'set -eu; token=$(cronstable secret get REPORT_TOKEN); cronstable artifact put daily-report' }),
    J("finance-eod-close", "30 2 * * *", { p: LD, o: "meridian-a", tz: "America/New_York", cmd: 'echo "booked end-of-day on ' + host + ' (America/New_York, DST-aware)"' }),
    J("monthly-close-prep", "30 1 LW * *", { p: LD, o: "meridian-d", cmd: 'echo "staged the books on the last weekday of the month (LW)"' }),
    J("payroll-file-transmit", "0 7 L-3 * *", { p: LD, o: "meridian-g", cmd: 'echo "sent the payroll file three days before month-end (L-3)"' }),
    J("board-pack-render", "0 6 * * 5#3", { p: LD, o: "meridian-i", cmd: 'echo "rendered the board pack on the third Friday (5#3)"' }),
    J("eu-open-report", "0 6 * * mon-fri", { p: LD, o: "meridian-b", tz: "Europe/London", cmd: 'echo "eu-open-report sent the London morning digest on ' + host + '"' }),
    J("apac-open-report", "0 9 * * *", { p: LD, o: "meridian-c", tz: "Asia/Tokyo", cmd: 'echo "apac-open-report sent the Tokyo morning digest on ' + host + '"' }),
    J("nightly-report-batch", "@daily", { p: LD, o: "meridian-e", cmd: 'echo "generated the daily report batch"' }),
    J("slow-report-generator", "5,35 * * * *", { p: EN, run: 10, fail: "timeout", cmd: 'sleep 30  # executionTimeout:10 killTimeout:5 -> SIGKILL' }),

    // monitoring / alerting (the incident cockpit)
    J("db-health-orders", "* * * * *", { p: EN, fail: "db69", cmd: 'pg_isready -h orders-db.meridian.internal && echo ok || exit 69' }),
    J("db-health-inventory", "* * * * *", { p: EN, fail: "db69", cmd: 'pg_isready -h inventory-db.meridian.internal && echo ok || exit 69' }),
    J("db-health-payments", "* * * * *", { p: EN, fail: "db69", cmd: 'pg_isready -h payments-db.meridian.internal && echo ok || exit 69' }),
    J("db-health-warehouse", "* * * * *", { p: EN, fail: "db69", cmd: 'pg_isready -h warehouse-db.meridian.internal && echo ok || exit 69' }),
    J("cert-expiry-check", "* * * * *", { p: EN, fail: "cert", cmd: 'if [ "$(date -u +%M)" -ge 45 ] && [ "$(date -u +%M)" -le 47 ]; then echo "cert expires in 6 days" >&2; exit 1; fi; echo ok' }),
    J("alert-selftest", "20,40 * * * *", { p: LD, o: "meridian-g", fail: "always", cmd: 'echo "alert self-test firing from ' + host + '"; exit 1' }),

    // housekeeping

  var BYNAME = {}; ROSTER.forEach(function (j) { BYNAME[j.name] = j; });

  // ---- fail profiles: fire-ms -> outcome/exit/reason ---------------
  function outcomeFor(job, t) {
    var min = new Date(t).getUTCMinutes(), bucket = Math.floor(t / 60000);
    switch (job.fail) {
      case "always": return { outcome: "failure", exit_code: 1, fail_reason: "self-test tripwire (failsWhen.always)" };
      case "db69": return (bucket % 5 === 0) ? { outcome: "failure", exit_code: 69, fail_reason: "connection refused (EX_UNAVAILABLE)" } : ok();
      case "every5": return (min % 5 === 0) ? { outcome: "failure", exit_code: 7, fail_reason: "downstream 503 from hooks.meridian.io" } : ok();
      case "stderrwin": return (min >= 25 && min <= 29) ? { outcome: "failure", exit_code: 1, fail_reason: "wrote to stderr (failsWhen.producesStderr)" } : ok();
      case "stdoutwin": return (min >= 35 && min <= 39) ? { outcome: "failure", exit_code: 1, fail_reason: "matched failure pattern on stdout" } : ok();
      case "cert": return (min >= 45 && min <= 47) ? { outcome: "failure", exit_code: 1, fail_reason: "certificate expires in 6 days" } : ok();

      case "timeout": return { outcome: "failure", exit_code: 137, fail_reason: "execution timeout (10s) exceeded — SIGKILL" };
      case "selfheal": return (bucket % 4 === 0) ? { outcome: "failure", exit_code: 75, fail_reason: "retryable: broker not ready" } : ok();

      // success sits well past maxTimeSinceSuccessSeconds (jobDict adds d.sla)
      case "feed": return (nowMs() - t < 3000e3) ? { outcome: "failure", exit_code: 4, fail_reason: "partner feed not delivered (SFTP drop empty)" } : ok();
      case "cancelled": return (bucket % 6 === 0) ? { outcome: "cancelled", exit_code: null, fail_reason: "superseded (concurrencyPolicy: Replace)" } : ok();
      default: return ok();
    }
    function ok() { return { outcome: "success", exit_code: 0, fail_reason: null }; }
  }
  function runDur(job, t) {
    if (job.run) return +(job.run + jitter(job.name + t, -0.4, 0.6)).toFixed(2);
    return +jitter(job.name + t, 0.2, 2.4).toFixed(3);
  }

  // ---- derive one job's public dict at time `now` ------------------
  function jobDict(job, now) {
    var d = { name: job.name, enabled: !job.disabled, schedule: job.schedule, command: job.cmd,
      captureStdout: !job.cap0, captureStderr: !job.cap0, utc: job.tz !== "local", timezone: job.tz && job.tz !== "local" ? job.tz : null,
      running: false, pids: [], scheduled_in: null, last_run: null, history: [], paused: null };
    // runtime pause: a user action (OVERLAY, including an explicit resume as
    // null) wins over the roster fixture's standing maintenance pause. The
    // fixture anchors on the hour so its record (and the render signatures
    // derived from it) stays stable between polls.
    if (Object.prototype.hasOwnProperty.call(OVERLAY.paused, job.name)) d.paused = OVERLAY.paused[job.name];
    else if (job.paused) { var ph = Math.floor(now / 3600000) * 3600000;
      d.paused = { since: iso(ph - 1800000), until: iso(ph + 5400000), note: "upstream maintenance window", by: "sre-oncall", channel: "api" }; }
    // per-job SLA: the "feed" fail profile keeps the job success-free for the
    // trailing 3000s, so the breach numbers below stay coherent with history
    if (job.late) d.sla = { thresholds: { maxTimeSinceSuccessSeconds: 900 }, state: "late",
