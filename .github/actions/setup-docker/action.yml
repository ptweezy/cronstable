name: Set up Docker for 32-bit containers
description: Keep native i686 networking working with Docker's security protections enabled.
runs:
  using: composite
  steps:
    - name: Check the runner's Docker version
      id: engine
      shell: bash
      run: |
        set -euo pipefail
        version=$(docker version --format '{{.Server.Version}}')
        # Ubuntu 26 images ship 29.4.2, whose socketcall block breaks i686
        # networking. 29.4.3 fixes it with targeted AppArmor/SELinux rules.
        # https://docs.docker.com/engine/release-notes/29/#2943
        minimum=29.4.3
        if [ "$(printf '%s\n' "$minimum" "$version" | sort -V | head -n 1)" != "$minimum" ]; then
          echo "upgrade=true" >> "$GITHUB_OUTPUT"
        fi
        echo "Docker server: $version (minimum: $minimum)"
    - name: Install a patched Docker engine
      if: steps.engine.outputs.upgrade == 'true'
      uses: docker/setup-docker-action@v5.5.0
      with:
        version: v29.8.1
