# Daily VERSION updates for the exact pins, grouped into one PR per ecosystem.
# The `daily` interval runs Monday through Friday. SECURITY updates are enabled
# in the repo settings (Code security: "Dependabot alerts" and "Dependabot
# security updates") and reuse the ecosystems below, so keep this list in step
# with what the pipeline uses.
version: 2
updates:
  # Actions are pinned to commit SHAs with a trailing version comment
  # (actions/checkout@<sha> # v7.0.1). Dependabot updates the comment only
  # when it ends with the version, so put other notes on the line above.
  - package-ecosystem: github-actions
    directories:
      - "/" # scans .github/workflows/ and root action.yml only
      - "/.github/actions/*"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # A floor in pyproject.toml is the oldest release cronstable supports, and
  # it moves only for a reason its comment names, never to follow a new
  # release (see "Dependency floors" in CONTRIBUTING.md). With
  # increase-if-necessary, a version update changes a range only when a new
  # release falls outside it, such as a major release past an upper cap;
  # keep the floor when you accept one. requirements/min.txt pins the floors,
  # so version updates skip it. exclude-paths applies to version updates
  # only, and Dependabot alerts still cover the floors: when one names a
  # floor, raise it in pyproject.toml and regenerate, or dismiss the alert
  # with the reason the advisory doesn't affect cronstable. Dependabot reads
  # requirements files one directory below `directory`, so "/" covers
  # requirements/.
  - package-ecosystem: pip
    directory: "/"
    versioning-strategy: increase-if-necessary
    exclude-paths:
      - "requirements/min.txt"
      - "requirements/dev-freethreaded.txt"
      - "pyinstaller/requirements/**"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      python:
        patterns: ["*"]

  # scripts/generate_build_files.py writes /Dockerfile and docker/Dockerfile.*
  # from docker/images.toml: apply a base-image bump there and rerun it. A uv
  # bump in pyinstaller/Dockerfile also moves SETUP_UV_VERSION in release.yml.
  # .clusterfuzzlite/Dockerfile pins the OSS-Fuzz builder's moving v1 tag by
  # digest, so its updates are digest bumps.
  # Review, do not automerge: a new base image can change the default Python.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/docker"
      - "/pyinstaller"
      - "/.clusterfuzzlite"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns: ["*"]

  # Follow the branches in flake.nix, including Intel macOS's 26.05 lane.
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      nix:
        patterns: ["*"]
