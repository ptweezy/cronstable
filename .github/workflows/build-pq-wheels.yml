name: Build optional cryptography wheels
on:
  workflow_call:
    inputs:
      matrix: {type: string, required: true}
      version: {type: string, required: true}
      cryptography: {type: string, required: true}
      crypto-sha: {type: string, required: true}
      ref: {type: string, default: ''}
      refresh: {type: boolean, default: false}
permissions:
  contents: read
env:
  PIP_RETRIES: '5'
  PIP_TIMEOUT: '60'
jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ubuntu-26.04
    continue-on-error: ${{ !inputs.refresh }}
    timeout-minutes: 300
    steps:
      # Runner setup comes from the workflow revision, even when refreshing
      # a release whose source tree predates the shared compatibility action.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-docker
        if: matrix.platform == 'linux/386'
      - name: Validate the released source against trusted history
        if: inputs.ref != ''
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TO_VALIDATE: ${{ inputs.ref }}
          REFRESH: ${{ inputs.refresh }}
        run: python3 .github/scripts/docker_refresh.py validate-ref
      - name: Check out the application revision
        if: inputs.ref != ''
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.revision }}
          persist-credentials: false
      - name: Download resolved cryptography source
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: release-inputs
      - name: Restore the OpenSSL build (manylinux rows)
        if: ${{ matrix.manylinux && !inputs.refresh }}
        id: openssl-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .openssl-${{ matrix.arch }}
          key: openssl-pqwheel-${{ matrix.arch }}-${{ hashFiles('pyinstaller/build_openssl.sh') }}-${{ matrix.image }}
        continue-on-error: true
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4.4.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
          echo "digest=$(docker image inspect --format '{{.Id}}' '${{ matrix.image }}')" >> "$GITHUB_OUTPUT"
        id: image
      - name: Restore compiler work
        if: ${{ !inputs.refresh }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pq-cache
          key: pq-work-${{ matrix.libc }}-${{ matrix.arch }}-${{ steps.image.outputs.digest }}-${{ inputs.crypto-sha }}-${{ hashFiles('pyinstaller/build_openssl.sh', '.github/scripts/compiler_fingerprint.py', '.github/workflows/build-pq-wheels.yml') }}
        continue-on-error: true
      - name: Build the cryptography wheel (${{ matrix.libc }} ${{ matrix.arch }})
        env:
          # Passed as env so the single-quoted script stays free of quotes.
          # Each string runs in a fresh `sh -c`, so it sources retry.sh
          # itself. manylinux adds the perl modules OpenSSL needs: IPC::Cmd
          # (Configure), Time::Piece (its Makefile), bigint (s390x asm).
          PQ_TOOLS: ${{ matrix.libc == 'musl' && '. /src/.github/scripts/retry.sh && retry 5 apk add --no-cache build-base libffi-dev rust cargo openssl-dev openssl-libs-static pkgconf' || matrix.manylinux && '. /src/.github/scripts/retry.sh && retry 5 yum install -y perl-IPC-Cmd perl-Time-Piece perl-bignum' || '. /src/.github/scripts/retry.sh && retry 5 apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential libffi-dev rustc cargo libssl-dev zlib1g-dev libzstd-dev pkg-config' }}
          RUST_SETUP_CMD: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/src/.pq-cache/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
          # The probe below installs the project, and the python images carry
          # no git, so the version comes from here.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e PIP_RETRIES -e PIP_TIMEOUT -e PQ_TOOLS -e RUST_SETUP_CMD \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              . /src/.github/scripts/retry.sh
              sh -c "$PQ_TOOLS"
              if [ -n "${{ matrix.manylinux }}" ]; then
                # The build interpreter sets the abi3 floor, so build with
                # 3.11 (the PyPI wheel floor, below every consumer image).
                # extract_deps.py drops a wheel whose floor is too high.
                PY=/opt/python/cp311-cp311/bin/python
                # The runner user owns the checkout and this container runs
                # as root, so without this git refuses the bind mount and the
                # project install (setuptools_scm file finder) fails.
                git config --global --add safe.directory /src
                sh -c "$RUST_SETUP_CMD"
                sh pyinstaller/build_openssl.sh /src/.openssl-${{ matrix.arch }}
                PATH=/src/.pq-cache/cargo/bin:$PATH
                CARGO_HOME=/src/.pq-cache/cargo
                RUSTUP_HOME=/opt/rustup
                OPENSSL_DIR=/src/.openssl-${{ matrix.arch }}
                export PATH CARGO_HOME RUSTUP_HOME OPENSSL_DIR
              elif [ "${{ matrix.libc }}" = musl ]; then
                PY=python
                # openssl-libs-static puts the archives under /usr/lib.
                OPENSSL_DIR=/usr
                export OPENSSL_DIR
              else
                PY=python
                # Debian keeps them in the multiarch directory and builds
                # libcrypto with zlib and zstd; openssl-sys links neither, so
                # RUSTFLAGS adds them (PQ_TOOLS installs the -dev packages).
                # Every consumer image is Debian-family and has both.
                OPENSSL_LIB_DIR=/usr/lib/$(gcc -print-multiarch)
                OPENSSL_INCLUDE_DIR=/usr/include
                RUSTFLAGS="-C link-arg=-lz -C link-arg=-lzstd"
                export OPENSSL_LIB_DIR OPENSSL_INCLUDE_DIR RUSTFLAGS
              fi
              # Static on every row, with explicit archive paths: when
              # pkg-config finds OpenSSL under /usr, openssl-sys links it
              # dynamically despite OPENSSL_STATIC. Every image build gets
              # these wheels, so they carry their own OpenSSL.
              export OPENSSL_STATIC=1
              toolchain=$($PY .github/scripts/compiler_fingerprint.py)
              export CARGO_TARGET_DIR="/src/.pq-cache/target/$toolchain"
              export CARGO_HOME=/src/.pq-cache/cargo
              $PY -m pip install --upgrade pip
              rm -rf /src/wheelhouse
              # The preflight resolves this source from pyproject and checks its hash.
              $PY -m pip wheel --no-deps --wheel-dir /src/wheelhouse /src/release-inputs/cryptography-${{ inputs.cryptography }}.tar.gz
              # Prove the wheel seals X-Wing through the daemon (the probe the
              # binary lanes run) before an image build uses it.
              $PY -m pip install /src/wheelhouse/cryptography-*.whl
              $PY -m pip install .
              $PY pyinstaller/verify_extra.py cryptography
              # Fail if the extension still links libssl or libcrypto. Log the
              # full NEEDED list first. readelf writes a file in a command of
              # its own, so an image without readelf fails the row.
              ext=$($PY -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
              readelf -d "$ext" > /tmp/cryptography.dyn
              grep NEEDED /tmp/cryptography.dyn || true
              if grep -E "NEEDED.*lib(ssl|crypto)" /tmp/cryptography.dyn; then
                echo "FAIL: the wheel links OpenSSL dynamically" >&2
                exit 1
              fi
              chmod -R a+rX /src/wheelhouse
              ls -l /src/wheelhouse
            '
      - name: Make the caches readable by the cache save
        run: |
          set -euo pipefail
          for d in .pq-cache wheelhouse .openssl-${{ matrix.arch }}; do
            if [ -d "$d" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$d"
            fi
          done
          python3 .github/scripts/cache_size.py .pq-cache
        id: cache-size
      - name: Save compiler work (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pq-cache
          key: pq-work-${{ matrix.libc }}-${{ matrix.arch }}-${{ steps.image.outputs.digest }}-${{ inputs.crypto-sha }}-${{ hashFiles('pyinstaller/build_openssl.sh', '.github/scripts/compiler_fingerprint.py', '.github/workflows/build-pq-wheels.yml') }}
        if: ${{ !inputs.refresh && github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true' }}
        continue-on-error: true
      - name: Save the OpenSSL build (manylinux rows, trunk only)
        if: ${{ !inputs.refresh && matrix.manylinux && steps.openssl-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .openssl-${{ matrix.arch }}
          key: openssl-pqwheel-${{ matrix.arch }}-${{ hashFiles('pyinstaller/build_openssl.sh') }}-${{ matrix.image }}
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pq-wheel-${{ matrix.libc }}-${{ matrix.arch }}
          path: wheelhouse/cryptography-*.whl
          if-no-files-found: error
          retention-days: 7
