name: Build Docker platforms

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      version:
        type: string
        required: true
      release:
        type: boolean
        required: true
      zeroconf:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: ${{ inputs.release }}
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch this platform's optional wheel
        if: matrix.wheel != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ matrix.wheel }}
          path: docker/wheelhouse/${{ matrix.wheel_group }}
      - uses: docker/setup-qemu-action@v4.3.0
        if: matrix.qemu
      - uses: docker/setup-buildx-action@v4.3.0
      - name: Build the platform once
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VERSION=${{ inputs.version }}
            PYTHON_VARIANT=${{ matrix.python_variant }}
            ZEROCONF_VERSION=${{ inputs.zeroconf }}
            DEPS_REFRESH=${{ inputs.release && github.run_id || '' }}
          provenance: false
          # Cache loss affects build speed only. Publishing consumes the OCI
          # artifact, never this mutable, quota-limited cache.
          cache-from: type=gha,scope=${{ matrix.distro }}-${{ matrix.platform_id }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}-{1},ignore-error=true', matrix.distro, matrix.platform_id) || '' }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: image-${{ matrix.distro }}-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.release && 7 || 2 }}
