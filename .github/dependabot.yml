# Weekly VERSION updates for the exact pins, grouped into one PR per
# ecosystem. SECURITY updates are enabled in the repo settings (Code security:
# "Dependabot alerts" and "Dependabot security updates") and reuse the
# ecosystems below, so keep this list in step with what the pipeline uses.
version: 2
updates:
  # Actions are exact-pinned (actions/checkout@v7.0.0) so Dependabot sees the
  # minor and patch drift that a moving major tag would hide.
  - package-ecosystem: github-actions
    directories:
      - "/" # scans .github/workflows/ and root action.yml only
      - "/.github/actions/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # pyproject.toml owns dependency floors: apply a requirements_min.txt bump
  # there (extras too), then run scripts/generate_build_files.py. Keep
  # requirements_min.txt scanned; excluding it leaves the dependency graph
  # reporting obsolete vulnerable pins.
  - package-ecosystem: pip
    directory: "/"
    exclude-paths:
      - "requirements_dev.txt"
      - "requirements_dev_freethreaded.txt"
      - "pyinstaller/requirements/**"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python:
        patterns: ["*"]

  # scripts/generate_build_files.py writes /Dockerfile and docker/Dockerfile.*
  # from docker/images.toml: apply a base-image bump there and rerun it. A uv
  # bump in pyinstaller/Dockerfile also moves SETUP_UV_VERSION in release.yml.
  # Review, do not automerge: a new base image can change the default Python.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/docker"
      - "/pyinstaller"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns: ["*"]

  # Follow the branches in flake.nix, including Intel macOS's 26.05 lane.
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nix:
        patterns: ["*"]
