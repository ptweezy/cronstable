name: Build one architecture's wheel and Docker images

on:
  workflow_call:
    inputs:
      wheel: {type: string, required: true}
      matrix: {type: string, required: true}
      version: {type: string, required: true}
      release: {type: boolean, required: true}
      zeroconf: {type: string, required: true}
      cryptography: {type: string, required: true}
      crypto-sha: {type: string, required: true}
      ref: {type: string, default: ''}
      refresh: {type: boolean, default: false}

permissions:
  contents: read
  packages: write

jobs:
  wheel:
    permissions:
      contents: read
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: ${{ format('[{0}]', inputs.wheel) }}
      version: ${{ inputs.version }}
      release: ${{ inputs.release }}
      cryptography: ${{ inputs.cryptography }}
      crypto-sha: ${{ inputs.crypto-sha }}
      ref: ${{ inputs.ref }}
      refresh: ${{ inputs.refresh }}

  images:
    needs: wheel
    if: inputs.matrix != '[]'
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ inputs.matrix }}
      version: ${{ inputs.version }}
      release: ${{ inputs.release }}
      zeroconf: ${{ inputs.zeroconf }}
      ref: ${{ inputs.ref }}
      refresh: ${{ inputs.refresh }}
