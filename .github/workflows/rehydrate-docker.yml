name: Rehydrate Docker images

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ptweezy/cronstable' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release-id: ${{ steps.release.outputs.release-id }}
      revision: ${{ steps.release.outputs.revision }}
      build: ${{ steps.release.outputs.build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      docker-none: ${{ steps.matrix.outputs.docker-none }}
      docker-glibc: ${{ steps.matrix.outputs.docker-glibc }}
      docker-musl: ${{ steps.matrix.outputs.docker-musl }}
      pq-glibc: ${{ steps.matrix.outputs.pq-glibc }}
      pq-musl: ${{ steps.matrix.outputs.pq-musl }}
      zeroconf: ${{ steps.inputs.outputs.zeroconf }}
      cryptography: ${{ steps.inputs.outputs.cryptography }}
      crypto-sha: ${{ steps.inputs.outputs.crypto-sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Select the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python .github/scripts/docker_refresh.py select
      - name: Check out the released source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.revision }}
          path: source
          persist-credentials: false
      - name: Prepare the released image matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(python .github/scripts/docker_matrix.py source/.github/docker-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Resolve fresh dependency sources
        id: inputs
        working-directory: source
        run: |
          set -euo pipefail
          python -m pip install packaging
          python ../.github/scripts/release_inputs.py
          cp release-inputs/resolved.json release-inputs/third-party/resolved.json
          mkdir -p release-inputs/refresh-tools
          cp ../.github/scripts/refresh_runtime.py release-inputs/refresh-tools/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-inputs
          path: source/release-inputs/
          if-no-files-found: error
          retention-days: 30

  test:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.prepare.outputs.version }}
      PIP_CONSTRAINT: ${{ github.workspace }}/release-inputs/constraints.txt
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: release-inputs
      - name: Test the release with fresh dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements_dev.txt '.[speedups,push,discovery]'
          python -m pytest -q

  pq-wheels:
    needs: prepare
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: ${{ needs.prepare.outputs.pq-glibc }}
      version: ${{ needs.prepare.outputs.version }}
      release: false
      ref: ${{ needs.prepare.outputs.revision }}
      refresh: true
      cryptography: ${{ needs.prepare.outputs.cryptography }}
      crypto-sha: ${{ needs.prepare.outputs.crypto-sha }}

  pq-wheels-musl:
    needs: prepare
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: ${{ needs.prepare.outputs.pq-musl }}
      version: ${{ needs.prepare.outputs.version }}
      release: false
      ref: ${{ needs.prepare.outputs.revision }}
      refresh: true
      cryptography: ${{ needs.prepare.outputs.cryptography }}
      crypto-sha: ${{ needs.prepare.outputs.crypto-sha }}

  docker:
    needs: prepare
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.prepare.outputs.docker-none }}
      version: ${{ needs.prepare.outputs.version }}
      release: false
      ref: ${{ needs.prepare.outputs.revision }}
      refresh: true
      zeroconf: ${{ needs.prepare.outputs.zeroconf }}

  docker-glibc:
    needs: [prepare, pq-wheels]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.prepare.outputs.docker-glibc }}
      version: ${{ needs.prepare.outputs.version }}
      release: false
      ref: ${{ needs.prepare.outputs.revision }}
      refresh: true
      zeroconf: ${{ needs.prepare.outputs.zeroconf }}

  docker-musl:
    needs: [prepare, pq-wheels-musl]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.prepare.outputs.docker-musl }}
      version: ${{ needs.prepare.outputs.version }}
      release: false
      ref: ${{ needs.prepare.outputs.revision }}
      refresh: true
      zeroconf: ${{ needs.prepare.outputs.zeroconf }}

  assemble:
    needs: [prepare, test, docker, docker-glibc, docker-musl]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-${{ matrix.distro }}-linux-*
          path: images
      - name: Validate and assemble every platform
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          DISTRO: ${{ matrix.distro }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          python .github/scripts/oci_images.py --inputs images --distro "$DISTRO" \
            --platforms "$PLATFORMS" --version "$VERSION" --revision "$REVISION" --output layout
          tar -cf image.tar -C layout .
          sha256sum image.tar > image.sha256
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          skopeo copy --all --preserve-digests oci-archive:image.tar:release oci:verified:release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-refresh-${{ matrix.distro }}
          path: |
            image.tar
            image.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

  publish:
    needs: [prepare, assemble]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: docker-publish-${{ github.repository }}-${{ matrix.distro }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: docker-refresh-${{ matrix.distro }}
          path: prepared
      - name: Verify prepared bytes
        working-directory: prepared
        run: sha256sum -c image.sha256
      - name: Check that the release is still current
        id: current
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release-id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: python3 .github/scripts/docker_refresh.py check
      - name: Log in to GHCR
        if: steps.current.outputs.current == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: steps.current.outputs.current == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the validated images
        if: steps.current.outputs.current == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          DISTRO: ${{ matrix.distro }}
          SUFFIX: ${{ matrix.suffix }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          python3 .github/scripts/docker_refresh.py tags > tags.txt
          images=("ghcr.io/${REPO,,}")
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images+=("docker.io/$DOCKERHUB_USERNAME/cronstable")
          fi
          for image in "${images[@]}"; do
            while IFS= read -r tag; do
              skopeo copy --all --preserve-digests --retry-times 3 \
                --authfile "$HOME/.docker/config.json" \
                oci-archive:prepared/image.tar:release "docker://$image:$tag"
              echo "Published \`$image:$tag\`" >> "$GITHUB_STEP_SUMMARY"
            done < tags.txt
          done
