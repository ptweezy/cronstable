name: CI

# ONE pipeline for everything. On EVERY push (any branch) and pull request it
# builds and tests the whole product in parallel -- the full tox matrix
# (lint/mypy/pytest), the wheel + sdist, the self-contained PyInstaller binaries
# for Linux (amd64, arm64, i686, armv7, ppc64le, s390x and riscv64 in both glibc
# and musl/Alpine flavors, plus armv6 in musl only), macOS (arm64 + amd64 on
# macOS 15, shipped; plus macOS 26/Tahoe as non-gating CI coverage) and Windows
# (amd64 + arm64), and every Docker image (8 distros, full arch set, build-only)
# -- and gates on ALL of it. The `perf` job runs in the same fan-out: it
# benchmarks this commit against the latest release tag (paired on one runner,
# see benchmarks/) and, on a release, a regression beyond a metric's limit
# fails the gate, while the resulting chart + summary are attached to the
# GitHub Release and appended to its notes.
# No SOFTWARE is published on an ordinary commit; the
# one thing that is, is documentation -- a push to `main` publishes wiki/ to
# the GitHub wiki (the `wiki` job, ungated, since a doc is not an artifact).
#
# A release happens ONLY when either:
#   - a push to `main` carries a [release] marker at the START of the SUBJECT
#     line of any of its commits:
#         [release]          -> minor (default)
#         [release:major]    -> major
#         [release:minor]    -> minor
#         [release:patch]    -> patch
#     (if several pushed commits carry a marker, the LATEST such commit wins;
#     bodies are never scanned, so prose that merely mentions a marker cannot
#     trigger or escalate a release -- 1.3.0 shipped off a [release:patch]
#     push because a commit body discussing the bare [release] marker
#     out-bumped it), or
#   - it is started via workflow_dispatch (bump from the dropdown, or an exact
#     `tag` to release a specific X.Y.Z; the `tag` input wins over `bump`).
#
# The perf gate has an override of its own, resolved by the same decide step:
#   - the workflow_dispatch input `perf`: gate (default) / accept / ignore
#   - a pushed commit SUBJECT starting with [perf:accept] or [perf:ignore]
#     (same range and same subjects-only rule as the [release] marker)
#   `accept` reports a relative regression instead of failing on it. `ignore`
#   runs the comparison and attaches it as usual, but nothing it finds (a
#   regression, a budget breach, a dead gate, or the perf job itself failing)
#   holds the release. Both routes only loosen the gate, so the strongest
#   request wins (ignore > accept > gate), and the release notes name the
#   override that was used.
#
# On a release, once EVERY build + test job above has succeeded (the gate),
# and ONLY then, the pipeline publishes: the wheel + sdist to PyPI via Trusted
# Publishing (OIDC, skip-existing so a retry is a no-op), tags the commit
# (using optional RELEASE_TOKEN or the job GITHUB_TOKEN), cuts a GitHub
# Release with ALL prebuilt binaries + a
# single SHA256SUMS, pushes every Docker image, and updates the Homebrew tap.
# Build, packaging, manifest and checksum validation finish before publication.
# External publishing services can still fail; PyPI precedes tag creation so a
# failed PyPI upload leaves no orphan tag.
#
# This file replaces the former build.yml + docker.yml + tox.yml + release.yml,
# whose binary/tox builds it deduplicates into one definition each.
#
# Example commit message (marker leads the subject line):
#     [release:minor] Add retry backoff to the HTTP reporter

on:
  push:
    branches: ["**"]  # build + test on every commit, on every branch
  pull_request:       # and on every PR (covers fork PRs, which don't push here)
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level (ignored when 'tag' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      tag:
        description: "Exact version to release as X.Y.Z (overrides bump); leave blank to compute the next one"
        type: string
        default: ""
      perf:
        description: "Perf gate: gate (a regression fails the release), accept (regressions are reported, not gated), ignore (everything is reported, nothing gates)"
        type: choice
        options: [gate, accept, ignore]
        default: gate

# One in-flight run per (head repo, branch, kind). A same-repo branch push and
# its PR still share a group, so the duplicate is cancelled rather than run
# twice. The group is qualified by the HEAD repository because
# cancel-in-progress evaluates on the INCOMING run: an unqualified group let a
# fork PR whose head branch was named `main` land in the push-to-main group and
# cancel an in-flight release mid-publish (its own ref is refs/pull/N/merge).
#
# It is also qualified by kind, and that is what protects a release now that
# main is the only branch. `cancel-in-progress: false` protects a run that has
# already started, and only that one; a run still waiting in the queue loses
# its slot to the next push. So gating on the ref alone cost coverage rather
# than minutes, and 555845a is the proof: it landed on main and its run died
# in the queue before a single job started. Splitting the groups lets ordinary
# pushes collapse freely while a release sits alone in its own group, starting
# at once and running to completion; consecutive releases still share one
# group and serialize.
#
# The release test errs on the side of caution and, unlike `decide`, is
# allowed to be fuzzy: a false positive costs one extra run that survives to
# the end, while a false negative could cancel a publish. It says yes to a
# manual dispatch, to any pushed commit whose full message contains `[release`
# (a superset of decide's stricter scan, which reads subject lines only), and
# to any push of 20+ commits, the point at which the event payload truncates
# and hides the rest.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, '|'), '[release') || github.event.commits[19] != null) && 'release' || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, '|'), '[release') || github.event.commits[19] != null) }}

# Least-privilege default for all jobs; the publish jobs opt up to the narrower
# write scopes they actually need (see each one's own permissions:).
permissions:
  contents: read

# Network hardening for transient PyPI/network blips. Runner-native jobs install
# with uv (UV_HTTP_TIMEOUT raises its per-request socket timeout; uv retries
# internally) and UV_PYTHON_DOWNLOADS=never keeps uv on the setup-python
# interpreter rather than fetching a managed one. The emulated foreign-arch
# binary jobs stay on pip inside their `docker run` containers (uv's official
# image is amd64/arm64 only and lacks musl ppc64le/s390x wheels) and read
# PIP_RETRIES/PIP_TIMEOUT, forwarded into `docker run` with `-e`. They also
# forward PIP_CACHE_DIR, pointed at an actions/cache-persisted directory in
# the mounted checkout, so the wheels pip compiles under QEMU carry over
# between runs instead of being rebuilt on every push.
env:
  PIP_RETRIES: "5"
  PIP_TIMEOUT: "60"
  UV_HTTP_TIMEOUT: "60"
  UV_PYTHON_DOWNLOADS: "never"

jobs:

  # ---------------------------------------------------------------------------
  # Decide + version (run on every event; feed both the gate and the publish).
  # ---------------------------------------------------------------------------

  # Decide whether this run is a release (and at what level), then compute the
  # version: two steps in ONE job. They ran as separate serial jobs before, but
  # each needed the same full-history checkout and every builder waited on both
  # runner spin-ups, so merging them starts the whole fan-out sooner.
  #
  # The decide step is kept strict so the trigger logic lives in a real script,
  # never a fuzzy `contains()` match. A release requires a workflow_dispatch OR
  # a push to main with a [release] marker -- a marker on any other branch, or a
  # PR, never releases (this file triggers on all branches + PRs, so the decide
  # step itself must enforce the main-only rule the old push:branches:[main]
  # filter used to).
  #
  # The version step computes the version ONCE so every builder pins the same
  # number via SETUPTOOLS_SCM_PRETEND_VERSION. It always runs (the gate builds
  # always need a version): on a release it computes the next X.Y.Z (or the
  # explicit `tag` override) and refuses if that tag already exists; otherwise
  # it emits the natural setuptools_scm dev version (e.g. 1.2.9.devN+g<sha>),
  # exactly as the old build.yml did for its per-commit builds.
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.d.outputs.release }}
      bump: ${{ steps.d.outputs.bump }}
      perf: ${{ steps.d.outputs.perf }}
      perf-source: ${{ steps.d.outputs.perf_source }}
      new: ${{ steps.ver.outputs.new }}
      docker-matrix: ${{ steps.distros.outputs.matrix }}
      docker-none: ${{ steps.distros.outputs.docker-none }}
      docker-glibc: ${{ steps.distros.outputs.docker-glibc }}
      docker-musl: ${{ steps.distros.outputs.docker-musl }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history + tags: the marker scan walks BEFORE..AFTER and setuptools_scm / tag math resolve
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Decide release
        id: d
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          INPUT_PERF: ${{ github.event.inputs.perf }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          release=false
          bump=minor
          # The commit SUBJECTS this run scans, for the [release] marker and
          # the [perf:*] markers alike: the commits new in this push
          # (BEFORE..AFTER). On a brand-new branch BEFORE is all-zeros, and on
          # a workflow_dispatch it is unset, so fall back to the tip. The scan
          # never fails the step: a build-only run has no marker to find.
          zero="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$zero" ] \
               || ! git rev-parse -q --verify "${BEFORE}^{commit}" >/dev/null; then
            subjects="$(git log -1 --pretty=%s "$AFTER" 2>/dev/null || true)"
          else
            subjects="$(git log --pretty=%s "${BEFORE}..${AFTER}" 2>/dev/null || true)"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            release=true
            bump="${INPUT_BUMP:-minor}"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # Trigger if any commit introduced by this push has a [release]
            # marker.
            # Only commit SUBJECTS are scanned, and the marker must be at the
            # very start of the subject. Bodies are never scanned: prose that
            # merely mentions a marker (a changelog quote, a commit that
            # documents this very syntax, dependabot notes) must not trigger
            # or escalate a release -- that is exactly how 1.3.0 shipped from
            # a [release:patch] push. If several commits carry a marker, the
            # LATEST one wins (git log lists newest first); a bare [release]
            # counts as minor.
            marker="$(printf '%s\n' "$subjects" \
              | grep -oiE '^\[release(:(major|minor|patch))?\]' \
              | head -n1 \
              | tr '[:upper:]' '[:lower:]' || true)"
            if [ -n "$marker" ]; then
              release=true
              case "$marker" in
                "[release:major]") bump=major ;;
                "[release:patch]") bump=patch ;;
                *)                 bump=minor ;;
              esac
            fi
          fi
          # else: a PR or a non-main push -> build + test only, never release.
          #
          # The perf gate override: the dispatch input and/or a [perf:accept]
          # or [perf:ignore] marker at the START of a scanned subject. Both
          # routes only loosen the gate, so the strongest request wins
          # (ignore > accept > gate). The perf job reads the mode for its
          # compare flags and its continue-on-error; enforcement itself stays
          # release-only (an ordinary commit warns either way).
          perf=gate
          perf_source=default
          case "${INPUT_PERF:-}" in
            accept|ignore)
              perf="$INPUT_PERF"
              perf_source="workflow_dispatch input perf=$INPUT_PERF"
              ;;
          esac
          if [ "$perf" = "gate" ] \
               && printf '%s\n' "$subjects" | grep -qiE '^\[perf:accept\]'; then
            perf=accept
            perf_source="[perf:accept] commit marker"
          fi
          if printf '%s\n' "$subjects" | grep -qiE '^\[perf:ignore\]'; then
            perf=ignore
            perf_source="[perf:ignore] commit marker"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "perf=$perf" >> "$GITHUB_OUTPUT"
          echo "perf_source=$perf_source" >> "$GITHUB_OUTPUT"
          echo "::notice::release=$release bump=$bump perf=$perf ($perf_source; event=$EVENT ref=$REF)"
      - name: Compute version
        id: ver
        env:
          RELEASE: ${{ steps.d.outputs.release }}
          BUMP: ${{ steps.d.outputs.bump }}
          OVERRIDE: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE" != "true" ]; then
            # Build-only run: resolve setuptools_scm's natural dev version off
            # git in a throwaway env (no venv/install left behind).
            new="$(uv run --no-project --with setuptools-scm python -m setuptools_scm)"
            echo "new=$new" >> "$GITHUB_OUTPUT"
            echo "::notice::Build-only at version $new (no release)."
            exit 0
          fi

          git fetch --tags --force
          if [ -n "${OVERRIDE:-}" ]; then
            # Explicit override from workflow_dispatch: release exactly this
            # version instead of the computed next one. Tags in this repo are
            # bare X.Y.Z and the rest of the pipeline (HISTORY.md lookup, asset
            # names, the PyPI/scm version) assumes that shape, so reject anything
            # else rather than silently building a malformed release.
            new="$OVERRIDE"
            if ! printf '%s' "$new" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid tag '$new'; expected X.Y.Z (digits only, no leading 'v')." >&2
              exit 1
            fi
            echo "::notice::Releasing $new (explicit tag override)"
          else
            latest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            latest=${latest:-0.0.0}
            IFS='.' read -r major minor patch <<<"$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new="${major}.${minor}.${patch}"
            echo "::notice::Releasing $new (previous $latest, bump=$BUMP)"
          fi

          # Never clobber an existing tag (a failed publish leaves no orphan tag,
          # so a clean retry is still possible).
          if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
            echo "::error::Tag $new already exists; refusing to re-release." >&2
            exit 1
          fi
          echo "new=$new" >> "$GITHUB_OUTPUT"
      # The ONE distro matrix (.github/docker-matrix.json): `docker` (the
      # build-only gate) and `docker-push` both fromJSON this output, so the
      # two lists can never drift apart (they were written twice and did).
      # The gate ignores the per-row `suffix`; only the push tags use it.
      - name: Emit the docker distro matrix
        id: distros
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/docker_matrix.py)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Gate: tests + all binaries + all Docker images. Runs on EVERY event, in
  # parallel. The publish jobs below need every one of these to succeed.
  # ---------------------------------------------------------------------------

  # Cheap static, configuration and packaging checks precede the build fan-out.
  preflight:
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    needs:
      - version
      - tox-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      zeroconf: ${{ steps.inputs.outputs.zeroconf }}
      cryptography: ${{ steps.inputs.outputs.cryptography }}
      crypto-sha: ${{ steps.inputs.outputs.crypto-sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Check release credentials and version
        if: needs.version.outputs.release == 'true'
        env:
          VERSION: ${{ needs.version.outputs.new }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: python .github/scripts/release_preflight.py
      - name: Check Azure signing login
        if: needs.version.outputs.release == 'true'
        uses: azure/login@v3.0.2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Check optional Docker Hub login
        if: needs.version.outputs.release == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve dependency sources
        id: inputs
        run: |
          python -m pip install packaging pytest strictyaml
          python .github/scripts/release_inputs.py
          python -m pytest tests/test_ci_release_pipeline.py -q
      - name: Validate Linux package recipes
        run: bash .github/scripts/build_packages.sh 1.2.3 "$RUNNER_TEMP/package-check" --check
      - name: Validate package-manager templates
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/template-check"
          mkdir -p "$work"
          for asset in macos-arm64 macos-amd64 linux-arm64 linux-amd64 windows-amd64.exe windows-arm64.exe windows-i686.exe; do
            printf '%064d  cronstable-%s\n' 0 "$asset"
          done > "$work/SHA256SUMS"
          bash packaging/homebrew/render-formula.sh 1.2.3 "$work/SHA256SUMS" packaging/homebrew/cronstable.rb.tmpl > "$work/cronstable.rb"
          ruby -c "$work/cronstable.rb"
          python .github/scripts/render_scoop.py 1.2.3 "$work/SHA256SUMS" "$work/cronstable.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-inputs
          path: release-inputs/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  tox-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # This repository is LF-only (see .gitattributes). Fail fast if any
      # tracked blob ever reaches the index with CRLF or mixed line endings,
      # e.g. one that slipped past `text=auto` normalization by being marked
      # binary or committed by a client that ignored .gitattributes.
      - name: Validate workflow syntax
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck='' -pyflakes=''
      - name: Guard against CRLF line endings
        run: |
          crlf="$(git ls-files --eol | grep -E 'i/(crlf|mixed)' || true)"
          if [ -n "$crlf" ]; then
            echo "::error::Tracked files with CRLF/mixed line endings (this repo is LF-only):"
            echo "$crlf"
            exit 1
          fi
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      # tox-uv pulls in uv and makes tox provision envs + install deps with it.
      - run: pip install tox tox-uv
      - run: tox -p auto -e lint,mypy,bandit,openapi

  # Dependency-license gate. cronstable's core is MIT and it BUNDLES its deps
  # (the PyInstaller binaries and Docker images vendor the whole tree), so a
  # copyleft (GPL/AGPL) or non-open source-available (SSPL/BUSL) dependency must
  # never slip in. scripts/check_licenses.py reads the INSTALLED dist metadata
  # (no third-party scanner) and fails on a disallowed license; weak file-scoped
  # copyleft (LGPL/MPL) is reported but allowed. It installs the runtime plus
  # every distributable extra (`speedups`, `push`, and `discovery`; `push`
  # carries both pynacl and cryptography) so nothing the artifacts can carry
  # escapes the scan. zeroconf (discovery) is LGPL-2.1: expected in the
  # report, and shipped with its compliance kit (in-binary notice, Release
  # source archive, public build recipe). See LICENSING.md.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install runtime + distributable extras
        run: |
          set -euo pipefail
          uv venv --python 3.14
          uv pip install ".[speedups,push,discovery]" "zeroconf==${{ needs.preflight.outputs.zeroconf }}"
      - name: Check dependency licenses
        run: |-
          uv run python .github/scripts/check_licenses.py


    needs:
      - version
      - preflight

  tox:
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        os: [ubuntu-latest, windows-latest]  # macOS is POSIX like Linux; add macos-latest to cover it too
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        experimental: [false]
        include:
          # Windows on ARM64: a gating row on the latest stable Python so the
          # runtime is exercised on win-arm64 (the released .exe targets it too).
          - os: windows-11-arm
            python: '3.14'
            experimental: false
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # The suite runs in 2-9 min per cell (Windows is the slow end); 30 still
    # bounds a hung asyncio test while leaving headroom for a degraded
    # runner VM, which has cost us whole runs at 20.
    timeout-minutes: 30
    steps: &tox-steps
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: |-
          pip install tox tox-uv

      # requirements_dev.txt installs the playwright LIBRARY into the tox env,
      # but pip cannot fetch a browser, and without one the client/daemon cron
      # engine differential (tests/test_web_engine_parity.py) self-skips, which
      # is why it used to run nowhere at all: the dashboard ships a SECOND
      # implementation of the schedule dialect, and nothing compared it against
      # the daemon's outside a dev machine where someone had run
      # `playwright install`.
      #
      # Only this cell: the download is ~150 MB and the differential is
      # platform-independent (it replays the same golden corpus through the
      # same two engines), so a second OS or Python row buys no signal and
      # costs a browser fetch per row. The other cells keep self-skipping.
      # Installed from the requirements_dev.txt line verbatim, so this step and
      # the tox env normally resolve the same release and the browser
      # downloaded here is the build that env goes looking for in the shared
      # ms-playwright cache. The line carries no version pin, and the two
      # installs resolve independently (pip here, uv inside tox), so on a skew
      # the env's playwright wants a browser revision this step did not fetch,
      # chromium.launch() raises, and the differential self-skips: silently
      # green, with nothing comparing the second engine again. The enforcement
      # step below turns that silence into a red cell.
      - name: Install Chromium for the web engine differential
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          set -euo pipefail
          pip install "$(grep -E '^playwright' requirements_dev.txt)"
          python -m playwright install --with-deps chromium
      # Both arms on every runner: the one that does not match the OS skips
      # (a pass, no venv), so ubuntu-latest, windows-latest and
      # windows-11-arm all take the same line and each measures the coverage
      # profile for the OS it is on. See tox.ini's `platform` key.
      - run: |-
          tox -e py-windows,py-posix

      # The differential self-skips wherever Chromium is missing (every other
      # cell, by design), so THIS cell must prove it actually ran: re-drive it
      # through the tox env's own interpreter (and therefore the env's own
      # resolved playwright, the one that must find the browser fetched above)
      # and require a pass, not a skip. Cheap (<1s after the suite), and
      # without it a pip/uv resolution skew quietly restores the
      # "nothing compares the second engine" state this cell exists to end.
      # The check reads pytest's junitxml counts (at least one test, zero
      # failures, zero errors, zero skips) rather than grepping stdout for a
      # literal "1 passed", which a second test in the file would flip to a
      # false red.
      - name: Enforce the web engine differential ran (no silent skip)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          set -euo pipefail
          .tox/py-posix/bin/python -m pytest \
            tests/test_web_engine_parity.py \
            tests/test_web_heat_e2e.py \
            tests/test_web_drawer_e2e.py \
            tests/test_web_title_e2e.py \
            tests/test_web_logsearch_e2e.py \
            tests/test_web_fleet_e2e.py \
            -v -rs --junitxml=parity-enforce.xml
          .tox/py-posix/bin/python - <<'EOF'
          import xml.etree.ElementTree as ET
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for suite in ET.parse("parity-enforce.xml").getroot().iter("testsuite"):
              for key in totals:
                  totals[key] += int(suite.get(key, 0))
          print("parity differential:", totals)
          assert totals["tests"] >= 1, "no parity test was collected"
          assert totals["failures"] == 0 and totals["errors"] == 0
          assert totals["skipped"] == 0, (
              "a parity test skipped in the one cell that provisions "
              "Chromium: the browser install or resolution went stale"
          )
          EOF
      # Every matrix cell uploads its own coverage.xml; Codecov merges them by
      # flag into one combined number. fail_ci_if_error stays false so a Codecov
      # outage never reds the build (and fork PRs with no token still pass).
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python }}
          fail_ci_if_error: false

    needs:
      - version
      - preflight

  tox-experimental:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.15']
        experimental: [true]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    # The suite runs in 2-9 min per cell (Windows is the slow end); 30 still
    # bounds a hung asyncio test while leaving headroom for a degraded
    # runner VM, which has cost us whole runs at 20.
    timeout-minutes: 30
    steps: *tox-steps
    needs:
      - version
      - preflight

  # Wheel + sdist, built and `twine check`ed exactly as it will be published to
  # PyPI. Uploaded as an artifact the `release` job publishes verbatim (so the
  # exact bytes that were checked here are what ship).
  dist:
    needs:
      - version
      - preflight
    runs-on: ubuntu-latest
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Build distributions
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          uv build                                      # wheel + sdist into dist/
          uvx twine check dist/*.whl dist/*.tar.gz       # twine, run ephemerally
      # `twine check` validates metadata and renders the long description; it
      # does NOT look at file size, and neither does the publish action. A 1.2.31
      # sdist that had grown past PyPI's per-file cap therefore sailed through
      # every gate and was rejected two hours later, at upload, after the wheel
      # had already been accepted. Catch it here instead, in seconds.
      - name: Check artifacts against PyPI's per-file size limit
        run: |
          set -euo pipefail
          # warehouse: MAX_FILESIZE = 100 * ONE_MIB (constants.py). The error
          # text says "100 MB" but the value is 100 MiB.
          limit=104857600
          # Fail well below the cap: a release that squeaks under today is one
          # screenshot away from failing, and the sdist ships every git-tracked
          # file (see MANIFEST.in), so it grows with the repo, not the code.
          warn=94371840
          status=0
          for f in dist/*.whl dist/*.tar.gz; do
            size=$(wc -c < "$f")
            printf '%10d bytes  %s\n' "$size" "$f"
            if [ "$size" -ge "$warn" ]; then
              pct=$(( size * 100 / limit ))
              echo "::error file=MANIFEST.in::$(basename "$f") is ${size} bytes, ${pct}% of PyPI's ${limit}-byte per-file limit. Prune it (MANIFEST.in) before releasing."
              status=1
            fi
          done
          exit "$status"
      - name: Smoke-test the installed wheel
        run: python .github/scripts/smoke_dist.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # `nix flake check`: evaluate flake.nix and build cronstable from nixpkgs'
  # Python and dependency set. `nix run github:ptweezy/cronstable` works off
  # this file, and it is the prerequisite artifact for a later nixpkgs
  # submission, so it needs a gate that notices when it stops evaluating.
  #
  # CI-ONLY, like the macOS 26 row: continue-on-error, and the release does not
  # wait on it. Everything it builds comes from a nixpkgs branch that moves
  # outside this repository, so a red here is information about nixpkgs, not a
  # reason to hold a release that ships no Nix artifact.
  nix:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # --print-build-logs so a dependency that fails to build says why in the
      # job log instead of only naming the derivation.
      - run: nix flake check --print-build-logs

  # Self-contained glibc PyInstaller binaries, one per architecture, built
  # inside a manylinux image against a python-build-standalone interpreter.
  #
  # The floor a binary carries is the highest GLIBC_x.y symbol version anything
  # in the bundle asks for, and that is set by where the interpreter, OpenSSL,
  # libstdc++ and every installed wheel were built, not by the bootloader,
  # which comes from a manylinux2014 wheel and only needs GLIBC_2.14. Building
  # on the runner put the floor at GLIBC_2.38, which excludes RHEL/Alma/Rocky 8
  # and 9, Amazon Linux 2023, SLES 15, Debian 12 and Ubuntu 22.04 LTS. Building
  # inside manylinux2014 (CentOS 7) with a python-build-standalone interpreter
  # puts it at GLIBC_2.17 and reaches every glibc Linux still in production.
  #
  # The container is load-bearing rather than cosmetic: pip derives manylinux
  # compatibility from the RUNNING glibc, so on a bare runner it selects the
  # manylinux_2_34 wheels and pins the floor there whatever the interpreter was
  # built against.
  #
  # The image's own /opt/python interpreters are unusable here: manylinux
  # configures them --disable-shared, and PyInstaller hard-requires a shared
  # libpython (PythonLibraryNotFoundError, no fallback). Hence install_pbs.sh.
  #
  # amd64, amd64v3 and arm64 build natively; armv7, ppc64le and s390x run under QEMU.
  # armv7 has no manylinux2014 image, so it builds on manylinux_2_31_armv7l
  # (Ubuntu 20.04) and declares GLIBC_2.31, which covers Raspberry Pi OS
  # bullseye and Debian 11 armhf. ppc64le builds on manylinux_2_28_ppc64le
  # (AlmaLinux 8) and declares GLIBC_2.28, the floor of the only ppc64le
  # wheel cryptography publishes: post-quantum push sealing on POWER costs
  # RHEL 7, whose ppc64le builds left support in 2024. Every row ends with
  # elf_floor.py, which re-derives the floor from the frozen bytes and fails
  # the job if a dependency raised it.
  binaries:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-x86_64-unknown-linux-gnu-install_only.tar.gz'
            pysha: '490953e4a7e97a6ed64d0f0bd04f2d4d9a7bb45368890d3fa32ba05d0ff5c48f'
            floor: '2.17'
            # 64-bit, little-endian, EM_X86_64.
            archspec: elf:2:1:62
            # A wheel always exists for pynacl here, so absence means a broken
            # build rather than a missing wheel; the emulated rows source-build
            # it and stay best-effort.
            nacl: hard
            # A manylinux2014_x86_64 wheel always exists for cryptography, so
            # this row bundles post-quantum sealing and fails if it cannot.
            pq: hard
            rust: '1'
            native: '1'
          - arch: amd64v3
            runner: ubuntu-24.04
            platform: linux/amd64
            image: quay.io/pypa/manylinux2014_x86_64:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-x86_64_v3-unknown-linux-gnu-install_only.tar.gz'
            pysha: '8fc4a6bd7422364d815844616de31bfb5c38743815810fd9a8a4bc278684f6fc'
            floor: '2.17'
            archspec: elf:2:1:62
            nacl: hard
            pq: hard
            rust: '1'
            native: '1'
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: quay.io/pypa/manylinux2014_aarch64:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-aarch64-unknown-linux-gnu-install_only.tar.gz'
            pysha: '5bad659dc6d686b430f60104d53abfecb1cd93de37b8aaa112f10f0cea2cb655'
            floor: '2.17'
            archspec: elf:2:1:183   # 64-bit, little-endian, EM_AARCH64
            nacl: hard
            pq: hard   # manylinux2014_aarch64 wheel; see the amd64 row
            rust: '1'
            native: '1'
          - arch: ppc64le
            runner: ubuntu-24.04
            platform: linux/ppc64le
            qemu: true
            # manylinux_2_28 rather than manylinux2014: cryptography publishes
            # its ppc64le wheel at manylinux_2_28 and up, so this row's floor
            # is 2.28 (RHEL 8, Ubuntu 18.10, Debian 10) to carry it. The
            # pip cache key includes the image name, so the source-built
            # wheels never cross from the 2.17 image.
            image: quay.io/pypa/manylinux_2_28_ppc64le:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-ppc64le-unknown-linux-gnu-install_only.tar.gz'
            pysha: '5b9089861601ead3af0ab4c564cecd2c02b3e6cdf2eb4ef08e1caba98311a79f'
            floor: '2.28'
            archspec: elf:2:1:21    # 64-bit, little-endian, EM_PPC64
            nacl: soft
            pq: hard   # manylinux_2_28_ppc64le wheel; see the image note above
            rust: '1'
            native: '0'
          - arch: s390x
            runner: ubuntu-24.04
            platform: linux/s390x
            qemu: true
            image: quay.io/pypa/manylinux2014_s390x:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-s390x-unknown-linux-gnu-install_only.tar.gz'
            pysha: '8ceecd7af302de3f6e6c4564dd671e4d1fa3a2a69f7d40075c75a2747d6ceacf'
            floor: '2.17'
            archspec: elf:2:2:22    # 64-bit, BIG-endian, EM_S390
            nacl: soft
            # No cryptography wheel exists for s390x at any tag, so this row
            # builds it from source: the rustup Rust it already has for
            # orjson, plus an OpenSSL 3.5 built from source (CentOS 7 ships
            # 1.0.2, and ML-KEM needs 3.5) into the workspace, where the
            # cache steps below keep it across runs. soft, like every other
            # source build under QEMU here: verify_extra.py seals a real
            # X-Wing probe and drops a build that cannot.
            pq: soft
            pq_src: '1'
            rust: '1'
            native: '0'
          - arch: armv7
            runner: ubuntu-24.04
            platform: linux/arm/v7
            qemu: true
            # No manylinux2014 armv7l image exists; this one is Ubuntu 20.04,
            # so the floor this row declares is 2.31 rather than 2.17.
            image: quay.io/pypa/manylinux_2_31_armv7l:2026.08.15-1
            pyurl: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260814/cpython-3.14.7+20260814-armv7-unknown-linux-gnueabihf-install_only.tar.gz'
            pysha: 'fc000e5c8651aaa81113aa55868300ebb9debff71d6d96b2a841f589d5057668'
            floor: '2.31'
            archspec: elf:1:1:40    # 32-bit, little-endian, EM_ARM
            # Hard-float, and nothing in the bundle may need above ARMv7.
            armgate: '--arm-float hard --max-arm-arch v7 --max-arm-fp 4'
            nacl: soft
            # cryptography publishes a manylinux_2_31_armv7l wheel, which is
            # this row's image exactly, so post-quantum sealing rides along
            # with no source build and no Rust. hard for the same reason the
            # native rows are: the wheel is always there.
            pq: hard
            # No Rust here, which is a cost decision rather than a limitation:
            # rustup does publish host tools for armv7-unknown-linux-gnueabihf
            # (the soft-float gnueabi triple is the one that lacks them), but
            # building a Rust toolchain's worth of orjson under QEMU costs more
            # than orjson buys. It is best-effort on every lane by design, and
            # the stdlib fallback (cronstable/_json) is byte-compatible.
            rust: '0'
            native: '0'
    runs-on: ${{ matrix.runner }}
    # The emulated rows source-build uvloop, pynacl and psutil under QEMU.
    # Generous on purpose; a row still going at this point is wedged, not slow.
    timeout-minutes: 300
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      # Same contract as binaries-container: persist the wheels pip BUILDS from
      # sdists so the slow QEMU compiles happen once per dependency bump rather
      # than on every push. Keyed on the image as well as the arch, because a
      # wheel source-built against CentOS 7 and one built against any other
      # base both carry the plain linux_<arch> tag and a shared cache could
      # hand one row the other's build.
      - name: Restore pip cache (QEMU-built wheels)
        id: pip-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: pip-manylinux-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', '.github/workflows/release.yml') }}
          restore-keys: |
            pip-manylinux-${{ matrix.arch }}-
      # The static OpenSSL the pq_src row builds for cryptography (see
      # build_openssl.sh): an hour under QEMU, so it is kept across runs.
      # Keyed on the script, which pins the OpenSSL version, and on the
      # image, whose toolchain produced the objects. Saved trunk-only like
      # the pip cache above, and for the same quota reason.
        continue-on-error: true
      - name: Restore the OpenSSL build (pq_src rows)
        if: ${{ matrix.pq_src }}
        id: openssl-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .openssl-${{ matrix.arch }}
          key: openssl-manylinux-${{ matrix.arch }}-${{ hashFiles('pyinstaller/build_openssl.sh') }}-${{ matrix.image }}
        continue-on-error: true
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4.3.0
      # Pulled in its own retried step, like every other container lane, so a
      # registry blip never re-runs the hour-long build below. NOT pull_base:
      # that helper's mirror failover rewrites the image into the Docker Hub
      # `library/` namespace, and these are quay.io images, which the mirrors
      # do not carry.
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
      - name: Build binary (manylinux ${{ matrix.arch }})
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
          # Passed through the environment rather than spliced into the
          # single-quoted script below, which admits no quote characters.
          # CentOS 7 carries curl; the distro rustc predates orjson's MSRV by
          # years, so a current stable comes from rustup. No curl-level retry
          # flags: that curl is 7.29 and rejects --retry-connrefused as a
          # usage error, and retry.sh already wraps the call.
          RUST_SETUP_CMD: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e PIP_CACHE_DIR=/src/.pip-cache \
            -e RUST_SETUP_CMD \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              # The checkout is mounted at /src, so the runner-side retry helper
              # is reachable in here too.
              . /src/.github/scripts/retry.sh
              # pip refuses a cache directory it does not own: this container
              # runs as root while the bind-mounted workspace is the runner
              # user, so without the chown every pip call logs "The cache has
              # been disabled" and the persisted cache stores nothing.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              # The checkout belongs to the runner user and this container is
              # root, so git calls the bind mount dubiously owned and refuses to
              # read it. setuptools_scm shells out to git for its file finder
              # during `pip install .` and treats that refusal as fatal, so the
              # build dies before it starts. The other container lanes never hit
              # this because their images carry no git at all; manylinux does.
              git config --global --add safe.directory /src
              # The interpreter this lane freezes: shared libpython, GLIBC_2.17,
              # pinned by digest. The image ships its own CPythons at
              # /opt/python, but manylinux configures them --disable-shared and
              # PyInstaller cannot freeze from those.
              sh /src/.github/scripts/install_pbs.sh \
                "${{ matrix.pyurl }}" "${{ matrix.pysha }}" /opt/pbs
              PATH=/opt/pbs/bin:$PATH
              LD_LIBRARY_PATH=/opt/pbs/lib
              export PATH LD_LIBRARY_PATH
              if [ "${{ matrix.arch }}" = amd64v3 ]; then
                python3 docker/python_runtime.py --check
                RUSTFLAGS="-C target-cpu=x86-64-v3"
                export RUSTFLAGS
              fi
              # python-build-standalone bakes the toolchain it was built with
              # into sysconfig (CC=/usr/bin/<triple>-gcc), and that path does
              # not exist in this image, so every source build dies with "No
              # such file or directory" before it compiles a line. It bites the
              # emulated rows hardest, where psutil, uvloop and pynacl all
              # build from sdist. Point the build tools at the image toolchain,
              # which is the one producing GLIBC_2.17 objects anyway.
              CC=gcc
              CXX=g++
              AR=ar
              LDSHARED="gcc -shared"
              export CC CXX AR LDSHARED
              # install_extra.sh / install_orjson.sh read these; nothing on the
              # image PATH is the right interpreter, so both are absolute.
              PIP="/opt/pbs/bin/python3 -m pip"
              PY=/opt/pbs/bin/python3
              export PIP PY
              $PIP install --upgrade pip
              $PIP install pyinstaller==6.22.1  # pin matches the other binary jobs
              $PIP install .                    # bakes the pinned version into cronstable/version.py
              # Bundle uvloop (the `speedups` extra): a manylinux_2_17 wheel on
              # amd64/arm64, else a source build against the image toolchain.
              # The shared script has verify_extra.py prove the result runs a
              # loop (a source build can miscompile under QEMU) and uninstalls
              # it otherwise, so the binary cleanly falls back to asyncio.
              sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
              # Bundle orjson (the `speedups` extra): a wheel on amd64/arm64,
              # else a Rust source build behind RUST_SETUP. armv7 passes no
              # RUST_SETUP by choice (see the matrix comment), so that row falls
              # back to the stdlib json encoder (cronstable/_json), which is
              # byte-compatible.
              RUST_SETUP=""
              if [ "${{ matrix.rust }}" = "1" ]; then
                RUST_SETUP="$RUST_SETUP_CMD"
              fi
              RUST_SETUP="$RUST_SETUP" sh pyinstaller/install_orjson.sh
              # Bundle pynacl (the `push` extra). hard where an abi3 wheel
              # always exists, soft where it source-builds: a build that fails
              # the sealed-box round trip is uninstalled, so push fails closed
              # rather than shipping a miscompiled libsodium.
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" ${{ matrix.nacl }} "push extra not bundled"
              # Bundle cryptography (the post-quantum half of the `push` extra) so the frozen daemon
              # seals post-quantum X-Wing push. NO APOSTROPHES BELOW: this
              # whole script is the argument of a single-quoted sh -euc, so
              # one would end it mid-comment. Every row declares `pq`. Where
              # a wheel matches the image (manylinux2014 on amd64/arm64,
              # manylinux_2_31_armv7l on armv7, manylinux_2_28_ppc64le on
              # ppc64le) it is hard: the wheel is always there and absence
              # means a broken build. s390x has no wheel at any tag and
              # declares pq_src instead: a current Rust from rustup and an
              # OpenSSL 3.5 built from source by build_openssl.sh into the
              # bind-mounted workspace (the cache steps around this one keep
              # it), both linked statically so the bundle carries no libssl,
              # under the soft policy the other QEMU source builds here take.
              # Either way verify_extra.py then seals a real X-Wing probe,
              # catching an ML-KEM-less OpenSSL here rather than at the first
              # pairing an operator makes.
              if [ -n "${{ matrix.pq }}" ]; then
                pq_ready=1
                if [ -n "${{ matrix.pq_src }}" ]; then
                  # Best effort as a whole, like the row: a toolchain step
                  # that fails costs the build its post-quantum suite and
                  # says so, never the job.
                  {
                    if [ ! -x /opt/cargo/bin/cargo ]; then
                      sh -c "$RUST_SETUP_CMD"
                    fi
                    # OpenSSL Configure imports perl IPC::Cmd, and the
                    # Makefile it writes imports Time::Piece; CentOS 7
                    # packages both apart from perl and the image leaves
                    # them out. The bigint the s390x assembler generators
                    # import is in its base perl: CentOS 7 has no
                    # perl-bignum package, and naming one fails yum.
                    perl -MIPC::Cmd -MTime::Piece -e 1 2>/dev/null || retry 5 yum install -y perl-IPC-Cmd perl-Time-Piece
                    sh pyinstaller/build_openssl.sh /src/.openssl-${{ matrix.arch }}
                  } || pq_ready=0
                  PATH=/opt/cargo/bin:$PATH
                  CARGO_HOME=/opt/cargo
                  RUSTUP_HOME=/opt/rustup
                  OPENSSL_DIR=/src/.openssl-${{ matrix.arch }}
                  OPENSSL_STATIC=1
                  export PATH CARGO_HOME RUSTUP_HOME OPENSSL_DIR OPENSSL_STATIC
                fi
                if [ "$pq_ready" = 1 ]; then
                  sh pyinstaller/install_extra.sh cryptography "cryptography>=48" \
                    ${{ matrix.pq }} "post-quantum push not bundled"
                else
                  echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
                fi
              fi
              # Bundle zeroconf (the `discovery` extra): pure Python with
              # optional speedups, so a HARD install on every row. LGPL-2.1;
              # the in-binary notice, Release source archive and public build
              # recipe are the compliance kit (see LICENSING.md).
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version          # smoke test, on CentOS 7 itself
              # Whenever the build env kept pynacl, the frozen binary must
              # reach it (and zeroconf) too: the push-plus-bonjour config
              # validates only when both import inside the bundle.
              if $PY -c "import nacl" 2>/dev/null; then
                dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
              fi
              # Gate the FROZEN artifact too (see install_extra.sh header):
              # whenever the build env kept cryptography, the frozen bundle
              # must seal xwing. On a soft row that dropped a broken source
              # build there is nothing to gate, and the install log said so.
              if $PY -c "import cryptography" 2>/dev/null; then
                suites=$(dist/cronstable --sealable-suites)
                echo "sealable suites: $suites"
                echo "$suites" | grep -qx xwing || {
                  echo "FAIL: the frozen binary cannot seal xwing" >&2
                  exit 1
                }
              fi
              # A job that shells out to the CLI, asserted on the KV side
              # effect: proves the daemon PyInstaller env scrub against the
              # real bootloader, which no venv test reaches. Native rows only;
              # it needs a live daemon and loopback HTTP, and the rest of this
              # matrix is emulated. The scrub it proves is shared Python code,
              # identical on every lane.
              if [ "${{ matrix.native }}" = "1" ]; then
                bash /src/.github/scripts/cli_job_smoke.sh dist/cronstable
              fi
              # Assert the binary is the architecture this row claims: an image
              # that resolved to the wrong platform passes every smoke above and
              # ships a mislabelled asset.
              $PY /src/.github/scripts/assert_arch.py dist/cronstable ${{ matrix.archspec }}
              # And assert the FLOOR, which no functional test can see: the
              # smoke ran on a glibc newer than the binary needs, so a
              # dependency that starts publishing a higher-tagged wheel would
              # ship a binary that no longer starts on the hosts this lane
              # exists to serve, with CI green throughout. --no-exec-stack
              # additionally catches an interpreter built with an executable
              # stack, which dies on SELinux-hardened hosts.
              $PY /src/.github/scripts/elf_floor.py dist/cronstable \
                --max-glibc ${{ matrix.floor }} --no-exec-stack ${{ matrix.armgate }}
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}
            '
      # The container runs as root and pip creates its cache files via
      # tempfile (mode 0600), so without this the runner-user tar in
      # actions/cache's save step cannot read them.
      - name: Make the pip cache readable by the cache save
        run: |
          set -euo pipefail
          for d in .pip-cache .openssl-${{ matrix.arch }}; do
            if [ -d "$d" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$d"
            fi
          done
      # Branch-gated like every other cache writer: the Actions cache is ONE
      # 10 GB pool per repository and is already over it, so writing from every
      # branch would evict the layer cache the docker job depends on. Other
      # branches still RESTORE what main stored.
      - name: Save pip cache (trunk only)
        if: ${{ steps.pip-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: pip-manylinux-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Save the OpenSSL build (pq_src rows, trunk only)
        if: ${{ matrix.pq_src && steps.openssl-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .openssl-${{ matrix.arch }}
          key: openssl-manylinux-${{ matrix.arch }}-${{ hashFiles('pyinstaller/build_openssl.sh') }}-${{ matrix.image }}
        continue-on-error: true
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}
          path: dist/cronstable-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained container-built Linux binaries, one per arch x libc pair.
  # PyInstaller is not a cross-compiler and the runners are glibc, so every
  # row builds inside `docker run --platform` (checkout + upload stay on the
  # host). The musl rows cover every architecture Alpine has a port for and
  # ship with a `-musl` suffix; the two glibc rows here are the ones the
  # manylinux `binaries` job cannot serve (see the per-arch includes). amd64,
  # arm64 and i686 execute natively; armv7, armv6, ppc64le, s390x and
  # riscv64 run under QEMU. armv6 is musl-only (Debian/glibc ships no
  # arm32v6). Same pyinstaller pin and `--version` smoke test as that job;
  # the per-libc bits (base image, package-manager commands, artifact suffix)
  # ride the matrix.
  #
  # Every base image is pinned to an EXPLICIT distro tag. A floating tag makes
  # the libc floor an emergent property of whatever the tag resolves to that
  # week: `python:3.14-alpine` moved from Alpine 3.19 to 3.24 on its own and
  # took the musl floor from 1.2.4 to 1.2.6 with it, silently. 3.23 is the
  # newest Alpine still on musl 1.2.5, so it is the pin. tests/test_ci_fences.py
  # holds the images to a dated tag.
  binaries-container:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        libc: [musl, glibc]
        arch: [amd64, amd64v3, arm64, i686, armv7, armv6, ppc64le, s390x, riscv64]
        exclude:
          # These glibc rows build in the manylinux `binaries` job, which
          # reaches GLIBC_2.17 (2.31 on armv7) instead of this lane's Debian
          # floor; armv6 is musl-only (Debian ships no arm32v6).
          - {libc: glibc, arch: amd64}
          - {libc: glibc, arch: amd64v3}
          - {libc: glibc, arch: arm64}
          - {libc: glibc, arch: armv7}
          - {libc: glibc, arch: ppc64le}
          - {libc: glibc, arch: s390x}
          - {libc: glibc, arch: armv6}
        include:
          # per-libc: base image, artifact suffix, and the package-manager
          # commands the build script splices in (no quote characters in any
          # of them; they are injected into a single-quoted sh -c script)
          - libc: musl
            image: python:3.14-alpine3.23
            suffix: -musl
            toolchain: 'retry 5 apk add --no-cache build-base libffi-dev zlib-dev'
            nacl_tools: 'retry 3 apk add --no-cache libffi-dev make >/dev/null 2>&1 || true'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 5 apk add --no-cache curl && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # What a cryptography SOURCE build needs on the rows with no
            # wheel (pq_src below): Alpine 3.23 ships rust 1.91 (the MSRV
            # is 1.83) and OpenSSL 3.5 (ML-KEM needs 3.5) for all nine of
            # its arches, so the distro toolchain does the whole job with
            # no rustup and no OpenSSL build. The extension links the
            # distro libssl (see the lane script), so the headers suffice.
            pq_tools: 'retry 5 apk add --no-cache rust cargo openssl-dev pkgconf'
          - libc: glibc
            # Overridden per row below: the two remaining glibc rows sit on
            # different Debian suites, because bookworm has no riscv64 port
            # and trixie's glibc is three years newer than i686 hosts need.
            image: python:3.14-slim-trixie
            suffix: ''
            toolchain: 'retry 5 apt-get -o Acquire::Retries=5 update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential libffi-dev zlib1g-dev'
            nacl_tools: 'retry 3 apt-get -o Acquire::Retries=5 install -y --no-install-recommends libffi-dev make >/dev/null 2>&1 || true'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 5 apt-get -o Acquire::Retries=5 update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # The trixie counterpart of the musl pq_tools: rustc 1.85 and
            # OpenSSL 3.5.7 on every port trixie ships, headers in
            # libssl-dev. Only the trixie row uses it (riscv64); the
            # bookworm i686 row has OpenSSL 3.0 and rustc 1.63 and takes
            # its own route below.
            pq_tools: 'retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends rustc cargo libssl-dev pkg-config'
          # per-arch: docker platform, runner, and whether QEMU is needed
          # (amd64/arm64/i686 execute natively on the runners)
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: amd64v3, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {arch: i686, platform: linux/386, runner: ubuntu-24.04}
          # Post-quantum sealing on every row. `pq: hard` where cryptography
          # publishes a musllinux_1_2 wheel (x86_64 and aarch64): the wheel
          # is always there, so absence is a broken build. `pq: soft` with
          # `pq_src` everywhere else: cryptography compiles from its sdist
          # with the distro Rust and OpenSSL that pq_tools installs, under
          # QEMU on most of these rows, and takes the policy pynacl takes
          # for its own source builds here: verify_extra.py seals a real
          # X-Wing probe and uninstalls a build that cannot, so a
          # miscompiled cryptography is never frozen in and the binary
          # refuses xwing pairings instead (x25519 push still seals). The
          # pip cache keeps the built wheel, so the compile is paid once
          # per cryptography bump. Keyed on both libc and arch because the
          # glibc twins of several arches build in the manylinux `binaries`
          # job instead.
          - {libc: musl, arch: amd64, pq: hard}
          - {libc: musl, arch: amd64v3, pq: hard}
          - {libc: musl, arch: arm64, pq: hard}
          - {libc: musl, arch: i686, pq: soft, pq_src: '1'}
          - {libc: musl, arch: armv7, pq: soft, pq_src: '1'}
          - {libc: musl, arch: armv6, pq: soft, pq_src: '1'}
          - {libc: musl, arch: ppc64le, pq: soft, pq_src: '1'}
          - {libc: musl, arch: s390x, pq: soft, pq_src: '1'}
          - {libc: musl, arch: riscv64, pq: soft, pq_src: '1'}
          # `armgate` is the ABI assertion elf_floor.py makes on 32-bit ARM,
          # which no functional test can make for itself: the float ABI, and
          # the newest instruction set anything in the bundle needs.
          #
          # `hostplat` is the fix for the ARMv6 wheel trap. Under QEMU an ARMv6
          # container reports armv7l from uname, so pip cheerfully installs
          # musllinux armv7l wheels (the whole aiohttp/multidict/yarl stack and
          # every zeroconf Cython module publish them) whose object code uses
          # ARMv7 instructions. The 1.2.41 armv6 binary shipped 27 such members
          # and could not have run on a Raspberry Pi 1 at all, while passing
          # every smoke test under emulation. _PYTHON_HOST_PLATFORM is
          # sysconfig's cross-build hook: setting it makes pip generate armv6l
          # tags, so those wheels stop being candidates and the C extensions
          # compile in-container against Alpine's ARMv6 gcc instead. armgate
          # then holds the result to it.
          - {arch: armv7, platform: linux/arm/v7, runner: ubuntu-24.04, qemu: true, armgate: '--arm-float hard --max-arm-arch v7 --max-arm-fp 4'}
          - {arch: armv6, platform: linux/arm/v6, runner: ubuntu-24.04, qemu: true, armgate: '--arm-float hard --max-arm-arch v6 --max-arm-fp 2', hostplat: linux-armv6l}
          - {arch: ppc64le, platform: linux/ppc64le, runner: ubuntu-24.04, qemu: true}
          - {arch: s390x, platform: linux/s390x, runner: ubuntu-24.04, qemu: true}
          - {arch: riscv64, platform: linux/riscv64, runner: ubuntu-24.04, qemu: true}
          # per-libc-and-arch, so these land on the two glibc rows only and
          # leave the musl rows of the same arches alone. `floor` is the glibc
          # version elf_floor.py holds the frozen bundle to; the musl rows set
          # none and skip that gate (they carry no GLIBC_ symbol versions).
          # i686 goes to bookworm, whose glibc 2.36 is what Debian 12 i386
          # actually ships; python-build-standalone publishes no i686 Linux
          # target, so the manylinux route the other arches take is closed
          # here. riscv64 stays on trixie, the first Debian release with the
          # port at all.
          - libc: glibc
            arch: i686
            image: python:3.14-slim-bookworm
            floor: '2.36'
            # bookworm has OpenSSL 3.0 and rustc 1.63, both short of what a
            # cryptography source build needs (3.5 for ML-KEM, Rust 1.83),
            # so this row overrides the glibc pq_tools with the build
            # prerequisites alone and takes pq_openssl: a rustup Rust plus
            # an OpenSSL 3.5 built from source (build_openssl.sh). Native
            # rather than emulated, so that build is minutes, and not
            # cached. rustup is told the host explicitly: uname inside a
            # linux/386 container can still say x86_64.
            pq: soft
            pq_src: '1'
            pq_openssl: '1'
            pq_tools: 'retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates perl make pkg-config'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 5 apt-get -o Acquire::Retries=5 update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl ca-certificates && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --default-host i686-unknown-linux-gnu --profile minimal --no-modify-path'
          - {libc: glibc, arch: riscv64, image: python:3.14-slim-trixie, floor: '2.41', pq: soft, pq_src: '1'}
    runs-on: ${{ matrix.runner }}
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      # Persist pip's cache (otherwise lost with the runner) in the workspace,
      # where the build container sees it at /src/.pip-cache via the bind
      # mount and the PIP_CACHE_DIR forwarded below. pip keeps the wheels it
      # BUILDS from sdists in this cache, so the slow QEMU compiles (uvloop,
      # orjson's Rust build, pynacl's bundled libsodium, the musl aiohttp
      # stack, PyInstaller's own bootloader) happen once per dependency bump
      # instead of on every push; install_orjson.sh's plain-pip first attempt
      # then finds the cached wheel and skips the rustup toolchain entirely.
      # Resolution still queries the index every run, so which VERSIONS
      # install is unchanged, and the verify probes still run against the
      # installed result; the cache only skips re-downloading and re-compiling
      # artifacts pip validates by hash. Keyed per arch AND libc: a wheel
      # source-built on glibc and one built on musl both carry the plain
      # linux_<arch> tag, so a shared cache could hand one row the other's
      # ABI-incompatible build. The key's hashFiles covers pyproject.toml and
      # this workflow, where the dep floors and the pyinstaller pin live;
      # restore-keys seeds the rebuild from the previous cache when either
      # file changes.
      - name: Restore pip cache (QEMU-built wheels)
        id: pip-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: pip-${{ matrix.libc }}-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', '.github/workflows/release.yml') }}
          restore-keys: |
            pip-${{ matrix.libc }}-${{ matrix.arch }}-
      # Register binfmt/QEMU so `docker run --platform` can execute a foreign-arch
      # container. amd64/arm64/i686 run natively and skip this.
        continue-on-error: true
      - if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4.3.0
      # Pull the base image in its own retried step. Docker Hub times out often
      # enough to red a release on its own (a 15s connect timeout to
      # registry-1.docker.io took the s390x row down mid-release), and pulling
      # here keeps the retry off the build below: that one runs for up to an
      # hour under QEMU and must never be repeated for a registry blip.
      # pull_base adds registry failover on top of the retries: the
      # 2026-07-25 Hub outage outlived five attempts, so a same-digest
      # mirror (ECR Public, then mirror.gcr.io) now backstops the pull.
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          pull_base ${{ matrix.image }} ${{ matrix.platform }}
      - name: Build binary (${{ matrix.libc }} container)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e PIP_CACHE_DIR=/src/.pip-cache \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              # The checkout is mounted at /src, so the runner-side retry helper
              # is reachable in here too. Neither apk nor apt retries hard
              # enough on its own, and a failed index fetch is a hard job
              # failure, so the matrix-provided commands wrap themselves in it.
              . /src/.github/scripts/retry.sh
              # pip refuses to use a cache directory it does not own: this
              # container runs as root while the bind-mounted workspace is
              # the runner user, so without the chown every pip call logs
              # "The cache has been disabled" and the whole persisted cache
              # stores nothing. The host-side step after the build hands
              # ownership back so the cache save can read it.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              # Per-libc C toolchain + strip (the spec sets strip=True), plus
              # libffi/zlib headers for the deps that ship no wheel for this
              # libc/arch and fall back to compiling from sdist (notably the
              # i686 aiohttp stack; propcache on armv7). The full-wheel arches
              # leave the toolchain unused.
              ${{ matrix.toolchain }}
              if [ "${{ matrix.arch }}" = amd64v3 ]; then
                python docker/python_runtime.py --variant amd64v3 --libc musl --prefix /opt/pbs
                PATH=/opt/pbs/bin:$PATH
                RUSTFLAGS="-C target-cpu=x86-64-v3"
                export PATH RUSTFLAGS
              fi
              # See the hostplat comment in the matrix: this is what stops pip
              # selecting armv7l wheels inside an ARMv6 container.
              if [ -n "${{ matrix.hostplat }}" ]; then
                _PYTHON_HOST_PLATFORM="${{ matrix.hostplat }}"
                export _PYTHON_HOST_PLATFORM
                python -c "import sysconfig; print(\"host platform:\", sysconfig.get_platform())"
              fi
              pip install --upgrade pip
              pip install pyinstaller==6.22.1   # pin matches the other binary jobs
              pip install .                     # bakes the pinned version into cronstable/version.py
              # Bundle uvloop (the `speedups` extra): a wheel where one exists
              # (amd64/arm64), else a source build. The shared script has
              # verify_extra.py prove the result runs a loop (a source build
              # can miscompile under QEMU) and uninstalls it otherwise, so a
              # broken uvloop is never frozen in; the binary then cleanly
              # falls back to asyncio.
              sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
              # Bundle orjson (the `speedups` extra): a wheel on amd64/arm64,
              # else a Rust source build. RUST_SETUP (per-libc, from the
              # matrix) installs a CURRENT Rust via rustup (distro rustc is
              # older than the orjson MSRV) only when the wheel is missing;
              # the shared script round-trip-verifies the result and drops a
              # broken QEMU build -> stdlib json fallback. install_orjson.sh
              # runs RUST_SETUP via `sh -c`, a fresh shell, so the command
              # sources the retry helper itself; rustup is fetched to a file
              # and then executed rather than piped straight into sh: curl
              # retries cannot un-feed a truncated script to an interpreter
              # that has already started running it.
              RUST_SETUP="${{ matrix.rust_setup }}" sh pyinstaller/install_orjson.sh
              # Bundle pynacl (the `push` extra): wheels on amd64/arm64, else
              # a plain-C source build (bundled libsodium, no Rust; the
              # libffi/make toolchain is best-effort). Soft on this lane
              # only: a build that fails the sealed-box round-trip is
              # uninstalled, so the binary never ships a miscompiled
              # libsodium (push fails closed).
              ${{ matrix.nacl_tools }}
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
              # Bundle cryptography (the post-quantum half of the `push` extra) so the frozen daemon
              # seals post-quantum X-Wing push. The wheel rows take it hard;
              # the pq_src rows first install the distro Rust and OpenSSL
              # (pq_tools) and let pip build the sdist against the distro
              # libssl, which PyInstaller already collects into the bundle
              # for the ssl module of the interpreter, so the binary
              # carries one OpenSSL rather than two. Soft, as the matrix
              # explains (and no apostrophes: single-quoted sh -euc). The
              # bookworm row is the exception: its distro OpenSSL cannot
              # seal ML-KEM, so it links a static one it builds (pq_openssl
              # below). Either way verify_extra.py seals a real X-Wing probe
              # before the bundle is frozen.
              if [ -n "${{ matrix.pq }}" ]; then
                if [ -n "${{ matrix.pq_src }}" ]; then
                  ${{ matrix.pq_tools }}
                fi
                # The bookworm row (see its matrix entry): the distro has
                # neither the Rust nor the OpenSSL the build needs, so both
                # come from outside it.
                pq_ready=1
                if [ -n "${{ matrix.pq_openssl }}" ]; then
                  # Best effort as a whole, like the row: a toolchain step
                  # that fails costs the build its post-quantum suite and
                  # says so, never the job.
                  {
                    if [ ! -x /opt/cargo/bin/cargo ]; then
                      sh -c "${{ matrix.rust_setup }}"
                    fi
                    sh pyinstaller/build_openssl.sh /opt/openssl
                  } || pq_ready=0
                  PATH=/opt/cargo/bin:$PATH
                  CARGO_HOME=/opt/cargo
                  RUSTUP_HOME=/opt/rustup
                  OPENSSL_DIR=/opt/openssl
                  OPENSSL_STATIC=1
                  export PATH CARGO_HOME RUSTUP_HOME OPENSSL_DIR OPENSSL_STATIC
                fi
                if [ "$pq_ready" = 1 ]; then
                  sh pyinstaller/install_extra.sh cryptography "cryptography>=48" \
                    ${{ matrix.pq }} "post-quantum push not bundled"
                else
                  echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
                fi
              fi
              # Bundle zeroconf (the `discovery` extra): pure Python with
              # optional speedups, so a HARD install even under QEMU. It
              # is LGPL-2.1; the in-binary notice, Release source
              # archive, and public build recipe are the compliance kit
              # (see LICENSING.md).
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version            # smoke test, native or emulated on its own libc
              # Whenever the build env kept pynacl, the frozen binary
              # must reach it (and zeroconf) too: the push-plus-bonjour
              # config validates only when both import inside the bundle.
              if python -c "import nacl" 2>/dev/null; then
                dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
              fi
              # Gate the FROZEN artifact too (see install_extra.sh header):
              # whenever the build env kept cryptography, the frozen bundle
              # must seal xwing. On a soft row that dropped a broken source
              # build there is nothing to gate, and the install log said so.
              if python -c "import cryptography" 2>/dev/null; then
                suites=$(dist/cronstable --sealable-suites)
                echo "sealable suites: $suites"
                echo "$suites" | grep -qx xwing || {
                  echo "FAIL: the frozen binary cannot seal xwing" >&2
                  exit 1
                }
              fi
              # The CLI-from-job smoke (cli_job_smoke.sh) runs on the native
              # lanes only: it needs a daemon, loopback HTTP and curl, and
              # most of these rows run under QEMU. The scrub it proves is
              # shared Python code, identical on every lane.
              # Assert the glibc FLOOR on the rows that declare one, which no
              # functional test can see: the smoke ran on the same libc the
              # bundle was built against, so a dependency that starts
              # publishing a higher-tagged wheel would ship a binary that no
              # longer starts on the hosts this row exists to serve, with CI
              # green throughout. The musl rows set no floor and skip it: they
              # carry no GLIBC_ symbol versions, and their floor is held down
              # by the pinned Alpine tag instead.
              gate=""
              if [ -n "${{ matrix.floor }}" ]; then
                gate="--max-glibc ${{ matrix.floor }} --no-exec-stack"
              fi
              if [ -n "$gate" ] || [ -n "${{ matrix.armgate }}" ]; then
                python /src/.github/scripts/elf_floor.py dist/cronstable $gate ${{ matrix.armgate }}
              fi
              if [ "${{ matrix.arch }}" = amd64v3 ]; then
                python /src/.github/scripts/assert_arch.py dist/cronstable elf:2:1:62
                python /src/.github/scripts/elf_floor.py dist/cronstable --max-glibc 0.0 --no-exec-stack
              fi
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}
            '
      # The container runs as root and pip creates its cache files via
      # tempfile (mode 0600), so without this the runner-user tar in
      # actions/cache's save step cannot read them: the save fails with a
      # permissions warning the job ignores, and every push recompiles the
      # QEMU wheels the cache exists to keep.
      - name: Make the pip cache readable by the cache save
        run: |
          set -euo pipefail
          if [ -d .pip-cache ]; then
            sudo chown -R "$(id -u):$(id -g)" .pip-cache
          fi
      # Branch-gated like the docker job's buildx export, and for the same
      # reason: the Actions cache is ONE 10 GB pool per repository, shared
      # with that exporter's multi-GB layer blobs, and this job alone is 13
      # matrix rows. Writing from every branch and every fork PR would evict
      # the layer cache the docker build depends on. Every other branch
      # still RESTORES through to what main stored, which is
      # where the QEMU compile savings actually come from.
      - name: Save pip cache (trunk only)
        if: ${{ steps.pip-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: pip-${{ matrix.libc }}-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: dist/cronstable-linux-${{ matrix.arch }}${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained MIPS binaries. Its own job rather than a `binaries-container`
  # row because every assumption that job makes is different here: there is no
  # mips variant of the `python:3.14-*` images, so the base is Debian itself and
  # Python comes from apt (3.11, the newest packaged for this port; the project
  # floor is 3.10). Bookworm also marks its interpreter externally managed
  # (PEP 668), so the build installs into a venv instead of the interpreter pip
  # that lane uses.
  #
  # Debian bookworm is the last suite carrying mips64el, and the multi-arch
  # `library/debian` manifest list does NOT include it; only the per-arch
  # `mips64le/debian` repository does, which is why the pull below is spelled
  # out rather than going through pull_base. That repository is also frozen:
  # mips64le was removed from the official-images definition for bookworm in
  # August 2026, so the tag no longer moves and the base OS layer no longer
  # gets patched. The archive pin below is the other half of the same story.
  #
  # Everything compiles from source here, PyInstaller included: no mips wheel
  # exists on PyPI for anything, and PyInstaller builds its own bootloader onto
  # its `mips` machine tag. That is deliberate. Build time is not the constraint
  # on this lane, and the binary it produces is smaller than the amd64 one.
  binaries-mips:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: mips64le
            platform: linux/mips64le
            image: mips64le/debian:bookworm-slim
            # 64-bit, little-endian, EM_MIPS. All three are asserted together
            # because e_machine alone is not an architecture: EM_MIPS covers
            # 32-bit and big-endian MIPS too.
            archspec: elf:2:1:8
    runs-on: ubuntu-24.04
    # Emulated MIPS compiles the whole dependency stack plus a bootloader.
    # Generous on purpose; a row still going at this point is wedged, not slow.
    timeout-minutes: 300
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      # Persist source wheels with an image/recipe key and a bounded cache.
      - uses: docker/setup-qemu-action@v4.3.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: that helper rewrites the image into the `library/`
          # namespace for its mirror failover, and this is a per-architecture
          # repository the mirrors do not carry. Plain retried pull instead.
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
          echo "digest=$(docker image inspect --format '{{.Id}}' '${{ matrix.image }}')" >> "$GITHUB_OUTPUT"
        id: image
      - name: Restore source wheels
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-mips-${{ matrix.arch }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Build binary (${{ matrix.arch }} container)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT -e PIP_CACHE_DIR=/src/.pip-cache \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              # The checkout is mounted at /src, so the runner-side retry helper
              # is reachable in here too. apt does not retry hard enough on its
              # own and a failed index fetch is a hard job failure.
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              # Pin the archive to a snapshot slice rather than the live
              # suite. Debian bookworm entered LTS on 2026-06-11 with LTS
              # architectures i386, amd64, armhf, arm64 and ppc64el; mips64el
              # is not among them, bookworm-security already publishes no
              # mips64el index, and the precedent for what happens next is
              # bullseye, whose binary-mipsel index is a 404 today. The index
              # gets deleted on an unannounced date, which would red a release
              # with no warning. snapshot.debian.org serves the same bytes
              # from a frozen date, over plain HTTP so this slim image needs
              # no ca-certificates, with a same-host redirect apt follows on
              # its own. This freezes the row on an unpatched archive slice,
              # which is a decision and not a fix: the alternative is to stop
              # shipping the row. Recurring check:
              #   curl -s https://deb.debian.org/debian/dists/bookworm/Release | grep ^Architectures
              echo "deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20260715T000000Z/ bookworm main" > /etc/apt/sources.list
              rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
              # Python plus a C toolchain: aiohttp, psutil and the extras below
              # are all source builds, and so is the PyInstaller bootloader.
              retry 5 apt-get -o Acquire::Retries=5 -qq update
              retry 5 apt-get -o Acquire::Retries=5 -qq install -y --no-install-recommends \
                python3 python3-venv python3-dev build-essential zlib1g-dev libffi-dev pkg-config
              # pip runs as root; the mounted checkout belongs to the runner.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              python3 -VV
              python3 -m venv /v
              retry 5 /v/bin/pip install --upgrade pip setuptools wheel
              # install_extra.sh / install_orjson.sh read these.
              PIP=/v/bin/pip
              PY=/v/bin/python
              export PIP PY
              # Not wrapped in retry: with no mips wheel on PyPI this COMPILES
              # the bootloader, and retry.sh is for network operations only.
              # Retrying a deterministic compile failure just multiplies it.
              /v/bin/pip install pyinstaller==6.22.1   # pin matches the other binary jobs
              /v/bin/pip install .                     # bakes the pinned version into cronstable/version.py
              # Extras ride the container lane policy set: best-effort for the
              # compiled ones, hard only for pure-Python zeroconf. uvloop and
              # pynacl both build and verify here. orjson does not: it is Rust,
              # and mips64el has neither a rustup host toolchain nor a distro
              # rustc past the orjson MSRV, so RUST_SETUP stays unset and the
              # script falls back to the stdlib json encoder (cronstable/_json),
              # which is byte-compatible.
              sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
              sh pyinstaller/install_orjson.sh
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              /v/bin/pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version          # smoke test: fails the job if the bundle is broken
              # Whenever the build env kept pynacl, the frozen binary must reach
              # it (and zeroconf) too: the push-plus-bonjour config validates
              # only when both import inside the bundle.
              if /v/bin/python -c "import nacl" 2>/dev/null; then
                dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
              fi
              # cli_job_smoke.sh is deliberately not run here: it needs a
              # daemon, loopback HTTP and curl, and this row is emulated. The
              # env scrub it proves is shared Python code, identical everywhere.
              /v/bin/python /src/.github/scripts/assert_arch.py \
                dist/cronstable ${{ matrix.archspec }}
              # And the glibc floor, which no functional test can see: the
              # smoke ran on the same libc the bundle was built against, so a
              # dependency that starts asking for a newer symbol version would
              # ship a binary that no longer starts on bookworm-era hardware,
              # with CI green throughout.
              # No --no-exec-stack on this row, unlike every other glibc lane.
              # NOTE: no apostrophes anywhere below, comments included. This
              # whole script is the argument of a single-quoted sh -euc, so
              # one would close the quote and strand the rest.
              # The Debian mips64el port carries an executable stack
              # everywhere: the kernel FPU emulator runs FP branch delay slots
              # out of line on the user stack, so glibc is configured for it
              # and every object inherits it. All 62 images here declare it,
              # including the libcrypto and libpython that Debian itself
              # ships, so the check can never pass. Debian settled it for
              # bookworm in #1022787, and lintian disables the same tag on
              # MIPS.
              /v/bin/python /src/.github/scripts/elf_floor.py dist/cronstable --max-glibc 2.36
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}
            '
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}
          path: dist/cronstable-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Bound the source-wheel cache
        id: cache-size
        run: |
          sudo chown -R "$(id -u):$(id -g)" .pip-cache
          python3 .github/scripts/cache_size.py .pip-cache
      - name: Save source wheels (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-mips-${{ matrix.arch }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', '.github/workflows/release.yml') }}
        if: github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true'
        continue-on-error: true

  # Self-contained binaries for the two legacy 32-bit ARM ABIs: glibc hard-float
  # ARMv6 (Raspberry Pi 1, Zero, Zero W) and glibc soft-float armel (Kirkwood
  # boxes: SheevaPlug, QNAP TS-x1x, D-Link DNS-320, Zyxel NSA325, Pogoplug).
  #
  # Its own job because neither base image comes from a family the other lanes
  # know. Debian's armhf port is ARMv7, so `library/debian` and `python:3.14-*`
  # cannot supply an ARMv6 base at all, and python-build-standalone publishes no
  # ARMv6 target either. Python therefore comes from apt (3.11, the newest in
  # bookworm; the project floor is 3.10), the same trade the MIPS lane makes.
  #
  # Everything compiles from source, PyInstaller included: PyPI publishes no
  # ARMv6 or armel wheels.
  #
  # Two guards make these rows trustworthy, and both are load-bearing rather
  # than decorative:
  #
  #   _PYTHON_HOST_PLATFORM is sysconfig's cross-build hook. Under QEMU these
  #   containers report armv7l from uname, so without it pip installs armv7l
  #   wheels whose object code the target CPUs cannot execute. Setting it makes
  #   pip generate armv6l/armv5tel tags instead, so those wheels stop being
  #   candidates and the C extensions compile in-container.
  #
  #   QEMU_CPU pins the emulated core to the real target (ARM1176 is the Pi 1,
  #   ARM926 is Kirkwood), so an ARMv7 instruction that did sneak in faults
  #   during the build rather than on a user's hardware. elf_floor.py then
  #   asserts the float ABI and Tag_CPU_arch statically over the whole bundle.
  binaries-arm-legacy:
    # pq-wheel-armv6 runs with continue-on-error, so a wheel that failed
    # to build never holds this job; the armv6 binary then seals
    # x25519 only, as the armel one always does.
    needs:
      - version
      - pq-wheel-armv6
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: armv6
            platform: linux/arm/v6
            # Genuine linux/arm/v6 glibc (measured: config blob says
            # architecture arm, variant v6), rebuilt weekly, apt tracks
            # mirrordirector.raspbian.org with only the main component
            # enabled. Every other candidate is ARMv7-only,
            # musl-only, or years stale: dtcooper/raspberrypi-os is arm64 and
            # arm/v7, arm32v6/debian does not exist, arm32v6/python is Alpine,
            # and the balenalib armv6 images stopped in 2025.
            #
            # Pinned by tag rather than digest on purpose, unlike the armel row
            # below: Raspbian's OpenSSL and zlib travel inside the frozen
            # binary, so a base that keeps getting patched is worth more here
            # than a byte-identical build. It is a personal namespace with no
            # support promise, which is the cost of there being no official
            # ARMv6 base at all.
            image: tianon/raspbian:bookworm-slim
            # ARM1176JZF-S, the Pi 1/Zero core: ARMv6KZ with VFPv2.
            qemu_cpu: arm1176
            hostplat: linux-armv6l
            armgate: '--arm-float hard --max-arm-arch v6 --max-arm-fp 2'
            floor: '2.36'
            sources: ''
    runs-on: ubuntu-24.04
    # Emulating an ARM1176 while compiling the whole dependency stack plus a
    # bootloader is slow even by this workflow's standards. Generous on purpose;
    # a row still going at this point is wedged, not slow.
    timeout-minutes: 360
    steps: &legacy-arm-steps
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      # Persist source wheels with an image/recipe key and a bounded cache.
      #
      # The cryptography wheel pq-wheel-armv6 built for the armv6 row (no
      # PyPI wheel exists for ARMv6, and the compile is hours under an
      # emulated ARM1176, which is why it is its own continue-on-error job
      # rather than a step here). A missing artifact leaves the row on x25519.
      - name: Fetch the ARMv6 post-quantum wheel
        if: ${{ matrix.arch == 'armv6' }}
        continue-on-error: true
        uses: actions/download-artifact@v7.0.0
        with:
          name: pq-wheel-glibc-armv6
          path: pq-wheels
      - uses: docker/setup-qemu-action@v4.3.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: one image is third-party and the other is a
          # per-architecture repository, and that helper's mirror failover
          # rewrites both into Docker Hub's `library/` namespace.
          retry 5 docker pull --platform ${{ matrix.platform }} ${{ matrix.image }}
      - name: Build binary (${{ matrix.arch }})
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform ${{ matrix.platform }} \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e QEMU_CPU=${{ matrix.qemu_cpu }} \
            -e _PYTHON_HOST_PLATFORM=${{ matrix.hostplat }} \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              if [ -n "${{ matrix.sources }}" ]; then
                echo "${{ matrix.sources }}" > /etc/apt/sources.list
                rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
              fi
              # Python plus a C toolchain: every dependency here is a source
              # build, and so is the PyInstaller bootloader.
              retry 5 apt-get -o Acquire::Retries=5 -qq update
              retry 5 apt-get -o Acquire::Retries=5 -qq install -y --no-install-recommends \
                python3 python3-venv python3-dev build-essential zlib1g-dev libffi-dev pkg-config
              python3 -VV
              # Prove the two guards took effect before anything is installed
              # against this interpreter. get_platform() is what pip derives its
              # wheel tags from, so this line is the armv7-wheel fix, visible.
              python3 -c "import sysconfig; print(\"wheel platform:\", sysconfig.get_platform())"
              python3 -m venv /v
              retry 5 /v/bin/pip install --upgrade pip setuptools wheel
              # install_extra.sh / install_orjson.sh read these.
              PIP=/v/bin/pip
              PY=/v/bin/python
              export PIP PY
              # Not wrapped in retry: with no wheel on PyPI for either ABI this
              # COMPILES the bootloader, and retry.sh is for network operations
              # only. Retrying a deterministic compile failure multiplies it.
              /v/bin/pip install pyinstaller==6.22.1   # pin matches the other binary jobs
              /v/bin/pip install .                     # bakes the pinned version into cronstable/version.py
              # Extras ride the container lane policy set: best-effort for the
              # compiled ones, hard only for zeroconf, whose Cython modules are
              # optional (its build swallows a failed extension build and the
              # pure-Python implementation is equivalent). orjson is Rust and
              # rustup publishes no host toolchain for either ABI, so
              # RUST_SETUP stays unset and the binary uses the stdlib json
              # encoder (cronstable/_json), which is byte-compatible.
              sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
              sh pyinstaller/install_orjson.sh
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
              # Bundle cryptography (the post-quantum half of the push extra)
              # on the armv6 row, from the wheel pq-wheel-armv6 built and the
              # preceding step fetched: PIP_ONLY_BINARY keeps pip off the sdist,
              # which has no Rust to build with in here. Soft, like pynacl:
              # verify_extra.py seals a real X-Wing probe on the emulated
              # core and drops a build that cannot. armel has no Rust
              # toolchain for its ABI at all and stays on x25519.
              if [ "${{ matrix.arch }}" = armv6 ] && ls /src/pq-wheels/cryptography-*.whl >/dev/null 2>&1; then
                PIP_FIND_LINKS=/src/pq-wheels PIP_ONLY_BINARY=cryptography \
                  sh pyinstaller/install_extra.sh cryptography "cryptography>=48" soft "post-quantum push not bundled"
              else
                echo "cryptography: no wheel for this row; post-quantum push not bundled"
              fi
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              /v/bin/pyinstaller pyinstaller/cronstable.spec
              # Smoke test on the emulated target core, so an instruction the
              # real hardware lacks faults here.
              dist/cronstable --version
              # Whenever the build env kept pynacl, the frozen binary must reach
              # it (and zeroconf) too: the push-plus-bonjour config validates
              # only when both import inside the bundle.
              if /v/bin/python -c "import nacl" 2>/dev/null; then
                dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
              fi
              # And whenever it kept cryptography, the frozen bundle must seal
              # xwing (see install_extra.sh header).
              if /v/bin/python -c "import cryptography" 2>/dev/null; then
                suites=$(dist/cronstable --sealable-suites)
                echo "sealable suites: $suites"
                echo "$suites" | grep -qx xwing || {
                  echo "FAIL: the frozen binary cannot seal xwing" >&2
                  exit 1
                }
              fi
              # cli_job_smoke.sh is deliberately not run here: it needs a
              # daemon, loopback HTTP and curl, and this row is emulated. The
              # env scrub it proves is shared Python code, identical everywhere.
              #
              # 32-bit, little-endian, EM_ARM. e_machine cannot tell the two ABIs
              # apart, which is what the float-ABI half of the gate below is for.
              /v/bin/python /src/.github/scripts/assert_arch.py dist/cronstable elf:1:1:40
              /v/bin/python /src/.github/scripts/elf_floor.py dist/cronstable \
                --max-glibc ${{ matrix.floor }} --no-exec-stack ${{ matrix.armgate }}
              mv dist/cronstable dist/cronstable-linux-${{ matrix.arch }}
            '
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-${{ matrix.arch }}
          path: dist/cronstable-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # This ABI has no PQ wheel dependency and can start immediately.
  binaries-armel:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: armel
            platform: linux/arm/v5
            # Pinned by digest on purpose: arm32v5 was dropped from the
            # bookworm official-images stanza in August 2026, so this tag is
            # frozen at its final build and will never be rebuilt. Neither will
            # the OS layer be patched, because bookworm-security carries no
            # armel component at all. That is the price of serving this
            # hardware; the alternative is not shipping the row.
            image: arm32v5/debian:bookworm-slim@sha256:cf9397e3198b2c002eb360586d341ba89154634198a26c578eb096b533b212cd
            # ARM926EJ-S, the Kirkwood core: ARMv5TE, no VFP, so soft-float.
            qemu_cpu: arm926
            hostplat: linux-armv5tel
            # Rewrite sources to bookworm main only. The image's default list
            # includes bookworm-security, whose Release file dropped armel when
            # bookworm entered LTS (its Architectures line is amd64 arm64 armhf
            # i386 ppc64el), so apt spends the build warning about a component
            # that cannot exist. main itself is alive and still serving armel;
            # snapshot.debian.org has a frozen slice if that ever changes.
            sources: 'deb http://deb.debian.org/debian bookworm main'
            # libatomic is the only member exempted from the v5 ceiling.
            # Debian armel libatomic1 declares Tag_CPU_arch v7 because the
            # linker MAX-merges that tag over every input object, and the
            # library contains ldrex and dmb implementations built for v7
            # alongside v5 ones. A v5 core reaches none of them. All 68 IFUNC
            # resolvers, the load-time constructor, and all 51 fallback
            # implementations contain only ARMv5TE instructions, and each of
            # the 440 instructions for newer cores belongs to a variant that
            # the resolver selects only when the HWCAP byte reports that the
            # processor supports it. On this hardware, the library uses the
            # __kuser_cmpxchg kernel helper instead. libcrypto links against
            # libatomic, which is how it enters the bundle. elf_floor.py
            # applies the exemption only when the member dispatches through
            # IFUNC, so a plain v7 build substituted later still fails this
            # row.
            armgate: '--arm-float soft --max-arm-arch v5 --max-arm-fp 0 --arm-arch-except libatomic.so.1'
            floor: '2.36'
    runs-on: ubuntu-24.04
    # Emulating an ARM926 while compiling the whole dependency stack plus a
    # bootloader is slow even by this workflow's standards. Generous on purpose;
    # a row still going at this point is wedged, not slow.
    timeout-minutes: 360
    steps: *legacy-arm-steps

  # Self-contained LoongArch binaries, glibc and musl. Its own job rather than
  # two binaries-container rows because neither base image comes from a family
  # that job knows: `library/debian`, `library/alpine` and `python:3.14-*` have
  # no loong64, so both bases are third-party (`pull_base` failover does not
  # apply to either) and the musl row installs Python from apk rather than
  # getting it from the image.
  #
  # Debian promoted loong64 to a full release architecture in sid and forky and
  # Alpine has shipped it since 3.21, so the upstream ecosystem is there. The
  # audience is new-world ABI hardware and upstream distros: the older
  # institutional fleets (Loongnix, Kylin, UOS) run an old-world ABI that is
  # binary-incompatible with these builds, and nothing here serves them.
  #
  # Everything compiles from source, PyInstaller included: PyPI publishes no
  # loong64 wheels, so the bootloader is built onto its `loongarch` machine tag
  # in both libc flavours.
  binaries-loong64:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - libc: glibc
            suffix: ''
            # Built from the python.org tarball with --with-ensurepip, tracks
            # Debian trixie, and is the only fresh line in that namespace: the
            # sid-slim and forky-slim tags there share one digest from a
            # snapshot.debian.org slice and have not moved since March.
            image: ghcr.io/loong64/python:3.14-slim-trixie
            toolchain: 'retry 5 apt-get -o Acquire::Retries=5 update && retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends build-essential libffi-dev zlib1g-dev curl ca-certificates'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # What the cryptography source build needs beyond the rustup
            # Rust: trixie's OpenSSL 3.5 headers (the extension links the
            # distro libssl; see the lane script).
            pq_tools: 'retry 5 apt-get -o Acquire::Retries=5 install -y --no-install-recommends libssl-dev pkg-config'
            floor: '2.41'
          - libc: musl
            suffix: -musl
            # `library/alpine` has no loong64 and the loongarch64/alpine
            # namespace on Docker Hub is stale, so this is the third-party
            # image that tracks the signed Alpine minirootfs.
            image: ghcr.io/loong64/alpine:3.24.1
            toolchain: 'retry 5 apk add --no-cache build-base libffi-dev zlib-dev python3 python3-dev py3-pip curl'
            rust_setup: '. /src/.github/scripts/retry.sh && retry 3 curl --proto =https --tlsv1.2 --retry 5 --retry-connrefused --retry-delay 5 -sSfo /tmp/rustup.sh https://sh.rustup.rs && env CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup sh /tmp/rustup.sh -y --default-toolchain stable --profile minimal --no-modify-path'
            # Alpine 3.24's OpenSSL 3.5 headers, for the same source build.
            pq_tools: 'retry 5 apk add --no-cache openssl-dev pkgconf'
            floor: ''
    runs-on: ubuntu-24.04
    # Emulated LoongArch compiles the whole dependency stack plus a bootloader.
    # Generous on purpose; a row still going at this point is wedged, not slow.
    timeout-minutes: 300
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      # Persist source wheels with an image/recipe key and a bounded cache.
      #
      # loong64 emulation is in the default binfmt install (tonistiigi/binfmt
      # has carried it since 2024, under the containerd architecture name).
      - uses: docker/setup-qemu-action@v4.3.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: that helper rewrites the image into Docker Hub's
          # `library/` namespace for its mirror failover, and neither of these
          # images lives there. Plain retried pull instead.
          retry 5 docker pull --platform linux/loong64 ${{ matrix.image }}
          echo "digest=$(docker image inspect --format '{{.Id}}' '${{ matrix.image }}')" >> "$GITHUB_OUTPUT"
        id: image
      - name: Restore source wheels
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-loong64-${{ matrix.libc }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Build binary (loong64 ${{ matrix.libc }})
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/loong64 \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT -e PIP_CACHE_DIR=/src/.pip-cache \
            -e PIP_BREAK_SYSTEM_PACKAGES=1 \
            -v "$PWD:/src" -w /src \
            ${{ matrix.image }} sh -euc '
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              # Per-libc toolchain. On the musl row this also installs Python
              # itself: apk marks that interpreter externally managed (PEP
              # 668), which PIP_BREAK_SYSTEM_PACKAGES answers without needing
              # a venv the way the Debian-packaged interpreters do.
              ${{ matrix.toolchain }}
              # Own both newly created and restored caches before pip runs.
              mkdir -p /src/.pip-cache && chown -R root:root /src/.pip-cache
              python3 -VV
              pip install --upgrade pip
              # Not wrapped in retry: with no loong64 wheel on PyPI this
              # COMPILES the bootloader, and retry.sh is for network
              # operations only. Retrying a deterministic compile failure just
              # multiplies it.
              pip install pyinstaller==6.22.1   # pin matches the other binary jobs
              pip install .                     # bakes the pinned version into cronstable/version.py
              # Extras ride the container lane policy set: best-effort for the
              # compiled ones, hard only for pure-Python zeroconf. Rust comes
              # from rustup, which publishes loongarch64 host toolchains for
              # both libcs; orjson soft-fails to the stdlib json encoder
              # (cronstable/_json) if that build does not come off.
              sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
              RUST_SETUP="${{ matrix.rust_setup }}" sh pyinstaller/install_orjson.sh
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
              # Bundle cryptography (the post-quantum half of the `push` extra): no loong64 wheel
              # exists, so it builds from its sdist against the distro
              # OpenSSL 3.5 (pq_tools) with the rustup Rust the orjson step
              # installed (fetched here if that step never got to it). The
              # extension links the distro libssl, which PyInstaller already
              # collects into the bundle for the ssl module of the
              # interpreter, so the binary carries one OpenSSL rather than
              # two.
              # Soft like the other compiled extras on this lane:
              # verify_extra.py seals a real X-Wing probe and drops a build
              # that cannot.
              if { ${{ matrix.pq_tools }}; } && { [ -x /opt/cargo/bin/cargo ] || sh -c "${{ matrix.rust_setup }}"; }; then
                PATH=/opt/cargo/bin:$PATH CARGO_HOME=/opt/cargo RUSTUP_HOME=/opt/rustup \
                  sh pyinstaller/install_extra.sh cryptography "cryptography>=48" soft "post-quantum push not bundled"
              else
                echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
              fi
              sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
              pyinstaller pyinstaller/cronstable.spec
              dist/cronstable --version          # smoke test, emulated on its own libc
              # Whenever the build env kept pynacl, the frozen binary must
              # reach it (and zeroconf) too: the push-plus-bonjour config
              # validates only when both import inside the bundle.
              if python3 -c "import nacl" 2>/dev/null; then
                dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
              fi
              # And whenever it kept cryptography, the frozen bundle must
              # seal xwing (see install_extra.sh header).
              if python3 -c "import cryptography" 2>/dev/null; then
                suites=$(dist/cronstable --sealable-suites)
                echo "sealable suites: $suites"
                echo "$suites" | grep -qx xwing || {
                  echo "FAIL: the frozen binary cannot seal xwing" >&2
                  exit 1
                }
              fi
              # cli_job_smoke.sh is deliberately not run here: it needs a
              # daemon, loopback HTTP and curl, and this row is emulated. The
              # env scrub it proves is shared Python code, identical everywhere.
              #
              # 64-bit, little-endian, EM_LOONGARCH.
              python3 /src/.github/scripts/assert_arch.py dist/cronstable elf:2:1:258
              if [ -n "${{ matrix.floor }}" ]; then
                python3 /src/.github/scripts/elf_floor.py dist/cronstable --max-glibc ${{ matrix.floor }} --no-exec-stack
              fi
              mv dist/cronstable dist/cronstable-linux-loong64${{ matrix.suffix }}
            '
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-linux-loong64${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-linux-loong64${{ matrix.suffix }}
          path: dist/cronstable-linux-loong64${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Bound the source-wheel cache
        id: cache-size
        run: |
          sudo chown -R "$(id -u):$(id -g)" .pip-cache
          python3 .github/scripts/cache_size.py .pip-cache
      - name: Save source wheels (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pip-cache
          key: slow-pip-binaries-loong64-${{ matrix.libc }}-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyproject.toml', 'pyinstaller/*.sh', '.github/workflows/release.yml') }}
        if: github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true'
        continue-on-error: true

  # Self-contained macOS binaries. The shipped pair is macOS 15 (arm64 + amd64),
  # signed + notarized on a release. macOS 26 (Tahoe) is built too for early
  # OS-version breakage signal, but it is CI-ONLY: continue-on-error so a flaky
  # Tahoe build never blocks a release, and it is neither signed nor attached.
  # `ship` picks the shipped rows; `asset` names the artifact (the shipped ones
  # keep the bare `macos-<arch>` names the Release + Homebrew formula expect).
  binaries-macos:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: arm64
            runner: macos-15          # macOS 15, Apple Silicon -- shipped
            ship: true
            asset: macos-arm64
            # Every cryptography release ships macosx_11_0_arm64, so the
            # Apple Silicon rows take the newest.
            pq: hard
          - arch: amd64
            runner: macos-15-intel    # macOS 15, Intel -- shipped
            ship: true
            asset: macos-amd64
            # cryptography 49.0.0 dropped x86_64 macOS; 48.0.1 (2026-06-09)
            # is the last release with a universal2 wheel, and its OpenSSL
            # 4.0.1 seals ML-KEM. The Intel rows pin below 49 so the wheel
            # resolves, which means these two binaries carry a cryptography
            # that receives no further fixes. Bounded on purpose: the daemon
            # uses it for one HPKE seal per alert and nothing else (no TLS,
            # no parsing of untrusted input), so the exposure is the KEM and
            # AEAD code paths, and the alternative is no post-quantum sealing
            # on Intel Macs at all.
            pq: hard
            pqcap: ',<49'
          - arch: amd64v3
            runner: macos-15-intel    # macOS 15, Intel -- shipped
            ship: true
            asset: macos-amd64v3
            pq: hard
            pqcap: ',<49'
    runs-on: ${{ matrix.runner }}
    # The macOS 26 rows are coverage-only: never let them gate a release.
    continue-on-error: ${{ !matrix.ship }}
    steps: &macos-steps
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'  # set explicitly; don't rely on the runner's preinstalled patch level
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Prepare macOS signing credentials
        if: ${{ needs.version.outputs.release == 'true' && matrix.ship }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            echo "::warning::macOS signing secrets not set; shipping an unsigned, unnotarized binary."
            exit 0
          fi

          # Import the Developer ID cert into a throwaway, randomly-keyed
          # keychain scoped to this runner (never the login keychain).
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" \
            -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          # Let codesign use the key non-interactively.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Exercise the configured identity/private key before compilation.
          cp /usr/bin/true "$RUNNER_TEMP/signing-probe"
          codesign --force --options runtime --timestamp --keychain "$KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" "$RUNNER_TEMP/signing-probe"

          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool history --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID"
      - name: Build amd64v3 Python
        if: matrix.arch == 'amd64v3'
        id: runtime
        run: |
          set -euo pipefail
          brew install openssl@3 libffi sqlite xz pkgconf
          CPPFLAGS="-I$(brew --prefix libffi)/include -I$(brew --prefix sqlite)/include" \
          LDFLAGS="-L$(brew --prefix libffi)/lib -L$(brew --prefix sqlite)/lib" \
            python3 docker/python_runtime.py --variant amd64v3 \
              --prefix "$RUNNER_TEMP/python-amd64v3" --openssl "$(brew --prefix openssl@3)"
      - name: Build binary
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          # Runner-native, all-wheels arch: install into a throwaway uv venv and
          # freeze from it with `uv run` (uv discovers the setup-python 3.14).
          uv venv --python "${{ steps.runtime.outputs.python-path || '3.14' }}"
          uv pip install pyinstaller==6.22.1  # pin matches the Linux jobs
          uv pip install .                     # bakes the pinned version into cronstable/version.py
          # Bundle uvloop (the `speedups` extra) for the faster event loop; macOS
          # ships wheels for both arches. The shared script has verify_extra.py
          # confirm it imports and runs a loop, else uninstalls it so the binary
          # falls back to asyncio.
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
          # Bundle orjson (the `speedups` extra); macOS ships wheels (no Rust).
          # The shared script round-trip-verifies it and drops a broken build, so
          # the binary falls back to stdlib json (cronstable/_json).
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_orjson.sh
          # Bundle pynacl (the `push` extra); macOS ships universal2
          # wheels, so absence means a broken build. Install and verify
          # are HARD failures on this lane (a soft-fail would silently
          # ship the advertised push channel disabled).
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" hard
          # Bundle cryptography (the post-quantum half of the `push` extra) so the frozen daemon
          # seals post-quantum X-Wing push. Every row declares `pq`: the
          # arm64 rows take the newest release, and the Intel rows cap at
          # `pqcap` (below 49, the last line with a universal2 wheel; see the
          # matrix). hard everywhere, and verify_extra.py seals a real X-Wing
          # probe before freezing.
          if [ -n "${{ matrix.pq }}" ]; then
            PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
              sh pyinstaller/install_extra.sh cryptography "cryptography>=48${{ matrix.pqcap }}" \
                ${{ matrix.pq }} "post-quantum push not bundled"
          fi
          # Bundle zeroconf (the `discovery` extra): pure Python, wheels
          # on both arches, HARD failure. LGPL-2.1; in-binary notice +
          # Release source archive + public build recipe (LICENSING.md).
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
          uv run pyinstaller pyinstaller/cronstable.spec
          dist/cronstable --version            # smoke test: fails the job if the bundle is broken
          # Prove the FROZEN bundle reaches PyNaCl and zeroconf too (both
          # fail closed at config validation when they cannot import).
          dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
          # Gate the FROZEN artifact too (see install_extra.sh header).
          if [ -n "${{ matrix.pq }}" ]; then
            suites=$(dist/cronstable --sealable-suites)
            echo "sealable suites: $suites"
            echo "$suites" | grep -qx xwing || {
              echo "FAIL: the frozen binary cannot seal xwing" >&2
              exit 1
            }
          fi
          # A job that shells out to the CLI, asserted on the KV side effect:
          # proves the daemon's PyInstaller env scrub against the real
          # bootloader, which no venv test reaches (see the script header).
          bash .github/scripts/cli_job_smoke.sh dist/cronstable
          # Assert the binary is the intended native arch: Rosetta would happily
          # run an x86_64 build on the arm64 runner and let the smoke test pass,
          # silently producing a mislabelled asset. `file` reports x86_64/arm64.
          case "${{ matrix.arch }}" in
            amd64|amd64v3) want=x86_64 ;;
            arm64) want=arm64 ;;
          esac
          file dist/cronstable | grep -q "$want"
      # Developer ID sign + notarize the SHIPPED binary in place, on a release
      # only. Guarded on the cert secret too: if the signing secrets are not
      # configured, the step warns and exits 0, shipping an unsigned binary.
      # Renaming after signing is safe -- the notarization ticket is keyed to the
      # code signature (cdhash), not the filename -- so this runs before the `mv`.
      - name: Sign and notarize
        if: ${{ needs.version.outputs.release == 'true' && matrix.ship }}
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Sign with the hardened runtime + secure timestamp (both required for
          # notarization) and the PyInstaller entitlements, then verify.
          codesign --force --options runtime --timestamp \
            --entitlements pyinstaller/entitlements.plist \
            --keychain "$KEYCHAIN" \
            --sign "$MACOS_SIGN_IDENTITY" dist/cronstable
          codesign --verify --strict --verbose=2 dist/cronstable

          # Notarize: the zip is just the upload transport; the ticket binds to
          # the binary's signature, so we keep shipping the bare signed binary.
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k dist/cronstable "$RUNNER_TEMP/cronstable.zip"
          xcrun notarytool submit "$RUNNER_TEMP/cronstable.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
        timeout-minutes: 20
      - name: Rename binary
        run: |-
          mv dist/cronstable "dist/cronstable-${{ matrix.asset }}"
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-${{ matrix.asset }}
          path: dist/cronstable-${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  binaries-macos-experimental:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26          # macOS 26 (Tahoe), Apple Silicon -- CI only
            ship: false
            asset: macos26-arm64
            pq: hard   # see the macOS 15 arm64 row
          - arch: amd64
            runner: macos-26-intel    # macOS 26 (Tahoe), Intel -- CI only
            ship: false
            asset: macos26-amd64
            pq: hard   # see the macOS 15 Intel row
            pqcap: ',<49'
          - arch: amd64v3
            runner: macos-26-intel    # macOS 26 (Tahoe), Intel -- CI only
            ship: false
            asset: macos26-amd64v3
            pq: hard   # see the macOS 15 Intel row
            pqcap: ',<49'
    runs-on: ${{ matrix.runner }}
    # The macOS 26 rows are coverage-only: never let them gate a release.
    continue-on-error: ${{ !matrix.ship }}
    steps: *macos-steps

  # Self-contained FreeBSD binaries (amd64, arm64). PyInstaller is not a
  # cross-compiler and GitHub hosts no FreeBSD runner, so both rows build
  # inside a real FreeBSD VM booted on the Ubuntu runner: amd64 runs on the
  # host's own architecture, arm64 under full-system QEMU. The host stays
  # x86_64 for both rows (the action's own guidance: an arm64 runner is
  # slower at this than an x86_64 one emulating).
  #
  # PyPI publishes no FreeBSD wheels for anything, so every compiled
  # dependency here is a source build, PyInstaller's own bootloader
  # included. The extras therefore ride the CONTAINER lane's policy set
  # rather than the native lanes': best-effort for the compiled ones
  # (verify_extra.py drops a miscompiled build and the binary falls back),
  # hard only for pure-Python zeroconf.
  #
  # timeout-minutes is the 6h ceiling: the native row lands in well under an
  # hour, and the emulated row compiles cryptography's Rust crate on top of
  # everything else it builds, which is hours under full-system QEMU.
  binaries-freebsd:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          - arch: amd64
            vmarch: x86_64
            # Host-native. A Rust orjson source build costs minutes here,
            # so the speedups extra is worth attempting.
            # openssl35 is the port OpenSSL 3.5 (the base 3.0 cannot seal
            # ML-KEM), under /usr/local beside libsodium; with the port
            # rust already here for orjson, that is the whole cryptography
            # source build.
            pkgs: python314 rust gmake pkgconf libsodium openssl35
            orjson: '1'
            pq: '1'
            cflags: -I/usr/local/include
          - arch: amd64v3
            vmarch: x86_64
            pkgs: python314 rust gmake pkgconf libsodium openssl35 libffi sqlite3
            orjson: '1'
            pq: '1'
            cflags: -I/usr/local/include
          - arch: arm64
            vmarch: aarch64
            # Full-system QEMU. orjson is a Rust extension whose own build
            # backend (maturin) has no FreeBSD wheel either, so installing
            # it here means compiling a Rust toolchain's worth of code
            # inside an emulated guest. It is best-effort on every lane by
            # design, so this row skips it outright and the binary uses the
            # stdlib json fallback (cronstable/_json). uvloop stays: it is
            # a plain C build against bundled libuv, and the event loop is
            # the win that actually matters for a scheduler. cryptography
            # is a Rust extension too, but it is the whole post-quantum
            # push channel rather than a speedup, so this row does pay for
            # it: the port rust (prebuilt, so only cryptography's own crate
            # compiles here) and the port OpenSSL 3.5, under the job
            # timeout sized for the emulated compile. Soft: a build that
            # fails the X-Wing probe is dropped and the binary seals x25519.
            pkgs: python314 rust gmake pkgconf libsodium openssl35
            orjson: '0'
            pq: '1'
            cflags: -I/usr/local/include -include sys/cdefs.h
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (FreeBSD ${{ matrix.vmarch }})
        uses: vmactions/freebsd-vm@v1.5.5
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          release: '14.3'
          arch: ${{ matrix.vmarch }}
          # 4 vCPU is the hosted runner's full allotment; the extra memory
          # over the action's 6144 default is for the C/Rust source builds.
          cpu: 4
          mem: 8192
          # rsync the guest's workspace back so dist/ reaches the host for
          # the upload step below.
          copyback: true
          # Only NAMED host variables cross into the guest.
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          prepare: |
            pkg install -y ${{ matrix.pkgs }}
          run: |
            set -eu
            . .github/scripts/retry.sh

            # FreeBSD's lang/python314 is configured --without-ensurepip
            # (see its port Makefile), so a venv comes up with no pip at
            # all and the usual `python -m venv` line silently yields an
            # unusable environment. Bootstrap pip explicitly; `fetch` is in
            # the base system, and only the network hop is retried.
            runtime=python3.14
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              CFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
                python3.14 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3
              runtime=/tmp/cronstable-python-amd64v3/bin/python3
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export RUSTFLAGS
            fi
            "$runtime" -m venv --without-pip venv
            retry 5 fetch -o get-pip.py https://bootstrap.pypa.io/get-pip.py
            venv/bin/python get-pip.py

            # install_extra.sh / install_orjson.sh read these; the venv has
            # no activate step in a non-interactive sh.
            PIP="venv/bin/pip"
            PY="venv/bin/python"
            export PIP PY

            # Every dependency here is a source build, so the whole run needs
            # FreeBSD's pkg prefix on the search paths: the base clang does
            # not look in /usr/local on its own, and pynacl against the pkg
            # libsodium fails on a missing sodium.h without it. On aarch64 the
            # matrix adds a force-include of <sys/cdefs.h>: the base
            # <machine/ieeefp.h> there spells __BEGIN_DECLS/__END_DECLS without
            # including the header that defines them, so every translation unit
            # pulling it in fails to compile. PyInstaller's bootloader is one,
            # which is what took the arm64 lane down. The amd64 x86 header does
            # not use those macros, so that row needs no workaround.
            CFLAGS="${{ matrix.cflags }}"
            LDFLAGS="-L/usr/local/lib"
            export CFLAGS LDFLAGS

            # Deliberately NOT wrapped in retry: no FreeBSD wheel exists, so
            # this COMPILES the bootloader rather than downloading one, and
            # retry.sh's contract is network operations only. Retrying a
            # deterministic compile failure five times turned one 70s error
            # into a 17-minute job.
            venv/bin/pip install pyinstaller==6.22.1  # pin matches the other binary jobs
            venv/bin/pip install .                # bakes the pinned version into cronstable/version.py

            # Bundle uvloop (the `speedups` extra): no FreeBSD wheel exists,
            # so this is always a source build against bundled libuv. The
            # shared script has verify_extra.py prove the result runs a loop
            # and uninstalls it otherwise, so a miscompiled uvloop is never
            # frozen in and the binary cleanly falls back to asyncio.
            sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
            # Bundle orjson (the `speedups` extra) where this lane attempts
            # it; see the matrix comment for why the emulated row does not.
            # Rust comes from pkg (1.96+, past orjson's MSRV), so the
            # script's rustup ladder is never needed and RUST_SETUP stays
            # unset.
            if [ "${{ matrix.orjson }}" = "1" ]; then
              sh pyinstaller/install_orjson.sh
            else
              echo "orjson: skipped on this lane; using stdlib json"
            fi
            # Bundle pynacl (the `push` extra). SODIUM_INSTALL=system links
            # the pkg libsodium, found through the CFLAGS/LDFLAGS exported
            # above, instead of running PyNaCl's bundled autotools build,
            # whose thousands of tiny configure spawns are what actually
            # hurts under emulation. Soft, like the container lane: a build
            # that fails the sealed-box round trip is uninstalled, so push
            # fails closed rather than shipping a miscompiled libsodium.
            SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
            # Bundle cryptography (the post-quantum half of the `push` extra) from its sdist on
            # the row that attempts it (see the matrix): the port OpenSSL
            # 3.5 under /usr/local is the library, linked statically so the
            # bundle carries no libssl, and the port rust the compiler. Soft
            # like pynacl: verify_extra.py seals a real X-Wing probe and
            # drops a build that cannot.
            if [ "${{ matrix.pq }}" = "1" ]; then
              OPENSSL_DIR=/usr/local OPENSSL_STATIC=1 \
                sh pyinstaller/install_extra.sh cryptography "cryptography>=48" soft "post-quantum push not bundled"
            else
              echo "cryptography: skipped on this lane; post-quantum push not bundled"
            fi
            # Bundle zeroconf (the `discovery` extra): pure Python with
            # optional speedups, so a HARD install even here. LGPL-2.1; the
            # in-binary notice, Release source archive and public build
            # recipe are the compliance kit (see LICENSING.md).
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            venv/bin/pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            # Whenever the build env kept pynacl, the frozen binary must
            # reach it (and zeroconf) too: the push-plus-bonjour config
            # validates only when both import inside the bundle.
            if venv/bin/python -c "import nacl" 2>/dev/null; then
              dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
            fi
            # And whenever it kept cryptography, the frozen bundle must seal
            # xwing (see install_extra.sh header).
            if venv/bin/python -c "import cryptography" 2>/dev/null; then
              suites=$(dist/cronstable --sealable-suites)
              echo "sealable suites: $suites"
              echo "$suites" | grep -qx xwing || {
                echo "FAIL: the frozen binary cannot seal xwing" >&2
                exit 1
              }
            fi
            # cli_job_smoke.sh is deliberately not run here: it needs bash,
            # curl and a live daemon, none of which this lean VM carries,
            # and one row is emulated. The env scrub it proves is shared
            # Python code, identical on every lane.
            #
            # Assert the binary is the arch this row claims: a VM that came
            # up on the wrong image would otherwise pass every smoke above
            # and ship a mislabelled asset. Read the ELF e_machine field
            # rather than grepping `file`, whose prose differs between
            # versions and across arches.
            case "${{ matrix.arch }}" in
              amd64|amd64v3) spec=elf:2:1:62 ;;    # 64-bit LE, EM_X86_64
              arm64) spec=elf:2:1:183 ;;   # 64-bit LE, EM_AARCH64
            esac
            venv/bin/python .github/scripts/assert_arch.py dist/cronstable "$spec"
            mv dist/cronstable "dist/cronstable-freebsd-${{ matrix.arch }}"
            # Package with FreeBSD's own pkg(8), in the VM that targets the
            # ABI the package declares; freebsd_pkg.py explains why fpm on
            # the Linux runner is not equivalent. The system python3.14
            # runs it: the script is stdlib-only and the venv is about to
            # be discarded.
            python3.14 .github/scripts/freebsd_pkg.py               "$SETUPTOOLS_SCM_PRETEND_VERSION"               "dist/cronstable-freebsd-${{ matrix.arch }}" dist/pkgout
            # Install the package for real before it ships: this executes
            # the embedded post-install (service account via pw) and proves
            # the payload runs from its installed path.
            pkg add dist/pkgout/cronstable-*.pkg
            /usr/local/bin/cronstable --version
            test -x /usr/local/etc/rc.d/cronstable
            pw usershow cronstable >/dev/null
            mv dist/pkgout/cronstable-*.pkg "dist/cronstable-freebsd-${{ matrix.arch }}.pkg"
            # Keep the copyback to the artifact: the venv and PyInstaller's
            # work tree are hundreds of megabytes of rsync the host has no
            # use for.
            rm -rf venv build get-pip.py freebsd-pkg-work dist/pkgout
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-freebsd-${{ matrix.arch }}" "dist/cronstable-freebsd-${{ matrix.arch }}.pkg"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-freebsd-${{ matrix.arch }}
          path: |
            dist/cronstable-freebsd-${{ matrix.arch }}
            dist/cronstable-freebsd-${{ matrix.arch }}.pkg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained OpenBSD binary, amd64. PyInstaller cannot cross-compile and
  # no runner offers OpenBSD, so this builds in an OpenBSD 7.9 virtual machine
  # on the Linux runner, KVM-accelerated (native x86_64, no emulation).
  #
  # PyInstaller 6.22.1 is the first release with OpenBSD in its own CI and with
  # native OpenBSD detection fixed, which is why the pin the other lanes share
  # is what makes this row possible at all.
  #
  # Three OpenBSD-specific limits are worth knowing before leaning on this
  # binary: a setuid one-file build is disallowed outright, the parent-process
  # anti-spoofing hardening is not implemented for OpenBSD, and the bootloader
  # self-locates through argv[0] plus $PATH rather than a /proc path, which
  # breaks under a supervisor that rewrites argv[0].
  binaries-openbsd:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        arch: [amd64, amd64v3]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (OpenBSD 7.9 amd64)
        uses: vmactions/openbsd-vm@v1.4.7
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          # OpenBSD offers no cross-release ABI guarantee, so this pin is the
          # release the binary runs on and needs bumping every six months.
          release: '7.9'
          cpu: 4
          mem: 8192
          # rsync the guest workspace back so dist/ reaches the host upload.
          copyback: true
          # Only NAMED host variables cross into the guest.
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          prepare: |
            pkg_add -I python%3.13 py3-pip libsodium py3-psutil py3-multidict py3-yarl py3-propcache py3-aiohappyeyeballs py3-jinja2 py3-uvloop rust openssl%3.5 gmake pkgconf libffi sqlite3 xz bzip2
          run: |
            set -eu

            # OpenBSD's python port installs an EXTERNALLY-MANAGED marker
            # (PEP 668), so a bare pip install hard-errors. Upstream
            # PyInstaller's own OpenBSD CI answers it the same way. Installing
            # into the system interpreter rather than a venv is deliberate:
            # the pkg_add'd C extensions above (psutil, uvloop and the aiohttp
            # stack's compiled parts) live in its site-packages, and a plain
            # venv would hide exactly what the pkg_add step exists to provide.
            PIP_BREAK_SYSTEM_PACKAGES=1
            export PIP_BREAK_SYSTEM_PACKAGES

            # install_extra.sh / install_orjson.sh read these. The port
            # installs python3.13 without a python3 symlink.
            PIP="python3.13 -m pip"
            PY="python3.13"
            export PIP PY
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              CFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib" \
                python3.13 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3
              PY=/tmp/cronstable-python-amd64v3/bin/python3
              PIP="$PY -m pip"
              PATH=/tmp/cronstable-python-amd64v3/bin:$PATH
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export PY PIP PATH RUSTFLAGS
            fi

            # Deliberately NOT wrapped in retry: no OpenBSD wheel exists, so
            # this COMPILES the bootloader rather than downloading one, and
            # retry.sh's contract is network operations only.
            $PIP install pyinstaller==6.22.1  # pin matches the other binary jobs
            $PIP install .                    # bakes the pinned version into cronstable/version.py

            # Bundle uvloop (the `speedups` extra): the pkg_add above already
            # satisfies the floor, so this resolves without a source build.
            # The shared script still round-trips it before freezing.
            sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
            # orjson is skipped on this lane: OpenBSD ships rust 1.94.1, below
            # orjson's MSRV, so a source build cannot succeed and the packaged
            # py3-orjson is below the floor pyproject spells. The binary uses
            # the stdlib json encoder (cronstable/_json), which is
            # byte-compatible.
            echo "orjson: skipped on this lane; using stdlib json"
            # Bundle pynacl (the `push` extra). SODIUM_INSTALL=system links the
            # port libsodium instead of running PyNaCl's bundled autotools
            # build. Soft, like every source-built lane: a build that fails the
            # sealed-box round trip is uninstalled, so push fails closed rather
            # than shipping a miscompiled libsodium.
            CFLAGS="-I/usr/local/include"
            LDFLAGS="-L/usr/local/lib"
            export CFLAGS LDFLAGS
            SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
            # Bundle cryptography (the post-quantum half of the `push` extra) from its sdist: no
            # OpenBSD wheel exists. The base LibreSSL is no use to it (its
            # ML-KEM compiles only against OpenSSL 3.5 or newer), so the
            # openssl%3.5 port installed above is the library, at the
            # side-by-side paths OpenBSD gives an alternate OpenSSL, and the
            # port rust (1.94, past the 1.83 MSRV) is the compiler. Static so
            # the bundle carries no libssl of its own. Soft, like pynacl:
            # verify_extra.py seals a real X-Wing probe and drops a build
            # that cannot.
            OPENSSL_INCLUDE_DIR=/usr/local/include/eopenssl35 \
              OPENSSL_LIB_DIR=/usr/local/lib/eopenssl35 OPENSSL_STATIC=1 \
              sh pyinstaller/install_extra.sh cryptography "cryptography>=48" soft "post-quantum push not bundled"
            # Bundle zeroconf (the `discovery` extra): pure Python with
            # optional speedups, so a HARD install here too. LGPL-2.1; the
            # in-binary notice, Release source archive and public build recipe
            # are the compliance kit (see LICENSING.md).
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            # Whenever the build env kept pynacl, the frozen binary must reach
            # it (and zeroconf) too: the push-plus-bonjour config validates
            # only when both import inside the bundle.
            if $PY -c "import nacl" 2>/dev/null; then
              dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
            fi
            # And whenever it kept cryptography, the frozen bundle must seal
            # xwing (see install_extra.sh header).
            if $PY -c "import cryptography" 2>/dev/null; then
              suites=$(dist/cronstable --sealable-suites)
              echo "sealable suites: $suites"
              echo "$suites" | grep -qx xwing || {
                echo "FAIL: the frozen binary cannot seal xwing" >&2
                exit 1
              }
            fi
            # cli_job_smoke.sh is deliberately not run here: it needs bash,
            # curl and a live daemon, none of which this lean VM carries. The
            # env scrub it proves is shared Python code, identical everywhere.
            #
            # 64-bit, little-endian, EM_X86_64: a VM that came up on the wrong
            # image would otherwise pass every smoke above and ship a
            # mislabelled asset.
            $PY .github/scripts/assert_arch.py dist/cronstable elf:2:1:62
            mv dist/cronstable dist/cronstable-openbsd-${{ matrix.arch }}
            # Keep the copyback to the artifact: PyInstaller's work tree is
            # hundreds of megabytes of rsync the host has no use for.
            rm -rf build
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-openbsd-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-openbsd-${{ matrix.arch }}
          path: dist/cronstable-openbsd-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained NetBSD binary, amd64, built in a NetBSD 11.0 virtual machine
  # on the Linux runner (KVM-accelerated, no emulation).
  #
  # PyInstaller supports NetBSD in code without documenting it: compat.py
  # defines is_netbsd and folds it into is_unix, and bindepend.py overrides
  # ldd's output format for it, because NetBSD's default ldd output yields
  # library names PyInstaller cannot parse.
  binaries-netbsd:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        arch: [amd64, amd64v3]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (NetBSD 11.0 amd64)
        uses: vmactions/netbsd-vm@v1.4.9
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          release: '11.0'
          cpu: 4
          mem: 8192
          copyback: true
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          # pkgin is not in NetBSD base and is not on this image; pkg_add from
          # base is the package manager here, with PKG_PATH already set.
          prepare: |
            /usr/sbin/pkg_add python313 libsodium py313-psutil py313-multidict py313-yarl py313-propcache py313-aiohappyeyeballs py313-jinja2 py313-uvloop py313-orjson rust openssl gmake pkgconf libffi sqlite3 xz bzip2
          run: |
            set -eu
            . .github/scripts/retry.sh

            # pkgsrc builds python313 --without-ensurepip, so a venv comes up
            # with no pip at all. Bootstrap it explicitly; `ftp` is in base and
            # speaks HTTP, and only the network hop is retried.
            # --system-site-packages on purpose: the pkg_add'd C extensions
            # above live in the system site-packages, and a plain venv would
            # hide exactly what that step exists to provide.
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              CFLAGS="-I/usr/pkg/include" LDFLAGS="-L/usr/pkg/lib -Wl,-R/usr/pkg/lib" \
                python3.13 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3
              /tmp/cronstable-python-amd64v3/bin/python3 -m venv --without-pip venv
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export RUSTFLAGS
            else
              python3.13 -m venv --system-site-packages --without-pip venv
            fi
            retry 5 ftp -o get-pip.py https://bootstrap.pypa.io/get-pip.py
            venv/bin/python get-pip.py

            # install_extra.sh / install_orjson.sh read these; the venv has no
            # activate step in a non-interactive sh.
            PIP="venv/bin/pip"
            PY="venv/bin/python"
            export PIP PY

            # pkgsrc installs under /usr/pkg, which the base compiler does not
            # search on its own; every source build below needs it.
            CFLAGS="-I/usr/pkg/include"
            LDFLAGS="-L/usr/pkg/lib -Wl,-R/usr/pkg/lib"
            export CFLAGS LDFLAGS

            # Deliberately NOT wrapped in retry: no NetBSD wheel exists, so
            # this COMPILES the bootloader rather than downloading one.
            $PIP install pyinstaller==6.22.1  # pin matches the other binary jobs
            $PIP install .                    # bakes the pinned version into cronstable/version.py

            # uvloop and orjson both come from pkgsrc above, at versions past
            # the floors these scripts spell, so neither needs a source build;
            # the scripts still round-trip both before freezing.
            sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
            sh pyinstaller/install_orjson.sh
            # Bundle pynacl (the `push` extra) against the pkgsrc libsodium
            # rather than PyNaCl's bundled autotools build. Soft: a build that
            # fails the sealed-box round trip is uninstalled, so push fails
            # closed rather than shipping a miscompiled libsodium.
            SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
            # Bundle cryptography (the post-quantum half of the `push` extra) from its sdist: no
            # NetBSD wheel exists. pkgsrc's openssl (3.6, past the 3.5 that
            # ML-KEM needs) and rust (past the 1.83 MSRV), both installed
            # above under /usr/pkg, are the library and the compiler. Static
            # so the bundle carries no libssl of its own. Soft, like pynacl:
            # verify_extra.py seals a real X-Wing probe and drops a build
            # that cannot.
            OPENSSL_DIR=/usr/pkg OPENSSL_STATIC=1 \
              sh pyinstaller/install_extra.sh cryptography "cryptography>=48" soft "post-quantum push not bundled"
            # Bundle zeroconf (the `discovery` extra): pure Python with
            # optional speedups, so a HARD install. LGPL-2.1; see LICENSING.md.
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            venv/bin/pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            if $PY -c "import nacl" 2>/dev/null; then
              dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
            fi
            # And whenever the build env kept cryptography, the frozen bundle
            # must seal xwing (see install_extra.sh header).
            if $PY -c "import cryptography" 2>/dev/null; then
              suites=$(dist/cronstable --sealable-suites)
              echo "sealable suites: $suites"
              echo "$suites" | grep -qx xwing || {
                echo "FAIL: the frozen binary cannot seal xwing" >&2
                exit 1
              }
            fi
            # 64-bit, little-endian, EM_X86_64.
            $PY .github/scripts/assert_arch.py dist/cronstable elf:2:1:62
            mv dist/cronstable dist/cronstable-netbsd-${{ matrix.arch }}
            rm -rf venv build get-pip.py
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-netbsd-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-netbsd-${{ matrix.arch }}
          path: dist/cronstable-netbsd-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained illumos binary, amd64, built in an OmniOS r151054 LTS
  # virtual machine (supported to 2028-05-01) on the Linux runner.
  #
  # ONE illumos binary, not one per distribution: OpenIndiana and SmartOS zones
  # share the illumos ABI, and OmniOS is the build host with a shared
  # libpython3.13.so and a bundled ensurepip, which is the pairing that usually
  # fails on exotic platforms.
  #
  # PyInstaller has a real illumos path rather than an accidental one: the
  # bootloader wscript carries a Solaris branch, compat.py folds is_solar into
  # is_unix, and bindepend.py has its own ldd branch for it.
  binaries-illumos:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        arch: [amd64, amd64v3]
    runs-on: ubuntu-latest
    # The Rust compile of cryptography is the largest cost here; the VM is
    # host-native (KVM), so it is minutes rather than the hour QEMU takes.
    timeout-minutes: 180
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - name: Build binary (OmniOS r151054 amd64)
        uses: vmactions/omnios-vm@v1.3.6
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        with:
          release: 'r151054-build'
          cpu: 4
          mem: 8192
          copyback: true
          envs: 'SETUPTOOLS_SCM_PRETEND_VERSION'
          prepare: |
            # CPython's source build needs pkg-config to find ncurses headers
            # under /usr/include/ncurses and the matching 64-bit libraries.
            # Its fallback finds the library but misses term.h (setupterm).
            pkg install runtime/python-313 developer/build-essential developer/pkg-config library/security/openssl-3
            # libsodium (the push extra) and rust (its post-quantum half)
            # live in the OmniOS `extra` publisher rather than core. Neither
            # can fail the job, like every extra on this lane: a publisher
            # that cannot be reached costs the binary push and nothing else.
            pkg publisher extra.omnios >/dev/null 2>&1 || pkg set-publisher -g https://pkg.omnios.org/r151054/extra/ extra.omnios || echo "extra publisher unavailable; push not bundled"
            pkg install ooce/library/libsodium ooce/developer/rust || echo "libsodium or rust unavailable; push or post-quantum push not bundled"
          run: |
            set -eu

            # OmniOS ships ensurepip's bundled wheel, so the venv comes up with
            # a working pip and needs no get-pip.py hop. (Do not copy the
            # FreeBSD lane's block here: it calls `fetch`, which does not exist
            # on illumos.)
            runtime=python3.13
            if [ "${{ matrix.arch }}" = amd64v3 ]; then
              LDFLAGS="-L/usr/lib/amd64 -Wl,-R/usr/lib/amd64" \
                python3.13 docker/python_runtime.py --variant amd64v3 --prefix /tmp/cronstable-python-amd64v3 --openssl /usr
              runtime=/tmp/cronstable-python-amd64v3/bin/python3
              RUSTFLAGS="-C target-cpu=x86-64-v3"
              export RUSTFLAGS
            fi
            "$runtime" -m venv venv

            # install_extra.sh / install_orjson.sh read these.
            PIP="venv/bin/pip"
            PY="venv/bin/python"
            export PIP PY

            # Deliberately NOT wrapped in retry: no illumos wheel exists, so
            # this COMPILES the bootloader rather than downloading one.
            $PIP install pyinstaller==6.22.1  # pin matches the other binary jobs
            $PIP install .                    # bakes the pinned version into cronstable/version.py

            # Nothing is prebuilt for illumos, so every extra is a source build
            # against the gcc14 toolchain installed above, and all of them are
            # best-effort. orjson stays on the stdlib json fallback
            # (cronstable/_json): its build backend needs more than the
            # `extra` rust gives it here. pynacl links the `extra`
            # libsodium under /opt/ooce (SODIUM_INSTALL=system, found through
            # the pkg-config path and the flags that follow; -R so the bundled
            # extension resolves the library at run time), and cryptography
            # builds from its sdist with that rust against the core OpenSSL
            # 3.5, which the interpreter already links, so the bundle carries
            # one OpenSSL. Both are soft: verify_extra.py proves a sealed-box
            # round trip and a real X-Wing seal, and drops a build that fails.
            sh pyinstaller/install_extra.sh uvloop "uvloop>=0.19" soft "using asyncio"
            sh pyinstaller/install_orjson.sh
            PKG_CONFIG_PATH=/opt/ooce/lib/amd64/pkgconfig \
              CFLAGS="-I/opt/ooce/include" \
              LDFLAGS="-L/opt/ooce/lib/amd64 -R/opt/ooce/lib/amd64" \
              SODIUM_INSTALL=system \
              sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" soft "push extra not bundled"
            if [ -x /opt/ooce/bin/cargo ]; then
              PATH="/opt/ooce/bin:$PATH" \
                OPENSSL_LIB_DIR=/usr/lib/amd64 OPENSSL_INCLUDE_DIR=/usr/include \
                sh pyinstaller/install_extra.sh cryptography "cryptography>=48" soft "post-quantum push not bundled"
            else
              echo "cryptography: no rust on this host; post-quantum push not bundled"
            fi
            # Bundle zeroconf (the `discovery` extra): pure Python with
            # optional speedups, so a HARD install. LGPL-2.1; see LICENSING.md.
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard

            venv/bin/pyinstaller pyinstaller/cronstable.spec
            dist/cronstable --version           # smoke test: fails the job if the bundle is broken
            if $PY -c "import nacl" 2>/dev/null; then
              dist/cronstable --validate-config -c pyinstaller/smoke-push.yaml
            fi
            # And whenever the build env kept cryptography, the frozen bundle
            # must seal xwing (see install_extra.sh header).
            if $PY -c "import cryptography" 2>/dev/null; then
              suites=$(dist/cronstable --sealable-suites)
              echo "sealable suites: $suites"
              echo "$suites" | grep -qx xwing || {
                echo "FAIL: the frozen binary cannot seal xwing" >&2
                exit 1
              }
            fi
            # 64-bit, little-endian, EM_X86_64.
            $PY .github/scripts/assert_arch.py dist/cronstable elf:2:1:62
            mv dist/cronstable dist/cronstable-illumos-${{ matrix.arch }}
            rm -rf venv build
      - name: Check every declared binary artifact
        shell: bash
        run: python3 .github/scripts/check_artifacts.py "dist/cronstable-illumos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-illumos-${{ matrix.arch }}
          path: dist/cronstable-illumos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Self-contained Windows binaries: amd64 on the hosted runner, arm64 on the
  # windows-11-arm runner. Any C-extension dep lacking a win_arm64 wheel (parts
  # of the aiohttp stack, ruamel.yaml.clib) compiles from sdist via the runner's
  # Visual Studio ARM64 toolchain. Same pyinstaller pin + `--version` smoke test.
  # Three assets per arch come out of here: the one-file
  # cronstable-windows-<arch>.exe, the one-directory cronstable-windows-<arch>.zip
  # (the shape that can host the Windows service; the one-file bootloader runs
  # the app in a child process the SCM never sees), and the WiX MSI
  # cronstable-windows-<arch>.msi carrying the same one-directory payload.
  # These twelve artifacts are the unsigned gate set: on a release, the
  # sign-windows job signs and repackages them and the release ships
  # that set.
  # Steps use bash (git bash ships on the Windows runners).
  binaries-windows:
    needs:
      - version
      - preflight
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      matrix:
        include:
          # pyarch is setup-python's `architecture`. It is EMPTY on the two
          # native rows on purpose: the action falls back to the runner's
          # own arch when the input is blank, so leaving it unset is exactly
          # today's behavior, while i686 asks for the 32-bit interpreter on
          # the same x64 runner.
          #
          # pfsuffix and regflag exist because a 32-bit MSI is redirected on
          # a 64-bit host: it installs under "Program Files (x86)" and its
          # registry components land in the WOW6432Node view. Both
          # redirections are self-consistent (the .wxs uses
          # ProgramFiles6432Folder and its RegistrySearch reads back through
          # the same view), and on a genuinely 32-bit host -- the only place
          # this artifact is needed -- they resolve to the plain paths. The
          # smoke assertions below therefore have to follow the host, not
          # the target.
          - arch: amd64
            runner: windows-latest
            pyarch: ''
            pfsuffix: ''
            regflag: /reg:64
            # Every cryptography release ships win_amd64, so this row takes
            # the newest.
            pq: hard
          - arch: amd64v3
            runner: windows-latest
            pyarch: ''
            pfsuffix: ''
            regflag: /reg:64
            pq: hard
          - arch: arm64
            runner: windows-11-arm
            pyarch: ''
            pfsuffix: ''
            regflag: /reg:64
            # cryptography shipped win_arm64 wheels for 46.0.0 through 46.0.3
            # only, before the release that added ML-KEM, so this row builds
            # from source (pq_src): a rustup Rust for aarch64-pc-windows-msvc
            # and a static OpenSSL from the runner's vcpkg. soft, because
            # both come from outside the wheel index: verify_extra.py seals a
            # real X-Wing probe and drops a build that cannot, and the binary
            # then refuses xwing pairings (x25519 push still seals).
            pq: soft
            pq_src: '1'
          - arch: i686
            runner: windows-latest
            pyarch: x86
            pfsuffix: ' (x86)'
            regflag: /reg:32
            # cryptography 49.0.0 dropped 32-bit Windows; 48.0.1 is the last
            # release with a win32 wheel, on an OpenSSL that seals ML-KEM.
            # Same pin and the same fixed-version tradeoff as the Intel
            # macOS rows (see binaries-macos).
            pq: hard
            pqcap: ',<49'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # Shallow on purpose: SETUPTOOLS_SCM_PRETEND_VERSION pins the version, so
      # setuptools_scm never walks history here, and its git file-finder (which
      # the wheel/sdist build does use) only needs the checked-out tree.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        id: py
        with:
          python-version: '3.14'
          architecture: ${{ matrix.pyarch }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Build amd64v3 Python
        if: matrix.arch == 'amd64v3'
        id: runtime
        shell: pwsh
        run: |
          python docker/python_runtime.py --variant amd64v3 --prefix "$env:RUNNER_TEMP/python-amd64v3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build binary
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
          # The spec's "both" mode emits dist/cronstable.exe and the
          # service-hosting dist/cronstable/ from one Analysis, instead
          # of paying the dependency scan twice per arch on every push.
          CRONSTABLE_BUNDLE: both
        run: |
          set -euo pipefail
          # Freeze from a throwaway uv venv built on the EXACT interpreter
          # setup-python just installed. Spelling the path rather than
          # `--python 3.14` is what keeps the i686 row honest: uv resolves a
          # bare version against everything it can discover, and the x64
          # 3.14 also present on that runner would satisfy it, silently
          # producing a 64-bit build under a 32-bit name.
          uv venv --python "${{ steps.runtime.outputs.python-path || steps.py.outputs.python-path }}"
          uv pip install pyinstaller==6.22.1  # pin matches the Linux/macOS jobs
          uv pip install .                     # bakes the pinned version into cronstable/version.py
          # Bundle orjson (the `speedups` extra) for the durable-state / cluster
          # JSON paths; Windows amd64 ships a wheel (arm64 falls back if none).
          # The shared script round-trip-verifies it and drops a broken build,
          # so the binary falls back to stdlib json (cronstable/_json).
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_orjson.sh
          # Bundle pynacl (the `push` extra); Windows ships wheels for
          # win32/amd64/arm64, so absence means a broken build. Install
          # and verify are HARD failures on this lane (a soft-fail would
          # silently ship the advertised push channel disabled).
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh pynacl "pynacl>=1.6.2" hard
          # Bundle cryptography (the post-quantum half of the `push` extra) so the frozen daemon
          # seals post-quantum X-Wing push. amd64 and i686 take a wheel
          # (i686 capped by `pqcap` at the last release with a win32 wheel);
          # arm64 has none and builds from source (pq_src, see the matrix).
          # Either way verify_extra.py seals a real X-Wing probe before
          # freezing.
          if [ -n "${{ matrix.pq }}" ]; then
            pq_ready=1
            if [ -n "${{ matrix.pq_src }}" ]; then
              # The toolchain for a source build, best effort as a whole:
              # the row is soft, so a step here that fails costs the build
              # its post-quantum suite (logged below), never the job.
              {
                # A current Rust for this host. The arm64 image does not
                # promise one, so rustup-init is fetched when cargo is absent.
                if ! command -v cargo >/dev/null 2>&1; then
                  curl --proto '=https' --tlsv1.2 -sSfo rustup-init.exe \
                    https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
                  ./rustup-init.exe -y --profile minimal --default-toolchain stable
                  export PATH="$USERPROFILE/.cargo/bin:$PATH"
                fi
                # A static OpenSSL 3.5+ from the runner's vcpkg, brought to
                # the current port set first: the checkout an image carries
                # can predate the OpenSSL release ML-KEM needs, and the probe
                # below would then drop a build that compiled fine. vcpkg
                # fetches its own perl, so no toolchain beyond MSVC is
                # assumed.
                test -n "${VCPKG_INSTALLATION_ROOT:-}"
                git -C "$VCPKG_INSTALLATION_ROOT" pull --ff-only
                "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics
                "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:arm64-windows-static
                export OPENSSL_DIR="$VCPKG_INSTALLATION_ROOT/installed/arm64-windows-static"
                export OPENSSL_STATIC=1
              } || pq_ready=0
            fi
            if [ "$pq_ready" = 1 ]; then
              PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
                sh pyinstaller/install_extra.sh cryptography "cryptography>=48${{ matrix.pqcap }}" \
                  ${{ matrix.pq }} "post-quantum push not bundled"
            else
              echo "cryptography: source-build toolchain setup failed; post-quantum push not bundled"
            fi
          fi
          # Bundle zeroconf (the `discovery` extra): pure Python, wheels
          # on win32/amd64/arm64, HARD failure. LGPL-2.1; in-binary
          # notice + Release source archive + public build recipe
          # (LICENSING.md).
          PIP="uv pip" PIPUNINST="uv pip uninstall" PY="uv run python" \
            sh pyinstaller/install_extra.sh zeroconf "zeroconf==${{ needs.preflight.outputs.zeroconf }}" hard
          uv run pyinstaller pyinstaller/cronstable.spec
          ./dist/cronstable.exe --version      # smoke test: fails the job if the bundle is broken
          # Prove the FROZEN bundle reaches PyNaCl and zeroconf too (both
          # fail closed at config validation when they cannot import).
          ./dist/cronstable.exe --validate-config -c pyinstaller/smoke-push.yaml
          # A job that shells out to the CLI (through cmd.exe here), asserted
          # on the KV side effect: proves the daemon's PyInstaller env scrub
          # against the real bootloader (see the script header).
          bash .github/scripts/cli_job_smoke.sh dist/cronstable.exe
          # Assert the PE is the arch this row claims. The i686 row builds on
          # the same x64 runner as amd64, where a 64-bit interpreter would
          # pass every smoke above and still ship under the 32-bit name; the
          # macOS lane guards the Rosetta version of this. Read the COFF
          # Machine field rather than grepping `file`, whose prose differs
          # between versions and across these three arches.
          case "${{ matrix.arch }}" in
            amd64|amd64v3) spec=pe:8664 ;;   # IMAGE_FILE_MACHINE_AMD64
            arm64) spec=pe:aa64 ;;   # IMAGE_FILE_MACHINE_ARM64
            i686)  spec=pe:014c ;;   # IMAGE_FILE_MACHINE_I386
          esac
          uv run python .github/scripts/assert_arch.py dist/cronstable.exe "$spec"
          mv dist/cronstable.exe "dist/cronstable-windows-${{ matrix.arch }}.exe"
      # Gate the FROZEN artifact too, on the one row that bundles cryptography
      # (see install_extra.sh header). Its own step in pwsh, the shell a
      # Windows host runs this binary from; the one-directory bundle needs no
      # second pass, since it comes out of the same Analysis as this exe.
      - name: Prove the frozen binary seals xwing
        if: ${{ matrix.pq != '' }}
        shell: pwsh
        run: |
          # A soft row (arm64) can have dropped a source build that failed
          # its probe; the install log said so, and there is nothing to gate.
          uv run python -c "import cryptography" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "cryptography is not in the build env; nothing to gate"
            exit 0
          }
          $exe = "dist/cronstable-windows-${{ matrix.arch }}.exe"
          $suites = & $exe --sealable-suites
          if ($LASTEXITCODE -ne 0) {
            Write-Host "FAIL: --sealable-suites exited $LASTEXITCODE"
            exit 1
          }
          Write-Host "sealable suites: $($suites -join ', ')"
          if ($suites -notcontains 'xwing') {
            Write-Host "FAIL: the frozen binary cannot seal xwing"
            exit 1
          }
      - name: Check every declared binary artifact
        shell: bash
        run: python .github/scripts/check_artifacts.py "dist/cronstable-windows-${{ matrix.arch }}.exe"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-windows-${{ matrix.arch }}
          path: dist/cronstable-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Smoke-test and zip the one-directory bundle
        run: |
          set -euo pipefail
          # dist/cronstable/ came out of the same spec run as the
          # one-file exe (CRONSTABLE_BUNDLE=both), so the two layouts
          # share one Analysis and cannot drift.
          ./dist/cronstable/cronstable.exe --version
          ./dist/cronstable/cronstable.exe --validate-config -c pyinstaller/smoke-push.yaml
          # The CLI-from-job smoke again, on the one-directory bootloader: a
          # different runtime shape (single process, the one the service
          # hosts), so it gets its own pass.
          bash .github/scripts/cli_job_smoke.sh dist/cronstable/cronstable.exe
          # A real SCM round trip, because hosting a service is this
          # artifact's whole point and the hosted runners are elevated.
          # `service install` only needs the -c path to exist (it is baked
          # absolute into the ImagePath); it never opens the service's log.
          # Never `service start` here: there is nothing to run and a start
          # would burn the recovery retries the install just configured.
          # The trap keeps a failed step from leaking the service on the VM.
          trap './dist/cronstable/cronstable.exe service remove --name cronstable-ci-smoke >/dev/null 2>&1 || true' EXIT
          ./dist/cronstable/cronstable.exe service install --name cronstable-ci-smoke -c pyinstaller/smoke-push.yaml
          ./dist/cronstable/cronstable.exe service status --name cronstable-ci-smoke | grep -i stopped
          ./dist/cronstable/cronstable.exe service remove --name cronstable-ci-smoke
          # Zip with the single top-level cronstable/ directory, so
          # extracting into C:\Program Files yields the exact
          # C:\Program Files\cronstable\cronstable.exe path the Windows
          # documentation uses. root_dir/base_dir keep the folder prefix on
          # every entry.
          uv run python -c "import shutil; shutil.make_archive('dist/cronstable-windows-${{ matrix.arch }}', 'zip', root_dir='dist', base_dir='cronstable')"
      - name: Check every declared binary artifact
        shell: bash
        run: python .github/scripts/check_artifacts.py "dist/cronstable-windows-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-windows-${{ matrix.arch }}-zip
          path: dist/cronstable-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
      # The recipe lives in the shared script because sign-windows
      # rebuilds the MSIs with the SAME script: one recipe is what makes
      # "the gate already proved this MSI" true. test_ci_fences pins
      # both call sites.
          compression-level: 0
      - name: Build MSI
        env:
          VERSION: ${{ needs.version.outputs.new }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sh .github/scripts/build_msi.sh "$ARCH" "$VERSION" \
            dist/cronstable "dist/cronstable-windows-${ARCH}.msi"
      # A real machine-wide install/uninstall on the elevated runner. The
      # service must exist afterwards but never be started: the runner has
      # no configuration, and the .wxs only starts a service on an upgrade
      # that finds one, or on an explicit STARTSERVICE=1.
      - name: Smoke-test MSI (install, verify, uninstall)
        env:
          ARCH: ${{ matrix.arch }}
          PFSUFFIX: ${{ matrix.pfsuffix }}
        run: |
          set -euo pipefail
          . .github/scripts/msi_smoke.sh
          msi_install "dist/cronstable-windows-${ARCH}.msi" msi-install.log
          # Registered, stopped, and the ImagePath is the exact quoted
          # command line winservice.host_argv/image_path would write.
          # PFSUFFIX is empty on the 64-bit rows and " (x86)" on i686, whose
          # package the 64-bit host redirects; see the matrix.
          sc query cronstable | grep -q 'STOPPED'
          sc qc cronstable | grep -F "\"C:\\Program Files${PFSUFFIX}\\cronstable\\cronstable.exe\" -l INFO service run --name cronstable -c \"C:\\ProgramData\\cronstable\""
          # The recovery actions the Util custom action configured.
          sc qfailure cronstable | grep -qi 'RESTART'
          # The installed exe runs from Program Files.
          "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe" --version
          msi_uninstall "dist/cronstable-windows-${ARCH}.msi" msi-uninstall.log
          # Service and files are gone.
          if sc query cronstable >/dev/null 2>&1; then
            echo "service still registered after uninstall" >&2
            exit 1
          fi
          test ! -e "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe"
      # A real major-upgrade round trip; the fresh-install smoke above
      # exercises none of the upgrade choreography. Install with a
      # CUSTOM config directory, upgrade to a patch-bumped twin without
      # re-passing any property, then require the service still points
      # at the custom directory and was started by the upgrade. Either
      # assert missing re-opens the fleet failure: upgrades silently
      # resetting the config dir and leaving the service stopped.
      # The running service this leaves behind is also the one place a
      # real PARAMCHANGE delivery can be proven, so the reload round
      # trip lives here too.
      - name: Smoke-test MSI upgrade (remembered properties, restart, reload)
        env:
          VERSION: ${{ needs.version.outputs.new }}
          ARCH: ${{ matrix.arch }}
          PFSUFFIX: ${{ matrix.pfsuffix }}
          REGFLAG: ${{ matrix.regflag }}
        run: |
          set -euo pipefail
          . .github/scripts/msi_smoke.sh
          sh .github/scripts/build_msi.sh "$ARCH" "$VERSION" \
            dist/cronstable upgrade-twin.msi bump-patch
          cfg="/c/cronstable-ci-upgrade-cfg"
          cfgwin='C:\cronstable-ci-upgrade-cfg'
          mkdir -p "$cfg"
          cp pyinstaller/smoke-push.yaml "$cfg/"
          # Leave neither the install nor the service behind on failure.
          trap '. .github/scripts/msi_smoke.sh; \
            msi_uninstall upgrade-twin.msi cleanup-twin.log >/dev/null 2>&1 || true; \
            msi_uninstall "dist/cronstable-windows-${ARCH}.msi" cleanup-v1.log >/dev/null 2>&1 || true; \
            rm -rf "$cfg"' EXIT
          msi_install "dist/cronstable-windows-${ARCH}.msi" upgrade-v1.log \
            CONFIGDIR="$cfgwin"
          sc qc cronstable | grep -F "$cfgwin"
          # The upgrade: no properties on the command line, the managed
          # rollout's normal shape.
          msi_install upgrade-twin.msi upgrade-v2.log
          # The custom directory survived the re-registration.
          sc qc cronstable | grep -F "$cfgwin"
          # The probe found the remembered directory: the start
          # component's marker exists and the service reaches RUNNING
          # (the config in $cfg already passed --validate-config).
          # REGFLAG picks the view the package actually wrote: a 32-bit
          # package on this 64-bit host lands under WOW6432Node, and an
          # unqualified query would miss it and read as a broken probe.
          MSYS2_ARG_CONV_EXCL='*' reg query 'HKLM\SOFTWARE\cronstable' /v ServiceStartedByMsi "$REGFLAG"
          for _ in $(seq 1 15); do
            sc query cronstable | grep -q 'RUNNING' && break
            sleep 2
          done
          sc query cronstable | grep -q 'RUNNING'
          # A real forced-reload round trip. `service reload` sends the
          # SCM's paramchange control, which succeeds only when the
          # running service advertises it in its accepted mask; the
          # handler posts the reparse onto the loop, whose log line
          # lands in the bootstrap log (smoke-push.yaml has no logging:
          # section to replace it).
          "/c/Program Files${PFSUFFIX}/cronstable/cronstable.exe" service reload
          for _ in $(seq 1 15); do
            grep -q 'service control PARAMCHANGE' "$cfg/logs/cronstable-service.log" 2>/dev/null && break
            sleep 1
          done
          grep -q 'service control PARAMCHANGE' "$cfg/logs/cronstable-service.log"
          # A reload is not a stop: the service is still RUNNING.
          sc query cronstable | grep -q 'RUNNING'
          msi_uninstall upgrade-twin.msi upgrade-uninstall.log
          if sc query cronstable >/dev/null 2>&1; then
            echo "service still registered after upgrade uninstall" >&2
            exit 1
          fi
      - name: Check every declared binary artifact
        shell: bash
        run: python .github/scripts/check_artifacts.py "dist/cronstable-windows-${{ matrix.arch }}.msi"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cronstable-windows-${{ matrix.arch }}-msi
          path: dist/cronstable-windows-${{ matrix.arch }}.msi
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # cryptography wheels for the image platforms PyPI publishes none for, so
  # every image seals post-quantum push on every arch it ships. Built once
  # per (libc, arch) here and handed to Docker platform jobs as a wheelhouse
  # (docker/wheelhouse/<libc>/, which the Dockerfiles COPY beside
  # pyproject.toml and pip reads with --find-links), rather than compiled
  # inside each image build: six images build s390x, and one QEMU Rust
  # compile of cryptography is an hour or more.
  #
  # Each row builds in the container the wheel must load in: Alpine 3.23 for
  # the musl rows (distro rust + OpenSSL 3.5, static), Debian trixie for the
  # glibc i686 and riscv64 rows (same, from apt; every consumer of those two
  # arches is trixie or newer), and manylinux_2_28 for glibc s390x, whose
  # consumers span RHEL 10 (glibc 2.39) through Ubuntu 26.04, so the wheel
  # is built against the oldest of them with a rustup Rust and an OpenSSL
  # built from source (build_openssl.sh, cached). Every row builds with
  # CPython 3.11: the build interpreter sets the floor of the abi3 tag on
  # the wheel, and cp311-abi3 (the tag the PyPI wheels carry) loads on
  # every image interpreter, where a newer floor would keep the wheel out
  # of the rhel (3.12) and opensuse (3.13) images. The wheel carries the
  # plain linux_<arch> tag of an unrepaired build, or the manylinux tag
  # that maturin assigns inside a manylinux image; extract_deps.py matches
  # the machine either way, and the per-libc directories keep a musl wheel
  # away from a glibc image and a glibc wheel away from a musl image.
  #
  # Every row is best-effort at the job level (continue-on-error), so a
  # failed compile costs that platform its post-quantum suite (the image
  # then seals x25519 only, which extract_deps.py reports) rather than the
  # release. Every run resolves fresh sources; compiler work is reused only
  # within a matching source, image and installed toolchain. Cache writes are
  # bounded and trunk-only. libc groups release their Docker consumers separately.
  pq-wheels:
    needs: [version, preflight]
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: '[{"libc": "glibc", "arch": "i686", "platform": "linux/386", "image": "python:3.11-slim-trixie"}, {"libc": "glibc", "arch": "riscv64", "platform": "linux/riscv64", "image": "python:3.11-slim-trixie", "qemu": true}, {"libc": "glibc", "arch": "s390x", "platform": "linux/s390x", "image": "quay.io/pypa/manylinux_2_28_s390x:2026.08.15-1", "qemu": true, "manylinux": "1"}]'
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      cryptography: ${{ needs.preflight.outputs.cryptography }}
      crypto-sha: ${{ needs.preflight.outputs.crypto-sha }}

  pq-wheels-musl:
    needs: [version, preflight]
    uses: ./.github/workflows/build-pq-wheels.yml
    with:
      matrix: '[{"libc": "musl", "arch": "i686", "platform": "linux/386", "image": "python:3.11-alpine3.23"}, {"libc": "musl", "arch": "armv7", "platform": "linux/arm/v7", "image": "python:3.11-alpine3.23", "qemu": true}, {"libc": "musl", "arch": "ppc64le", "platform": "linux/ppc64le", "image": "python:3.11-alpine3.23", "qemu": true}, {"libc": "musl", "arch": "s390x", "platform": "linux/s390x", "image": "python:3.11-alpine3.23", "qemu": true}, {"libc": "musl", "arch": "riscv64", "platform": "linux/riscv64", "image": "python:3.11-alpine3.23", "qemu": true}]'
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      cryptography: ${{ needs.preflight.outputs.cryptography }}
      crypto-sha: ${{ needs.preflight.outputs.crypto-sha }}

  pq-wheel-armv6:
    needs:
      - version
      - preflight
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download resolved cryptography source
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: release-inputs
      - uses: docker/setup-qemu-action@v4.3.0
      - name: Pull the build image
        run: |
          set -euo pipefail
          . .github/scripts/retry.sh
          # NOT pull_base: a third-party image (see binaries-arm-legacy).
          retry 5 docker pull --platform linux/arm/v6 tianon/raspbian:bookworm-slim
          echo "digest=$(docker image inspect --format '{{.Id}}' tianon/raspbian:bookworm-slim)" >> "$GITHUB_OUTPUT"
        id: image
      - name: Restore ARMv6 compiler work
        uses: actions/cache/restore@v6.1.0
        with:
          path: .pq-cache
          key: armv6-work-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyinstaller/build_openssl.sh', '.github/scripts/compiler_fingerprint.py', '.github/workflows/release.yml') }}
        continue-on-error: true
      - name: Build the cryptography wheel (glibc armv6)
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v6 \
            -e SETUPTOOLS_SCM_PRETEND_VERSION \
            -e PIP_RETRIES -e PIP_TIMEOUT \
            -e QEMU_CPU=arm1176 \
            -e _PYTHON_HOST_PLATFORM=linux-armv6l \
            -v "$PWD:/src" -w /src \
            tianon/raspbian:bookworm-slim sh -euc '
              . /src/.github/scripts/retry.sh
              export DEBIAN_FRONTEND=noninteractive
              retry 5 apt-get -o Acquire::Retries=5 -qq update
              # A C toolchain for OpenSSL and the crate build, perl for the
              # OpenSSL Configure script, binutils for the readelf checks.
              retry 5 apt-get -o Acquire::Retries=5 -qq install -y --no-install-recommends \
                python3 python3-venv python3-dev build-essential libffi-dev pkg-config \
                perl make curl ca-certificates binutils
              python3 -VV
              python3 -c "import sysconfig; print(\"wheel platform:\", sysconfig.get_platform())"
              python3 -m venv /v
              retry 5 /v/bin/pip install --upgrade pip setuptools wheel
              retry 3 curl --proto =https --tlsv1.2 -sSfo /tmp/rustup-init https://static.rust-lang.org/rustup/dist/arm-unknown-linux-gnueabihf/rustup-init
              chmod +x /tmp/rustup-init
              env CARGO_HOME=/src/.pq-cache/cargo RUSTUP_HOME=/opt/rustup /tmp/rustup-init -y \
                --default-host arm-unknown-linux-gnueabihf --default-toolchain stable \
                --profile minimal --no-modify-path
              PATH=/src/.pq-cache/cargo/bin:$PATH
              CARGO_HOME=/src/.pq-cache/cargo
              RUSTUP_HOME=/opt/rustup
              export PATH CARGO_HOME RUSTUP_HOME
              rustc -vV
              BUILD_OPENSSL_CONFIG_EXTRA=no-asm sh pyinstaller/build_openssl.sh /src/.pq-cache/openssl
              OPENSSL_DIR=/src/.pq-cache/openssl
              OPENSSL_STATIC=1
              export OPENSSL_DIR OPENSSL_STATIC
              toolchain=$(/v/bin/python .github/scripts/compiler_fingerprint.py)
              export CARGO_TARGET_DIR="/src/.pq-cache/target/$toolchain"
              rm -rf /src/wheelhouse
              # The preflight resolves this source from pyproject and checks its hash.
              /v/bin/pip wheel --no-deps --wheel-dir /src/wheelhouse /src/release-inputs/cryptography-${{ needs.preflight.outputs.cryptography }}.tar.gz
              # Prove the wheel seals X-Wing through the daemon itself, on
              # the emulated target core, before it is handed to the binary.
              /v/bin/pip install /src/wheelhouse/cryptography-*.whl
              /v/bin/pip install .
              /v/bin/python pyinstaller/verify_extra.py cryptography
              ext=$(/v/bin/python -c "import cryptography.hazmat.bindings._rust as m; print(m.__file__)")
              # Self-contained: no libssl or libcrypto as a shared dependency.
              readelf -d "$ext" > /tmp/cryptography.dyn
              grep NEEDED /tmp/cryptography.dyn || true
              if grep -E "NEEDED.*lib(ssl|crypto)" /tmp/cryptography.dyn; then
                echo "FAIL: the wheel links OpenSSL dynamically" >&2
                exit 1
              fi
              # And within the ARMv6 ceiling elf_floor.py holds the binary to
              # (v6, v6KZ or v6K; VFPv2 at most), read from the same
              # .ARM.attributes it reads.
              readelf -A "$ext" | grep -E "Tag_CPU_arch:|Tag_FP_arch:" > /tmp/cryptography.arm
              cat /tmp/cryptography.arm
              if grep -E "Tag_CPU_arch: v(7|8|6T2)" /tmp/cryptography.arm; then
                echo "FAIL: the wheel needs an instruction set above ARMv6" >&2
                exit 1
              fi
              if grep -E "Tag_FP_arch: (VFPv3|VFPv4|FP-ARMv8)" /tmp/cryptography.arm; then
                echo "FAIL: the wheel needs a floating-point unit above VFPv2" >&2
                exit 1
              fi
              chmod -R a+rX /src/wheelhouse
              ls -l /src/wheelhouse
            '
      - name: Make the wheelhouse readable by the cache save
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" .pq-cache wheelhouse
          python3 .github/scripts/cache_size.py .pq-cache
        id: cache-size
      - name: Save ARMv6 compiler work (trunk only)
        uses: actions/cache/save@v6.1.0
        with:
          path: .pq-cache
          key: armv6-work-${{ steps.image.outputs.digest }}-${{ needs.preflight.outputs.crypto-sha }}-${{ hashFiles('pyinstaller/build_openssl.sh', '.github/scripts/compiler_fingerprint.py', '.github/workflows/release.yml') }}
        if: github.ref == 'refs/heads/main' && steps.cache-size.outputs.fits == 'true'
        continue-on-error: true
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pq-wheel-glibc-armv6
          path: wheelhouse/cryptography-*.whl
          if-no-files-found: error
          retention-days: 7

  # Cache maintenance is best-effort and never gates publication.
  compiler-cache-budget:
    needs: [pq-wheels, pq-wheels-musl, pq-wheel-armv6, binaries-mips, binaries-loong64]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.repository == 'ptweezy/cronstable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Bound compiler cache storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune_ci_caches.py

  # Each platform builds once. Native/wheel-independent platforms start at
  # once; foreign platforms wait only for their libc wheel group. Assembly
  # checks every image before the release; publishing copies those same bytes.
  docker:
    needs: [version, preflight]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.version.outputs.docker-none }}
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      zeroconf: ${{ needs.preflight.outputs.zeroconf }}

  docker-glibc:
    needs: [version, preflight, pq-wheels]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.version.outputs.docker-glibc }}
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      zeroconf: ${{ needs.preflight.outputs.zeroconf }}

  docker-musl:
    needs: [version, preflight, pq-wheels-musl]
    uses: ./.github/workflows/build-docker.yml
    with:
      matrix: ${{ needs.version.outputs.docker-musl }}
      version: ${{ needs.version.outputs.new }}
      release: ${{ needs.version.outputs.release == 'true' }}
      zeroconf: ${{ needs.preflight.outputs.zeroconf }}

  docker-assemble:
    needs: [version, docker, docker-glibc, docker-musl]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: ${{ needs.version.outputs.release == 'true' }}
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.version.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-${{ matrix.distro }}-linux-*
          path: images
      - name: Validate and assemble OCI manifests
        env:
          VERSION: ${{ needs.version.outputs.new }}
          DISTRO: ${{ matrix.distro }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          python .github/scripts/oci_images.py --inputs images --distro "$DISTRO" \
            --platforms "$PLATFORMS" --version "$VERSION" --revision "$GITHUB_SHA" --output layout
          tar -cf image.tar -C layout .
          sha256sum image.tar > image.sha256
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          skopeo copy --all --preserve-digests oci-archive:image.tar:release oci:verified:release
      - uses: actions/upload-artifact@v7.0.1
        if: needs.version.outputs.release == 'true'
        with:
          name: docker-release-${{ matrix.distro }}
          path: |
            image.tar
            image.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  perf:
    needs:
      - version
      - preflight
    runs-on: ubuntu-latest
    # perf=ignore: a perf job that fails for ANY reason (a gated regression
    # is already a warning under that mode, so this covers a crashed bench,
    # a timeout, a pairing refusal) reads as success to the `release` job's
    # needs, exactly like a CI-only macOS row. The report still uploads when
    # it exists, and the release notes say the gate was overridden.
    continue-on-error: ${{ needs.version.outputs.perf == 'ignore' }}
    # A budget, not a licence: the pre-additions suite measured 1609s
    # (2026-07-24, three consecutive runs within 6s of each other), and the
    # 2026-07 benchmark additions priced in at CI rates fit under this with
    # margin. bench.py prints its ten slowest benchmarks (fixtures included)
    # per run, so growth is triaged from the log before this ceiling fires.
    # A timeout here is a red X that is NOT a perf regression.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # full history + tags: the baseline is the latest release tag
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install current and baseline environments
        id: envs
        env:
          NEW_VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          uv venv --python 3.14 .venv-new
          SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION" \
            uv pip install --python .venv-new/bin/python .
          # orjson, on BOTH sides (the baseline venv gets it below): the
          # binaries and Docker images ship the speedups extra, so orjson is
          # production's default JSON backend, and a perf venv without it
          # times the stdlib fallback only. Deliberately orjson alone, NOT
          # the full speedups extra: uvloop would shift every async metric's
          # baseline and most of the delta would be uvloop's own (waived in
          # benchmarks/README.md; bench.py records the flag). Not
          # best-effort: compare.py hard-fails a pairing where the two
          # sides' orjson state differs, so a one-sided install must fail
          # loudly here rather than report a backend swap as a code
          # regression.
          uv pip install --python .venv-new/bin/python orjson
          # pynacl: the push.seal_500 metric skips without it, and a
          # one-sided install is the webui/playwright dead-gate trap all
          # over again -- so it goes into BOTH venvs (the baseline install
          # is below), not best-effort.
          uv pip install --python .venv-new/bin/python pynacl
          # Web-UI benchmarks (webui.*) time renders in a headless Chromium via
          # Playwright. Install it on BOTH sides (the baseline venv is created
          # below): a metric that skips on the baseline is reported with no
          # comparison and gated: False, so installing only on the current side
          # left every webui.* gate permanently inert, a 5s render regression
          # included. Releases before the ?perf=1 hook shipped still skip on the
          # baseline for that reason, but the gate now self-heals as soon as a
          # hooked release becomes the baseline instead of staying dead.
          # Best-effort: on failure the webui.* metrics skip (recorded, never
          # failed) and the rest of the gate still runs -- but the webui ids
          # in benchmarks/expected_gated.txt then fail a RELEASE run's
          # comparison (ordinary commits warn), because a silently dead gate
          # is exactly what that file exists to catch. A transient
          # Playwright/Chromium outage on a release is a rerun, not an edit
          # to the expected list.
          uv pip install --python .venv-new/bin/python playwright || true
          .venv-new/bin/python -m playwright install --with-deps chromium \
            || echo "::warning::playwright/chromium unavailable; webui.* skip"
          git fetch --tags --force
          prev=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -n "$prev" ]; then
            # The baseline side: the last release's source in a worktree,
            # installed into its own venv at its own pinned version. Both
            # sides are DRIVEN by the current checkout's benchmarks/bench.py
            # (the harness imports cronstable from whichever venv runs it), so
            # a new benchmark measures both sides and an old release simply
            # skips any API it does not have.
            git worktree add /tmp/perf-baseline "$prev"
            uv venv --python 3.14 .venv-old
            SETUPTOOLS_SCM_PRETEND_VERSION="$prev" \
              uv pip install --python .venv-old/bin/python /tmp/perf-baseline
            # The baseline side's orjson: same backend on both sides or
            # compare.py refuses the pairing (see the current-side install
            # above). Not best-effort, same reason. pynacl likewise, so
            # push.seal_500 compares as soon as a push-capable release is
            # the baseline instead of staying dead.
            uv pip install --python .venv-old/bin/python orjson pynacl
            # Same Playwright install on the baseline side, so webui.* can
            # actually be compared. The browser download above is cached
            # per-runner, so this only adds the Python package.
            uv pip install --python .venv-old/bin/python playwright || true
          else
            echo "::notice::No release tag yet; recording a baseline without a comparison."
          fi
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - name: Run benchmarks (interleaved rounds, per tier)
        env:
          PYTHONHASHSEED: "0"
          PREV: ${{ steps.envs.outputs.prev }}
        run: |
          set -euo pipefail
          mkdir -p perf
          # Two tiers with their own round counts. The fast in-process metrics
          # get more rounds: it is cheap, it deepens the best-of-rounds
          # estimate, and it gives compare.py's robust scatter statistic
          # enough points to work with. (More rounds do NOT tighten the noise
          # band itself: the band estimates single-round scatter while the
          # comparison diffs min-of-rounds, so measured bands can even widen
          # as rounds are added.) The noisier subprocess metrics (cold
          # start, import, peak RSS) get fewer, since each round spawns
          # processes. Old then new within each round interleaves both sides
          # through the same runner weather; compare.py folds every
          # perf/{old,new}.*.json with each metric's own estimator (best-of for
          # time, median for memory).
          run_tier() {
            tier="$1"; rounds="$2"
            for round in $(seq 1 "$rounds"); do
              if [ -n "$PREV" ]; then
                .venv-old/bin/python benchmarks/bench.py --tier "$tier" \
                  --json "perf/old.$tier$round.json"
              fi
              .venv-new/bin/python benchmarks/bench.py --tier "$tier" \
                --json "perf/new.$tier$round.json"
            done
          }
          run_tier inprocess 5
          run_tier subprocess 2
      - name: Compare and gate
        env:
          RELEASE: ${{ needs.version.outputs.release }}
          NEW_VERSION: ${{ needs.version.outputs.new }}
          PREV: ${{ steps.envs.outputs.prev }}
          PERF_MODE: ${{ needs.version.outputs.perf }}
          PERF_SOURCE: ${{ needs.version.outputs.perf-source }}
        run: |
          set -euo pipefail
          # The mode the decide step resolved from the dispatch input and the
          # [perf:accept] / [perf:ignore] subject markers. accept reports a
          # relative regression instead of failing on it. ignore runs the
          # comparison exactly as an ordinary commit does, warnings only, and
          # the job-level continue-on-error above keeps a perf job that dies
          # outright from holding the release either.
          flags=""
          if [ "$RELEASE" != "true" ]; then
            flags="--warn-only"   # ordinary commit: same comparison, warnings only
          elif [ "$PERF_MODE" = "ignore" ]; then
            flags="--warn-only"
            echo "::warning::perf gate overridden ($PERF_SOURCE): regressions, budget breaches and dead gates are reported but do not gate this release."
          elif [ "$PERF_MODE" = "accept" ]; then
            flags="--accept"
            echo "::notice::$PERF_SOURCE: regressions are reported but do not gate."
          fi
          # --budgets: absolute ceilings for the headline metrics, on top of
          # the relative gate (drift across many quick releases compounds
          # under a green relative gate; the ceiling is what stops it).
          # --expected-gated: metric ids that must actually compare on both
          # sides, so a gate that silently died (baseline-side skip) fails
          # the run instead of being filed as first-release coverage.
          # Both respect --warn-only (ordinary commits and perf=ignore warn);
          # neither is excused by [perf:accept]: each has its own
          # reviewed-edit ritual in benchmarks/.
          if [ -z "$PREV" ]; then
            # $flags matters here too now: --budgets can gate even without a
            # baseline to diff against.
            .venv-new/bin/python benchmarks/compare.py $flags \
              --current perf/new.*.json --current-label "$NEW_VERSION" \
              --budgets benchmarks/budgets.json \
              --md perf/perf-summary.md --merged-out perf/perf-results.json
          else
            .venv-new/bin/python benchmarks/compare.py $flags \
              --baseline perf/old.*.json --current perf/new.*.json \
              --baseline-label "$PREV" --current-label "$NEW_VERSION" \
              --budgets benchmarks/budgets.json \
              --expected-gated benchmarks/expected_gated.txt \
              --md perf/perf-summary.md --svg perf/perf-chart.svg \
              --merged-out perf/perf-results.json
          fi
          if [ "$RELEASE" = "true" ] && [ "$PERF_MODE" = "ignore" ]; then
            # Say so at the top of the report the release notes carry, so a
            # verdict of FAILED further down reads as what it is there:
            # information, not the gate.
            {
              echo "### Performance gate overridden"
              echo ""
              echo "This release was published with the perf gate overridden ($PERF_SOURCE). The comparison below is informational: nothing in it, and no failure of the perf job itself, held the release."
              echo ""
              cat perf/perf-summary.md
            } > perf/perf-summary.stamped.md
            mv perf/perf-summary.stamped.md perf/perf-summary.md
          fi
      # Upload even when the gate failed, so the report that explains the red
      # X is always available on the run.
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: perf-report
          path: perf/
          if-no-files-found: error
          retention-days: 30

  # Developer Certificate of Origin (DCO) check. Every commit in a pull request
  # must carry a `Signed-off-by:` trailer (add one with `git commit -s`); see the
  # DCO file and CONTRIBUTING.md. PR-scoped (releases land via merge/bot commits
  # on main, which this does not police), so it is NOT in the release gate below
  # and never blocks a publish.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the full PR commit range must be walkable
      - name: Verify Signed-off-by on every PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # The PR's own commits only (base..head), merges excluded: a
          # maintainer's merge is not a contribution needing a sign-off.
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            if ! git show -s --format='%B' "$sha" \
                 | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $(git show -s --format='%h %s' "$sha") is missing a Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::DCO check failed. Sign off your commits (git commit -s). To fix an existing branch: git rebase --signoff ${BASE_SHA} then git push --force-with-lease. See CONTRIBUTING.md."
            exit 1
          fi
          echo "All PR commits carry a DCO sign-off."

  # Proprietary-package boundary guard. Builds the MIT core AND cronstable-pro
  # (pro/) and proves Pro still imports the core and keeps its entitlement gate
  # fail-closed. The whole point of the split is that premium code depends on the
  # core's public API without living inside the MIT package. This runs on every
  # push and PR but is NOT in the release gate below; the MIT core ships
  # independently of the proprietary package's health.
  pro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # setuptools_scm needs history to version the core
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Build core + pro, prove the boundary, run pro's tests
        run: |
          set -euo pipefail
          uv venv --python 3.14
          uv pip install .              # the MIT core (root), from local source
          uv pip install "./pro[dev]"   # cronstable-pro (its core dep is satisfied)
          uv run python -c "import cronstable_pro; print('pro', cronstable_pro.__version__, '/ core', cronstable_pro.core_version())"
          uv run pytest pro/tests -q

  # ---------------------------------------------------------------------------
  # Publish. Runs ONLY on a release, and ONLY after every gate job above has
  # succeeded. Skip-propagation makes docker-push/homebrew skip automatically
  # when `release` is skipped on an ordinary commit (do NOT add always()).
  # ---------------------------------------------------------------------------

  # Authenticode-sign the Windows assets with Azure Artifact Signing, on
  # a release only. A separate x64 job for two reasons: the signing
  # client does not support Windows ARM runners, so the arm64 lane
  # cannot sign its own build, and keeping id-token: write out of the
  # build lanes means their third-party build code can never mint a
  # signing token. Authenticode is architecture-agnostic; one runner
  # signs every arch's PEs.
  #
  # The payload exe must be signed before it is packaged, so this job
  # unzips each zip, signs, re-zips, rebuilds every MSI from the signed
  # tree with the same pinned WiX, and signs those. The signed amd64 MSI
  # gets a real msiexec round trip here; the arm64 MSI cannot execute on
  # this runner and the i686 one installs to a redirected directory that
  # is not the path this step asserts, and binaries-windows' native smoke
  # already proved the .wxs semantics this same run on each unsigned twin.
  #
  # Preflight requires all six signing secrets. Missing credentials or a
  # signing/scan failure block publication, as WinGet requires signed MSIs.
  sign-windows:
    needs: [version, binaries-windows]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # OIDC federation for azure/login; no stored client secret
    outputs:
      signed: ${{ steps.decide.outputs.signed }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1    # for packaging/msi/cronstable.wxs
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Decide whether to sign
        id: decide
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          # All six or none, docker-push's registry-gate rule: a partial
          # set would fail azure/login mid-release instead of degrading
          # to the unsigned ship. The name list IS the env block above
          # (an unset secret still materializes as an empty env var);
          # test_ci_fences keeps the env block covering every secret the
          # job references.
          names="$(compgen -A export AZURE_ | sort || true)"  # no-match exits 1; the guard below owns that case
          if [ -z "$names" ]; then
            echo "no AZURE_* env vars found; the decide step lost its env block" >&2
            exit 1
          fi
          missing=""
          for name in $names; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing secrets missing:$missing; WinGet requires signed installers."
            exit 1
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      # The twelve Windows artifacts, flattened. The MSIs ride along for
      # the pattern but are rebuilt below; an MSI's payload cannot be
      # swapped after the fact.
      - name: Download Windows artifacts
        if: steps.decide.outputs.signed == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: cronstable-windows-*
          merge-multiple: true
          path: signdir
      - name: Log in to Azure (OIDC)
        if: steps.decide.outputs.signed == 'true'
        uses: azure/login@v3.0.2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Unpack the payloads and stage the exes
        if: steps.decide.outputs.signed == 'true'
        run: |
          set -euo pipefail
          mkdir -p out exes
          for arch in amd64 amd64v3 arm64 i686; do
            python -c "import zipfile; zipfile.ZipFile('signdir/cronstable-windows-${arch}.zip').extractall('work/${arch}')"
            test -f "work/${arch}/cronstable/cronstable.exe"
            cp "signdir/cronstable-windows-${arch}.exe" exes/
          done
      # Four PE signing calls: the staged one-file exes, then each
      # payload's root exe. The filter with recursion off keeps the
      # third-party DLLs under _internal out of our signature. Every
      # call goes through the local action, which retries a failed
      # attempt twice: the signing action reinstalls its module from the
      # PowerShell gallery on each call, and a gallery blip fails the
      # step before anything is signed. That action also owns the digest
      # and timestamp inputs (test_ci_fences pins both the ladder and
      # the inputs).
      - name: Sign the one-file exes
        if: steps.decide.outputs.signed == 'true'
        uses: ./.github/actions/sign-artifacts
        with:
          label: the one-file exes
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\exes
          files-folder-filter: exe
      - name: Sign the amd64 payload exe
        if: steps.decide.outputs.signed == 'true'
        uses: ./.github/actions/sign-artifacts
        with:
          label: the amd64 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\amd64\cronstable
          files-folder-filter: exe
      - name: Sign the amd64v3 payload exe
        if: steps.decide.outputs.signed == 'true'
        uses: ./.github/actions/sign-artifacts
        with:
          label: the amd64v3 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\amd64v3\cronstable
          files-folder-filter: exe
      - name: Sign the arm64 payload exe
        if: steps.decide.outputs.signed == 'true'
        uses: ./.github/actions/sign-artifacts
        with:
          label: the arm64 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\arm64\cronstable
          files-folder-filter: exe
      - name: Sign the i686 payload exe
        if: steps.decide.outputs.signed == 'true'
        uses: ./.github/actions/sign-artifacts
        with:
          label: the i686 payload exe
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\work\i686\cronstable
          files-folder-filter: exe
      - name: Re-zip the signed payloads
        if: steps.decide.outputs.signed == 'true'
        run: |
          set -euo pipefail
          # Same shape the build lane produced: a single top-level
          # cronstable/ folder, so extracting into C:\Program Files
          # yields the documented path.
          for arch in amd64 amd64v3 arm64 i686; do
            python -c "import shutil; shutil.make_archive('out/cronstable-windows-${arch}', 'zip', root_dir='work/${arch}', base_dir='cronstable')"
            cp "exes/cronstable-windows-${arch}.exe" out/
          done
      - name: Rebuild the MSIs from the signed payload
        if: steps.decide.outputs.signed == 'true'
        env:
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          # The SAME recipe as binaries-windows' Build MSI step, by
          # construction: one shared script, so the signed rebuild
          # cannot drift from the MSI the gate's msiexec smoke proved.
          # -arch is metadata, so this x64 runner builds the arm64
          # package too.
          for arch in amd64 amd64v3 arm64 i686; do
            sh .github/scripts/build_msi.sh "$arch" "$VERSION" \
              "work/${arch}/cronstable" "out/cronstable-windows-${arch}.msi"
          done
      - name: Sign the MSIs
        if: steps.decide.outputs.signed == 'true'
        uses: ./.github/actions/sign-artifacts
        with:
          label: the MSIs
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: msi
      # The action can exit 0 having signed nothing (a filter typo), so
      # check the exact bytes being uploaded. The set is DERIVED, not
      # enumerated: everything in out/ except the zips, plus each
      # payload root's exes (work/ is the tree the zips were built
      # from, so that covers the exe inside each zip). A new asset in
      # out/ is verified without being listed here; the count floor
      # catches the set shrinking.
      - name: Verify every signature
        if: steps.decide.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File | Where-Object Extension -ne '.zip') +
                   @(Get-ChildItem work\*\cronstable\*.exe -File)
          if ($files.Count -lt 12) {
            throw "expected at least 12 signed files (4 exes, 4 MSIs, 4 payload exes), found $($files.Count)"
          }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') {
              throw "unsigned or invalid signature on $($f.FullName): $($sig.Status) $($sig.StatusMessage)"
            }
            Write-Host "OK $($f.FullName) -> $($sig.SignerCertificate.Subject)"
          }
      # A real msiexec round trip on the signed amd64 package (this
      # runner is x64 and elevated). The ImagePath/recovery greps stay
      # in binaries-windows' native smoke; this one proves the signed
      # rebuild still installs, registers the service and runs. The
      # trap keeps a failed step from leaking the install.
      - name: Smoke-test the signed amd64 MSI (install, uninstall)
        if: steps.decide.outputs.signed == 'true'
        run: |
          set -euo pipefail
          . .github/scripts/msi_smoke.sh
          for arch in amd64 amd64v3; do
            msi="out/cronstable-windows-${arch}.msi"
            trap 'msi_uninstall "$msi" signed-cleanup.log >/dev/null 2>&1 || true' EXIT
            msi_install "$msi" signed-install.log
            sc query cronstable | grep -q 'STOPPED'
            "/c/Program Files/cronstable/cronstable.exe" --version
            msi_uninstall "$msi" signed-uninstall.log
          done
      # Validate WinGet artifacts while the other platform builds run.
      # A failure blocks publication through release's sign-windows dependency.
      - name: Prepare winget checksums
        if: steps.decide.outputs.signed == 'true'
        run: |
          set -euo pipefail
          cd out
          sha256sum cronstable-windows-amd64.msi cronstable-windows-arm64.msi > SHA256SUMS
      - name: Verify and Defender-scan winget installers
        if: steps.decide.outputs.signed == 'true'
        timeout-minutes: 20
        shell: pwsh
        run: ./.github/scripts/prepare_winget.ps1 -AssetDirectory out -OutputDirectory winget-validation -WixCommand "$env:USERPROFILE/.dotnet/tools/wix.exe"
      - name: Generate winget manifests
        if: steps.decide.outputs.signed == 'true'
        env:
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          python -m pip install strictyaml==1.7.3
          python .github/scripts/render_winget.py "$VERSION" winget-validation/metadata.json winget-manifests
      - name: Validate with the winget client
        if: steps.decide.outputs.signed == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command winget.exe -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery -Scope CurrentUser
            Repair-WinGetPackageManager
          }
          $client = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($client) {
            & $client.Source validate --manifest winget-manifests --disable-interactivity
          } else {
            $package = Get-AppxPackage Microsoft.DesktopAppInstaller
            & (Join-Path $package.InstallLocation 'winget.exe') validate --manifest winget-manifests --disable-interactivity
          }
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
      - name: Preserve winget validation evidence
        if: always() && steps.decide.outputs.signed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: winget-validation
          path: |
            winget-validation/*.log
            winget-validation/*.wxs
            winget-validation/metadata.json
            winget-manifests/*.yaml
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the signed set
        if: steps.decide.outputs.signed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          # Named outside the cronstable-* pattern on purpose: the
          # release job merges that glob into one directory, and a
          # matching name would leave signed and unsigned copies of the
          # same filenames to fight over download order. test_ci_fences
          # pins the name outside the glob.
          name: signed-windows
          path: |
            out/cronstable-windows-amd64.exe
            out/cronstable-windows-amd64v3.exe
            out/cronstable-windows-arm64.exe
            out/cronstable-windows-i686.exe
            out/cronstable-windows-amd64.zip
            out/cronstable-windows-amd64v3.zip
            out/cronstable-windows-arm64.zip
            out/cronstable-windows-i686.zip
            out/cronstable-windows-amd64.msi
            out/cronstable-windows-amd64v3.msi
            out/cronstable-windows-arm64.msi
            out/cronstable-windows-i686.msi
          if-no-files-found: error
          retention-days: 7

  packages:
    needs: [version, binaries, binaries-container, binaries-loong64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: cronstable-linux-*
          merge-multiple: true
          path: binaries
      - name: Build .deb, .rpm and .apk packages
        run: |
          set -euo pipefail
          # Development artifacts use the same numeric package version as the MSIs.
          package_version="$(printf '%s' "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')"
          bash .github/scripts/build_packages.sh "$package_version" binaries
        env:
          VERSION: ${{ needs.version.outputs.new }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-packages
          path: |
            binaries/*.deb
            binaries/*.rpm
            binaries/*.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release-prepare:
    needs:
      - version
      - dist
      - binaries
      - binaries-container
      - binaries-mips
      - binaries-arm-legacy
      - binaries-loong64
      - binaries-macos
      - binaries-freebsd
      - binaries-openbsd
      - binaries-netbsd
      - binaries-illumos
      - binaries-windows
      - sign-windows
      - perf
      - preflight
      - packages
      - binaries-armel
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The wheel + sdist built (and twine-checked) by `dist`: publish these
      # exact bytes rather than rebuilding.
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Download release binaries
        uses: actions/download-artifact@v8.0.1
        with:
          path: binaries
          pattern: cronstable-*
          merge-multiple: true

      # Replace the twelve Windows files with their signed versions before
      # anything hashes or attaches them, so SHA256SUMS, the Release
      # assets and the winget manifests describe the signed bytes.
      # Gated on the sign job's output because this job cannot see the
      # secrets, and downloading a never-uploaded artifact would fail
      # the publish. test_ci_fences pins the position.
      - name: Overlay the signed Windows artifacts
        if: needs.sign-windows.outputs.signed == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: signed-windows
          path: binaries

      # Packaging ran as soon as its Linux inputs finished. Hash the exact
      # prebuilt files that will be attached to the release.
      - name: Download Linux packages
        uses: actions/download-artifact@v8.0.1
        with:
          name: linux-packages
          path: binaries
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp dist/*.whl dist/*.tar.gz \
             binaries/cronstable-linux-amd64 binaries/cronstable-linux-arm64 \
             binaries/cronstable-linux-amd64v3 \
             binaries/cronstable-linux-i686 binaries/cronstable-linux-armv7 \
             binaries/cronstable-linux-armv6 binaries/cronstable-linux-armel \
             binaries/cronstable-linux-ppc64le binaries/cronstable-linux-s390x \
             binaries/cronstable-linux-riscv64 binaries/cronstable-linux-loong64 \
             binaries/cronstable-linux-mips64le \
             binaries/cronstable-linux-amd64-musl binaries/cronstable-linux-arm64-musl \
             binaries/cronstable-linux-amd64v3-musl \
             binaries/cronstable-linux-i686-musl binaries/cronstable-linux-armv7-musl \
             binaries/cronstable-linux-armv6-musl binaries/cronstable-linux-loong64-musl \
             binaries/cronstable-linux-ppc64le-musl binaries/cronstable-linux-s390x-musl \
             binaries/cronstable-linux-riscv64-musl \
             binaries/cronstable-linux-amd64.deb binaries/cronstable-linux-arm64.deb \
             binaries/cronstable-linux-amd64v3.deb \
             binaries/cronstable-linux-i686.deb binaries/cronstable-linux-armv7.deb \
             binaries/cronstable-linux-ppc64le.deb binaries/cronstable-linux-s390x.deb \
             binaries/cronstable-linux-riscv64.deb \
             binaries/cronstable-linux-amd64.rpm binaries/cronstable-linux-arm64.rpm \
             binaries/cronstable-linux-amd64v3.rpm \
             binaries/cronstable-linux-i686.rpm binaries/cronstable-linux-armv7.rpm \
             binaries/cronstable-linux-ppc64le.rpm binaries/cronstable-linux-s390x.rpm \
             binaries/cronstable-linux-riscv64.rpm \
             binaries/cronstable-linux-amd64.apk binaries/cronstable-linux-arm64.apk \
             binaries/cronstable-linux-amd64v3.apk \
             binaries/cronstable-linux-i686.apk binaries/cronstable-linux-armv7.apk \
             binaries/cronstable-linux-armv6.apk binaries/cronstable-linux-ppc64le.apk \
             binaries/cronstable-linux-s390x.apk binaries/cronstable-linux-riscv64.apk binaries/cronstable-linux-loong64.apk \
             binaries/cronstable-macos-amd64 binaries/cronstable-macos-arm64 \
             binaries/cronstable-macos-amd64v3 \
             binaries/cronstable-freebsd-amd64 binaries/cronstable-freebsd-arm64 \
             binaries/cronstable-freebsd-amd64v3 \
             binaries/cronstable-freebsd-amd64.pkg binaries/cronstable-freebsd-arm64.pkg \
             binaries/cronstable-freebsd-amd64v3.pkg \
             binaries/cronstable-openbsd-amd64 binaries/cronstable-netbsd-amd64 \
             binaries/cronstable-netbsd-amd64v3 \
             binaries/cronstable-openbsd-amd64v3 \
             binaries/cronstable-illumos-amd64 \
             binaries/cronstable-illumos-amd64v3 \
             binaries/cronstable-windows-amd64.exe binaries/cronstable-windows-arm64.exe \
             binaries/cronstable-windows-amd64v3.exe \
             binaries/cronstable-windows-i686.exe \
             binaries/cronstable-windows-amd64.zip binaries/cronstable-windows-arm64.zip \
             binaries/cronstable-windows-amd64v3.zip \
             binaries/cronstable-windows-i686.zip \
             binaries/cronstable-windows-amd64.msi binaries/cronstable-windows-arm64.msi \
             binaries/cronstable-windows-amd64v3.msi \
             binaries/cronstable-windows-i686.msi \
             "$work"/
          ( cd "$work" && sha256sum -- * ) > SHA256SUMS
          cat SHA256SUMS

      # The Scoop manifest for this release, rendered from the SHA256SUMS just
      # written. Scoop is a PULL channel: once this file is in the
      # ScoopInstaller/Extras bucket, its Excavator bot re-reads checkver and
      # autoupdate every four hours and bumps the manifest from the same
      # SHA256SUMS asset, so nothing here has to push anything ever again.
      # Attaching it rather than committing it keeps the hashes honest.
      - name: Render the Scoop manifest
        run: |
          set -euo pipefail
          mkdir -p scoop
          python3 .github/scripts/render_scoop.py "${{ needs.version.outputs.new }}" SHA256SUMS scoop/cronstable.json
          cat scoop/cronstable.json

      # The perf gate's output for THIS run: the markdown summary the notes
      # append, the merged raw results for the record, and the chart (kept in
      # this artifact only, never attached to the Release).
      - name: Download performance report
        uses: actions/download-artifact@v8.0.1
        # Under perf=ignore the perf job may have died before uploading; the
        # notes step below then says so instead of failing the release.
        continue-on-error: ${{ needs.version.outputs.perf == 'ignore' }}
        with:
          name: perf-report
          path: perf

      - name: Build release notes from HISTORY.md
        env:
          NEW: ${{ needs.version.outputs.new }}
          PERF_MODE: ${{ needs.version.outputs.perf }}
          PERF_SOURCE: ${{ needs.version.outputs.perf-source }}
        run: |
          set -euo pipefail
          # Pull this version's section out of HISTORY.md (everything between its
          # own "## X.Y.Z" header and the next "## " header), dropping leading
          # blank lines. The header is matched on whitespace-split fields
          # ($1 == "##", $2 == the exact version) so it hits whether the heading
          # is still bare ("## 1.2.9") or already dated ("## 1.2.9 (2026-07-07)").
          # The exact $2 match also keeps 1.2.1 from swallowing 1.2.10's section.
          awk -v ver="$NEW" '
            $1 == "##" && $2 == ver { cap = 1; next }
            cap && /^## / { exit }
            cap { print }
          ' HISTORY.md | sed '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "::notice::Using HISTORY.md notes for $NEW."
          else
            echo "::warning::No HISTORY.md section for $NEW; release notes will be auto-generated only."
          fi
          # Append the perf comparison (gate verdict + full table) below the
          # curated notes. Text only: the perf job passes no --img-url, so the
          # body embeds no <img> for perf-chart.svg. An image in a release body
          # is refetched by every render of it (the tag page, the /releases
          # index, the releases.atom feed release-watching bots poll) because
          # the counted /releases/download/ hop is Cache-Control: no-cache, and
          # it cannot even display: GitHub signs asset URLs with
          # response-content-type=application/octet-stream plus
          # Content-Disposition: attachment, and browsers do not sniff SVG in
          # an <img>, so it only ever rendered as its alt text.
          if [ -f perf/perf-summary.md ]; then
            {
              echo ""
              cat perf/perf-summary.md
            } >> release-notes.md
          else
            # only reachable under perf=ignore, where a perf job that died
            # before writing its report does not hold the release
            echo "::warning::perf/perf-summary.md is missing (perf gate $PERF_MODE, $PERF_SOURCE); the notes carry no comparison."
            {
              echo ""
              echo "### Performance"
              echo ""
              echo "The perf gate was overridden ($PERF_SOURCE) and the perf job produced no report for this run."
            } >> release-notes.md
          fi

      # LGPL source offer for the bundled python-zeroconf: attach its sdist
      # (same requirement the binary lanes installed, resolved within this
      # run) plus the notice file, so the Release page itself provides the
      # license text and equivalent access to the library source next to
      # the binaries that bundle it. Only zeroconf is
      # LGPL; its dependencies are permissive and covered by the licenses
      # gate. See LICENSING.md.
      - name: Download resolved source archives
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-inputs
          path: release-inputs
      - name: Prepare source offer and Homebrew formula
        run: |
          set -euo pipefail
          cp -R release-inputs/third-party .
          mkdir -p homebrew
          bash packaging/homebrew/render-formula.sh "${{ needs.version.outputs.new }}" SHA256SUMS \
            packaging/homebrew/cronstable.rb.tmpl > homebrew/cronstable.rb
          ruby -c homebrew/cronstable.rb
      - name: Preserve prepared release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: prepared-release
          path: |
            dist/
            binaries/
            SHA256SUMS
            scoop/
            homebrew/
            perf/
            third-party/
            release-notes.md
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Preserve validated Homebrew formula
        uses: actions/upload-artifact@v7.0.1
        with:
          name: homebrew-formula
          path: homebrew/cronstable.rb
          if-no-files-found: error
          retention-days: 7
    timeout-minutes: 20

  release:
    needs:
      - version
      - tox
      - tox-static
      - licenses
      - release-prepare
      - docker-assemble
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag and create the GitHub Release
      id-token: write   # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The wheel + sdist built (and twine-checked) by `dist`: publish these
      # exact bytes rather than rebuilding.
      - name: Download prepared release
        uses: actions/download-artifact@v8.0.1
        with:
          name: prepared-release
          path: .
      - name: Verify prepared artifact checksums
        run: python3 .github/scripts/verify_release_checksums.py
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Idempotent re-runs: the publish precedes the tag/Release below, so if
          # a later step fails (e.g. the tag push) the version is already on PyPI.
          # skip-existing makes re-running the workflow a no-op on the upload
          # instead of a hard "file already exists" failure, so the tag + Release
          # can be completed on a retry without burning the version.
          skip-existing: true

      # Everything below runs only after PyPI has accepted the upload.
      - name: Tag the release
        env:
          NEW: ${{ needs.version.outputs.new }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # On a re-run the tag is already on the remote: skip it when it names
          # HEAD, fail when it names another commit. ls-remote peels the annotated
          # tag to its commit, which a shallow checkout cannot do locally.
          existing="$(git ls-remote --tags origin "refs/tags/$NEW^{}" "refs/tags/$NEW" | tail -n1 | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$(git rev-parse HEAD)" ]; then
              echo "tag $NEW already points at HEAD; skipping"
              exit 0
            fi
            echo "::error::tag $NEW already exists at $existing, not HEAD $(git rev-parse HEAD)"
            exit 1
          fi
          git tag -a "$NEW" -m "Release $NEW"
          # RELEASE_TOKEN is an optional override. Ordinary main releases use
          # the job's contents:write GITHUB_TOKEN, as release 1.2.50 did.
          # Additional workflow authorization can be required for target commits
          # with workflow changes relative to the default branch; it is not a
          # blanket requirement for tagging commits already on main.
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$NEW"
          else
            echo "::notice::RELEASE_TOKEN not set; pushing the tag with the job GITHUB_TOKEN (contents: write)."
            git push origin "refs/tags/$NEW"
          fi

      # Pull in every per-arch binary the gate built (fast + slow). The pattern
      # is broad and flattens them into ./binaries; the CI-only macOS 26 assets
      # (cronstable-macos26-*) land here too but are neither hashed nor attached
      # below (the lists are explicit).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.new }}
          name: ${{ needs.version.outputs.new }}
          # The curated HISTORY.md section becomes the body; with
          # generate_release_notes it is prepended above GitHub's auto-generated
          # "What's Changed" / Full Changelog compare link.
          body_path: release-notes.md
          generate_release_notes: true
          # Every shipped binary + the single SHA256SUMS, attached in one shot
          # (no later attach step, so nothing ever fights immutable-release
          # protection).
          # The benchmark report, listed by name rather than as a perf/perf-*
          # glob so that perf-chart.svg (downloaded into perf/ with the rest of
          # the perf-report artifact) stays OFF the release: as a release asset
          # it collected more downloads than every binary combined, because
          # anything that rendered the notes fetched it. Both files here are
          # written on every run the perf job completes, including the first
          # release that has no baseline to diff against; a perf job that died
          # under perf=ignore leaves them out, and an unmatched entry here is
          # skipped, not fatal. The chart ships in the perf-report workflow
          # artifact.
          files: |
            SHA256SUMS
            scoop/cronstable.json
            perf/perf-summary.md
            perf/perf-results.json
            third-party/THIRD-PARTY-NOTICES.txt
            third-party/zeroconf-*.tar.gz
            dist/*.whl
            dist/*.tar.gz
            binaries/cronstable-linux-amd64
            binaries/cronstable-linux-amd64v3
            binaries/cronstable-linux-arm64
            binaries/cronstable-linux-i686
            binaries/cronstable-linux-armv7
            binaries/cronstable-linux-armv6
            binaries/cronstable-linux-armel
            binaries/cronstable-linux-ppc64le
            binaries/cronstable-linux-s390x
            binaries/cronstable-linux-riscv64
            binaries/cronstable-linux-loong64
            binaries/cronstable-linux-mips64le
            binaries/cronstable-linux-amd64-musl
            binaries/cronstable-linux-amd64v3-musl
            binaries/cronstable-linux-arm64-musl
            binaries/cronstable-linux-i686-musl
            binaries/cronstable-linux-armv7-musl
            binaries/cronstable-linux-armv6-musl
            binaries/cronstable-linux-loong64-musl
            binaries/cronstable-linux-ppc64le-musl
            binaries/cronstable-linux-s390x-musl
            binaries/cronstable-linux-riscv64-musl
            binaries/cronstable-linux-amd64.deb
            binaries/cronstable-linux-amd64v3.deb
            binaries/cronstable-linux-arm64.deb
            binaries/cronstable-linux-i686.deb
            binaries/cronstable-linux-armv7.deb
            binaries/cronstable-linux-ppc64le.deb
            binaries/cronstable-linux-s390x.deb
            binaries/cronstable-linux-riscv64.deb
            binaries/cronstable-linux-amd64.rpm
            binaries/cronstable-linux-amd64v3.rpm
            binaries/cronstable-linux-arm64.rpm
            binaries/cronstable-linux-i686.rpm
            binaries/cronstable-linux-armv7.rpm
            binaries/cronstable-linux-ppc64le.rpm
            binaries/cronstable-linux-s390x.rpm
            binaries/cronstable-linux-riscv64.rpm
            binaries/cronstable-linux-amd64.apk
            binaries/cronstable-linux-amd64v3.apk
            binaries/cronstable-linux-arm64.apk
            binaries/cronstable-linux-i686.apk
            binaries/cronstable-linux-armv7.apk
            binaries/cronstable-linux-armv6.apk
            binaries/cronstable-linux-ppc64le.apk
            binaries/cronstable-linux-s390x.apk
            binaries/cronstable-linux-riscv64.apk
            binaries/cronstable-linux-loong64.apk
            binaries/cronstable-macos-amd64
            binaries/cronstable-macos-amd64v3
            binaries/cronstable-macos-arm64
            binaries/cronstable-freebsd-amd64
            binaries/cronstable-freebsd-amd64v3
            binaries/cronstable-freebsd-arm64
            binaries/cronstable-freebsd-amd64.pkg
            binaries/cronstable-freebsd-amd64v3.pkg
            binaries/cronstable-freebsd-arm64.pkg
            binaries/cronstable-openbsd-amd64
            binaries/cronstable-openbsd-amd64v3
            binaries/cronstable-netbsd-amd64
            binaries/cronstable-netbsd-amd64v3
            binaries/cronstable-illumos-amd64
            binaries/cronstable-illumos-amd64v3
            binaries/cronstable-windows-amd64.exe
            binaries/cronstable-windows-amd64v3.exe
            binaries/cronstable-windows-arm64.exe
            binaries/cronstable-windows-i686.exe
            binaries/cronstable-windows-amd64.zip
            binaries/cronstable-windows-amd64v3.zip
            binaries/cronstable-windows-arm64.zip
            binaries/cronstable-windows-i686.zip
            binaries/cronstable-windows-amd64.msi
            binaries/cronstable-windows-amd64v3.msi
            binaries/cronstable-windows-arm64.msi
            binaries/cronstable-windows-i686.msi

    timeout-minutes: 20

  # Copy the validated multi-arch images at the just-released version.
  # Runs after `release` and is gated on all build/assembly validation via
  # `needs: release`. Pushes one image per distro to GHCR (and Docker Hub when
  # the DOCKERHUB_* secrets are set); the Debian image owns the bare
  # `latest`/`<version>` tags, the variants get `-<distro>` suffixes.
  docker-push:
    needs:
      - version
      - release
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
    strategy:
      fail-fast: false
      # the same canonical rows the build-only `docker` gate ran, from
      # .github/docker-matrix.json via the `version` job: what was gated is
      # exactly what is pushed, suffixes included.
      matrix:
        include: ${{ fromJSON(needs.version.outputs.docker-matrix) }}
    steps:
      - name: Resolve registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          images="ghcr.io/${REPO,,}"   # GHCR image names must be lowercase
          dockerhub=false
          # Preflight requires a complete pair when Docker Hub is configured.
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/cronstable"
            dockerhub=true
          fi
          {
            echo "dockerhub=$dockerhub"
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          # The distro suffix (e.g. `-alpine`) is appended to every tag; it is
          # empty for Debian, which therefore owns the bare `latest`/`<version>`.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.version.outputs.new }}
            type=raw,value=latest
            # Explicit -debian alias so the default base is pinnable by name too
            # (latest-debian / <version>-debian), mirroring the other variants.
            type=raw,value=${{ needs.version.outputs.new }}-debian,enable=${{ startsWith(matrix.distro, 'debian') }}
            type=raw,value=latest-debian,enable=${{ startsWith(matrix.distro, 'debian') }}

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download validated OCI image
        uses: actions/download-artifact@v8.0.1
        with:
          name: docker-release-${{ matrix.distro }}
          path: .
      - name: Publish the validated image without rebuilding
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sha256sum -c image.sha256
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y skopeo
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --retry-times 3 \
              --authfile "$HOME/.docker/config.json" oci-archive:image.tar:release "docker://$tag"
          done <<< "$TAGS"
    timeout-minutes: 30

  homebrew:
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1    # for the formula template + render script

      - name: Download validated Homebrew formula
        uses: actions/download-artifact@v8.0.1
        with:
          name: homebrew-formula
          path: prepared
      - name: Update Homebrew tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            # A release MUST update the tap. Skipping silently is exactly how the
            # yacron2 -> cronstable rename shipped for several versions without
            # ever publishing a cronstable formula -- the tap froze while every
            # release stayed green. Fail loudly so a stale tap can't hide behind
            # a successful run.
            echo "::error::HOMEBREW_TAP_TOKEN is not set; cannot update the Homebrew tap. Add it as a repo secret (fine-grained PAT with Contents: read/write on ptweezy/homebrew-tap) and re-run this release." >&2
            exit 1
          fi

          # Retried through a function, not inline: the helper names the failed
          # command in its warning, and the clone URL carries the tap token.
          # The rm makes a retry idempotent (git refuses a non-empty target, so
          # a half-finished clone would fail every later attempt).
          . .github/scripts/retry.sh
          clone_tap() {
            rm -rf tap
            git clone --depth 1 \
              "https://x-access-token:${TAP_TOKEN}@github.com/ptweezy/homebrew-tap.git" tap
          }
          retry 5 clone_tap
          mkdir -p tap/Formula
          cp prepared/cronstable.rb tap/Formula/cronstable.rb

          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then compare the index: a plain `git diff` ignores
          # untracked files, so on the formula's first publication it reported
          # "no changes" and the job exited green without ever committing --
          # the tap stayed empty while every release passed.
          git add Formula/cronstable.rb
          if git diff --cached --quiet; then
            echo "Formula already current for ${VERSION}."
            exit 0
          fi
          git commit -m "cronstable ${VERSION}"
          git push

  # Submit the ptweezy.cronstable manifest to microsoft/winget-pkgs for each
  # release. Use the manifests validated by sign-windows and verify that the
  # published installer hashes match the scanned files before submission.
  #
  # WINGET_TOKEN is a classic PAT with public_repo scope. Its account creates
  # the fork and PRs. After submission succeeds, cleanup closes that account's
  # PRs for older versions that have no approval.
  #
  # A missing token, failed submission, or cleanup error fails the job.
  winget:
    needs: [version, release, sign-windows]
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Download signed winget installers
        env:
          SIGNED: ${{ needs.sign-windows.outputs.signed }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != true ]; then
            echo "::error::WinGet requires signed MSIs. Configure the Windows signing secrets; see wiki/Contributing-and-Releasing.md."
            exit 1
          fi
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir winget-assets --pattern SHA256SUMS \
            --pattern cronstable-windows-amd64.msi \
            --pattern cronstable-windows-arm64.msi
      - name: Download validated winget manifests
        uses: actions/download-artifact@v8.0.1
        with:
          name: winget-validation
          path: .
      - name: Verify published winget installers match the scanned files
        env:
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          python .github/scripts/verify_winget_release.py "$VERSION" winget-validation/metadata.json winget-assets
      - name: Submit winget manifest
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.version.outputs.new }}
        run: |
          set -euo pipefail
          if [ -z "${WINGET_TOKEN:-}" ]; then
            echo "::error::WINGET_TOKEN is not set; the winget manifest would go stale. Add it as a repo secret (a GitHub PAT with public_repo scope)." >&2
            exit 1
          fi
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o wingetcreate.exe \
            https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.exe
          ./wingetcreate.exe submit winget-manifests \
            --no-open --token "$WINGET_TOKEN" \
            --prtitle "New version: ptweezy.cronstable version ${VERSION}"

      - name: Close superseded unapproved winget PRs
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.version.outputs.new }}
        shell: python {0}
        run: |
          import json
          import os
          import re
          import subprocess

          def api(endpoint, *args):
              result = subprocess.run(
                  ["gh", "api", "--hostname", "github.com", endpoint, *args],
                  check=True, stdout=subprocess.PIPE, text=True, encoding="utf-8",
              )
              return json.loads(result.stdout)

          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise ValueError(f"Invalid release version: {version!r}")
          current = tuple(map(int, version.split(".")))
          author = api("user")
          repo = "repos/microsoft/winget-pkgs"
          title = re.compile(
              r"New version: ptweezy\.cronstable version ([0-9]+\.[0-9]+\.[0-9]+)"
          )

          def older_submission(pr):
              match = title.fullmatch(pr["title"])
              return (
                  pr["state"] == "open"
                  and pr["user"]["id"] == author["id"]
                  and match is not None
                  and tuple(map(int, match[1].split("."))) < current
              )

          # Fetch all candidates before closing any PRs so pagination stays stable.
          pages = api(
              f"{repo}/issues", "--method", "GET",
              "-f", f"creator={author['login']}", "-f", "state=open",
              "-f", "per_page=100", "--paginate", "--slurp",
          )
          for issue in (issue for page in pages for issue in page):
              if "pull_request" not in issue or not older_submission(issue):
                  continue
              endpoint = f"{repo}/pulls/{issue['number']}"
              pr = api(endpoint)
              if pr["merged"] or not older_submission(pr):
                  continue
              reviews = api(
                  f"{endpoint}/reviews?per_page=100", "--paginate", "--slurp",
              )
              # Preserve any approval, including one on an earlier commit.
              if any(r["state"] == "APPROVED" for page in reviews for r in page):
                  print(f"Keeping approved PR #{pr['number']}.")
                  continue
              api(endpoint, "--method", "PATCH", "-f", "state=closed")
              print(f"Closed PR #{pr['number']}: superseded by {version}.")

  # ---------------------------------------------------------------------------
  # Docs. Runs on an ordinary commit and is NOT gated on the build+test matrix:
  # a wiki page is not a build artifact, so it neither waits on a release nor
  # lets a flaky emulated arch hold up a typo fix.
  # ---------------------------------------------------------------------------

  # Publish wiki/ to this repository's GitHub wiki. The wiki is a SEPARATE git
  # repo (<repo>.wiki.git), so committing wiki/ here has never updated the live
  # wiki -- that was a manual clone-copy-push, and it drifted exactly the way an
  # unautomated step always does (7 pages, some a week stale, when this job was
  # written). wiki/ is the source of truth; the wiki is the render target (the
  # pages use ~460 bare `[Page](Page)` wiki links, which ONLY resolve there).
  #
  # Publishes from `main`, the repository's only long-lived branch: it is where
  # wiki/ is edited, and the pages hardcode /blob/main/ links and
  # raw.githubusercontent.com/.../main/ screenshots, so the wiki documents the
  # trunk by construction. Only a push to main publishes.
  #
  # GITHUB_TOKEN with `contents: write` can push a repo's OWN wiki -- no PAT.
  # The widespread "wikis need a PAT" advice traces to one archived action's
  # README, last touched the day BEFORE GitHub shipped configurable
  # GITHUB_TOKEN permissions (2021-04-20); it has been wrong ever since. A PAT
  # is only needed for a wiki in a DIFFERENT repo -- which is why the Homebrew
  # tap push above needs HOMEBREW_TAP_TOKEN and this job needs no secret at all.
  wiki:
    # The repository guard earns its place: a fork has its OWN main, and a
    # fork's wiki is uninitialized (a wiki repo does not exist until someone
    # creates a page), so `<fork>/cronstable.wiki` 404s and the checkout fails.
    # Every other job in this pipeline is fork-clean, so without this the wiki
    # job would be a permanent red X on every fork's main push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ptweezy/cronstable'
    runs-on: ubuntu-latest
    permissions:
      # The one grant that allows pushing the wiki. GitHub's docs never mention
      # wikis under `contents`, but staff confirm it and both maintained wiki
      # actions default to GITHUB_TOKEN. Nothing in THIS repo is written.
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1    # for the wiki/ page sources
      - uses: actions/checkout@v7.0.1    # the wiki is its own repo; its default branch is always master
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki

      - name: Publish wiki/ to the GitHub wiki
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Mirror, so a page deleted from wiki/ is deleted from the wiki too.
          # The corollary is deliberate: a page created in the wiki's web UI is
          # transient and this job will remove it. Edit wiki/ and let CI publish.
          mirror() {
            find .wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
            cp -R wiki/. .wiki/
          }

          git -C .wiki config user.name  "github-actions[bot]"
          git -C .wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The wiki accepts web-UI edits, and a release run sits in its own
          # concurrency group alongside an ordinary one, so two publishes can
          # overlap and a push can lose a race. The commit is a pure snapshot
          # of wiki/, so there is nothing to rebase: re-mirror onto the new tip
          # and retry instead of reddening a docs run.
          for attempt in 1 2 3; do
            git -C .wiki fetch -q origin master
            git -C .wiki reset -q --hard origin/master
            mirror

            # Stage FIRST, then compare the index: a plain `git diff` ignores
            # untracked files, so a brand-new page would report "no changes" and
            # this job would exit green having published nothing -- the same way
            # the tap above stayed empty through green releases.
            git -C .wiki add -A
            if git -C .wiki diff --cached --quiet; then
              echo "Wiki already current for ${SHA:0:7}."
              exit 0
            fi

            # Print the change set: a mirror deletes, and a deletion must never
            # be silent in the log.
            git -C .wiki diff --cached --name-status

            git -C .wiki commit -q -m "Sync wiki from ${SHA:0:7}"
            if git -C .wiki push -q origin HEAD:master; then
              echo "::notice::Wiki published from ${SHA:0:7}."
              exit 0
            fi
            echo "::warning::Wiki push rejected (attempt ${attempt}/3); re-mirroring onto the new tip."
          done

          echo "::error::Could not push the wiki after 3 attempts; the wiki repo is being written concurrently. Re-run this job." >&2
          exit 1
