# Daily VERSION updates for the exact pins, grouped into one PR per ecosystem.
# The `daily` interval runs Monday through Friday. SECURITY updates are enabled
# in the repo settings (Code security: "Dependabot alerts" and "Dependabot
# security updates") and reuse the ecosystems below, so keep this list in step
# with what the pipeline uses.
version: 2
updates:
  # Actions are pinned to commit SHAs with a trailing version comment
  # (actions/checkout@<sha> # v7.0.1). Dependabot updates the comment only
  # when it ends with the version, so put other notes on the line above.
  - package-ecosystem: github-actions
    directories:
      - "/" # scans .github/workflows/ and root action.yml only
      - "/.github/actions/*"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # pyproject.toml owns dependency floors: apply a requirements/min.txt bump
  # there (extras too), then run scripts/generate_build_files.py. Keep
  # requirements/min.txt scanned; excluding it leaves the dependency graph
  # reporting obsolete vulnerable pins. Dependabot reads requirements files
  # one directory below `directory`, so "/" covers requirements/.
  - package-ecosystem: pip
    directory: "/"
    exclude-paths:
      - "requirements/dev-freethreaded.txt"
      - "pyinstaller/requirements/**"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      python:
        patterns: ["*"]

  # scripts/generate_build_files.py writes /Dockerfile and docker/Dockerfile.*
  # from docker/images.toml: apply a base-image bump there and rerun it. A uv
  # bump in pyinstaller/Dockerfile also moves SETUP_UV_VERSION in release.yml.
  # Review, do not automerge: a new base image can change the default Python.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/docker"
      - "/pyinstaller"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      docker:
        patterns: ["*"]

  # Follow the branches in flake.nix, including Intel macOS's 26.05 lane.
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      nix:
        patterns: ["*"]
